services:
  everythinghub-db:
    image: postgres:17
    container_name: everythinghub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: everythinghub
      POSTGRES_USER: everythinghub
      POSTGRES_PASSWORD: ${EH_DB_PASSWORD:?Set EH_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - everythinghub_pgdata:/var/lib/postgresql/data
      - ./000_create_service_role.sql:/docker-entrypoint-initdb.d/000_create_service_role.sql:ro
      - ./002_eh_quad_schema.sql:/docker-entrypoint-initdb.d/002_eh_quad_schema.sql:ro
      - ./003_eh_quad_intelligence.sql:/docker-entrypoint-initdb.d/003_eh_quad_intelligence.sql:ro
      - ./004_eh_quad_feedback_cursor.sql:/docker-entrypoint-initdb.d/004_eh_quad_feedback_cursor.sql:ro
      - ./005_eh_quad_catalogs.sql:/docker-entrypoint-initdb.d/005_eh_quad_catalogs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everythinghub -d everythinghub"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  everythinghub-search:
    build:
      context: ..
      dockerfile: database/Dockerfile
    container_name: everythinghub-search
    restart: unless-stopped
    depends_on:
      everythinghub-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://everythinghub:${EH_DB_PASSWORD}@everythinghub-db:5432/everythinghub
      EH_DB_SCHEMA: eh_quad
      EH_SEARCH_API_TOKEN: ${EH_SEARCH_API_TOKEN:?Set EH_SEARCH_API_TOKEN in .env}
      EH_SEARCH_HOST: 0.0.0.0
      EH_SEARCH_PORT: "8080"
    ports:
      - "127.0.0.1:58080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  # Optional HTTPS bridge. It creates an outbound tunnel; no inbound ports
  # are opened on the host and PostgreSQL itself remains loopback-only.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: everythinghub-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${EH_CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on:
      everythinghub-search:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  everythinghub_pgdata:
