services:
  everythinghub-db:
    image: postgres:17
    container_name: everythinghub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: everythinghub
      POSTGRES_USER: everythinghub
      POSTGRES_PASSWORD: ${EH_DB_PASSWORD:?Set EH_DB_PASSWORD in your environment}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - everythinghub_pgdata:/var/lib/postgresql/data
      - ./001_everythinghub_core.sql:/docker-entrypoint-initdb.d/001_everythinghub_core.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everythinghub -d everythinghub"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  everythinghub_pgdata:
