<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Everything Hub — Everything Within Reach</title>
<meta name="description" content="Search anything on the web with Everything Hub.">
<meta name="theme-color" content="#02070b">
<link rel="canonical" href="https://everythinghub.ink/">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#02070b;color:#f4fff7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{min-height:100svh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0 0 28px}
.art{position:relative;width:min(100%,1000px);aspect-ratio:0.86;overflow:hidden;line-height:0;margin:0 auto;isolation:isolate}
.art img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 50%}
.search{position:absolute;left:5%;top:64%;width:90%;height:7%;display:flex;align-items:center;gap:1%;padding:0 2.2%;border-radius:999px}
.search input{width:83%;height:80%;border:0;outline:0;background:transparent;color:#111;font-size:clamp(13px,2.3vw,24px);font-weight:600;padding:0 1% 0 14%;min-width:0}
.search input::placeholder{color:#454545;opacity:1}
.search button{width:15%;height:84%;border:0;border-radius:999px;background:transparent;cursor:pointer}
.hotspots{position:absolute;left:5%;top:74%;width:90%;height:21%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:1.3% 2.1%}
.hotspots button{border:0;background:transparent;border-radius:16px;cursor:pointer}
.hotspots button:focus-visible,.search button:focus-visible,.search input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.status{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;color:#c6f7d7;text-shadow:0 1px 4px #000;line-height:1.3;pointer-events:none}
@media(min-width:901px){.art{width:min(100%,1000px)}}
@media(max-width:430px){.art{width:100%}.search input{font-size:13px}.hotspots button{border-radius:8px}}
#results{flex:0 0 auto;width:min(920px,calc(100% - 32px));margin:24px auto 50px;color:#f3fff8;line-height:1.45}
.results-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px;padding:0 2px}
.results-heading h2{font-size:clamp(20px,3vw,26px);margin:0;color:#eafff2}
.results-heading p{font-size:12px;color:#9adbb8;margin:0}
.results-list{display:grid;gap:10px}
.eh-result{padding:16px 18px;border:1px solid #1eff9a66;border-radius:14px;background:linear-gradient(145deg,#09232c,#030c14);box-shadow:0 0 12px #00ff9920;min-width:0}
.eh-result a{color:#c8ff83;font-size:17px;font-weight:750;text-decoration:none;overflow-wrap:anywhere}
.eh-result a:hover{text-decoration:underline}
.eh-result p{margin:7px 0 5px;color:#d0e6db;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.eh-result small{color:#8fc8a9;font-size:10px;letter-spacing:.3px}
.results-note{margin:14px 2px;color:#8fc8a9;font-size:11px}
.catalog-preview-list{display:grid;gap:10px;margin:0 0 18px}
.eh-catalog-result{padding:16px 18px;border:1px solid #d6a63d;border-radius:14px;background:linear-gradient(145deg,#10251e,#07110f);box-shadow:0 0 14px #d6a63d22;min-width:0}
.eh-catalog-result .catalog-meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:9px}
.eh-catalog-result .catalog-pill{display:inline-flex;align-items:center;border:1px solid #d6a63d88;border-radius:999px;padding:3px 8px;color:#ffe4a6;font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:capitalize}
.eh-catalog-result .catalog-relevance{color:#b8f3cf;font-size:11px;font-weight:700}
.eh-catalog-result>a{display:block;color:#f3d27c;font-size:17px;font-weight:800;text-decoration:none;overflow-wrap:anywhere}
.eh-catalog-result>a:hover{text-decoration:underline}
.eh-catalog-result p{margin:7px 0 5px;color:#d0e6db;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.eh-catalog-result .catalog-counts{display:block;color:#9fcab2;font-size:10px}
.eh-catalog-result .catalog-matched{display:block;margin-top:7px;color:#b4d7c1;font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.eh-catalog-result .catalog-rights{margin-top:8px;padding-top:7px;border-top:1px solid #d6a63d33;color:#ffd98a;font-size:10px;font-weight:650}
@media(max-width:560px){.eh-catalog-result{padding:13px}.eh-catalog-result>a{font-size:15px}.eh-catalog-result p{font-size:12px}}

.results-empty{padding:20px;border:1px solid #1eff9a55;border-radius:14px;background:#04131d;color:#d0e6db}
@media(max-width:560px){#results{width:calc(100% - 22px);margin:18px auto 36px}.eh-result{padding:13px}.eh-result a{font-size:15px}.eh-result p{font-size:12px}.results-heading{align-items:flex-start;flex-direction:column;gap:3px}}
#top-stories{width:min(920px,calc(100% - 32px));margin:26px auto 56px;padding:16px;border:1px solid #1eff9a66;border-radius:18px;background:linear-gradient(145deg,#09232c,#030c14);color:#f3fff8;box-shadow:0 0 18px #00ff9920}
.news-head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.news-kicker{color:#92d8b1;font-size:10px;font-weight:700;letter-spacing:1.4px}
.news-head h2{margin:2px 0 3px;font-size:24px;color:#effff4}
#news-status{margin:0;color:#9fcab2;font-size:11px}
#news-refresh{border:1px solid #70e9a4;border-radius:999px;background:#eafff1;color:#082216;padding:9px 16px;font-weight:700;cursor:pointer}
.news-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 12px}
.news-tabs button{border:1px solid #4a8b70;border-radius:999px;background:#0b1c20;color:#e5fff0;padding:8px 13px;font-size:12px;cursor:pointer}
.news-tabs button.active{background:#eafff1;color:#082216;border-color:#eafff1}
.news-list{display:grid;gap:8px}
.news-item{padding:12px 13px;border:1px solid #1eff9a33;border-radius:12px;background:#06131b}
.news-item a{display:block;color:#d8ff9e;text-decoration:none;font-size:14px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.news-item a:hover{text-decoration:underline}
.news-item p{margin:5px 0 0;color:#9fcab2;font-size:11px}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.media-card{min-width:0;overflow:hidden;border:1px solid #1eff9a55;border-radius:14px;background:#06131b}
.media-card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#10252c}
.media-card a{display:block;color:#d8ff9e;text-decoration:none;font-weight:700;font-size:13px;line-height:1.35;padding:9px 10px 4px;overflow-wrap:anywhere}
.media-card small{display:block;padding:0 10px 10px;color:#9fcab2;font-size:10px}.media-card small a{color:#9fcab2;text-decoration:underline}.image-placeholder{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:4/3;background:#10252c;color:#9fcab2;font-size:12px}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.video-card{min-width:0;overflow:hidden;border:1px solid #1eff9a55;border-radius:14px;background:#06131b}
.video-card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#10252c}.video-placeholder{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/9;background:radial-gradient(circle at center,#174c38,#07151c 72%);color:#d8ff9e;font-size:14px;font-weight:800;letter-spacing:.05em}
.video-card a{display:block;color:#d8ff9e;text-decoration:none;font-weight:700;font-size:13px;line-height:1.35;padding:9px 10px 4px;overflow-wrap:anywhere}
.video-card small{display:block;padding:0 10px 10px;color:#9fcab2;font-size:10px}
@media(max-width:560px){#top-stories{width:calc(100% - 22px);padding:12px;margin:20px auto 38px}.news-head h2{font-size:20px}.news-item a{font-size:13px}.media-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.video-grid{grid-template-columns:1fr;gap:8px}}
.search:focus-within input,.search.has-query input{background:linear-gradient(90deg,transparent 0 12%,#fff 12% 100%);}
</style>
</head>
<body>
<main><section class="art" aria-label="Everything Hub search">
<img src="https://everythinghub-search-engine-4x25f8.v2.appdeploy.ai/resources/everythinghub-approved-octopus.png" alt="Approved original Everything Hub octopus artwork with the eight search categories">
<form class="search" id="searchForm" aria-label="Search Everything Hub">
<input id="query" type="search" autocomplete="off" placeholder="" aria-label="Search anything on the web">
<button type="submit" aria-label="Search"></button>
</form>
<div class="hotspots" aria-label="Search categories">
<button type="button" data-mode="web" aria-label="Web"></button><button type="button" data-mode="news" aria-label="News"></button><button type="button" data-mode="images" aria-label="Images"></button><button type="button" data-mode="videos" aria-label="Videos"></button>
<button type="button" data-mode="shopping" aria-label="Shopping"></button><button type="button" data-mode="places" aria-label="Places"></button><button type="button" data-mode="business" aria-label="Business"></button><button type="button" data-mode="research" aria-label="Research"></button>
</div><div class="status" id="status" aria-live="polite"></div>
</section><section id="results" aria-live="polite" aria-label="Search results"></section><section id="top-stories" aria-label="Live news"><div class="news-head"><div><div class="news-kicker">LIVE NEWS</div><h2>Top Stories</h2><p id="news-status" aria-live="polite">Loading the latest stories…</p></div><button id="news-refresh" type="button">Refresh</button></div><nav class="news-tabs" aria-label="News categories"><button type="button" data-news="for-you" class="active">For you</button><button type="button" data-news="world">World</button><button type="button" data-news="technology">Technology</button><button type="button" data-news="business">Business</button><button type="button" data-news="science">Science</button></nav><div id="news-items" class="news-list"></div></section></main>
<script>
const input=document.getElementById('query'),form=document.getElementById('searchForm'),status=document.getElementById('status');
let mode=new URLSearchParams(location.search).get('mode')||'web';
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;input.focus();status.textContent='Selected '+b.getAttribute('aria-label')+' search';}));
const resultsRoot=document.getElementById('results');
function safeUrl(value){try{const u=new URL(value);return (u.protocol==='https:'||u.protocol==='http:')?u.href:'#';}catch{return '#';}}
function makeHeading(q,label,countText){
  const heading=document.createElement('div');heading.className='results-heading';
  const h=document.createElement('h2');h.textContent=label+' “'+q+'”';
  const count=document.createElement('p');count.textContent=countText;
  heading.append(h,count);resultsRoot.append(heading);
}
function renderCatalogResults(items,q){
  const safeItems=(Array.isArray(items)?items:[]).filter(item=>
    item&&item.preview_only===true&&item.commercial_eligible===false&&safeUrl(item.url)!=='#'
  ).slice(0,5);
  if(!safeItems.length)return 0;
  makeHeading(q,'Catalog matches',safeItems.length.toLocaleString()+' candidate previews · preview only');
  const list=document.createElement('div');list.className='catalog-preview-list';
  for(const item of safeItems){
    const card=document.createElement('article');card.className='eh-catalog-result';
    card.dataset.catalogId=String(item.catalog_id||'');
    card.dataset.relevanceClass=String(item.relevance_class||'');
    card.dataset.previewOnly='true';
    card.dataset.commercialEligible='false';
    const meta=document.createElement('div');meta.className='catalog-meta';
    const kind=document.createElement('span');kind.className='catalog-pill';
    kind.textContent=String(item.catalog_type||item.record_type||'catalog').replace(/_/g,' ');
    const relevance=document.createElement('span');relevance.className='catalog-relevance';
    relevance.textContent=String(item.relevance_label||'Catalog record match');
    meta.append(kind,relevance);
    const link=document.createElement('a');link.href=safeUrl(item.url);link.target='_blank';link.rel='noopener noreferrer';
    link.textContent=String(item.catalog_title||item.title||'Untitled catalog');
    const snippet=document.createElement('p');snippet.textContent=String(item.snippet||item.description||'Candidate catalog preview.');
    const counts=document.createElement('small');counts.className='catalog-counts';
    const recordCount=Number.isSafeInteger(item.record_count)?item.record_count:0;
    const pageCount=Number.isSafeInteger(item.source_page_count)?item.source_page_count:0;
    counts.textContent=recordCount.toLocaleString()+' records · '+pageCount.toLocaleString()+' source pages';
    const matched=document.createElement('small');matched.className='catalog-matched';
    const matchedRecords=Array.isArray(item.matched_records)?item.matched_records.slice(0,3):[];
    matched.textContent=matchedRecords.length
      ?'Matched records: '+matchedRecords.map(record=>String(record.record_type||'record')+': '+String(record.title||'Untitled')).join(' · ')
      :'Matched record titles are not available in this preview.';
    const rights=document.createElement('p');rights.className='catalog-rights';
    const terms=String(item.source_terms_status||'not_reviewed');
    const clearance=String(item.record_level_clearance||'not_reviewed');
    const termsText=terms==='not_reviewed'?'Source terms not reviewed':
      terms==='reviewed_per_dataset'?'Source terms reviewed per dataset':
      'Source policy status: '+terms.replace(/_/g,' ');
    const rightsText=clearance==='not_reviewed'?'Record rights not cleared':
      'Record rights: '+clearance.replace(/_/g,' ');
    const redistribution=String(item.rights_status||'').includes('not_cleared_for_redistribution')
      ?' · Redistribution not cleared':'';
    rights.textContent='Candidate preview only · '+termsText+' · '+rightsText+
      ' · Commercial use not cleared'+redistribution;
    card.append(meta,link,snippet,counts,matched,rights);
    list.append(card);
  }
  resultsRoot.append(list);
  return safeItems.length;
}
function renderResults(data,q){
  resultsRoot.replaceChildren();
  const catalogCount=renderCatalogResults(data.catalogResults,q);
  const visibleCount=Array.isArray(data.results)?data.results.length:(Number(data.count)||0);
  const indexedCount=Number(data.indexedPages)||0;
  makeHeading(q,'Web results',visibleCount.toLocaleString()+' visible results'+(indexedCount?' · '+indexedCount.toLocaleString()+' indexed pages':''));
  const list=document.createElement('div');list.className='results-list';
  for(const item of (Array.isArray(data.results)?data.results:[])){
    const card=document.createElement('article');card.className='eh-result';
    const link=document.createElement('a');link.href=safeUrl(item.url);link.target='_blank';link.rel='noopener noreferrer';link.textContent=item.title||item.url||'Web result';
    const snippet=document.createElement('p');snippet.textContent=item.snippet||item.description||'';
    const source=document.createElement('small');source.textContent=(item.source||'Public web')+(item.origin?' · '+item.origin:'');
    card.append(link,snippet,source);list.append(card);
  }
  if(!list.children.length){const empty=document.createElement('div');empty.className='results-empty';empty.textContent='No matching web results came back. Try another search or category.';list.append(empty);}
  resultsRoot.append(list);
  if(!catalogCount&&data.catalogPreview&&data.catalogPreview.status!=='ready'){
    const note=document.createElement('p');note.className='results-note';
    note.textContent='No matching candidate catalog records were found in the current preview. Candidate records remain provisional until source terms and record-level rights are reviewed.';
    resultsRoot.append(note);
  }
}
function cleanCommonsValue(value){
  return String(value||'').replace(/<[^>]*>/g,' ')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&quot;/g,'"').replace(/&apos;/g,"'")
    .replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(Number(n)))
    .replace(/&#x([0-9a-f]+);/gi,(_,n)=>String.fromCodePoint(parseInt(n,16)))
    .replace(/\s+/g,' ').trim();
}
function mediaPreviewMetadata(meta){
  const license=cleanCommonsValue(meta.LicenseShortName?.value);
  const licenseUrl=cleanCommonsValue(meta.LicenseUrl?.value);
  const creator=cleanCommonsValue(meta.Artist?.value||meta.Credit?.value||'');
  const raw=cleanCommonsValue(meta.AttributionRequired?.value).toLowerCase();
  const attributionRequired=raw==='true'?true:raw==='false'?false:null;
  const publicDomain=license.toLowerCase().startsWith('public domain');
  const cc0=/^cc0(?:\s|$)/i.test(license);
  const ccByMatch=license.match(/^cc by(-sa)?\s+(1\.0|2\.0|2\.5|3\.0|4\.0)$/i);
  let ccByLicenseUrlValid=false;
  if(ccByMatch){try{
    const url=new URL(licenseUrl),kind=ccByMatch[1]?'by-sa':'by';
    const expected='/licenses/'+kind+'/'+ccByMatch[2]+'/';
    ccByLicenseUrlValid=url.protocol==='https:'&&url.hostname==='creativecommons.org'&&url.pathname.replace(/\/+$/,'/')===expected;
  }catch{}}
  const licenseValid=publicDomain||cc0||(ccByMatch!==null&&ccByLicenseUrlValid);
  const attributionValid=ccByMatch?creator.length>0:(attributionRequired===false||(attributionRequired===true&&creator.length>0));
  return {allowed:licenseValid&&attributionValid,license,licenseUrl,creator,attributionRequired};
}
function renderImages(data,q){
  resultsRoot.replaceChildren();
  const candidates=Object.values(data.query?.pages||{}).filter(p=>p.imageinfo&&p.imageinfo[0]?.thumburl);
  const pages=candidates.map(page=>({page,preview:mediaPreviewMetadata(page.imageinfo[0].extmetadata||{})}))
    .filter(entry=>entry.preview.allowed).slice(0,24);
  makeHeading(q,'Image results',pages.length.toLocaleString()+' licensed Wikimedia Commons images');
  const grid=document.createElement('div');grid.className='media-grid';
  for(let index=0;index<pages.length;index++){
    const p=pages[index].page,info=p.imageinfo[0],preview=pages[index].preview;
    const card=document.createElement('article');card.className='media-card';
    card.dataset.license=preview.license;card.dataset.creator=preview.creator;
    const link=document.createElement('a');link.href=safeUrl(info.descriptionurl);link.target='_blank';link.rel='noopener noreferrer';
    const img=document.createElement('img');img.src=safeUrl(info.thumburl);img.alt=p.title||q;
    img.loading=index<8?'eager':'lazy';img.decoding='async';img.referrerPolicy='no-referrer';
    img.onerror=()=>{const placeholder=document.createElement('div');placeholder.className='image-placeholder';placeholder.textContent='Preview unavailable';img.replaceWith(placeholder);};
    const title=document.createElement('a');title.href=safeUrl(info.descriptionurl);title.target='_blank';title.rel='noopener noreferrer';title.textContent=(p.title||'Image').replace(/^File:/,'');
    const small=document.createElement('small');small.append(document.createTextNode('Wikimedia Commons · '));
    if(preview.creator)small.append(document.createTextNode(preview.creator+' · '));
    if(preview.licenseUrl&&safeUrl(preview.licenseUrl)!=='#'){
      const licenseLink=document.createElement('a');licenseLink.href=safeUrl(preview.licenseUrl);licenseLink.target='_blank';licenseLink.rel='noopener noreferrer';licenseLink.textContent=preview.license||'License';small.append(licenseLink);
    }else small.append(document.createTextNode(preview.license||'Public domain'));
    link.append(img);card.append(link,title,small);grid.append(card);
  }
  if(!pages.length){const empty=document.createElement('div');empty.className='results-empty';empty.textContent='No matching Commons images with a verified reusable license and attribution were found. Try another search.';resultsRoot.append(empty);return;}
  resultsRoot.append(grid);
}
function renderVideos(data,q){
  resultsRoot.replaceChildren();
  const items=Array.isArray(data.items)?data.items:[];
  makeHeading(q,'Video results',items.length.toLocaleString()+' videos · '+(data.provider||'public video search'));
  const grid=document.createElement('div');grid.className='video-grid';
  for(const item of items){
    const card=document.createElement('article');card.className='video-card';
    const link=document.createElement('a');link.href=safeUrl(item.url);link.target='_blank';link.rel='noopener noreferrer';
    if(item.thumbnail){const img=document.createElement('img');img.src=item.videoId?'https://everythinghub-search-backend.vercel.app/api/video-thumbnail?id='+encodeURIComponent(item.videoId):safeUrl(item.thumbnail);img.alt=item.title||q;img.loading='eager';img.referrerPolicy='no-referrer';img.onerror=()=>{if(item.thumbnail&&img.src!==safeUrl(item.thumbnail)){img.src=safeUrl(item.thumbnail);img.onerror=()=>{const p=document.createElement('div');p.className='video-placeholder';p.textContent='▶ Watch video';img.replaceWith(p);};}else{const p=document.createElement('div');p.className='video-placeholder';p.textContent='▶ Watch video';img.replaceWith(p);}};link.append(img);}else{const placeholder=document.createElement('div');placeholder.className='results-empty';placeholder.textContent='▶ Video';link.append(placeholder);}
    const title=document.createElement('a');title.href=safeUrl(item.url);title.target='_blank';title.rel='noopener noreferrer';title.textContent=item.title||'Video';
    const small=document.createElement('small');small.textContent=(item.source||'Video source')+(item.duration?' · '+item.duration:'')+(item.views?' · '+item.views:'');
    card.append(link,title,small);grid.append(card);
  }
  if(!items.length){const empty=document.createElement('div');empty.className='results-empty';empty.textContent='No videos were returned for this search.';resultsRoot.append(empty);return;}
  resultsRoot.append(grid);
}
async function runImageSearch(q){
  status.textContent='Searching public image collections…';
  const u=new URL('https://commons.wikimedia.org/w/api.php');
  for(const [k,v] of Object.entries({action:'query',generator:'search',gsrsearch:q,gsrnamespace:'6',gsrlimit:'50',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'600',format:'json',origin:'*'}))u.searchParams.set(k,v);
  const response=await fetch(u,{signal:AbortSignal.timeout(20000)});if(!response.ok)throw new Error('Image provider HTTP '+response.status);
  const data=await response.json();renderImages(data,q);
  const n=document.querySelectorAll('#results .media-card').length;status.textContent=n.toLocaleString()+' licensed public images from Wikimedia Commons.';
}
async function runVideoSearch(q){
  status.textContent='Searching public video sources…';
  const u=new URL('https://everythinghub-search-backend.vercel.app/api/videos');u.searchParams.set('q',q);
  const response=await fetch(u,{signal:AbortSignal.timeout(25000)});const data=await response.json();
  if(!response.ok||data.status!=='ok')throw new Error(data.message||'Video search unavailable');
  renderVideos(data,q);status.textContent=data.count.toLocaleString()+' videos from '+data.provider+'.';
}
async function runSearch(){
  const q=input.value.trim();if(!q){input.focus();return;}
  status.textContent='Searching…';resultsRoot.replaceChildren();
  const pageUrl=new URL(location.href);pageUrl.searchParams.set('q',q);pageUrl.searchParams.set('mode',mode);history.replaceState({},'',pageUrl);
  try{
    if(mode==='images'){await runImageSearch(q);return;}
    if(mode==='videos'){await runVideoSearch(q);return;}
    const u=new URL('https://everythinghub-search-backend.vercel.app/api/search');u.searchParams.set('q',q);u.searchParams.set('limit','20');u.searchParams.set('lane',mode);
    let data=null;
    try{const response=await fetch(u,{headers:{accept:'application/json'},signal:AbortSignal.timeout(15000)});if(response.ok){const candidate=await response.json();if(Array.isArray(candidate.results)&&candidate.results.length)data=candidate;}}catch(error){}
    if(!data){const fast=new URL('https://everythinghub-search-backend.vercel.app/api/search-fast');fast.searchParams.set('q',q);fast.searchParams.set('lane',mode);const response=await fetch(fast,{headers:{accept:'application/json'},signal:AbortSignal.timeout(12000)});if(!response.ok)throw new Error('Live web search returned HTTP '+response.status);data=await response.json();if(data.status!=='ok'||!Array.isArray(data.results)||!data.results.length)throw new Error(data.message||'No public results returned');}
    renderResults(data,q);const visibleCount=Array.isArray(data.results)?data.results.length:(Number(data.count)||0);status.textContent=visibleCount.toLocaleString()+' visible results from '+(data.providers||[]).join(' and ')+'.';
  }catch(error){status.textContent=mode==='images'?'Image search is temporarily unavailable.':mode==='videos'?'Video sources are temporarily unavailable.':'Search is temporarily unavailable. Please try again.';const message=document.createElement('div');message.className='results-empty';message.textContent=error.message||'The search service did not respond. Please try again.';resultsRoot.replaceChildren(message);}
}
const newsItems=document.getElementById('news-items'),newsStatus=document.getElementById('news-status');
let activeNewsCategory='for-you';
async function loadNews(category){
  activeNewsCategory=category;newsStatus.textContent='Loading the latest stories…';newsItems.replaceChildren();
  document.querySelectorAll('[data-news]').forEach(b=>b.classList.toggle('active',b.dataset.news===category));
  try{
    const u=new URL('https://everythinghub-search-backend.vercel.app/api/news');u.searchParams.set('category',category);
    const response=await fetch(u,{signal:AbortSignal.timeout(15000)});const data=await response.json();
    if(!response.ok||data.status!=='ok'||!Array.isArray(data.items)||!data.items.length)throw new Error(data.message||'No news stories returned');
    newsStatus.textContent='Updated '+new Date(data.updatedAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+' · '+data.count+' stories';
    for(const item of data.items){
      const card=document.createElement('article');card.className='news-item';
      const link=document.createElement('a');link.href=safeUrl(item.url);link.target='_blank';link.rel='noopener noreferrer';link.textContent=item.title;
      const meta=document.createElement('p');meta.textContent=(item.source||'News source')+(item.publishedAt?' · '+new Date(item.publishedAt).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'');
      card.append(link,meta);newsItems.append(card);
    }
  }catch(error){newsStatus.textContent='News sources are temporarily unavailable. Try Refresh.';const msg=document.createElement('div');msg.className='results-empty';msg.textContent='The news feed did not respond. Tap Refresh to try again.';newsItems.replaceChildren(msg);}
}
document.querySelectorAll('[data-news]').forEach(b=>b.addEventListener('click',()=>void loadNews(b.dataset.news)));
document.getElementById('news-refresh').addEventListener('click',()=>void loadNews(activeNewsCategory));
void loadNews(activeNewsCategory);
form.addEventListener('submit',e=>{e.preventDefault();void runSearch();});
input.addEventListener('input',()=>form.classList.toggle('has-query',input.value.trim().length>0));
const params=new URLSearchParams(location.search);if(params.get('q')){input.value=params.get('q');void runSearch();}
</script>
