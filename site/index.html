<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04110c"><meta name="description" content="Everything Hub — Everything within reach. Search web, news, images, videos, shopping, places, business and research.">
<title>Everything Hub — Everything within reach</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#0b3526,#061710 40%,#020806);color:#effff4;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(1180px,100%);margin:auto;padding:14px 14px 44px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 4px 14px;color:#a7d6b6;font-size:12px}.brand{font-size:19px;font-weight:900;color:#f5fff7}.brand span{color:#b7ff53}.live{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#6cff76;box-shadow:0 0 10px #6cff76}
.art{position:relative;width:100%;line-height:0;border:1px solid #37ff8c;border-radius:20px;overflow:hidden;box-shadow:0 0 22px #00ff8740,0 22px 60px #0008;background:#04130d}.art>img{display:block;width:100%;height:auto}
.search{position:absolute;left:29.5%;top:43.1%;width:42%;height:7.3%;display:flex;line-height:normal}.search input{width:76%;min-width:0;border:0;outline:0;background:#fff;color:#17251a;border-radius:30px 0 0 30px;padding:0 14px;font-size:clamp(10px,2.2vw,18px)}.search button{width:24%;border:0;border-radius:0 30px 30px 0;background:linear-gradient(135deg,#a8d987,#d4ef83);color:#14351b;font-weight:850;font-size:clamp(9px,1.8vw,16px);cursor:pointer}
.hotspot{position:absolute;display:block;background:transparent;border:0;cursor:pointer;border-radius:12px}.hotspot:focus-visible{outline:3px solid #baff55;outline-offset:2px}
.left1{left:3%;top:22%;width:24%;height:8%}.left2{left:3%;top:31%;width:24%;height:8%}.left3{left:3%;top:40%;width:24%;height:8%}.left4{left:3%;top:49%;width:24%;height:8%}.right1{right:3%;top:22%;width:24%;height:8%}.right2{right:3%;top:31%;width:24%;height:8%}.right3{right:3%;top:40%;width:24%;height:8%}.right4{right:3%;top:49%;width:24%;height:8%}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:42px;margin:12px 3px 6px;color:#b9d5c1;font-size:13px}.status strong{color:#d7ff9b}
.results{display:grid;gap:9px;margin:8px 3px 24px}.result{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:14px;align-items:start;padding:13px;border:1px solid #245a3e;border-radius:14px;background:linear-gradient(110deg,#0a2118,#07150f);min-width:0}.result.no-thumb{grid-template-columns:minmax(0,1fr)}.result:hover{border-color:#9be65b;box-shadow:0 0 16px #3dff8430}.thumb{width:100%;height:94px;object-fit:cover;border-radius:9px;background:#10281c}.copy{min-width:0}.copy a{color:#c6f28d;font-size:15px;font-weight:800;line-height:1.35;overflow-wrap:anywhere;text-decoration:none}.copy p{margin:6px 0;color:#c0d3c4;font-size:12px;line-height:1.55;overflow-wrap:anywhere}.source{font-size:10px;color:#7fba91}
.empty{padding:24px;text-align:center;border:1px dashed #387451;border-radius:14px;color:#b9d5c1;background:#06150e}.more{display:block;margin:14px auto 28px;padding:12px 24px;border:1px solid #83d957;border-radius:999px;background:#0b6a3d;color:white;font-weight:800;cursor:pointer}
.discover{margin:28px 3px 0}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}.section-head h2{margin:0;color:#f0fff3;font-size:21px}.section-head small{color:#8fbd9c;font-size:11px}.discover-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.discover-card{display:flex;align-items:center;gap:12px;min-height:82px;padding:13px;border:1px solid #236744;border-radius:14px;background:linear-gradient(145deg,#0b2b1d,#06130d);color:#effff4;cursor:pointer;text-align:left}.discover-card:hover{border-color:#a6ef63}.discover-icon{display:grid;place-items:center;flex:0 0 36px;height:36px;border-radius:11px;background:#10462b;color:#c2ff77;font-size:18px}.discover-card strong{display:block;font-size:13px}.discover-card small{display:block;margin-top:4px;color:#91bba0;font-size:10px}
footer{margin:28px 3px 0;padding:17px 0 0;border-top:1px solid #1f5238;color:#7eaa8e;text-align:center;font-size:11px}
@media(max-width:760px){main{padding:8px 8px 30px}.topline{padding:7px 5px 11px}.art{border-radius:12px}.search input{padding:0 8px}.discover-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.discover-card{min-height:68px;padding:9px;gap:8px}.discover-icon{flex-basis:32px;height:32px}.discover-card strong{font-size:12px}.discover-card small{font-size:9px}.result{grid-template-columns:minmax(0,104px) minmax(0,1fr);gap:10px;padding:10px}.result.no-thumb{grid-template-columns:minmax(0,1fr)}.thumb{height:78px}.copy a{font-size:14px}.copy p{font-size:11px}}
@media(max-width:420px){.brand{font-size:17px}.live{font-size:10px}.status{font-size:11px}.section-head h2{font-size:18px}.discover-card small{display:none}}
</style>
</head>
<body><main>
<div class="topline"><div class="brand">Everything<span>Hub</span></div><div class="live"><span class="dot"></span> Independent search · Everything within reach</div></div>
<section class="art" aria-label="Everything Hub approved octopus homepage artwork and search">
<img src="https://raw.githubusercontent.com/rshure001/EverythingHub-Crawler/main/assets/everythinghub-approved.png" alt="Approved Everything Hub artwork: emerald octopus, glowing brain, gold accents and eight search categories">
<form class="search" id="searchForm"><input id="q" type="search" aria-label="Search Everything Hub" placeholder="Search Everything…" autocomplete="off" required><button type="submit">Search</button></form>
<button class="hotspot left1" data-mode="web" aria-label="Web Search" title="Web Search"></button><button class="hotspot left2" data-mode="videos" aria-label="Videos" title="Videos"></button><button class="hotspot left3" data-mode="images" aria-label="Images" title="Images"></button><button class="hotspot left4" data-mode="news" aria-label="News" title="News"></button>
<button class="hotspot right1" data-mode="shopping" aria-label="Shopping" title="Shopping"></button><button class="hotspot right2" data-mode="research" aria-label="Research" title="Research"></button><button class="hotspot right3" data-mode="business" aria-label="Business" title="Business"></button><button class="hotspot right4" data-mode="places" aria-label="Places" title="Places"></button>
</section>
<div id="status" class="status" aria-live="polite"><span>Search the web or choose one of the eight categories.</span><strong id="modeLabel">WEB SEARCH</strong></div>
<section id="results" class="results" aria-label="Search results"></section><button id="more" class="more" type="button" hidden>More results</button>
<section class="discover"><div class="section-head"><h2>Discover on Everything Hub</h2><small>Eight ways to explore</small></div><div class="discover-grid">
<button class="discover-card" data-mode="news"><span class="discover-icon">▤</span><span><strong>News</strong><small>World and local updates</small></span></button>
<button class="discover-card" data-mode="images"><span class="discover-icon">▧</span><span><strong>Images</strong><small>Photos and visuals</small></span></button>
<button class="discover-card" data-mode="videos"><span class="discover-icon">▶</span><span><strong>Videos</strong><small>Watch and discover</small></span></button>
<button class="discover-card" data-mode="research"><span class="discover-icon">⌕</span><span><strong>Research</strong><small>Knowledge and learning</small></span></button>
</div></section>
<footer>Everything Hub · Everything within reach · Independent search and discovery</footer>
</main>
<script>
const BASE="https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1",KEY="sb_publishable_XlIsACWhtVS1jVODWYGTpg_GMs8v3vJ";
const LANES={web:null,news:"news",images:"general",videos:"general",shopping:"business",places:"culture",business:"business",research:"science"};
const LABELS={web:"WEB SEARCH",news:"NEWS",images:"IMAGES",videos:"VIDEOS",shopping:"SHOPPING",places:"PLACES",business:"BUSINESS",research:"RESEARCH"};
const form=document.getElementById("searchForm"),input=document.getElementById("q"),status=document.getElementById("status"),modeLabel=document.getElementById("modeLabel"),results=document.getElementById("results"),more=document.getElementById("more");
let mode="web",offset=0,busy=false,hasMore=false;
function safeUrl(v){try{const u=new URL(v);return ["https:","http:"].includes(u.protocol)?u.href:""}catch{return ""}}
function setMode(v){if(!LABELS[v])return;mode=v;modeLabel.textContent=LABELS[v];input.placeholder="Search "+v[0].toUpperCase()+v.slice(1)+"…"}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function message(txt){results.replaceChildren(el("div","empty",txt))}
function addResult(x){const href=safeUrl(x.url||x.pageUrl||x.videoUrl||x.imageUrl);if(!href)return;const card=el("article","result"),image=safeUrl(x.image||x.imageUrl||x.thumbnailUrl);if(image){const img=el("img","thumb");img.src=image;img.alt="";img.loading="lazy";img.referrerPolicy="no-referrer";card.append(img)}else card.classList.add("no-thumb");const copy=el("div","copy"),link=el("a","",x.title||href),desc=el("p","",x.snippet||x.description||"Open this result to explore the source."),source=el("div","source",x.source||"Everything Hub");link.href=href;link.target="_blank";link.rel="noopener noreferrer";copy.append(link,desc,source);card.append(copy);results.append(card)}
async function search(reset=true){if(busy)return;if(reset){offset=0;hasMore=false;results.replaceChildren();more.hidden=true}const query=input.value.trim();if(query.length<2){status.firstElementChild.textContent="Enter at least two characters to search.";return}busy=true;status.firstElementChild.textContent="Searching "+mode+"…";try{let data,items;if(mode==="images"||mode==="videos"){const u=new URL(BASE+"/everything-hub-media-search");u.searchParams.set("q",query);u.searchParams.set("type",mode==="videos"?"video":"image");const r=await fetch(u,{headers:{apikey:KEY,accept:"application/json"}});if(!r.ok)throw Error("Media search returned "+r.status);data=await r.json();items=(data.results||[]).map(x=>({...x,url:x.pageUrl||x.videoUrl||x.imageUrl,image:x.imageUrl||x.thumbnailUrl,source:data.provider||"Media search"}));hasMore=false}else{const u=new URL(BASE+"/everything-hub-web-search");u.searchParams.set("q",query);u.searchParams.set("limit","20");u.searchParams.set("offset",String(offset));if(LANES[mode])u.searchParams.set("tentacle",LANES[mode]);const r=await fetch(u,{headers:{apikey:KEY,accept:"application/json"}});if(!r.ok)throw Error("Search returned "+r.status);data=await r.json();items=data.results||[];hasMore=Boolean(data.hasMore)}for(const x of items)addResult(x);const count=Number(data.count??items.length);status.firstElementChild.textContent=count.toLocaleString()+" results for “"+query+"”";if(!items.length)message("No matches found. Try another phrase or choose Web Search.");more.hidden=!hasMore;more.textContent="More results"}catch(e){status.firstElementChild.textContent="Search is temporarily unavailable. Please try again shortly.";message(String(e.message||e))}finally{busy=false}}
form.addEventListener("submit",e=>{e.preventDefault();search(true)});
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{setMode(b.dataset.mode);if(input.value.trim())search(true);else{status.firstElementChild.textContent="Ready to search "+mode+".";input.focus()}}));
more.addEventListener("click",()=>{if(!busy&&hasMore){offset+=20;search(false)}});
</script>
</body></html>
