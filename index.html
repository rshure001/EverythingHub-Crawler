document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{setMode(b.dataset.mode);if(input.value.trim())runSearch(input.value.trim());else{input.focus();status.textContent='Enter a search to explore '+mode+'.';}}));
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{setMode(b.dataset.tab);if(lastQuery)runSearch(lastQuery);}));
form.addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(q)runSearch(q);});
async function runSearch(q){lastQuery=q;status.textContent='Searching Everything Hub…';out.innerHTML='';try{let data;if(mode==='images'||mode==='videos'){const u=new URL('https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-media-search');u.searchParams.set('q',q);u.searchParams.set('type',mode==='videos'?'video':'image');const r=await fetch(u);if(!r.ok)throw Error('Media search '+r.status);data=await r.json();}else{const u=new URL('https://everythinghub-search-backend.vercel.app/api/search');u.searchParams.set('q',q);u.searchParams.set('limit','30');u.searchParams.set('mode',mode);const r=await fetch(u);if(!r.ok)throw Error('Search '+r.status);data=await r.json();}const rows=data.results||[];status.textContent=rows.length+' results for “'+q+'” · '+mode;if(!rows.length){out.innerHTML='<p class="empty">No results returned. Try Web or another search.</p>';return;}out.innerHTML=rows.map(x=>{const url=String(x.url||x.pageUrl||x.imageUrl||'#');const title=esc(x.title||x.name||url);const snippet=esc(x.snippet||x.description||'');const source=esc(x.source||x.provider||'Web result');const image=x.image||x.imageUrl||x.thumbnailUrl||'';return '<article class="item">'+(image?'<img loading="lazy" src="'+esc(image)+'" alt="">':'')+'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+title+'</a><p>'+snippet+'</p><small>'+source+'</small><div style="clear:both"></div></article>';}).join('');}catch(err){status.textContent='Search service temporarily unavailable';out.innerHTML='<p class="empty">'+esc(err.message)+'. The homepage is available; the search provider needs attention.</p>';}}
</script></body></html>
