name: Publish and verify Everything Hub — free Supabase Storage route
on:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "site/search.js"
      - "supabase/functions/everything-hub-static-publisher/index.ts"
      - ".github/workflows/everything-hub-publish-and-verify.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: everything-hub-static-publish
  cancel-in-progress: true
jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISHER_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-static-publisher
      PUBLISHER_USER_JWT: ${{ secrets.SUPABASE_PUBLISHER_USER_JWT }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a signed-in publisher JWT before network access
        run: |
          set -euo pipefail
          if [ -z "$PUBLISHER_USER_JWT" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_PUBLISHER_USER_JWT. Add a fresh signed-in Supabase user access token to repository Actions secrets; do not paste it into chat."
            exit 1
          fi
          if [[ ! "$PUBLISHER_USER_JWT" =~ ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ ]]; then
            echo "::error::SUPABASE_PUBLISHER_USER_JWT is present but is not JWT-shaped. No token value was printed."
            exit 1
          fi
          echo "Publisher JWT is present and JWT-shaped; token value withheld."
      - name: Read-only publisher storage preflight
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 20 "$PUBLISHER_URL?probe=publisher-diagnostic" -o /tmp/probe.json
          node <<'NODE'
          const fs=require("node:fs"),d=JSON.parse(fs.readFileSync("/tmp/probe.json","utf8"));
          if(!["ready","bucket_missing"].includes(d.status)||d.publishOnProbe!==false)throw new Error("Publisher storage preflight failed: "+JSON.stringify(d));
          console.log(JSON.stringify({status:d.status,bucket:d.bucket,bucketExists:d.bucketExists,publishOnProbe:d.publishOnProbe},null,2));
          NODE
      - name: Publish the exact commit to public Storage
        id: publish
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 45 -X POST "$PUBLISHER_URL" \
            -H "Authorization: Bearer $PUBLISHER_USER_JWT" \
            -H "Content-Type: application/json" \
            --data '{"sha":"'"$GITHUB_SHA"'"}' -o /tmp/publish.json -w 'HTTP %{http_code}\n'
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const d=JSON.parse(fs.readFileSync("/tmp/publish.json","utf8"));
          if(d.status!=="published"||!d.url||!d.searchUrl||!Number.isInteger(d.bytes)||!Number.isInteger(d.searchBytes))throw new Error("Publisher did not confirm both assets: "+JSON.stringify(d));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'url='+d.url+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'search_url='+d.searchUrl+'\n');
          console.log(JSON.stringify({status:d.status,url:d.url,searchUrl:d.searchUrl,bytes:d.bytes,searchBytes:d.searchBytes,commitSha:d.commitSha},null,2));
          NODE
      - name: Verify published HTML and JavaScript assets
        env:
          SITE_URL: ${{ steps.publish.outputs.url }}
          SEARCH_URL: ${{ steps.publish.outputs.search_url }}
        run: |
          set -euo pipefail
          curl -fsS -D /tmp/site-headers.txt "$SITE_URL" -o /tmp/site.html
          cmp -s site/index.html /tmp/site.html || { echo "Published homepage does not byte-match site/index.html"; exit 1; }
          grep -Eiq '^content-type: *text/html' /tmp/site-headers.txt
          curl -fsS -D /tmp/search-headers.txt "$SEARCH_URL" -o /tmp/search.js
          cmp -s site/search.js /tmp/search.js || { echo "Published search client does not byte-match site/search.js"; exit 1; }
          grep -Eiq '^content-type: *application/javascript' /tmp/search-headers.txt
          for needle in '<!doctype html' 'Everything Hub — Everything within reach' 'class="approved-master-art"' 'data:image/png;base64,' 'id="search"' 'id="q"' 'src="search.js"' 'data-mode="web"' 'data-mode="news"' 'data-mode="images"' 'data-mode="videos"' 'data-mode="shopping"' 'data-mode="places"' 'data-mode="business"' 'data-mode="research"' 'EverythingHubSearch.create'; do
            grep -Fqi "$needle" /tmp/site.html || { echo "Missing: $needle"; exit 1; }
          done
          echo "PASS: public Storage HTML and search client are byte-identical to the approved repository files."
