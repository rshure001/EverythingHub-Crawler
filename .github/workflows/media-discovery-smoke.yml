name: Everything Hub media discovery smoke test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/media-discovery-smoke.yml"
      - "supabase/functions/everything-hub-media-search/index.ts"
      - "database/test_media_discovery.py"
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: everythinghub-media-smoke
  cancel-in-progress: true
jobs:
  media-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify live image and video discovery metadata and reuse terms
        env:
          BASE: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-media-search
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 20 -G "$BASE" \
            --data-urlencode "q=octopus" --data-urlencode "type=image" -D /tmp/images.headers -o /tmp/images.json
          curl --silent --show-error --fail --max-time 20 -G "$BASE" \
            --data-urlencode "q=Apollo 11 NASA" --data-urlencode "type=video" -D /tmp/videos.headers -o /tmp/videos.json
          node <<'NODE'
          const fs = require("fs");
          for (const type of ["images", "videos"]) {
            const d = JSON.parse(fs.readFileSync("/tmp/" + type + ".json", "utf8"));
            const headers = fs.readFileSync("/tmp/" + type + ".headers", "utf8").toLowerCase();
            if (!headers.includes("content-type: application/json")) {
              throw new Error(type + ": missing JSON content type");
            }
            if (!headers.includes("cache-control: public, max-age=180, s-maxage=180")) {
              throw new Error(type + ": unexpected or missing cache policy");
            }
            if (!Array.isArray(d.results) || d.count !== d.results.length) {
              throw new Error(type + ": invalid results/count response");
            }
            if (typeof d.usageNote !== "string" || !d.usageNote.length) {
              throw new Error(type + ": missing source-terms usage note");
            }
            if (!d.results.length) {
              throw new Error(type + ": no discoverable media returned; provider=" + (d.provider || "unknown") + "; warning=" + (d.warning || "none"));
            }
            if (!["Wikimedia Commons", "Bing Images", "Bing Videos"].includes(d.provider)) {
              throw new Error(type + ": unexpected provider " + d.provider);
            }
            for (const [index, item] of d.results.entries()) {
              if (!item.source || !item.usageRights || !item.pageUrl?.startsWith("https://")) {
                throw new Error(type + ": result " + index + " lacks source, usage rights, or HTTPS source page");
              }
              if (type === "images" && !item.imageUrl?.startsWith("https://")) {
                throw new Error("images: result " + index + " lacks an HTTPS image URL");
              }
              if (d.provider === "Wikimedia Commons") {
                for (const field of ["license", "licenseUrl", "creator", "credit", "attributionRequired"]) {
                  if (!(field in item)) throw new Error(type + ": Commons result " + index + " missing " + field);
                }
              } else if (!String(item.usageRights).includes("Unverified")) {
                throw new Error(type + ": Bing result " + index + " must not imply reuse permission");
              }
            }
            console.log(JSON.stringify({
              type,
              provider: d.provider,
              count: d.count,
              usageNote: d.usageNote,
              firstResult: {
                title: d.results[0].title,
                source: d.results[0].source,
                license: d.results[0].license || null,
                attributionRequired: d.results[0].attributionRequired ?? null
              }
            }, null, 2));
          }
          NODE
