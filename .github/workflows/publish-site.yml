name: EverythingHub Publisher
# Revalidate and retain the current crawler catalog even while Pages deployment is permission-gated.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "public-search/**"
      - "publisher/**"
      - ".github/workflows/publish-site.yml"
  workflow_run:
    workflows: ["Everything Hub crawler"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: everythinghub-production-publisher
  cancel-in-progress: false
jobs:
  validate-and-build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      pages_available: ${{ steps.pages.outputs.available }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild and validate the public crawler catalog
        run: |
          python crawler/build_search_shards.py
          python crawler/validate_public_index.py
      - name: Validate immutable release manifest
        run: python publisher/publish.py --check
      - name: Validate and stage the crawler search catalog
        run: |
          python - <<'PY'
          import gzip, hashlib, json, pathlib, re, shutil
          source = pathlib.Path('public-search')
          target = pathlib.Path('site/search-index')
          manifest_path = source / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          shards = manifest.get('shards')
          if manifest.get('integrity') != 'sha256' or not isinstance(shards, list):
              raise SystemExit('Public search manifest must declare SHA-256 and a shard list')
          if len(shards) != int(manifest.get('shard_count', -1)):
              raise SystemExit('Manifest shard_count does not match the shard list')
          target.mkdir(parents=True, exist_ok=True)
          seen = set()
          total = 0
          for shard in shards:
              name = shard.get('file', '')
              if not re.fullmatch(r'shard-\d{4}\.json', name):
                  raise SystemExit(f'Unsafe shard filename: {name!r}')
              raw = (source / name).read_bytes()
              if len(raw) != int(shard.get('bytes', -1)):
                  raise SystemExit(f'{name}: byte length mismatch')
              digest = hashlib.sha256(raw).hexdigest()
              if digest != shard.get('sha256'):
                  raise SystemExit(f'{name}: SHA-256 mismatch')
              payload = json.loads(raw)
              pages = payload.get('pages')
              if not isinstance(pages, list) or len(pages) != int(shard.get('pages', -1)):
                  raise SystemExit(f'{name}: page count mismatch')
              for page in pages:
                  url = page.get('url') if isinstance(page, dict) else None
                  if not isinstance(url, str) or not url.startswith(('https://', 'http://')):
                      raise SystemExit(f'{name}: invalid page URL')
                  if url in seen:
                      raise SystemExit(f'{name}: duplicate URL across the catalog: {url}')
                  seen.add(url)
              total += len(pages)
              shutil.copyfile(source / name, target / name)
          if total != int(manifest.get('total_pages', -1)):
              raise SystemExit(f'Catalog total mismatch: {total} pages')
          catalog = manifest.get('catalog_gzip')
          if not isinstance(catalog, dict) or catalog.get('file') != 'catalog-v1.json.gz':
              raise SystemExit('Compressed crawler catalog metadata is missing or unsafe')
          catalog_raw = (source / catalog['file']).read_bytes()
          if len(catalog_raw) != int(catalog.get('bytes', -1)):
              raise SystemExit('Compressed crawler catalog byte length mismatch')
          if hashlib.sha256(catalog_raw).hexdigest() != catalog.get('sha256'):
              raise SystemExit('Compressed crawler catalog SHA-256 mismatch')
          catalog_payload = json.loads(gzip.decompress(catalog_raw))
          catalog_pages = catalog_payload.get('pages') if isinstance(catalog_payload, dict) else None
          if catalog_payload.get('version') != 1 or not isinstance(catalog_pages, list) or len(catalog_pages) != total:
              raise SystemExit('Compressed crawler catalog page count or schema mismatch')
          if catalog_pages != [page for shard in shards for page in json.loads((source / shard['file']).read_bytes()).get('pages', [])]:
              raise SystemExit('Compressed crawler catalog records differ from the verified shards')
          shutil.copyfile(source / catalog['file'], target / catalog['file'])
          shutil.copyfile(manifest_path, target / 'manifest.json')
          print(json.dumps({'status':'validated-and-staged','pages':total,'shards':len(shards),'unique_urls':len(seen),'catalog_gzip_bytes':len(catalog_raw),'integrity':'sha256'}, indent=2))
          PY
      - name: Upload validated release artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Check GitHub Pages access without changing repository settings
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>/tmp/pages-error; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "- GitHub Pages access: available to this integration" >> "$GITHUB_STEP_SUMMARY"
          else
            pages_error="$(head -c 300 /tmp/pages-error | tr '\n' ' ')"
            if [ -z "$pages_error" ]; then pages_error="unavailable"; fi
            if grep -qE 'HTTP 404|Not Found' /tmp/pages-error; then
              # The integration previously attempted configure-pages and GitHub
              # rejected site creation with "Resource not accessible by integration".
              # A missing site is therefore a permission blocker, not permission
              # to retry a mutating enablement request on every publish.
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub Pages site is not initialized and this integration cannot create it."
              echo "::warning::Validated artifact is retained; deployment is skipped without changing repository settings."
              echo "## GitHub Pages deployment blocked" >> "$GITHUB_STEP_SUMMARY"
              echo "- Artifact: validated and uploaded." >> "$GITHUB_STEP_SUMMARY"
              echo "- Blocker: GitHub Pages site lookup returned 404; the previous configure-pages create attempt returned Resource not accessible by integration." >> "$GITHUB_STEP_SUMMARY"
              echo "- Required capability: repository Pages site creation/administration permission for the GitHub Actions integration." >> "$GITHUB_STEP_SUMMARY"
              echo "- No repository settings or existing data were changed." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub Pages API response: $pages_error"
              echo "::warning::The validated artifact is retained without deployment."
              echo "## GitHub Pages deployment blocked" >> "$GITHUB_STEP_SUMMARY"
              echo "- Artifact: validated and uploaded." >> "$GITHUB_STEP_SUMMARY"
              echo "- Blocker: the repository Pages endpoint is not accessible to this GitHub Actions integration." >> "$GITHUB_STEP_SUMMARY"
              echo "- API response: $pages_error" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
  deploy:
    if: needs.validate-and-build.outputs.pages_available == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy validated release
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published homepage and complete crawler catalog
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import gzip, hashlib, json, os, urllib.request
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          def get(path):
              request = urllib.request.Request(base + path, headers={'User-Agent':'EverythingHub-Pages-Verification/1.0'})
              with urllib.request.urlopen(request, timeout=25) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{path}: HTTP {response.status}')
                  return response.read()
          html = get('index.html').decode('utf-8')
          if 'Everything Hub — Everything within reach' not in html or 'id="q"' not in html:
              raise SystemExit('Published homepage is missing its approved title or search field')
          if html.count('data-mode=') != 8 or 'everythinghub-approved.png' not in html:
              raise SystemExit('Published homepage is missing one or more approved search categories or artwork')
          manifest = json.loads(get('search-index/manifest.json'))
          shards = manifest.get('shards')
          if manifest.get('integrity') != 'sha256' or not isinstance(shards, list) or len(shards) != int(manifest.get('shard_count', -1)):
              raise SystemExit('Published search manifest is invalid')
          total = 0
          for shard in shards:
              name = shard.get('file', '')
              if not name.startswith('shard-') or not name.endswith('.json'):
                  raise SystemExit(f'Invalid published shard name: {name!r}')
              raw = get('search-index/' + name)
              if hashlib.sha256(raw).hexdigest() != shard.get('sha256'):
                  raise SystemExit(f'{name}: published SHA-256 mismatch')
              payload = json.loads(raw)
              pages = payload.get('pages')
              if not isinstance(pages, list) or len(pages) != int(shard.get('pages', -1)):
                  raise SystemExit(f'{name}: published page count mismatch')
              total += len(pages)
          if total != int(manifest.get('total_pages', -1)):
              raise SystemExit(f'Published total mismatch: {total} pages')
          catalog = manifest.get('catalog_gzip')
          if not isinstance(catalog, dict) or catalog.get('file') != 'catalog-v1.json.gz':
              raise SystemExit('Published compressed crawler catalog metadata is missing')
          catalog_raw = get('search-index/' + catalog['file'])
          if len(catalog_raw) != int(catalog.get('bytes', -1)):
              raise SystemExit('Published compressed crawler catalog byte length mismatch')
          if hashlib.sha256(catalog_raw).hexdigest() != catalog.get('sha256'):
              raise SystemExit('Published compressed crawler catalog SHA-256 mismatch')
          catalog_payload = json.loads(gzip.decompress(catalog_raw))
          if catalog_payload.get('version') != 1 or len(catalog_payload.get('pages', [])) != total:
              raise SystemExit('Published compressed crawler catalog page count mismatch')
          print(json.dumps({'status':'published-and-verified','url':base,'pages':total,'shards':len(shards),'catalog_gzip_bytes':len(catalog_raw),'integrity':'sha256','homepage_categories':8}, indent=2))
          PY
