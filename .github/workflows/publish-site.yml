name: EverythingHub Publisher
# Revalidate and retain the current crawler catalog even while Pages deployment is permission-gated.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "public-search/**"
      - "publisher/**"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: everythinghub-production-publisher
  cancel-in-progress: false
jobs:
  validate-and-build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      pages_available: ${{ steps.pages.outputs.available }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild and validate the public crawler catalog
        run: |
          python crawler/build_search_shards.py
          python crawler/validate_public_index.py
          python crawler/validate_media_catalog.py
      - name: Validate immutable release manifest
        run: python publisher/publish.py --check
      - name: Validate and stage the crawler search catalog
        run: python publisher/stage_search_catalog.py --source public-search --target site/search-index
      - name: Write machine-readable crawler release health
        run: python publisher/release_health.py --manifest public-search/manifest.json --output site/search-index/health.json --media-catalog data/media-discovery.json
      - name: Upload validated release artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Check GitHub Pages access without changing repository settings
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>/tmp/pages-error; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "- GitHub Pages access: available to this integration" >> "$GITHUB_STEP_SUMMARY"
          else
            pages_error="$(head -c 300 /tmp/pages-error | tr '\n' ' ')"
            if [ -z "$pages_error" ]; then pages_error="unavailable"; fi
            if grep -qE 'HTTP 404|Not Found' /tmp/pages-error; then
              # The integration previously attempted configure-pages and GitHub
              # rejected site creation with "Resource not accessible by integration".
              # A missing site is therefore a permission blocker, not permission
              # to retry a mutating enablement request on every publish.
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub Pages site is not initialized and this integration cannot create it."
              echo "::warning::Validated artifact is retained; deployment is skipped without changing repository settings."
              echo "## GitHub Pages deployment blocked" >> "$GITHUB_STEP_SUMMARY"
              echo "- Artifact: validated and uploaded." >> "$GITHUB_STEP_SUMMARY"
              echo "- Blocker: GitHub Pages site lookup returned 404; the previous configure-pages create attempt returned Resource not accessible by integration." >> "$GITHUB_STEP_SUMMARY"
              echo "- Required capability: repository Pages site creation/administration permission for the GitHub Actions integration." >> "$GITHUB_STEP_SUMMARY"
              echo "- No repository settings or existing data were changed." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub Pages API response: $pages_error"
              echo "::warning::The validated artifact is retained without deployment."
              echo "## GitHub Pages deployment blocked" >> "$GITHUB_STEP_SUMMARY"
              echo "- Artifact: validated and uploaded." >> "$GITHUB_STEP_SUMMARY"
              echo "- Blocker: the repository Pages endpoint is not accessible to this GitHub Actions integration." >> "$GITHUB_STEP_SUMMARY"
              echo "- API response: $pages_error" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
  deploy:
    if: needs.validate-and-build.outputs.pages_available == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy validated release
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published homepage and complete crawler catalog
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.request
          from publisher.stage_search_catalog import bounded_gunzip, decode_shard, validate_manifest, MAX_CATALOG_UNCOMPRESSED_BYTES
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          def get(path):
              request = urllib.request.Request(base + path, headers={'User-Agent':'EverythingHub-Pages-Verification/1.0'})
              with urllib.request.urlopen(request, timeout=25) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{path}: HTTP {response.status}')
                  return response.read()
          html = get('index.html').decode('utf-8')
          if 'Everything Hub — Everything within reach' not in html or 'id="q"' not in html:
              raise SystemExit('Published homepage is missing its approved title or search field')
          if html.count('data-mode=') != 8 or 'everythinghub-approved.png' not in html:
              raise SystemExit('Published homepage is missing one or more approved search categories or artwork')
          manifest = json.loads(get('search-index/manifest.json'))
          validate_manifest(manifest)
          health = json.loads(get('search-index/health.json'))
          expected_catalog = manifest.get('catalog_gzip')
          if (
              health.get('schema') != 1
              or health.get('source_updated_at') != manifest.get('updated_at')
              or health.get('total_pages') != manifest.get('total_pages')
              or health.get('shard_count') != manifest.get('shard_count')
              or health.get('catalog_gzip') != expected_catalog
              or health.get('search_transport') != ('gzip' if expected_catalog else 'shards')
          ):
              raise SystemExit('Published crawler health file does not match the catalog manifest')
          media = health.get('media_discovery')
          if not isinstance(media, dict) or media.get('schema') != 1:
              raise SystemExit('Published crawler health file is missing media discovery metrics')
          media_total = media.get('total_candidates')
          media_types = media.get('by_type')
          if not isinstance(media_total, int) or not isinstance(media_types, dict):
              raise SystemExit('Published media discovery metrics are malformed')
          if sum(media_types.values()) != media_total:
              raise SystemExit('Published media type counts do not match the candidate total')
          if (
              media.get('robots_allowed') != media_total
              or media.get('metadata_only_not_fetched') != media_total
              or media.get('rights_unknown') != media_total
              or media.get('extraction_status') != 'not_performed_by_discovery_crawler'
          ):
              raise SystemExit('Published media health incorrectly implies fetch, extraction, or reuse permission')
          shards = manifest.get('shards')
          if manifest.get('integrity') != 'sha256' or not isinstance(shards, list) or len(shards) != int(manifest.get('shard_count', -1)):
              raise SystemExit('Published search manifest is invalid')
          total = 0
          seen_urls = set()
          all_pages = []
          for shard in shards:
              name = shard.get('file', '')
              raw = get('search-index/' + name)
              pages = decode_shard(shard, raw)
              for page in pages:
                  url = page['url']
                  if url in seen_urls:
                      raise SystemExit(f'{name}: duplicate URL across the published catalog: {url}')
                  seen_urls.add(url)
              all_pages.extend(pages)
              total += len(pages)
          if total != int(manifest.get('total_pages', -1)):
              raise SystemExit(f'Published total mismatch: {total} pages')
          catalog = manifest.get('catalog_gzip')
          catalog_bytes = None
          if catalog is not None:
              if not isinstance(catalog, dict) or catalog.get('file') != 'catalog-v1.json.gz':
                  raise SystemExit('Published compressed crawler catalog metadata is unsafe')
              declared_bytes = catalog.get('bytes')
              if not isinstance(declared_bytes, int) or declared_bytes < 1 or declared_bytes > 16_000_000:
                  raise SystemExit('Published compressed crawler catalog exceeds the 16 MB independent-search safety limit')
              catalog_raw = get('search-index/' + catalog['file'])
              if len(catalog_raw) != declared_bytes:
                  raise SystemExit('Published compressed crawler catalog byte length mismatch')
              if hashlib.sha256(catalog_raw).hexdigest() != catalog.get('sha256'):
                  raise SystemExit('Published compressed crawler catalog SHA-256 mismatch')
              catalog_payload = json.loads(bounded_gunzip(catalog_raw, MAX_CATALOG_UNCOMPRESSED_BYTES).decode('utf-8'))
              if not isinstance(catalog_payload, dict) or catalog_payload.get('version') != 1 or catalog_payload.get('pages') != all_pages:
                  raise SystemExit('Published compressed crawler catalog records differ from the verified shards')
              catalog_bytes = len(catalog_raw)
          print(json.dumps({
              'status':'published-and-verified',
              'url':base,
              'pages':total,
              'shards':len(shards),
              'catalog_gzip_bytes':catalog_bytes,
              'search_transport':'gzip' if catalog is not None else 'shards',
              'integrity':'sha256',
              'homepage_categories':8
          }, indent=2))
          PY
