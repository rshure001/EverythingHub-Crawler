name: EverythingHub Publisher
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: everythinghub-production-publisher
  cancel-in-progress: false
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate immutable release manifest
        run: python publisher/publish.py --check
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload release artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy validated release
        id: deployment
        uses: actions/deploy-pages@v4
