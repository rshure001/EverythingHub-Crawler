name: Everything Hub live diagnostics
on:
  push:
    paths:
      - .github/workflows/everything-hub-live-diagnostics.yml
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: everything-hub-live-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live homepage and search API
        env:
          BASE: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1
          KEY: sb_publishable_XlIsACWhtVS1jVODWYGTpg_GMs8v3vJ
          VERCEL_BASE: https://everythinghub-homepage-fixed.vercel.app
        run: |
          set -euo pipefail
          echo "=== HOMEPAGE ==="
          curl -fsSL -D /tmp/headers.txt "$BASE/everything-hub-site" -o /tmp/home.html
          head -n 1 /tmp/headers.txt
          grep -i '^content-type:' /tmp/headers.txt | tail -1
          printf 'bytes='; wc -c < /tmp/home.html
          for needle in '<!doctype html' 'Everything Hub' 'id="q"' 'approved-master-art' 'class="tile"' 'everything-hub-media-search'; do
            if grep -Fq "$needle" /tmp/home.html; then echo "PASS homepage contains: $needle"; else echo "FAIL homepage missing: $needle"; exit 1; fi
          done
          tile_count=$(grep -o 'class="tile"' /tmp/home.html | wc -l)
          echo "homepage_tiles=$tile_count"
          test "$tile_count" -eq 8
          echo "=== CANONICAL VERCEL HOMEPAGE AND SEARCH CATALOG ==="
          node <<'NODE'
          const fs = require("fs");
          (async () => {
            const base = process.env.VERCEL_BASE.replace(/\/$/, "");
            const homeResponse = await fetch(base + "/", { signal: AbortSignal.timeout(20000) });
            if (!homeResponse.ok) throw new Error("Canonical homepage HTTP " + homeResponse.status);
            const html = await homeResponse.text();
            const tiles = (html.match(/class="tile"/g) || []).length;
            if (!html.includes("Everything Hub") || !html.includes('id="q"') ||
                !html.includes("approved-master-art") || tiles !== 8) {
              throw new Error("Canonical homepage structure check failed: " + JSON.stringify({tiles}));
            }
            const manifestResponse = await fetch(base + "/search-index/manifest.json", { signal: AbortSignal.timeout(20000) });
            if (!manifestResponse.ok) throw new Error("Search manifest HTTP " + manifestResponse.status);
            const manifest = await manifestResponse.json();
            if (!Array.isArray(manifest.shards) || manifest.shards.length !== manifest.shard_count) {
              throw new Error("Search manifest shard metadata is inconsistent");
            }
            let total = 0;
            for (const shard of manifest.shards) {
              const response = await fetch(new URL("search-index/" + shard.file, base + "/"), {
                signal: AbortSignal.timeout(20000)
              });
              if (!response.ok) throw new Error(shard.file + " HTTP " + response.status);
              const payload = await response.json();
              const count = Array.isArray(payload.pages) ? payload.pages.length : 0;
              if (count !== shard.pages) throw new Error(shard.file + " count mismatch: " + count + " != " + shard.pages);
              total += count;
            }
            if (total !== manifest.total_pages) {
              throw new Error("Catalog total mismatch: " + total + " != " + manifest.total_pages);
            }
            const summary = "- Canonical Vercel homepage: PASS (HTTP 200, " + tiles + " categories)\\n" +
              "- Canonical Vercel catalog: PASS (" + total + " pages across " + manifest.shards.length + " shards; all shards HTTP 200)\\n";
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            console.log(JSON.stringify({homepageStatus:200,tiles,totalPages:total,shardCount:manifest.shards.length},null,2));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          echo "=== CUSTOM DOMAIN CHECK ==="
          custom_domain_status="BLOCKED — domain request failed"
          if curl --max-time 12 -fsSL "https://everythinghub.ink/" -o /tmp/custom-domain.html; then
            if grep -Fq 'Everything Hub' /tmp/custom-domain.html && grep -Fq 'id="q"' /tmp/custom-domain.html; then
              custom_domain_status="PASS"
            else
              custom_domain_status="WARNING — response did not match the approved homepage"
            fi
          else
            echo "::warning::everythinghub.ink is not reachable; canonical Vercel deployment remains the verified publishing target."
          fi
          echo "=== CUSTOM EVERYTHING HUB BROWSER ==="
          curl -fsSL -D /tmp/browser-headers.txt "$BASE/everything-hub-browser" -o /tmp/browser.html
          head -n 1 /tmp/browser-headers.txt
          grep -i '^content-type:' /tmp/browser-headers.txt | tail -1
          printf 'browser_bytes='; wc -c < /tmp/browser.html
          for needle in 'Everything Hub Browser' 'id="address"' 'id="back"' 'id="forward"' 'id="reload"' 'id="home"' 'data-mode="images"'; do
            if grep -Fq "$needle" /tmp/browser.html; then echo "PASS browser contains: $needle"; else echo "FAIL browser missing: $needle"; exit 1; fi
          done
          db_search_ok=1
          db_search_detail="query returned usable results"
          independent_count=0
          image_count=0
          video_count=0
          echo "=== DATABASE-BACKED SEARCH API: ROLEX ==="
          if curl --max-time 20 -fsS -G "$BASE/everything-hub-web-search" -H "apikey: $KEY" -H "accept: application/json" --data-urlencode "q=Rolex" --data-urlencode "limit=10" -o /tmp/search.json; then
            if node -e '
              const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/search.json","utf8"));
              const a=Array.isArray(d.results)?d.results:[];
              console.log(JSON.stringify({count:d.count??a.length,resultCount:a.length,sample:a.slice(0,3).map(x=>({title:x.title,url:x.url}))},null,2));
              if(!a.length) process.exit(2);
            '; then
              echo "PASS: database-backed search returned results."
            else
              echo "WARN: database-backed search response did not contain usable results."
              db_search_ok=0
              db_search_detail="response contained no usable results"
            fi
          else
            echo "WARN: database-backed search endpoint is unavailable."
            db_search_ok=0
            db_search_detail="request timed out or returned a non-success HTTP status"
          fi
          echo "=== DATABASE-INDEPENDENT SEARCH FALLBACK ==="
          curl -fsS -G "$BASE/everything-hub-independent-search" --data-urlencode "q=Rolex" -o /tmp/independent.json
          node -e '
            const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/independent.json","utf8"));
            const a=Array.isArray(d.results)?d.results:[];
            console.log(JSON.stringify({provider:d.provider,independentOfDatabase:d.independentOfDatabase,count:d.count,resultCount:a.length,first:a[0]?.title},null,2));
            if(d.independentOfDatabase!==true || !a.length) process.exit(2);
          '
          independent_count=$(node -p "require('/tmp/independent.json').results.length")
          echo "=== MEDIA API: IMAGES ==="
          curl -fsS -G "$BASE/everything-hub-media-search" -H "apikey: $KEY" -H "accept: application/json" --data-urlencode "q=octopus" --data-urlencode "type=image" -o /tmp/media.json
          node -e '
            const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/media.json","utf8"));
            const a=Array.isArray(d.results)?d.results:[];
            console.log(JSON.stringify({provider:d.provider??null,resultCount:a.length,sample:a.slice(0,3)},null,2));
            if(!a.length) process.exit(2);
          '
          image_count=$(node -p "require('/tmp/media.json').results.length")

          echo "=== MEDIA API: VIDEOS ==="
          curl -fsS -G "$BASE/everything-hub-media-search" -H "apikey: $KEY" -H "accept: application/json" --data-urlencode "q=Apollo 11 NASA" --data-urlencode "type=video" -o /tmp/video.json
          node -e '
            const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/video.json","utf8"));
            const a=Array.isArray(d.results)?d.results:[];
            console.log(JSON.stringify({provider:d.provider??null,resultCount:a.length,hasWarning:!!d.warning},null,2));
            if(!Array.isArray(d.results)) process.exit(2);
          '
          video_count=$(node -p "require('/tmp/video.json').results.length")

          if [ "$db_search_ok" -ne 1 ]; then
            db_search_status="BLOCKED — $db_search_detail"
            echo "::warning::Database-backed search is blocked; independent search and media checks passed. See job summary."
          else
            db_search_status="PASS — $db_search_detail"
          fi
          {
            echo "## Everything Hub live diagnostics"
            echo "- Supabase homepage: PASS (8 categories)"
            echo "- Custom domain: $custom_domain_status"
            echo "- Custom browser endpoint: PASS"
            echo "- Database-backed search: $db_search_status"
            echo "- Independent search: PASS ($independent_count results)"
            echo "- Image discovery: PASS ($image_count results)"
            echo "- Video discovery: PASS ($video_count results)"
            if [ "$db_search_ok" -ne 1 ]; then
              echo "- Next action: restore PostgreSQL availability, then deploy and verify the eh_quad-only search function."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
