name: Everything Hub live diagnostics
on:
  push:
    paths:
      - .github/workflows/everything-hub-live-diagnostics.yml
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check live homepage and search API
        env:
          BASE: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1
          KEY: sb_publishable_XlIsACWhtVS1jVODWYGTpg_GMs8v3vJ
        run: |
          set -euo pipefail
          echo "=== HOMEPAGE ==="
          curl -fsSL -D /tmp/headers.txt "$BASE/everything-hub-site" -o /tmp/home.html
          head -n 1 /tmp/headers.txt
          grep -i '^content-type:' /tmp/headers.txt | tail -1
          printf 'bytes='; wc -c < /tmp/home.html
          for needle in '<!doctype html' 'Everything Hub' 'id="q"' 'approved-master-art' 'class="tile"' 'everything-hub-media-search'; do
            if grep -Fq "$needle" /tmp/home.html; then echo "PASS homepage contains: $needle"; else echo "FAIL homepage missing: $needle"; exit 1; fi
          done
          tile_count=$(grep -o 'class="tile"' /tmp/home.html | wc -l)
          echo "homepage_tiles=$tile_count"
          test "$tile_count" -eq 8
          echo "=== CUSTOM EVERYTHING HUB BROWSER ==="
          curl -fsSL -D /tmp/browser-headers.txt "$BASE/everything-hub-browser" -o /tmp/browser.html
          head -n 1 /tmp/browser-headers.txt
          grep -i '^content-type:' /tmp/browser-headers.txt | tail -1
          printf 'browser_bytes='; wc -c < /tmp/browser.html
          for needle in 'Everything Hub Browser' 'id="address"' 'id="back"' 'id="forward"' 'id="reload"' 'id="home"' 'data-mode="images"'; do
            if grep -Fq "$needle" /tmp/browser.html; then echo "PASS browser contains: $needle"; else echo "FAIL browser missing: $needle"; exit 1; fi
          done
          db_search_ok=1
          echo "=== DATABASE-BACKED SEARCH API: ROLEX ==="
          if curl --max-time 20 -fsS -G "$BASE/everything-hub-web-search" -H "apikey: $KEY" -H "accept: application/json" --data-urlencode "q=Rolex" --data-urlencode "limit=10" -o /tmp/search.json; then
            if node -e '
              const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/search.json","utf8"));
              const a=Array.isArray(d.results)?d.results:[];
              console.log(JSON.stringify({count:d.count??a.length,resultCount:a.length,sample:a.slice(0,3).map(x=>({title:x.title,url:x.url}))},null,2));
              if(!a.length) process.exit(2);
            '; then
              echo "PASS: database-backed search returned results."
            else
              echo "WARN: database-backed search response did not contain usable results."
              db_search_ok=0
            fi
          else
            echo "WARN: database-backed search endpoint is unavailable."
            db_search_ok=0
          fi
          echo "=== DATABASE-INDEPENDENT SEARCH FALLBACK ==="
          curl -fsS -G "$BASE/everything-hub-independent-search" --data-urlencode "q=Rolex" -o /tmp/independent.json
          node -e '
            const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/independent.json","utf8"));
            const a=Array.isArray(d.results)?d.results:[];
            console.log(JSON.stringify({provider:d.provider,independentOfDatabase:d.independentOfDatabase,count:d.count,resultCount:a.length,first:a[0]?.title},null,2));
            if(d.independentOfDatabase!==true || !a.length) process.exit(2);
          '
          echo "=== MEDIA API: IMAGES ==="
          curl -fsS -G "$BASE/everything-hub-media-search" -H "apikey: $KEY" -H "accept: application/json" --data-urlencode "q=octopus" --data-urlencode "type=image" -o /tmp/media.json
          node -e '
            const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/media.json","utf8"));
            const a=Array.isArray(d.results)?d.results:[];
            console.log(JSON.stringify({provider:d.provider??null,resultCount:a.length,sample:a.slice(0,3)},null,2));
            if(!a.length) process.exit(2);
          '

          echo "=== MEDIA API: VIDEOS ==="
          curl -fsS -G "$BASE/everything-hub-media-search" -H "apikey: $KEY" -H "accept: application/json" --data-urlencode "q=Apollo 11 NASA" --data-urlencode "type=video" -o /tmp/video.json
          node -e '
            const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/video.json","utf8"));
            const a=Array.isArray(d.results)?d.results:[];
            console.log(JSON.stringify({provider:d.provider??null,resultCount:a.length,hasWarning:!!d.warning},null,2));
            if(!Array.isArray(d.results)) process.exit(2);
          '
          if [ "$db_search_ok" -ne 1 ]; then
            echo "Database-backed search remains blocked; independent search and media checks completed."
            exit 2
          fi
