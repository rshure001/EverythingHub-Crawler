name: Everything Hub live diagnostics
# Push-triggered checks also verify the latest committed crawler catalog immediately.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/everything-hub-live-diagnostics.yml
      - .github/workflows/publish-site.yml
      - publisher/**
      - supabase/functions/everything-hub-web-search/**
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows:
      - "Everything Hub crawler"
      - "EverythingHub isolated importer smoke test"
    types:
      - completed
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: everything-hub-live-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    # The importer also runs after crawler completions; run diagnostics from this
    # trigger only when the importer itself was the hourly scheduled run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live homepage and search API
        env:
          BASE: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1
          KEY: sb_publishable_XlIsACWhtVS1jVODWYGTpg_GMs8v3vJ
          PUBLISHER_BASE: https://vdceayvfgkwpgwixrhwi.supabase.co/storage/v1/object/public/everything-hub-publishing/index.html
        run: |
          set -euo pipefail
          echo "=== PUBLISHED HOMEPAGE ==="
          publisher_status=$(curl --silent --show-error --max-time 20 -D /tmp/publisher-headers.txt -o /tmp/home.html -w "%{http_code}" "$PUBLISHER_BASE")
          echo "published_storage_http=$publisher_status"
          if [ "$publisher_status" = "200" ]; then
            content_type=$(grep -i '^content-type:' /tmp/publisher-headers.txt | tail -1 | tr -d '\r')
            echo "$content_type"
            echo "$content_type" | grep -Eiq 'content-type: *text/html'
            for needle in '<!doctype html' 'Everything Hub' 'id="q"' 'id="searchForm"' 'class="art"' 'assets/everythinghub-approved.png' 'everything-hub-media-search'; do
              grep -Fq "$needle" /tmp/home.html || { echo "Published homepage missing: $needle"; exit 1; }
            done
            category_count=$(grep -o 'data-mode=' /tmp/home.html | wc -l)
            test "$category_count" -eq 8
            echo "PASS published homepage: HTML, approved artwork, and all eight categories."
            {
              echo "## Published homepage"
              echo "- Public Storage homepage: PASS (HTTP 200, text/html; eight categories and approved artwork)."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$publisher_status" = "404" ]; then
            echo "::warning::No public homepage release is present yet. The secure publisher requires an authenticated owner session."
            {
              echo "## Published homepage"
              echo "- Public Storage homepage: pending authenticated owner publication (HTTP 404)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Public homepage returned HTTP $publisher_status; search API checks will continue."
            {
              echo "## Published homepage"
              echo "- Public Storage homepage: unavailable (HTTP $publisher_status)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "=== CUSTOM DOMAIN CHECK ==="
          custom_domain_status="BLOCKED — domain request failed"
          if curl --max-time 12 -fsSL "https://everythinghub.ink/" -o /tmp/custom-domain.html; then
            if grep -Fq 'Everything Hub' /tmp/custom-domain.html && grep -Fq 'id="q"' /tmp/custom-domain.html; then
              custom_domain_status="PASS"
            else
              custom_domain_status="WARNING — response did not match the approved homepage"
            fi
          else
            echo "::warning::everythinghub.ink is not reachable; the in-house AppDeploy deployment remains the verified publishing target."
          fi
          echo "=== CUSTOM EVERYTHING HUB BROWSER ==="
          curl -fsSL -D /tmp/browser-headers.txt "$BASE/everything-hub-browser" -o /tmp/browser.html
          head -n 1 /tmp/browser-headers.txt
          grep -i '^content-type:' /tmp/browser-headers.txt | tail -1
          printf 'browser_bytes='; wc -c < /tmp/browser.html
          for needle in 'Everything Hub Browser' 'id="address"' 'id="back"' 'id="forward"' 'id="reload"' 'id="home"' 'data-mode="images"'; do
            if grep -Fq "$needle" /tmp/browser.html; then echo "PASS browser contains: $needle"; else echo "FAIL browser missing: $needle"; exit 1; fi
          done
          db_search_ok=1
          db_search_detail="query returned usable results"
          static_index_ok=0
          static_index_count=0
          independent_fallback_ok=0
          independent_fallback_count=0
          vercel_catalog_fallback_ok=0
          vercel_catalog_fallback_count=0
          web_search_fallback_ok=0
          web_search_fallback_count=0
          independent_count=0
          image_count=0
          video_count=0
          echo "=== EH_QUAD SEARCH WITH PUBLIC CRAWLER FALLBACK: ROLEX ==="
          if curl --max-time 10 -sS -G "$BASE/everything-hub-web-search" -H "apikey: $KEY" -H "accept: application/json" --data-urlencode "q=Rolex" --data-urlencode "limit=10" -o /tmp/search.json -w '%{http_code} %{time_total}\n' > /tmp/search-metrics.txt; then
            read -r db_search_http db_search_seconds < /tmp/search-metrics.txt
            echo "Search API HTTP $db_search_http in $db_search_seconds seconds"
            case "$db_search_http" in
              200)
                if node -e '
                  const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/search.json","utf8"));
                  const a=Array.isArray(d.results)?d.results:[];
                  console.log(JSON.stringify({source:d.source??null,provider:d.provider??null,fallback:d.fallback??false,independentOfDatabase:d.independentOfDatabase??false,count:d.count??a.length,resultCount:a.length,sample:a.slice(0,3).map(x=>({title:x.title,url:x.url}))},null,2));
                  if(!a.length) process.exit(2);
                  if(d.fallback===true && d.source==="Everything Hub public crawler index") process.exit(3);
                  if(d.fallback===true && d.source==="Everything Hub Vercel public catalog" && d.independentOfDatabase===true && ["database_unavailable","database_empty"].includes(d.fallbackReason) && d.indexIntegrity==="sha256" && d.indexTransport==="vercel" && a.length) process.exit(5);
                  if(d.fallback===true && d.source==="Bing RSS independent web fallback" && d.independentOfDatabase===true && d.fallbackReason==="database_unavailable") process.exit(4);
                '; then
                  echo "PASS: eh_quad database-backed search returned usable results."
                  db_search_detail="HTTP 200 in $db_search_seconds seconds with database-backed results"
                else
                  search_exit=$?
                  if [ "$search_exit" -eq 3 ]; then
                    static_index_ok=1
                    static_index_count=$(node -p "require('/tmp/search.json').results.length")
                    db_search_ok=0
                    db_search_detail="HTTP 200 in $db_search_seconds seconds via public crawler fallback; PostgreSQL is still unavailable"
                    echo "PASS: public crawler index fallback returned $static_index_count results; database-backed search remains blocked."
                  elif [ "$search_exit" -eq 5 ]; then
                    vercel_catalog_fallback_ok=1
                    vercel_catalog_fallback_count=$(node -p "require('/tmp/search.json').results.length")
                    db_search_ok=0
                    db_search_detail="HTTP 200 in $db_search_seconds seconds via SHA-256-verified Vercel crawler catalog; PostgreSQL is still unavailable"
                    echo "PASS: Vercel crawler catalog fallback returned $vercel_catalog_fallback_count results; database-backed search remains blocked."
                  elif [ "$search_exit" -eq 4 ]; then
                    independent_fallback_ok=1
                    independent_fallback_count=$(node -p "require('/tmp/search.json').results.length")
                    db_search_ok=0
                    db_search_detail="HTTP 200 in $db_search_seconds seconds via Bing RSS independent fallback during database recovery; PostgreSQL is still unavailable"
                    echo "PASS: Bing RSS independent fallback returned $independent_fallback_count results."
                  else
                    echo "WARN: search API returned no usable results."
                    db_search_ok=0
                    db_search_detail="HTTP 200 but response contained no usable results"
                  fi
                fi
                ;;
              503)
                if node -e 'const seconds=Number(process.argv[1]); if(!Number.isFinite(seconds)||seconds>9.5) process.exit(1);' "$db_search_seconds"; then
                  if node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/search.json","utf8")); if(d.error!=="Search temporarily unavailable") process.exit(1);'; then
                    echo "PASS: database search returned the controlled HTTP 503 within the fail-fast budget."
                    db_search_ok=0
                    db_search_detail="HTTP 503 in $db_search_seconds seconds; controlled response while PostgreSQL is unavailable"
                  else
                    echo "::error::HTTP 503 did not include the expected controlled search error."
                    exit 1
                  fi
                else
                  echo "::error::Database search exceeded the 9.5-second fail-fast budget."
                  exit 1
                fi
                ;;
              *)
                echo "::warning::Unexpected database search HTTP $db_search_http."
                db_search_ok=0
                db_search_detail="unexpected HTTP $db_search_http in $db_search_seconds seconds"
                ;;
            esac
          else
            echo "::warning::Database-backed search timed out or failed before returning an HTTP response; continuing with independent fallback checks."
            db_search_ok=0
            db_search_detail="request timed out or failed before HTTP response"
          fi
          echo "=== NASA SEARCH PATH: EH_QUAD / STATIC / INDEPENDENT FALLBACK ==="
          if curl --max-time 10 -sS -G "$BASE/everything-hub-web-search" -H "apikey: $KEY" -H "accept: application/json" --data-urlencode "q=NASA" --data-urlencode "limit=10" -o /tmp/static-search.json; then
            if node -e '
            const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/static-search.json","utf8"));
            const a=Array.isArray(d.results)?d.results:[];
            const source=String(d.source||"");
            console.log(JSON.stringify({source:source||null,provider:d.provider??null,fallback:d.fallback??false,independentOfDatabase:d.independentOfDatabase??false,fallbackReason:d.fallbackReason??null,indexIntegrity:d.indexIntegrity??null,indexTransport:d.indexTransport??null,count:d.count??a.length,resultCount:a.length,sample:a.slice(0,3).map(x=>({title:x.title,url:x.url}))},null,2));
            if(source==="Everything Hub public crawler index" && d.indexIntegrity==="sha256" && a.length) process.exit(0);
            if(source==="Everything Hub Vercel public catalog" && d.fallback===true && d.independentOfDatabase===true && ["database_unavailable","database_empty"].includes(d.fallbackReason) && d.indexIntegrity==="sha256" && d.indexTransport==="vercel" && a.length) process.exit(6);
            if(source.startsWith("Everything Hub eh_quad") && a.length) process.exit(5);
            if(source==="Bing RSS independent web fallback" && d.independentOfDatabase===true && d.fallbackReason==="database_unavailable" && d.provider==="Bing RSS" && a.length) process.exit(4);
            process.exit(2);
          '; then
            static_index_ok=1
            static_index_count=$(node -p "require('/tmp/static-search.json').results.length")
            static_index_transport=$(node -p "require('/tmp/static-search.json').indexTransport || 'shards'")
            echo "PASS: NASA query returned the SHA-256 verified public crawler index."
          else
            static_search_exit=$?
            if [ "$static_search_exit" -eq 6 ]; then
              static_index_ok=1
              static_index_count=$(node -p "require('/tmp/static-search.json').results.length")
              static_index_transport="vercel"
              db_search_ok=0
              db_search_detail="NASA query returned the SHA-256-verified Vercel public crawler catalog; PostgreSQL remains unavailable"
              echo "PASS: NASA query returned $static_index_count results from the SHA-256-verified Vercel crawler catalog."
            elif [ "$static_search_exit" -eq 5 ]; then
              db_search_ok=1
              db_search_detail="NASA query returned eh_quad database-index results"
              echo "PASS: NASA query returned results from the eh_quad index."
            elif [ "$static_search_exit" -eq 4 ]; then
              web_search_fallback_ok=1
              web_search_fallback_count=$(node -p "require('/tmp/static-search.json').results.length")
              db_search_ok=0
              db_search_detail="HTTP 200 via Bing RSS independent fallback; PostgreSQL is still unavailable"
              echo "PASS: NASA query returned $web_search_fallback_count independent results while PostgreSQL is unavailable."
            else
              echo "::error::NASA query returned neither the eh_quad index, verified public crawler index, nor approved independent fallback."
              exit 1
            fi
          else
            echo "::warning::NASA search endpoint timed out or failed; continuing to independent search and media checks."
            static_index_ok=0
            db_search_ok=0
            db_search_detail="NASA database search timed out; independent fallback checks continue"
          fi
          echo "=== DATABASE-INDEPENDENT SEARCH FALLBACK ==="
          curl -fsS -G "$BASE/everything-hub-independent-search" --data-urlencode "q=Rolex" -o /tmp/independent.json
          node -e '
            const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/independent.json","utf8"));
            const a=Array.isArray(d.results)?d.results:[];
            console.log(JSON.stringify({provider:d.provider,independentOfDatabase:d.independentOfDatabase,count:d.count,resultCount:a.length,first:a[0]?.title},null,2));
            if(d.independentOfDatabase!==true || !a.length) process.exit(2);
          '
          independent_count=$(node -p "require('/tmp/independent.json').results.length")
          echo "=== MEDIA API: IMAGES ==="
          curl -fsS -G "$BASE/everything-hub-media-search" -H "apikey: $KEY" -H "accept: application/json" --data-urlencode "q=octopus" --data-urlencode "type=image" -o /tmp/media.json
          node -e '
            const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/media.json","utf8"));
            const a=Array.isArray(d.results)?d.results:[];
            console.log(JSON.stringify({provider:d.provider??null,resultCount:a.length,sample:a.slice(0,3)},null,2));
            if(!a.length) process.exit(2);
          '
          image_count=$(node -p "require('/tmp/media.json').results.length")

          echo "=== MEDIA API: VIDEOS ==="
          curl -fsS -G "$BASE/everything-hub-media-search" -H "apikey: $KEY" -H "accept: application/json" --data-urlencode "q=Apollo 11 NASA" --data-urlencode "type=video" -o /tmp/video.json
          node -e '
            const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/video.json","utf8"));
            const a=Array.isArray(d.results)?d.results:[];
            console.log(JSON.stringify({provider:d.provider??null,resultCount:a.length,hasWarning:!!d.warning},null,2));
            if(!Array.isArray(d.results)) process.exit(2);
          '
          video_count=$(node -p "require('/tmp/video.json').results.length")

          if [ "$db_search_ok" -ne 1 ]; then
            db_search_status="BLOCKED — $db_search_detail"
            echo "::warning::Database-backed search is blocked; independent search and media checks passed. See job summary."
          else
            db_search_status="PASS — $db_search_detail"
          fi
          {
            echo "## Everything Hub live diagnostics"
            echo "- Supabase homepage: PASS (8 categories)"
            echo "- Custom domain: $custom_domain_status"
            echo "- Custom browser endpoint: PASS"
            echo "- Database-backed search: $db_search_status"
            if [ "$static_index_ok" -eq 1 ]; then
              echo "- Public crawler fallback: PASS (NASA query returned $static_index_count results; SHA-256 verified $static_index_transport catalog)"
            fi
            if [ "$vercel_catalog_fallback_ok" -eq 1 ]; then
              echo "- Vercel crawler catalog fallback: PASS (Rolex query returned $vercel_catalog_fallback_count results; SHA-256 verified)"
            fi
            if [ "$independent_fallback_ok" -eq 1 ]; then
              echo "- Bing RSS independent fallback: PASS (Rolex query returned $independent_fallback_count results)"
            fi
            if [ "$web_search_fallback_ok" -eq 1 ]; then
              echo "- Database-independent web-search fallback: PASS (NASA query returned $web_search_fallback_count results)"
            fi
            if [ "$web_search_fallback_ok" -eq 1 ] && [ "$static_index_ok" -eq 0 ]; then
              echo "- Static catalog Edge Function path: NOT EXERCISED — independent provider is prioritized during database recovery; committed catalog integrity and ranking are covered by crawler CI."
            fi
            echo "- Independent search endpoint: PASS ($independent_count results)"
            echo "- Image discovery: PASS ($image_count results)"
            echo "- Video discovery: PASS ($video_count results)"
            if [ "$db_search_ok" -ne 1 ]; then
              echo "- Next action: restore PostgreSQL availability, inspect eh_quad, then run the additive index import and verify database-backed search."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
