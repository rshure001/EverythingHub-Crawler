name: Everything Hub free fallback acceptance
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eh-free-fallback-acceptance.yml"
      - "vercel-homepage/**"
  # The Vercel projects are not Git-linked. Dispatch the live browser gate only
  # after the stable aliases have been deployed, or after data-only catalog runs.
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Retroactive catalog inventory"
      - "Catalog-first discovery"
    types:
      - completed
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: eh-free-fallback-acceptance
  cancel-in-progress: true
jobs:
  browser-acceptance:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Always test the stable public alias, never a deployment-specific deployment URL.
      TARGET_URL: https://everythinghub-homepage-fixed.vercel.app/
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test live homepage, searches, media, news, and mobile layout
        run: |
          cat > acceptance.cjs <<'JS'
          const { chromium } = require("playwright");
          const fs = require("node:fs");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            const consoleErrors = [];
            const mediaResponses = [];
            const mediaFailures = [];
            page.on("pageerror", error => pageErrors.push(error.message));
            page.on("console", message => { if (message.type() === "error") consoleErrors.push(message.text()); });
            page.on("response", response => {
              try {
                const url = new URL(response.url());
                if (["upload.wikimedia.org", "commons.wikimedia.org", "archive.org"].includes(url.hostname)) {
                  mediaResponses.push({ url: response.url(), status: response.status() });
                }
              } catch {}
            });
            page.on("requestfailed", request => {
              if (/wikimedia\.org|archive\.org/.test(request.url())) {
                mediaFailures.push({ url: request.url(), error: request.failure()?.errorText || "request failed" });
              }
            });
            const EH_SUPABASE_BASE = "https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1";
            const EH_PUBLIC_KEY = "sb_publishable_XlIsACWhtVS1jVODWYGTpg_GMs8v3vJ";
            const report = { url: process.env.TARGET_URL, checks: {}, failures: [], pageErrors, consoleErrors, mediaNetwork: { responses: mediaResponses, failures: mediaFailures } };
            const layoutSnapshot = async () => page.evaluate(() => {
              const categories = [...document.querySelectorAll(".hotspots [data-mode]")];
              const categoryRects = categories.map(node => {
                const r = node.getBoundingClientRect();
                return { mode: node.dataset.mode, left: r.left, right: r.right, top: r.top, bottom: r.bottom };
              });
              const overlappingCategories = [];
              for (let i = 0; i < categoryRects.length; i++) {
                for (let j = i + 1; j < categoryRects.length; j++) {
                  const a = categoryRects[i], b = categoryRects[j];
                  if (Math.min(a.right, b.right) - Math.max(a.left, b.left) > 1 &&
                      Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top) > 1) {
                    overlappingCategories.push([a.mode, b.mode]);
                  }
                }
              }
              const controls = [...document.querySelectorAll("#query, #searchForm button[type=submit], .hotspots [data-mode]")];
              const controlsWithinViewport = controls.every(node => {
                const r = node.getBoundingClientRect();
                return r.width > 0 && r.height > 0 && r.left >= -1 && r.right <= window.innerWidth + 1;
              });
              return {
                viewport: document.documentElement.clientWidth,
                document: document.documentElement.scrollWidth,
                body: document.body.scrollWidth,
                artwork: !!document.querySelector(".art img")?.getClientRects().length,
                search: !!document.querySelector("#query")?.getClientRects().length,
                categories: categories.length,
                brokenImages: [...document.images].filter(img => img.complete && img.naturalWidth === 0).length,
                controlsWithinViewport,
                overlappingCategories
              };
            });
            const assertLayout = (label, layout) => {
              if (layout.document > layout.viewport + 2 ||
                  layout.body > layout.viewport + 2 ||
                  !layout.artwork || !layout.search || layout.categories !== 8 ||
                  layout.brokenImages || !layout.controlsWithinViewport ||
                  layout.overlappingCategories.length) {
                throw new Error(label + " layout failed: " + JSON.stringify(layout));
              }
            };
            const shot = async name => page.screenshot({ path: name, fullPage: true });
            const goHome = async () => {
              await page.goto(process.env.TARGET_URL, { waitUntil: "domcontentloaded", timeout: 45000 });
              await page.locator("#query").waitFor({ state: "visible", timeout: 20000 });
            };
            const search = async (mode, query, resultSelector, minCount = 1, requireCatalog = false) => {
              await page.locator('.hotspots [data-mode="' + mode + '"]').click();
              await page.locator("#query").fill(query);
              await page.locator("#searchForm button[type=submit]").click();
              await page.locator(resultSelector).first().waitFor({ state: "visible", timeout: 60000 });
              if (requireCatalog) await page.locator("#results .eh-catalog-result").first().waitFor({ state: "visible", timeout: 30000 });
              const count = await page.locator(resultSelector).count();
              const catalogs = await page.locator("#results .eh-catalog-result").evaluateAll(nodes => nodes.map(node => ({
                title: node.querySelector("a")?.textContent?.trim() || "",
                href: node.querySelector("a")?.href || "",
                text: node.textContent?.trim() || "",
                sourceKind: node.dataset.sourceKind || "page-derived",
                relevanceClass: node.dataset.relevanceClass || "",
                catalogId: node.dataset.catalogId || "",
                visible: node.getBoundingClientRect().width > 0 && node.getBoundingClientRect().height > 0
              })));
              if (count < minCount) throw new Error(mode + " returned only " + count + " results for " + query);
              if (requireCatalog && !catalogs.length) throw new Error("No visible catalog directory cards for " + query);
              return { count, titles: (await page.locator(resultSelector).allTextContents()).slice(0, 6), catalogs };
            };
            try {
              const response = await page.goto(report.url, { waitUntil: "domcontentloaded", timeout: 45000 });
              if (!response || response.status() !== 200) throw new Error("Homepage did not return HTTP 200");
              await page.locator(".art img").waitFor({ state: "visible", timeout: 20000 });
              await page.waitForFunction(() => {
                const img = document.querySelector(".art img");
                return !!img && img.complete && img.naturalWidth >= 800 && img.naturalHeight >= 800;
              }, null, { timeout: 30000 });
              const art = await page.locator(".art img").first().evaluate(img => ({ src: img.currentSrc || img.src, width: img.naturalWidth, height: img.naturalHeight, complete: img.complete }));
              if (!art.src.includes("everythinghub-approved-octopus.png") || art.width < 800 || art.height < 800) throw new Error("Approved octopus artwork check failed: " + JSON.stringify(art));
              const modes = await page.locator(".hotspots [data-mode]").evaluateAll(nodes => nodes.map(node => node.dataset.mode));
              if (modes.length !== 8) throw new Error("Expected eight search categories; got " + modes.length);
              report.checks.home = { http: response.status(), title: await page.title(), artwork: art, modes };
              const desktop = await layoutSnapshot();
              assertLayout("Desktop", desktop);
              report.checks.desktop = desktop;
              await shot("everythinghub-home.png");
              const rolex = await search("web", "Rolex", "#results .eh-result", 1, true);
              const rolexPageDerived = rolex.catalogs.some(card => card.sourceKind !== "external_link_only" && card.relevanceClass === "typed_product_match" && /Rolex/i.test(card.title + " " + card.text));
              const rolexExternal = rolex.catalogs.some(card => card.sourceKind === "external_link_only" && /Rolex/i.test(card.title + " " + card.text));
              if (!rolexPageDerived && !rolexExternal) throw new Error("Rolex search has no visible typed product catalog or official link-only directory: " + JSON.stringify(rolex.catalogs));
              report.checks.rolex = { results: rolex.count, catalogs: rolex.catalogs.length, pageDerived: rolexPageDerived, externalDirectory: rolexExternal, catalogTitles: rolex.catalogs.map(card => card.title) };
              await shot("everythinghub-rolex.png");
              await goHome();
              const vegas = await search("web", "Las Vegas", "#results .eh-result", 1, true);
              const vegasTyped = vegas.catalogs.some(card => card.sourceKind !== "external_link_only" && card.relevanceClass === "typed_location_match" && /Las Vegas/i.test(card.title + " " + card.text));
              if (!vegasTyped) throw new Error("Las Vegas search has no visible page-derived typed location catalog: " + JSON.stringify(vegas.catalogs));
              if (vegas.catalogs.some(card => /Homeland Security Events/i.test(card.title + " " + card.text))) throw new Error("Las Vegas search displayed an unrelated event catalog");
              report.checks.lasVegas = { results: vegas.count, catalogs: vegas.catalogs.length, pageDerivedTypedLocation: vegasTyped, catalogTitles: vegas.catalogs.map(card => card.title) };
              await shot("everythinghub-las-vegas.png");
              await goHome();
              const nasa = await search("web", "NASA", "#results .eh-result", 1, true);
              const nasaPageDerived = nasa.catalogs.some(card => card.sourceKind !== "external_link_only" && card.relevanceClass === "typed_organization_match" && /NASA/i.test(card.title + " " + card.text));
              const nasaExternal = nasa.catalogs.some(card => card.sourceKind === "external_link_only" && /NASA/i.test(card.title + " " + card.text));
              if (!nasaPageDerived && !nasaExternal) throw new Error("NASA search has no visible organization catalog or official link-only directory: " + JSON.stringify(nasa.catalogs));
              report.checks.nasa = { results: nasa.count, catalogs: nasa.catalogs.length, pageDerivedOrganization: nasaPageDerived, externalDirectory: nasaExternal, catalogTitles: nasa.catalogs.map(card => card.title) };
              await shot("everythinghub-nasa.png");
              const coreLinks = {};
              const openCoreLink = async (label, href) => {
                if (!href) throw new Error("Missing href for core link: " + label);
                const url = new URL(href);
                if (!["http:", "https:"].includes(url.protocol) || url.username || url.password) {
                  throw new Error("Unsafe core link for " + label + ": " + href);
                }
                const linkPage = await browser.newPage();
                try {
                  const response = await linkPage.goto(url.href, { waitUntil: "domcontentloaded", timeout: 30000 });
                  const status = response ? response.status() : 0;
                  if (!response || status < 200 || status >= 400) {
                    throw new Error("Core link navigation failed for " + label + ": HTTP " + status + " " + url.href);
                  }
                  coreLinks[label] = { url: linkPage.url(), status };
                } finally {
                  await linkPage.close();
                }
              };
              const nasaWebHrefs = await page.locator("#results .eh-result").evaluateAll(nodes => nodes.map(node =>
                node.tagName.toLowerCase() === "a" ? node.href : node.querySelector("a")?.href || ""
              ).filter(Boolean));
              const nasaWebHref = nasaWebHrefs.find(href => {
                try { return new URL(href).hostname.toLowerCase().endsWith("nasa.gov"); } catch { return false; }
              });
              const nasaCatalogHref = nasa.catalogs.find(card =>
                card.sourceKind !== "external_link_only" && card.relevanceClass === "typed_organization_match" && card.href
              )?.href;
              const nasaExternalHref = nasa.catalogs.find(card =>
                card.sourceKind === "external_link_only" && /NASA/i.test(card.title + " " + card.text) && card.href
              )?.href;
              await openCoreLink("nasaWebResult", nasaWebHref);
              try {
                await openCoreLink("nasaPageDerivedCatalog", nasaCatalogHref);
              } catch (error) {
                const rateLimit = String(error.message).match(/HTTP (\d+)/);
                if (!rateLimit || Number(rateLimit[1]) !== 429) throw error;
                report.checks.nasa.pageDerivedCatalogRateLimited = { url: nasaCatalogHref, status: 429 };
                if (nasaExternalHref) {
                  try {
                    await openCoreLink("nasaOfficialDirectory", nasaExternalHref);
                  } catch (directoryError) {
                    const directoryRateLimit = String(directoryError.message).match(/HTTP (\d+)/);
                    if (!directoryRateLimit || Number(directoryRateLimit[1]) !== 429) throw directoryError;
                    report.checks.nasa.officialDirectoryRateLimited = { url: nasaExternalHref, status: 429 };
                    await openCoreLink("nasaOfficialScienceFallback", "https://science.nasa.gov/");
                  }
                } else {
                  await openCoreLink("nasaOfficialScienceFallback", "https://science.nasa.gov/");
                }
              }
              const categoryChecks = {};
              for (const [category, query] of [["news", "NASA"], ["shopping", "Rolex"], ["places", "Las Vegas"], ["business", "Las Vegas hotels"], ["research", "NASA climate data"]]) {
                const result = await search(category, query, "#results .eh-result, #results .eh-catalog-result", 1, false);
                categoryChecks[category] = { query, visibleResults: result.count, catalogCards: result.catalogs.length };
              }
              report.checks.additionalCategories = categoryChecks;

              // Verify that the live backend actually applies the UI category
              // lanes; visible-result counts alone can hide an unfiltered fallback.
              const categoryLaneApi = {};
              const supabaseLane = { shopping: "business", places: "culture", business: "business", research: "science" };
              for (const [category, query, expectedHost] of [
                ["shopping", "Rolex", "bucherer.com"],
                ["places", "Las Vegas", "visitlasvegas.com"],
                ["business", "Las Vegas hotels", "visitlasvegas.com"],
                ["research", "NASA climate data", "nasa.gov"]
              ]) {
                const apiUrl = new URL(EH_SUPABASE_BASE + "/everything-hub-web-search");
                apiUrl.searchParams.set("q", query);
                apiUrl.searchParams.set("limit", "20");
                apiUrl.searchParams.set("tentacle", supabaseLane[category]);
                const apiResponse = await page.request.get(apiUrl.toString(), { headers: { apikey: EH_PUBLIC_KEY, accept: "application/json" } });
                const apiPayload = await apiResponse.json().catch(() => ({}));
                const apiResults = Array.isArray(apiPayload.results) ? apiPayload.results : [];
                const expectedLane = supabaseLane[category];
                const requestedLane = apiPayload.requestedTentacle || apiPayload.tentacle || null;
                const expectedHostMatch = apiResults.some(item => {
                  try { return new URL(item.url).hostname.toLowerCase().endsWith(expectedHost); }
                  catch { return false; }
                });
                if (apiResponse.status() !== 200 || !apiResults.length || requestedLane !== expectedLane) {
                  throw new Error("Free Edge " + category + " lane routing failed: " + JSON.stringify({
                    status: apiResponse.status(), count: apiResults.length, requestedLane, expectedLane, expectedHost, expectedHostMatch,
                    laneFallback: apiPayload.laneFallback
                  }));
                }
                categoryLaneApi[category] = {
                  http: apiResponse.status(), count: apiResults.length, requestedLane, expectedHost, expectedHostMatch,
                  laneFallback: Boolean(apiPayload.laneFallback), provider: apiPayload.provider || null
                };
              }

              await goHome();
              await page.locator("#news-items .news-item").first().waitFor({ state: "visible", timeout: 45000 });
              report.checks.news = { count: await page.locator("#news-items .news-item").count(), status: await page.locator("#news-status").innerText() };
              for (const category of ["world", "technology", "business", "science"]) {
                const tab = page.locator('[data-news="' + category + '"]');
                if (await tab.count()) {
                  await tab.click();
                  await page.locator("#news-items .news-item").first().waitFor({ state: "visible", timeout: 30000 });
                  report.checks.news[category] = await page.locator("#news-items .news-item").count();
                }
              }
              const refresh = page.locator("#news-refresh");
              if (await refresh.count()) {
                await refresh.click();
                await page.locator("#news-items .news-item").first().waitFor({ state: "visible", timeout: 30000 });
                report.checks.news.refresh = "passed";
              }

              report.checks.newsFreshness = {};
              const newsQueries = {
                "for-you": "latest world news today",
                world: "latest world news today",
                technology: "latest technology news artificial intelligence",
                business: "latest business news economy markets",
                science: "latest science and space news"
              };
              for (const category of ["for-you", "world", "technology", "business", "science"]) {
                const newsUrl = new URL(EH_SUPABASE_BASE + "/everything-hub-independent-search");
                newsUrl.searchParams.set("q", newsQueries[category]);
                const newsApi = await page.request.get(newsUrl.toString(), { headers: { apikey: EH_PUBLIC_KEY, accept: "application/json" } });
                const newsPayload = await newsApi.json().catch(() => ({}));
                const newsItems = Array.isArray(newsPayload.results) ? newsPayload.results : [];
                const publishedTimes = newsItems.map(item => Date.parse(item.publishedAt)).filter(Number.isFinite);
                const latestPublishedAt = publishedTimes.length ? Math.max(...publishedTimes) : 0;
                const latestPublishedAgeHours = latestPublishedAt ? (Date.now() - latestPublishedAt) / 3600000 : null;
                const maxAgeHours = category === "for-you" ? 24 : 168;
                report.checks.newsFreshness[category] = {
                  http: newsApi.status(), itemCount: newsItems.length, provider: newsPayload.provider || null,
                  independentOfDatabase: newsPayload.independentOfDatabase === true,
                  latestPublishedAt: latestPublishedAt ? new Date(latestPublishedAt).toISOString() : null,
                  latestPublishedAgeHours, maxAgeHours,
                  sources: [...new Set(newsItems.map(item => item.source).filter(Boolean))]
                };
                if (newsApi.status() !== 200 || newsPayload.independentOfDatabase !== true ||
                    newsItems.length === 0 || latestPublishedAgeHours === null ||
                    latestPublishedAgeHours < -1 || latestPublishedAgeHours > maxAgeHours) {
                  report.failures.push("Top Stories category is empty or stale: " + category + " " + JSON.stringify(report.checks.newsFreshness[category]));
                }
              }
              await shot("everythinghub-news.png");
              await goHome();
              await search("images", "NASA", "#results .media-card", 4);
              const imageCards = page.locator("#results .media-card");
              const imageCardCount = await imageCards.count();
              for (let i = 0; i < Math.min(4, imageCardCount); i++) await imageCards.nth(i).scrollIntoViewIfNeeded();
              await page.waitForFunction(() => {
                const cards = [...document.querySelectorAll("#results .media-card")].slice(0, 4);
                return cards.length >= 4 && cards.every(card => {
                  const img = card.querySelector("img");
                  return !!(img && img.complete && img.naturalWidth > 0) || !!card.querySelector(".image-placeholder");
                });
              }, null, { timeout: 30000 });
              const imageStats = await imageCards.evaluateAll(cards => ({
                cards: cards.length,
                loaded: cards.filter(card => { const img=card.querySelector("img"); return img && img.complete && img.naturalWidth > 0; }).length,
                failed: cards.filter(card => !!card.querySelector(".image-placeholder")).length,
                thumbnailUrls: cards.slice(0, 4).map(card => card.querySelector("img")?.currentSrc || card.querySelector("img")?.src || ""),
                providers: cards.map(card => card.querySelector("small")?.textContent || ""),
                licenses: cards.map(card => card.dataset.license || ""),
                creators: cards.map(card => card.dataset.creator || "")
              }));
              imageStats.thumbnailResponses = mediaResponses.slice();
              imageStats.thumbnailFailures = mediaFailures.slice();
              report.checks.images = imageStats;
              const imageHrefs = await imageCards.evaluateAll(cards => cards.map(card => card.tagName.toLowerCase() === "a" ? card.href : card.querySelector("a")?.href || "").filter(Boolean));
              await openCoreLink("imageSource", imageHrefs.find(href => { try { return ["commons.wikimedia.org", "archive.org"].includes(new URL(href).hostname.toLowerCase()); } catch { return false; } }));
              report.checks.coreLinks = coreLinks;
              if (imageStats.loaded < 4 || imageStats.providers.some(x => !x.includes("Wikimedia Commons") && !x.includes("Internet Archive")) || imageStats.licenses.some(x => !x)) {
                throw new Error("Licensed image thumbnail and attribution checks failed: " + JSON.stringify(imageStats));
              }
              await shot("everythinghub-images.png");
              await goHome();
              // Use a broad media query and require actual licensed, attributed thumbnails.
              await search("videos", "animation", "#results .video-card", 2);
              const videoCards = page.locator("#results .video-card");
              const videoCardCount = await videoCards.count();
              for (let i = 0; i < Math.min(2, videoCardCount); i++) await videoCards.nth(i).scrollIntoViewIfNeeded();
              await page.waitForFunction(() => {
                const cards = [...document.querySelectorAll("#results .video-card")].slice(0, 2);
                return cards.length >= 2 && cards.every(card => {
                  const img = card.querySelector("img");
                  return !!(img && img.complete && img.naturalWidth > 0);
                });
              }, null, { timeout: 30000 });
              const videoStats = await videoCards.evaluateAll(cards => ({
                cards: cards.length,
                loaded: cards.filter(card => { const img=card.querySelector("img"); return img && img.complete && img.naturalWidth > 0; }).length,
                failed: cards.filter(card => { const img=card.querySelector("img"); return !img || !img.complete || img.naturalWidth === 0; }).length,
                thumbnailUrls: cards.slice(0, 2).map(card => card.querySelector("img")?.currentSrc || card.querySelector("img")?.src || ""),
                providers: cards.map(card => card.querySelector("small")?.textContent || ""),
                licenses: cards.map(card => card.dataset.license || ""),
                creators: cards.map(card => card.dataset.creator || ""),
                links: cards.map(card => card.querySelector("a")?.href || ""),
                titles: cards.map(card => (card.querySelector("h3, h4, strong")?.textContent || card.textContent || "").trim())
              }));
              videoStats.thumbnailResponses = mediaResponses.slice();
              videoStats.thumbnailFailures = mediaFailures.slice();
              report.checks.videos = videoStats;
              const videoHrefs = await videoCards.evaluateAll(cards => cards.map(card => card.tagName.toLowerCase() === "a" ? card.href : card.querySelector("a")?.href || "").filter(Boolean));
              await openCoreLink("videoSource", videoHrefs.find(href => { try { return ["commons.wikimedia.org", "archive.org"].includes(new URL(href).hostname.toLowerCase()); } catch { return false; } }));
              report.checks.coreLinks = coreLinks;
              if (videoStats.cards < 2 || videoStats.loaded < 2 ||
                  videoStats.providers.some(x => !x.includes("Wikimedia Commons") && !x.includes("Internet Archive")) ||
                  videoStats.licenses.some(x => !x) ||
                  videoStats.links.some(x => !x.startsWith("https://commons.wikimedia.org/wiki/") && !x.startsWith("https://archive.org/details/"))) {
                throw new Error("Licensed video thumbnail and attribution checks failed: " + JSON.stringify(videoStats));
              }
              await shot("everythinghub-videos.png");
              await page.setViewportSize({ width: 390, height: 844 });
              await goHome();
              const mobile = await layoutSnapshot();
              assertLayout("Mobile", mobile);
              report.checks.mobile = mobile;
              await shot("everythinghub-mobile.png");
              if (pageErrors.length || consoleErrors.length) throw new Error("Browser errors: " + JSON.stringify({ pageErrors, consoleErrors }));
              if (report.failures.length) throw new Error("Acceptance failures: " + report.failures.join("; "));
              report.passed = true;
            } catch (error) {
              report.error = error.message || String(error);
              console.error("ACCEPTANCE_REPORT " + JSON.stringify(report));
              await shot("everythinghub-failure.png").catch(() => {});
            } finally {
              report.mediaNetwork = { responses: mediaResponses, failures: mediaFailures };
              report.finishedAt = new Date().toISOString();
              fs.writeFileSync("everythinghub-acceptance-report.json", JSON.stringify(report, null, 2));
              await browser.close();
            }
            console.log(JSON.stringify(report, null, 2));
            if (!report.passed) process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          JS
          node acceptance.cjs
      - name: Save screenshots and acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everythinghub-free-fallback-acceptance
          path: |
            everythinghub-*.png
            everythinghub-acceptance-report.json
          retention-days: 30
