name: Everything Hub free fallback acceptance
on:
  push:
    branches:
      - eh/nasa-video-search-2026-11-21
    paths:
      - ".github/workflows/eh-free-fallback-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_URL: https://everythinghub-homepage-fixed.vercel.app/
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test live homepage, searches, media, news, and mobile layout
        run: |
          cat > acceptance.cjs <<'JS'
          const { chromium } = require("playwright");
          const fs = require("node:fs");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            const consoleErrors = [];
            const httpErrors = [];
            const requestFailures = [];
            const isFirstPartyUrl = value => /everythinghub-search-backend\.vercel\.app|everythinghub-homepage-fixed/.test(value);
            page.on("pageerror", error => pageErrors.push(error.message));
            page.on("console", message => { if (message.type() === "error") consoleErrors.push(message.text()); });
            const mediaResponses = [];
            const mediaFailures = [];
            page.on("response", response => {
              const url = response.url();
              if (response.status() >= 400 && isFirstPartyUrl(url)) {
                httpErrors.push({ status: response.status(), url });
              }
              if (url.includes("archive.org")) {
                const headers = response.headers();
                mediaResponses.push({ status: response.status(), url, contentType: headers["content-type"] || "" });
              }
            });
            page.on("requestfailed", request => {
              if (request.url().includes("archive.org")) {
                mediaFailures.push({ url: request.url(), failure: request.failure()?.errorText || "" });
              }
            });
            page.on("requestfailed", request => {
              if (isFirstPartyUrl(request.url())) requestFailures.push({ url: request.url(), failure: request.failure()?.errorText || "" });
            });
            await page.addInitScript(() => {
              const originalFetch = window.fetch.bind(window);
              window.__ehNewsRequestCount = 0;
              window.__ehNewsRetrySimulated = false;
              window.fetch = async (...args) => {
                let url = null;
                try { url = new URL(String(args[0]), location.href); } catch {}
                if (url && url.hostname === "everythinghub-search-backend.vercel.app" && url.pathname === "/api/news") {
                  window.__ehNewsRequestCount += 1;
                  if (!window.__ehNewsRetrySimulated && url.searchParams.get("category") === "world") {
                    window.__ehNewsRetrySimulated = true;
                    throw new TypeError("Failed to fetch");
                  }
                }
                return originalFetch(...args);
              };
            });
            const report = { url: process.env.TARGET_URL, checks: {}, pageErrors, consoleErrors, httpErrors, requestFailures, mediaResponses, mediaFailures };
            const shot = async name => page.screenshot({ path: name, fullPage: true });
            const goHome = async () => {
              await page.goto(process.env.TARGET_URL, { waitUntil: "domcontentloaded", timeout: 45000 });
              const release = await page.locator("body").getAttribute("data-release").catch(() => null);
              if (release !== "fallback-2026-11-21-r4") throw new Error("Unexpected live release marker: " + release);
              await page.locator("#query").waitFor({ state: "visible", timeout: 20000 });
              const image = page.locator(".art img").first();
              await image.waitFor({ state: "visible", timeout: 20000 });
              await image.scrollIntoViewIfNeeded();
              await page.waitForFunction(() => {
                const img = document.querySelector(".art img");
                return !!img && img.complete && img.naturalWidth >= 800;
              }, null, { timeout: 30000 });
            };
            const waitForRelease = async () => {
              let response = null;
              let release = null;
              for (let attempt = 0; attempt < 24; attempt++) {
                try { response = await page.goto(report.url, { waitUntil: "domcontentloaded", timeout: 20000 }); } catch {}
                release = await page.locator("body").getAttribute("data-release").catch(() => null);
                if (response && response.status() === 200 && release === "fallback-2026-11-21-r4") return response;
                await page.waitForTimeout(5000);
              }
              throw new Error("Vercel fallback did not serve r3 release marker; last release=" + release);
            };
            const search = async (mode, query, resultSelector, minCount = 1) => {
              await page.locator('.hotspots [data-mode="' + mode + '"]').click();
              await page.locator("#query").fill(query);
              await page.locator("#searchForm button[type=submit]").click();
              await page.locator(resultSelector).first().waitFor({ state: "visible", timeout: 60000 });
              const count = await page.locator(resultSelector).count();
              if (count < minCount) throw new Error(mode + " returned only " + count + " results for " + query);
              return { count, titles: (await page.locator(resultSelector).allTextContents()).slice(0, 6) };
            };
            const categorySearch = async (mode, query, pattern) => {
              await goHome();
              await page.locator('.hotspots [data-mode="' + mode + '"]').click();
              const selected = await page.locator("#status").innerText();
              if (!selected.toLowerCase().includes("selected")) throw new Error("Category did not activate: " + mode);
              await page.locator("#query").fill(query);
              await page.locator("#searchForm button[type=submit]").click();
              await page.locator("#results .eh-result").first().waitFor({ state: "visible", timeout: 60000 });
              const titles = (await page.locator("#results .eh-result a").allTextContents()).map(value => value.trim()).filter(Boolean);
              if (!titles.some(title => pattern.test(title))) throw new Error("Category results were not relevant: " + mode + " / " + titles.slice(0, 5).join(" | "));
              return { count: titles.length, titles: titles.slice(0, 6) };
            };
            try {
              const response = await waitForRelease();
              if (!response || response.status() !== 200) throw new Error("Homepage did not return HTTP 200");
              const release = await page.locator("body").getAttribute("data-release");
              if (release !== "fallback-2026-11-21-r4") throw new Error("Live release marker mismatch: " + release);
              const artworkImage = page.locator(".art img").first();
              await artworkImage.waitFor({ state: "visible", timeout: 20000 });
              await artworkImage.scrollIntoViewIfNeeded();
              await page.waitForFunction(() => {
                const img = document.querySelector(".art img");
                return !!img && img.complete && img.naturalWidth >= 800 && img.naturalHeight >= 800;
              }, null, { timeout: 30000 });
              const art = await artworkImage.evaluate(img => ({ src: img.currentSrc || img.src, width: img.naturalWidth, height: img.naturalHeight, complete: img.complete }));
              if (!art.src.includes("everythinghub-approved-octopus.png") || art.width < 800 || art.height < 800) throw new Error("Approved octopus artwork check failed: " + JSON.stringify(art));
              const modes = await page.locator(".hotspots [data-mode]").evaluateAll(nodes => nodes.map(node => node.dataset.mode));
              if (modes.length !== 8) throw new Error("Expected eight search categories; got " + modes.length);
              report.checks.home = { http: response.status(), release, title: await page.title(), artwork: art, modes };
              report.checks.desktop = await page.evaluate(() => {
                const art = document.querySelector(".art").getBoundingClientRect();
                const results = document.querySelector("#results").getBoundingClientRect();
                return {
                  viewport: document.documentElement.clientWidth,
                  document: document.documentElement.scrollWidth,
                  artworkBottom: art.bottom,
                  resultsTop: results.top
                };
              });
              if (report.checks.desktop.document > report.checks.desktop.viewport + 2 ||
                  report.checks.desktop.resultsTop < report.checks.desktop.artworkBottom - 2) {
                throw new Error("Desktop layout overflow or overlap: " + JSON.stringify(report.checks.desktop));
              }
              await shot("everythinghub-home.png");
              await search("web", "Rolex", "#results .eh-result", 1);
              report.checks.rolex = { results: await page.locator("#results .eh-result").count(), catalogs: await page.locator("#results .eh-catalog-result").count() };
              await shot("everythinghub-rolex.png");
              await goHome();
              await search("web", "Las Vegas", "#results .eh-result", 1);
              report.checks.lasVegas = { results: await page.locator("#results .eh-result").count(), catalogs: await page.locator("#results .eh-catalog-result").count() };
              await shot("everythinghub-las-vegas.png");
              await goHome();
              await search("web", "NASA", "#results .eh-result", 1);
              report.checks.nasa = { results: await page.locator("#results .eh-result").count(), catalogs: await page.locator("#results .eh-catalog-result").count() };
              await shot("everythinghub-nasa.png");
              const searchLink = await page.locator("#results .eh-result a").first().evaluate(anchor => ({ href: anchor.href, target: anchor.target, rel: anchor.rel }));
              if (!/^https:\/\//i.test(searchLink.href) || searchLink.target !== "_blank" || !searchLink.rel.includes("noopener")) {
                throw new Error("Search result link contract failed: " + JSON.stringify(searchLink));
              }
              const popupPromise = page.waitForEvent("popup", { timeout: 10000 });
              await page.locator("#results .eh-result a").first().click();
              const popup = await popupPromise;
              await popup.waitForLoadState("domcontentloaded", { timeout: 15000 }).catch(() => undefined);
              report.checks.coreLinks = { search: { ...searchLink, openedUrl: popup.url() } };
              await popup.close().catch(() => undefined);

              report.checks.categories = {};
              for (const item of [
                { mode: "news", query: "NASA", pattern: /nasa|space|mars/i },
                { mode: "shopping", query: "Rolex", pattern: /rolex/i },
                { mode: "places", query: "Las Vegas", pattern: /las vegas|vegas/i },
                { mode: "business", query: "Las Vegas", pattern: /las vegas|vegas/i },
                { mode: "research", query: "NASA", pattern: /nasa/i }
              ]) {
                report.checks.categories[item.mode] = await categorySearch(item.mode, item.query, item.pattern);
              }

              await goHome();
              await page.waitForFunction(() => {
                const status = document.querySelector("#news-status")?.textContent || "";
                return status.startsWith("Updated") && document.querySelectorAll("#news-items .news-item").length > 0;
              }, null, { timeout: 45000 });
              const topTitles = (await page.locator("#news-items .news-item a").allTextContents()).map(value => value.trim().toLowerCase()).filter(Boolean);
              const newsApi = await page.evaluate(async () => {
                const response = await fetch("https://everythinghub-search-backend.vercel.app/api/news?category=for-you");
                return { http: response.status, data: await response.json() };
              });
              const latestPublished = (newsApi.data.items || []).map(item => Date.parse(item.publishedAt || "")).filter(Number.isFinite).sort((a, b) => b - a)[0] || null;
              const updateAgeMinutes = (Date.now() - Date.parse(newsApi.data.updatedAt || "")) / 60000;
              report.checks.news = {
                count: await page.locator("#news-items .news-item").count(),
                uniqueTitles: new Set(topTitles).size,
                status: await page.locator("#news-status").innerText(),
                apiHttp: newsApi.http,
                updatedAt: newsApi.data.updatedAt,
                updateAgeMinutes,
                latestPublishedAt: latestPublished ? new Date(latestPublished).toISOString() : null
              };
              if (report.checks.news.count < 5 || report.checks.news.uniqueTitles !== report.checks.news.count ||
                  newsApi.http !== 200 || newsApi.data.status !== "ok" || !Number.isFinite(updateAgeMinutes) ||
                  updateAgeMinutes > 360 || !latestPublished || (Date.now() - latestPublished) / 3600000 > 24) {
                throw new Error("Top Stories freshness or uniqueness failed: " + JSON.stringify(report.checks.news));
              }
              for (const category of ["world", "technology", "business", "science"]) {
                const tab = page.locator('[data-news="' + category + '"]');
                if (!(await tab.count())) throw new Error("Missing Top Stories tab: " + category);
                const beforeRequests = await page.evaluate(() => window.__ehNewsRequestCount || 0);
                const requiredRequests = category === "world" ? 2 : 1;
                await tab.click();
                await page.waitForFunction(({ category, beforeRequests, requiredRequests }) => {
                  const active = document.querySelector('[data-news="' + category + '"]')?.classList.contains("active");
                  const status = document.querySelector("#news-status")?.textContent || "";
                  const count = document.querySelectorAll("#news-items .news-item").length;
                  const requests = window.__ehNewsRequestCount || 0;
                  return active && status.startsWith("Updated") && count > 0 && requests >= beforeRequests + requiredRequests;
                }, { category, beforeRequests, requiredRequests }, { timeout: 30000 });
                const afterRequests = await page.evaluate(() => window.__ehNewsRequestCount || 0);
                const count = await page.locator("#news-items .news-item").count();
                const firstTitle = (await page.locator("#news-items .news-item a").first().innerText()).trim();
                report.checks.news[category] = { count, firstTitle, requests: afterRequests - beforeRequests };
                if (category === "world") {
                  const retryState = await page.evaluate(() => ({ simulated: window.__ehNewsRetrySimulated, requests: window.__ehNewsRequestCount || 0 }));
                  if (!retryState.simulated || afterRequests - beforeRequests < 2) throw new Error("News transient retry did not recover: " + JSON.stringify(retryState));
                  report.checks.news.retryTest = { simulatedFailure: true, requests: afterRequests - beforeRequests };
                }
              }
              const refresh = page.locator("#news-refresh");
              if (!(await refresh.count())) throw new Error("Top Stories Refresh control is missing.");
              const beforeRefresh = await page.evaluate(() => window.__ehNewsRequestCount || 0);
              await refresh.click();
              await page.waitForFunction(beforeRequests => {
                const status = document.querySelector("#news-status")?.textContent || "";
                const count = document.querySelectorAll("#news-items .news-item").length;
                const requests = window.__ehNewsRequestCount || 0;
                return status.startsWith("Updated") && count > 0 && requests >= beforeRequests + 1;
              }, beforeRefresh, { timeout: 30000 });
              const afterRefresh = await page.evaluate(() => window.__ehNewsRequestCount || 0);
              report.checks.news.refresh = {
                requests: afterRefresh - beforeRefresh,
                count: await page.locator("#news-items .news-item").count(),
                status: await page.locator("#news-status").innerText()
              };
              if (report.checks.news.refresh.requests < 1) throw new Error("Top Stories Refresh did not issue a new request.");
              const newsLink = await page.locator("#news-items .news-item a").first().evaluate(anchor => ({ href: anchor.href, target: anchor.target, rel: anchor.rel }));
              if (!/^https?:\/\//i.test(newsLink.href) || newsLink.target !== "_blank" || !newsLink.rel.includes("noopener")) {
                throw new Error("News article link contract failed: " + JSON.stringify(newsLink));
              }
              report.checks.coreLinks.news = newsLink;
              await shot("everythinghub-news.png");
              await goHome();
              await search("images", "NASA", "#results .media-card", 8);
              await page.waitForTimeout(3000);
              const imageStats = await page.locator("#results .media-card").evaluateAll(cards => ({
                cards: cards.length,
                loaded: cards.filter(card => { const img=card.querySelector("img"); return img && img.complete && img.naturalWidth > 0; }).length,
                providers: cards.map(card => card.querySelector("small")?.textContent || ""),
                licenses: cards.map(card => card.dataset.license || ""),
                creators: cards.map(card => card.dataset.creator || ""),
                creatorValid: cards.map(card => {
                  const license = String(card.dataset.license || "").toLowerCase();
                  const creator = String(card.dataset.creator || "").trim();
                  const requiresCreator = license.startsWith("cc by");
                  const genericCreator = ["internet archive", "unknown", "anonymous", "not specified", "n/a"].includes(creator.toLowerCase());
                  return !requiresCreator || (!!creator && !genericCreator);
                }),
                licenseUrls: cards.map(card => Array.from(card.querySelectorAll("small a")).find(anchor => anchor.href.startsWith("https://creativecommons.org/"))?.href || ""),
                attributions: cards.map(card => card.querySelector("small")?.textContent || ""),
                itemLinks: cards.map(card => card.querySelector("a")?.href || ""),
                thumbnailUrls: cards.map(card => card.querySelector("img")?.src || "")
              }));
              const failedItemLinks = imageStats.itemLinks.filter((_, index) => !imageStats.thumbnailUrls[index]).slice(0, 3);
              const alternateUrls = failedItemLinks.map(href => {
                const identifier = new URL(href).pathname.split("/").filter(Boolean).pop();
                return "https://archive.org/services/img/" + encodeURIComponent(identifier);
              });
              const alternateReferrer = await page.evaluate(async urls => Promise.all(urls.map(url => new Promise(resolve => {
                const img = new Image();
                img.referrerPolicy = "strict-origin-when-cross-origin";
                let settled = false;
                const finish = value => { if (settled) return; settled = true; clearTimeout(timer); resolve(value); };
                const timer = setTimeout(() => finish({ url, loaded: false, timeout: true }), 9000);
                img.onload = () => finish({ url, loaded: true, width: img.naturalWidth });
                img.onerror = () => finish({ url, loaded: false });
                img.src = url;
              }))), alternateUrls);
              report.checks.images = { ...imageStats, mediaResponses, mediaFailures, alternateReferrer };
              if (imageStats.loaded < 8 || imageStats.providers.some(x => !x.includes("Internet Archive")) ||
                  imageStats.licenses.some(x => !x) || imageStats.licenseUrls.some(x => !x.startsWith("https://creativecommons.org/")) ||
                  imageStats.creatorValid.some(valid => !valid) ||
                  imageStats.attributions.some((text, index) => !/Source:\s*Internet Archive/i.test(text) || !text.includes(imageStats.licenses[index]))) {
                throw new Error("Image thumbnails or attribution failed: " + JSON.stringify({ ...imageStats, mediaResponses }));
              }
              const imageLink = await page.locator("#results .media-card > a").first().evaluate(anchor => ({ href: anchor.href, target: anchor.target, rel: anchor.rel }));
              if (!/^https:\/\/archive\.org\/details\//i.test(imageLink.href) || imageLink.target !== "_blank" || !imageLink.rel.includes("noopener")) {
                throw new Error("Image source link contract failed: " + JSON.stringify(imageLink));
              }
              report.checks.images = { ...imageStats, mediaResponses, mediaFailures, alternateReferrer };
              report.checks.coreLinks.images = imageLink;
              await shot("everythinghub-images.png");
              await goHome();
              await search("videos", "animation", "#results .video-card", 4);
              const videoStats = await page.locator("#results .video-card").evaluateAll(cards => ({
                cards: cards.length,
                loaded: cards.filter(card => { const img=card.querySelector("img"); return img && img.complete && img.naturalWidth > 0; }).length,
                providers: cards.map(card => card.querySelector("small")?.textContent || ""),
                links: cards.map(card => card.querySelector("a")?.href || ""),
                titles: cards.map(card => (card.querySelector("a.video-title") || card.querySelector("a"))?.textContent?.trim() || "")
              }));
              if (videoStats.cards < 4 || videoStats.loaded < 4 || videoStats.titles.some(x => !x) ||
                  videoStats.providers.some(x => !x.includes("Internet Archive")) ||
                  videoStats.links.some(x => !x.startsWith("https://archive.org/details/"))) {
                throw new Error("Internet Archive video cards, titles, or thumbnails failed: " + JSON.stringify(videoStats));
              }
              const videoLink = await page.locator("#results .video-card > a").first().evaluate(anchor => ({ href: anchor.href, target: anchor.target, rel: anchor.rel }));
              if (videoLink.target !== "_blank" || !videoLink.rel.includes("noopener")) throw new Error("Video source link contract failed: " + JSON.stringify(videoLink));
              report.checks.videos = videoStats;
              report.checks.coreLinks.videos = videoLink;
              await shot("everythinghub-videos.png");
              await page.setViewportSize({ width: 390, height: 844 });
              await goHome();
              const mobile = await page.evaluate(() => {
                const art = document.querySelector(".art").getBoundingClientRect();
                const search = document.querySelector("#searchForm").getBoundingClientRect();
                const input = document.querySelector("#query").getBoundingClientRect();
                const categories = document.querySelector(".hotspots").getBoundingClientRect();
                const stories = document.querySelector("#top-stories").getBoundingClientRect();
                const results = document.querySelector("#results").getBoundingClientRect();
                return {
                  viewport: document.documentElement.clientWidth,
                  document: document.documentElement.scrollWidth,
                  artwork: !!document.querySelector(".art img")?.getClientRects().length,
                  search: !!document.querySelector("#query")?.getClientRects().length,
                  categories: document.querySelectorAll(".hotspots [data-mode]").length,
                  artworkWidth: art.width,
                  artworkBottom: art.bottom,
                  searchBottom: Math.max(search.bottom, input.bottom),
                  categoriesTop: categories.top,
                  categoriesBottom: categories.bottom,
                  storiesLeft: stories.left,
                  storiesRight: stories.right,
                  resultsTop: results.top,
                  brokenImages: [...document.images].filter(img => img.complete && img.naturalWidth === 0).length
                };
              });
              if (mobile.document > mobile.viewport + 2 || !mobile.artwork || !mobile.search || mobile.categories !== 8 ||
                  mobile.artworkWidth < mobile.viewport - 4 || mobile.searchBottom > mobile.categoriesTop + 2 ||
                  mobile.categoriesBottom > mobile.artworkBottom + 2 || mobile.storiesLeft < -2 ||
                  mobile.storiesRight > mobile.viewport + 2 || mobile.resultsTop < mobile.artworkBottom - 2 ||
                  mobile.brokenImages) {
                throw new Error("Mobile clipping, overlap, or image check failed: " + JSON.stringify(mobile));
              }
              report.checks.mobile = mobile;
              await shot("everythinghub-mobile.png");
              const isNewsEndpoint = value => {
                try {
                  const url = new URL(value);
                  return url.hostname === "everythinghub-search-backend.vercel.app" && url.pathname === "/api/news";
                } catch { return false; }
              };
              const loadedNewsCategories = new Set();
              if (report.checks.news.count > 0) loadedNewsCategories.add("for-you");
              for (const category of ["world", "technology", "business", "science"]) {
                if (report.checks.news[category]?.count > 0) loadedNewsCategories.add(category);
              }
              const recoveredNewsHttpErrors = httpErrors.filter(item => {
                if (!isNewsEndpoint(item.url)) return false;
                return loadedNewsCategories.has(new URL(item.url).searchParams.get("category"));
              });
              const recoveredNewsRequestFailures = requestFailures.filter(item => {
                if (!isNewsEndpoint(item.url)) return false;
                return loadedNewsCategories.has(new URL(item.url).searchParams.get("category"));
              });
              const fatalHttpErrors = httpErrors.filter(item => !recoveredNewsHttpErrors.includes(item));
              const fatalRequestFailures = requestFailures.filter(item => !recoveredNewsRequestFailures.includes(item));
              const genericNetworkConsoleErrors = consoleErrors.filter(message => /Failed to load resource: the server responded with a status of [45]\\d\\d/i.test(message));
              const fatalConsoleErrors = consoleErrors.filter(message => !/Failed to load resource: the server responded with a status of [45]\\d\\d/i.test(message));
              if (pageErrors.length || fatalConsoleErrors.length || fatalHttpErrors.length || fatalRequestFailures.length ||
                  genericNetworkConsoleErrors.length > recoveredNewsHttpErrors.length + recoveredNewsRequestFailures.length) {
                throw new Error("Browser errors affected core functions: " + JSON.stringify({
                  pageErrors, consoleErrors, httpErrors, requestFailures,
                  recoveredNewsHttpErrors, recoveredNewsRequestFailures
                }));
              }
              report.checks.browserErrors = {
                pageErrors, consoleErrors, recoveredNewsHttpErrors, recoveredNewsRequestFailures
              };
              report.passed = true;
            } catch (error) {
              report.error = error.message || String(error);
              console.error("ACCEPTANCE_REPORT " + JSON.stringify(report));
              await shot("everythinghub-failure.png").catch(() => {});
            } finally {
              report.finishedAt = new Date().toISOString();
              fs.writeFileSync("everythinghub-acceptance-report.json", JSON.stringify(report, null, 2));
              await browser.close();
            }
            console.log(JSON.stringify(report, null, 2));
            if (!report.passed) process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          JS
          node acceptance.cjs
      - name: Save screenshots and acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everythinghub-free-fallback-acceptance
          path: |
            everythinghub-*.png
            everythinghub-acceptance-report.json
          retention-days: 30
