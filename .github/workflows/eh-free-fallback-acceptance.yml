name: Everything Hub free fallback acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eh-free-fallback-acceptance
  cancel-in-progress: true
jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify free Vercel homepage and search
        env:
          TARGET_URL: https://everythinghub-homepage-fixed.vercel.app/
          EH_PUBLIC_KEY: sb_publishable_XlIsACWhtVS1jVODWYGTpg_GMs8v3vJ
          LIVE_EDGE: "0"
        run: node scripts/everything-hub-browser-check.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everything-hub-free-vercel-browser-evidence
          path: |
            everything-hub-browser-report.json
            everything-hub-*.png
          if-no-files-found: warn
          retention-days: 30
