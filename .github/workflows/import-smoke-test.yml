name: EverythingHub isolated importer smoke test

on:
  push:
    paths:
      - "database/**"
      - ".github/workflows/import-smoke-test.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: everythinghub_test
          POSTGRES_USER: eh_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eh_test -d everythinghub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eh_test:test-only-password@localhost:5432/everythinghub_test
      EH_DB_SCHEMA: eh_import_test
    steps:
      - name: Check out crawler repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install importer dependency
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Create isolated test schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA eh_import_test;"
          PGOPTIONS="-c search_path=eh_import_test" psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/001_everythinghub_core.sql
      - name: Import crawler snapshot into temporary database
        run: python database/import_repository_index.py
      - name: Verify imported records
        run: |
          count=$(psql "$DATABASE_URL" -tA -c "SELECT count(*) FROM eh_import_test.eh_documents;")
          echo "Imported records: $count"
          test "$count" -gt 0
