name: EverythingHub isolated importer smoke test

on:
  push:
    paths:
      - "database/**"
      - "data/universal-catalog-records.json.gz"
      - "engine/intelligence_core.py"
      - ".github/workflows/import-smoke-test.yml"
  pull_request:
    paths:
      - "database/**"
      - ".github/workflows/import-smoke-test.yml"
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Everything Hub crawler"
      - "Catalog-first discovery"
    types:
      - completed

permissions:
  contents: read

jobs:
  import-smoke-test:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: everythinghub_test
          POSTGRES_USER: eh_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eh_test -d everythinghub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eh_test:test-only-password@localhost:5432/everythinghub_test
      EH_DB_SCHEMA: eh_quad
    steps:
      - name: Check out crawler repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install importer dependency
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Create isolated test service role
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE service_role NOLOGIN BYPASSRLS;"
      - name: Create isolated eh_quad test schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/002_eh_quad_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/003_eh_quad_intelligence.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/004_eh_quad_feedback_cursor.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/005_eh_quad_catalogs.sql
      - name: Smoke-test append-only feedback learning in isolated eh_quad
        run: python database/intelligence_feedback_smoke.py
      - name: Run schema-isolation unit tests
        run: python -m unittest discover -s database -p 'test_*.py' -v
      - name: Import crawler snapshot into temporary database
        run: python database/import_repository_index.py
      - name: Import staged universal catalogs and records
        run: python database/import_universal_catalogs.py
      - name: Verify imported records and lane distribution
        run: |
          expected=$(python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("database").resolve()))
          sys.path.insert(0, str(Path("crawler").resolve()))
          from import_repository_index import (
              collect_robots_denied_urls,
              is_public_http_url,
              is_robots_allowed,
          )
          from index_store import load_index

          pages = load_index(Path("data/index.json")).get("pages", [])
          denied_urls = set(collect_robots_denied_urls(pages))
          allowed_urls = {
              page["url"]
              for page in pages
              if isinstance(page, dict)
              and is_public_http_url(page.get("url"))
              and is_robots_allowed(page)
              and page["url"] not in denied_urls
          }
          print(len(allowed_urls))
          PY
          )
          count=$(psql "$DATABASE_URL" -tA -c "SELECT count(*) FROM eh_quad.eh_documents;")
          echo "Expected unique allowed records: $expected"
          echo "Imported records: $count"
          test "$count" = "$expected"
          expected_catalog_counts=$(python - <<'PY'
          import gzip, json
          data = json.load(gzip.open("data/universal-catalog-records.json.gz", "rt", encoding="utf-8"))
          eligible = sum(
              1 for row in data["records"]
              if isinstance(row, dict)
              and isinstance(row.get("attributes"), dict)
              and row["attributes"].get("public_search_allowed") is True
          )
          print(len(data["catalogs"]), eligible)
          PY
          )
          expected_catalogs=$(echo "$expected_catalog_counts" | awk '{print $1}')
          expected_catalog_records=$(echo "$expected_catalog_counts" | awk '{print $2}')
          actual_catalogs=$(psql "$DATABASE_URL" -tA -c "SELECT count(*) FROM eh_quad.eh_catalogs;")
          actual_catalog_records=$(psql "$DATABASE_URL" -tA -c "SELECT count(*) FROM eh_quad.eh_catalog_records;")
          echo "Expected catalogs: $expected_catalogs; imported catalogs: $actual_catalogs"
          echo "Expected catalog records: $expected_catalog_records; imported catalog records: $actual_catalog_records"
          test "$actual_catalogs" = "$expected_catalogs"
          test "$actual_catalog_records" = "$expected_catalog_records"
          robots_denied=$(psql "$DATABASE_URL" -tA -c "SELECT count(*) FROM eh_quad.eh_documents WHERE robots_allowed IS NOT TRUE;")
          echo "Unexpected robots-denied stored records: $robots_denied"
          test "$robots_denied" = "0"
          invalid_lanes=$(psql "$DATABASE_URL" -tA -c "SELECT count(*) FROM eh_quad.eh_documents WHERE lane NOT IN ('general','science','news','technology','business','government','culture','nature');")
          echo "Invalid lane rows: $invalid_lanes"
          test "$invalid_lanes" = "0"
          echo "Imported records by search lane:"
          psql "$DATABASE_URL" -P pager=off -c "SELECT lane, count(*) AS records FROM eh_quad.eh_documents GROUP BY lane ORDER BY lane;"
      - name: Smoke-test the database crawler in isolated eh_quad
        env:
          EH_CRAWL_TEST_MODE: "1"
          EH_CRAWL_ALLOW_LOOPBACK_TEST: "1"
          EH_CRAWL_SEED: "0"
          EH_CRAWL_MAX_PAGES: "4"
          EH_CRAWL_MAX_ITEMS: "4"
          EH_CRAWL_MAX_DEPTH: "1"
          EH_CRAWL_HOST_DELAY: "0"
        run: python database/crawl_worker_smoke.py
      - name: Verify authenticated search, lane filters, and pagination
        env:
          EH_SEARCH_API_TOKEN: isolated-test-token
          EH_SEARCH_HOST: 127.0.0.1
          EH_SEARCH_PORT: "8080"
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO eh_quad.eh_documents
            (canonical_url, source_host, lane, title, description, body_text, content_hash, robots_allowed)
          VALUES
            ('https://everythinghub.test/search-smoke-general', 'everythinghub.test', 'general',
             'EverythingHub search smoke general', 'quartz lantern integration verification',
             'quartz lantern integration test general', 'smoke-general-v1', true),
            ('https://everythinghub.test/search-smoke-science', 'everythinghub.test', 'science',
             'EverythingHub search smoke science', 'quartz lantern integration verification',
             'quartz lantern integration test science', 'smoke-science-v1', true),
            ('https://everythinghub.test/search-smoke-business', 'everythinghub.test', 'business',
             'EverythingHub search smoke business', 'quartz lantern integration verification',
             'quartz lantern integration test business', 'smoke-business-v1', true),
            ('https://everythinghub.test/search-smoke-robots-denied', 'everythinghub.test', 'general',
             'EverythingHub robots denied fixture', 'quartz lantern integration verification',
             'quartz lantern integration test must not appear in search', 'smoke-robots-denied-v1', false)
          ON CONFLICT (canonical_url) DO NOTHING;
          SQL
          python database/search_api.py > /tmp/eh-search-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8080/healthz > /tmp/eh-health.json; then break; fi
            sleep 1
          done
          grep -q '"status": "ok"' /tmp/eh-health.json

          unauthorized=$(curl --silent --output /tmp/eh-unauthorized.json --write-out '%{http_code}' 'http://127.0.0.1:8080/search?q=quartz')
          test "$unauthorized" = "401"

          for offset in 0 1 2; do
            curl --silent --fail -H "Authorization: Bearer isolated-test-token" \
              "http://127.0.0.1:8080/search?q=quartz%20lantern&limit=1&offset=$offset" \
              > "/tmp/eh-page-$offset.json"
          done
          python - <<'PY'
          import json
          pages = [json.load(open(f"/tmp/eh-page-{offset}.json")) for offset in range(3)]
          urls = [page["results"][0]["url"] for page in pages]
          expected = {
              "https://everythinghub.test/search-smoke-general",
              "https://everythinghub.test/search-smoke-science",
              "https://everythinghub.test/search-smoke-business",
          }
          assert all(page["total"] == 3 and len(page["results"]) == 1 for page in pages), pages
          assert pages[0]["hasMore"] is True and pages[1]["hasMore"] is True and pages[2]["hasMore"] is False, pages
          assert len(set(urls)) == 3 and set(urls) == expected, urls
          print("Pagination returned all three unique allowed fixture records; robots-denied fixture was excluded.")
          PY

          rpc_count=$(psql "$DATABASE_URL" -tA -c "SELECT count(*) FROM eh_quad.eh_search_pages('quartz lantern', NULL, 20);")
          echo "eh_quad RPC visible rows: $rpc_count"
          test "$rpc_count" = "3"
          rpc_denied=$(psql "$DATABASE_URL" -tA -c "SELECT count(*) FROM eh_quad.eh_search_pages('quartz lantern', NULL, 20) WHERE url = 'https://everythinghub.test/search-smoke-robots-denied';")
          echo "eh_quad RPC robots-denied rows: $rpc_denied"
          test "$rpc_denied" = "0"

          curl --silent --fail -H "Authorization: Bearer isolated-test-token" \
            'http://127.0.0.1:8080/search?q=quartz%20lantern&tentacle=science' \
            > /tmp/eh-science.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/eh-science.json"))
          assert data["total"] == 1, data
          assert len(data["results"]) == 1, data
          assert data["results"][0]["url"] == "https://everythinghub.test/search-smoke-science", data
          assert data["results"][0]["tentacle"] == "science", data
          assert data["tentacle"] == "science", data
          print("Science lane filter returned only the science fixture.")
          PY

          encoded_catalog_query=$(python - <<'PY'
          import json
          from urllib.parse import quote
          import gzip
          data = json.load(gzip.open("data/universal-catalog-records.json.gz", "rt", encoding="utf-8"))
          print(quote(data["records"][0]["title"]))
          PY
          )
          curl --silent --fail -H "Authorization: Bearer isolated-test-token" \
            "http://127.0.0.1:8080/search?q=$encoded_catalog_query&type=catalog&record_type=dataset&limit=1" \
            > /tmp/eh-catalog-search.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/eh-catalog-search.json"))
          assert data["type"] == "catalog_records", data
          assert data["total"] >= 1, data
          assert len(data["results"]) == 1, data
          record = data["results"][0]
          assert record["record_type"] == "dataset", record
          assert record["url"].startswith("https://"), record
          assert record["catalog_id"], record
          print("Authenticated catalog-record search returned a staged dataset record.")
          PY
