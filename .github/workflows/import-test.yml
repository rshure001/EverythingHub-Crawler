name: Import crawler snapshot to isolated test schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out crawler repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install importer dependency
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Import into private test schema only
        env:
          DATABASE_URL: ${{ secrets.EVERYTHINGHUB_TEST_DATABASE_URL }}
        run: python database/import_repository_index.py
