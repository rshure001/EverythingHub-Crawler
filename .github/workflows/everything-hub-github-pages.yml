name: Everything Hub free GitHub Pages publisher

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/everything-hub-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: everything-hub-github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout approved site
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/search.js _site/search.js
          test -s _site/index.html
          test -s _site/search.js
          echo "Prepared HTML homepage and browser search client."
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish free static site
        id: deployment
        uses: actions/deploy-pages@v4
