name: First-party catalog preview smoke
on:
  pull_request:
    paths:
      - ".github/workflows/universal-catalog-preview-smoke.yml"
      - "scripts/universal-catalog-preview-smoke.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/universal-catalog-preview-smoke.yml"
      - "scripts/universal-catalog-preview-smoke.mjs"
      - "supabase/functions/everything-hub-web-search/**"
      - "supabase/functions/everything-hub-catalog-search/**"
  workflow_run:
    workflows:
      - "Retroactive catalog inventory"
      - "Catalog-first discovery"
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: universal-catalog-preview-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify first-party Supabase catalog search
        run: node scripts/universal-catalog-preview-smoke.mjs
        env:
          EH_BACKEND_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1
          EH_PUBLISHABLE_KEY: sb_publishable_XlIsACWhtVS1jVODWYGTpg_GMs8v3vJ
