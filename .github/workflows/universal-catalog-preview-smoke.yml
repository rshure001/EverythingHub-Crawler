name: Universal catalog preview smoke
on:
  pull_request:
    paths:
      - ".github/workflows/universal-catalog-preview-smoke.yml"
      - "scripts/universal-catalog-preview-smoke.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/universal-catalog-preview-smoke.yml"
      - "scripts/universal-catalog-preview-smoke.mjs"
  workflow_run:
    workflows:
      - "Retroactive catalog inventory"
      - "Catalog-first discovery"
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: universal-catalog-preview-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: scripts/universal-catalog-preview-smoke.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify the immutable Vercel preview API
        run: node scripts/universal-catalog-preview-smoke.mjs
        env:
          EH_BACKEND_PREVIEW_URL: https://everythinghub-search-backend-5ly8pl5vt-rshure001-8053.vercel.app
