name: Everything Hub live publishing and search verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/everything-hub-deploy-bridge/index.ts'
      - '.github/workflows/everything-hub-free-supabase-route.yml'
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: everything-hub-live-acceptance
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LEGACY_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-site/
      BRIDGE_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-deploy-bridge
      SEARCH_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-web-search?q=NASA&limit=5
      CATALOG_SEARCH_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-catalog-search?q=NASA&limit=5
      SEARCH_JS_URL: https://cdn.statically.io/gh/rshure001/EverythingHub-Crawler@main/site/search.js
      MANIFEST_URL: https://raw.githubusercontent.com/rshure001/EverythingHub-Crawler/main/public-search/manifest.json
    steps:
      - uses: actions/checkout@v4
      - name: Verify the legacy address redirects to the active bridge
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 30 -D /tmp/redirect.headers -o /dev/null -w '%{http_code}' "$LEGACY_URL")"
          test "$code" = "302"
          grep -Eiq '^location: https://vdceayvfgkwpgwixrhwi\.supabase\.co/functions/v1/everything-hub-deploy-bridge' /tmp/redirect.headers
      - name: Verify the bridge serves the complete homepage
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --max-time 45 -D /tmp/home.headers -o /tmp/home.html -w '%{http_code}' "$BRIDGE_URL")"
          bytes="$(wc -c < /tmp/home.html)"
          content_type="$(grep -i '^content-type:' /tmp/home.headers | tail -1 || true)"
          echo "Bridge HTTP=$code bytes=$bytes $content_type"
          head -c 240 /tmp/home.html | tr '\\n' ' '
          echo
          test "$code" = "200"
          grep -Eiq '^content-type: *text/html' /tmp/home.headers
          grep -Eiq '^<!doctype html|^<!--' /tmp/home.html
          for needle in 'Everything Hub' 'id="search"' 'id="q"' 'EverythingHubSearch' "['web','All']" "['images','Images']" "['videos','Videos']" "['news','News']" "['shopping','Shopping']" "['places','Maps']" "['business','Business']" "['research','Research']"; do
            grep -Fqi "$needle" /tmp/home.html || { echo "Missing homepage feature: $needle"; exit 1; }
          done
          test "$bytes" -gt 10000
      - name: Verify the public search script matches the repository
        run: |
          set -euo pipefail
          curl --silent --show-error --location --fail --max-time 40 -H "Accept: application/vnd.github.raw" -H "X-GitHub-Api-Version: 2022-11-28" -D /tmp/search.headers "$SEARCH_JS_URL" -o /tmp/search.js
          cmp -s site/search.js /tmp/search.js
          grep -Eiq '^content-type: *application/javascript|^content-type: *text/javascript' /tmp/search.headers
      - name: Verify the public crawler manifest and shard inventory
        run: |
          set -euo pipefail
          curl --silent --show-error --location --fail --max-time 40 "$MANIFEST_URL" -o /tmp/manifest.json
          node -e "const m=require('/tmp/manifest.json'); if(!Array.isArray(m.shards)||!m.shards.length) process.exit(1); console.log(JSON.stringify({shards:m.shards.length,totalPages:m.total_pages??m.totalPages??m.pageCount??null}))"
      - name: Verify live search endpoint returns valid results payload
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --max-time 50 -o /tmp/search.json -w '%{http_code}' "$SEARCH_URL")"
          echo "Live search HTTP=$code bytes=$(wc -c < /tmp/search.json)"
          echo "Required source: Everything Hub public crawler index"
          head -c 1800 /tmp/search.json || true
          echo
          test "$code" = "200"
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/search.json','utf8')); if(!Array.isArray(x.results) || x.results.length < 1 || !/Everything Hub public crawler index|Bing RSS independent web fallback/i.test(String(x.source || ''))) { console.error(x); process.exit(1); } console.log(JSON.stringify({query:x.query??'NASA',results:x.results.length,count:x.count??null,source:x.source??null,error:x.error??null}))"

      - name: Verify live first-party catalog search endpoint
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --max-time 50 -o /tmp/catalog-search.json -w '%{http_code}' "$CATALOG_SEARCH_URL")"
          echo "Catalog search HTTP=$code bytes=$(wc -c < /tmp/catalog-search.json)"
          test "$code" = "200"
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/catalog-search.json','utf8')); const p=x.catalogPreview||{}; if(!Array.isArray(x.catalogResults)||x.catalogResults.length<1||p.previewOnly!==true||!['candidate-preview','stale-candidate-preview'].includes(p.status)) { console.error(x); process.exit(1); } console.log(JSON.stringify({query:x.query,results:x.catalogResults.length,status:p.status,catalogs:p.catalogCount,records:p.recordCount}))"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser acceptance
        env:
          LEGACY_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-site/
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const errors = [];
            const report = { desktop: {}, mobile: {}, browserErrors: errors };
            try {
              const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
              page.on('pageerror', error => errors.push(String(error)));
              await page.goto(process.env.LEGACY_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForSelector('#q', { timeout: 30000 });
              assert.match(await page.title(), /Everything Hub/i);
              assert.ok(await page.locator('img[alt*="octopus" i]').count(), 'approved octopus artwork is missing');
              const modes = ['web','news','images','videos','shopping','places','business','research'];
              for (const mode of modes) {
                const button = page.locator('.eh-mode[data-mode="' + mode + '"]');
                assert.equal(await button.count(), 1, 'missing search category: ' + mode);
                await button.click();
                await page.waitForFunction(value => document.querySelector('.eh-mode.active')?.dataset.mode === value, mode);
              }
              report.desktop.categories = modes;

              async function search(mode, query) {
                await page.locator('.eh-mode[data-mode="' + mode + '"]').click();
                await page.locator('#q').fill(query);
                await page.locator('#search button[type="submit"]').click();
                await page.waitForFunction(() => {
                  const root = document.querySelector('#results');
                  return !!root && (root.querySelectorAll('.result').length > 0 || /No .* results found|temporarily unavailable/i.test(root.innerText));
                }, null, { timeout: 40000 });
                const count = await page.locator('#results .result').count();
                const titles = (await page.locator('#results .result a').allTextContents()).slice(0, 5);
                assert.ok(count > 0, mode + ' search returned no visible results for ' + query);
                return { mode, query, count, titles };
              }

              report.desktop.webSearches = [];
              for (const query of ['Rolex','Las Vegas','NASA']) {
                report.desktop.webSearches.push(await search('web', query));
              }
              report.desktop.news = await search('news', 'NASA');
              await search('images', 'NASA');
              const imageCount = await page.locator('#results .result img').count();
              assert.ok(imageCount > 0, 'Images search returned no visible thumbnails');
              report.desktop.imageThumbnails = imageCount;
              await search('videos', 'NASA');
              const videoCount = await page.locator('#results .result .media-tag, #results .result video, #results .result .play').count();
              assert.ok(videoCount > 0, 'Videos search returned no visible video cards');
              report.desktop.videoCards = videoCount;

              await page.waitForFunction(() => document.querySelectorAll('#discoverCards .discover-card').length > 0, null, { timeout: 35000 });
              report.desktop.topStories = await page.locator('#discoverCards .discover-card').count();
              for (const topic of ['technology','sports','entertainment','business']) {
                await page.locator('.discover-topic[data-topic="' + topic + '"]').click();
                await page.waitForFunction(value => document.querySelector('.discover-topic.active')?.dataset.topic === value && document.querySelectorAll('#discoverCards .discover-card').length > 0, topic, { timeout: 30000 });
              }
              await page.locator('#discoverRefresh').click();
              await page.waitForFunction(() => document.querySelectorAll('#discoverCards .discover-card').length > 0, null, { timeout: 30000 });
              report.desktop.topicTabsAndRefresh = 'passed';
              await page.screenshot({ path: 'artifacts/everythinghub-desktop.png', fullPage: true });

              const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
              mobile.on('pageerror', error => errors.push('mobile: ' + String(error)));
              await mobile.goto(process.env.LEGACY_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await mobile.waitForSelector('#q', { timeout: 30000 });
              const layout = await mobile.evaluate(() => {
                const input = document.querySelector('#q').getBoundingClientRect();
                const button = document.querySelector('#search button').getBoundingClientRect();
                return {
                  viewport: innerWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  input: { left: input.left, right: input.right, top: input.top, bottom: input.bottom },
                  button: { left: button.left, right: button.right, top: button.top, bottom: button.bottom },
                };
              });
              assert.ok(layout.documentWidth <= layout.viewport + 2, 'mobile page has horizontal overflow: ' + JSON.stringify(layout));
              assert.ok(layout.input.left >= 0 && layout.input.right <= layout.viewport, 'mobile search input is clipped');
              assert.ok(layout.button.left >= 0 && layout.button.right <= layout.viewport, 'mobile search button is clipped');
              assert.ok(layout.input.bottom <= layout.button.top || layout.button.bottom <= layout.input.top || layout.input.right <= layout.button.left || layout.button.right <= layout.input.left, 'mobile search controls overlap');
              report.mobile.layout = layout;
              await mobile.screenshot({ path: 'artifacts/everythinghub-mobile.png', fullPage: true });
              assert.equal(errors.length, 0, 'browser JavaScript errors: ' + errors.join(' | '));
              require('node:fs').writeFileSync('artifacts/acceptance-report.json', JSON.stringify(report, null, 2));
              console.log(JSON.stringify(report, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everythinghub-browser-acceptance
          path: artifacts/
          if-no-files-found: warn
