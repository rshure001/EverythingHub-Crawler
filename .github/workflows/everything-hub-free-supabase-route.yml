name: Everything Hub free Supabase Storage and catalog API diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/storage/v1/object/public/everythinghub-public-site/index.html
      SEARCH_JS_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/storage/v1/object/public/everythinghub-public-site/search.js
      SEARCH_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-web-search
      API_KEY: sb_publishable_XlIsACWhtVS1jVODWYGTpg_GMs8v3vJ
    steps:
      - uses: actions/checkout@v4
      - name: Verify public Storage homepage and MIME type
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --max-time 30 -D /tmp/home.headers -o /tmp/home.html -w '%{http_code}' "$SITE_URL")"
          test "$code" = "200"
          grep -Eiq '^content-type: *text/html' /tmp/home.headers
          for needle in 'class="approved-master-art"' 'data:image/png;base64,' 'id="search"' 'id="q"' 'src="search.js"' 'data-mode="web"' 'data-mode="news"' 'data-mode="images"' 'data-mode="videos"' 'data-mode="shopping"' 'data-mode="places"' 'data-mode="business"' 'data-mode="research"'; do
            grep -Fqi "$needle" /tmp/home.html || { echo "Missing homepage feature: $needle"; exit 1; }
          done
      - name: Verify the public search client is served as JavaScript
        run: |
          set -euo pipefail
          curl --silent --show-error --location --fail --max-time 30 -D /tmp/search.headers "$SEARCH_JS_URL" -o /tmp/search.js
          cmp -s site/search.js /tmp/search.js
          grep -Eiq '^content-type: *application/javascript' /tmp/search.headers
      - name: Verify catalog preview API contract
        run: |
          set -euo pipefail
          for query in Rolex "Las Vegas" NASA; do
            safe="$(printf '%s' "$query" | tr '[:upper:] ' '[:lower:]_')"
            code="$(curl --silent --show-error --location --max-time 35 -G "$SEARCH_URL" -H "apikey: $API_KEY" -H "accept: application/json" --data-urlencode "q=$query" --data-urlencode "limit=10" --data-urlencode "offset=0" -o "/tmp/search-$safe.json" -w '%{http_code}')"
            test "$code" = "200"
            QUERY="$query" FILE="/tmp/search-$safe.json" node <<'NODE'
          const fs=require("node:fs"),q=process.env.QUERY,data=JSON.parse(fs.readFileSync(process.env.FILE,"utf8"));
          if(!Array.isArray(data.results)||!Array.isArray(data.catalogResults))throw new Error(q+": catalog API response contract missing arrays");
          console.log(JSON.stringify({query:q,webResults:data.results.length,catalogResults:data.catalogResults.length},null,2));
          NODE
          done
      - name: Verify the browser search client accepts the current manifest
        run: cd public-search && node test-search.js
