name: Everything Hub live publishing and search verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'public-search/**'
      - 'supabase/functions/everything-hub-deploy-bridge/**'
      - 'supabase/functions/everything-hub-web-search/**'
      - '.github/workflows/everything-hub-free-supabase-route.yml'
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: everything-hub-live-acceptance
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LEGACY_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-site/
      BRIDGE_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-deploy-bridge
      SEARCH_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-web-search?q=NASA&limit=5
      SEARCH_JS_URL: https://cdn.jsdelivr.net/gh/rshure001/EverythingHub-Crawler@main/site/search.js
      MANIFEST_URL: https://raw.githubusercontent.com/rshure001/EverythingHub-Crawler/main/public-search/manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            site/index.html
            site/search.js
            public-search/manifest.json
          sparse-checkout-cone-mode: false
      - name: Verify the legacy address redirects to the active bridge
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 30 -D /tmp/redirect.headers -o /dev/null -w '%{http_code}' "$LEGACY_URL")"
          test "$code" = "302"
          grep -Eiq '^location: https://vdceayvfgkwpgwixrhwi\.supabase\.co/functions/v1/everything-hub-deploy-bridge' /tmp/redirect.headers
      - name: Verify the bridge serves the complete homepage
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --max-time 45 -D /tmp/home.headers -o /tmp/home.html -w '%{http_code}' "$BRIDGE_URL")"
          bytes="$(wc -c < /tmp/home.html)"
          content_type="$(grep -i '^content-type:' /tmp/home.headers | tail -1 || true)"
          echo "Bridge HTTP=$code bytes=$bytes $content_type"
          head -c 240 /tmp/home.html | tr '\\n' ' '
          echo
          test "$code" = "200"
          # Supabase's edge gateway may label streamed HTML as text/plain; validate
          # the document signature and actual interface markup instead of MIME metadata.
          grep -Eiq '^<!doctype html|^<!--' /tmp/home.html
          for needle in 'Everything Hub' 'id="search"' 'id="q"' 'src="search.js"' "['web','All']" "['images','Images']" "['videos','Videos']" "['news','News']" "['shopping','Shopping']" "['places','Maps']" "['business','Business']" "['research','Research']"; do
            grep -Fqi "$needle" /tmp/home.html || { echo "Missing homepage feature: $needle"; exit 1; }
          done
          python - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          def artwork_hash(path: str) -> str:
              html = Path(path).read_text(encoding="utf-8")
              match = re.search(r"data:image/png;base64,([A-Za-z0-9+/=\\r\\n]+)", html)
              if not match:
                  raise SystemExit(f"Approved embedded PNG artwork missing from {path}")
              payload = "".join(match.group(1).split()).encode("ascii")
              return hashlib.sha256(payload).hexdigest()

          expected = artwork_hash("site/index.html")
          actual = artwork_hash("/tmp/home.html")
          if expected != actual:
              raise SystemExit("Live homepage artwork does not match the approved repository artwork")
          print("Approved artwork SHA-256:", expected)
          PY
          test "$bytes" -gt 10000
      - name: Verify the public search script matches the repository
        run: |
          set -euo pipefail
          curl --silent --show-error --location --fail --max-time 40 -D /tmp/search.headers "$SEARCH_JS_URL" -o /tmp/search.js
          cmp -s site/search.js /tmp/search.js
          grep -Eiq '^content-type: *application/javascript|^content-type: *text/javascript' /tmp/search.headers
      - name: Verify the public crawler manifest and shard inventory
        run: |
          set -euo pipefail
          curl --silent --show-error --location --fail --max-time 40 "$MANIFEST_URL" -o /tmp/manifest.json
          cmp -s public-search/manifest.json /tmp/manifest.json || { echo "Live crawler manifest differs from the repository"; exit 1; }
          node -e "const m=require('/tmp/manifest.json'); if(!Array.isArray(m.shards)||!m.shards.length) process.exit(1); console.log(JSON.stringify({shards:m.shards.length,totalPages:m.total_pages??m.totalPages??m.pageCount??null}))"
      - name: Verify live search endpoint returns valid results payload
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --max-time 50 -o /tmp/search.json -w '%{http_code}' "$SEARCH_URL")"
          echo "Live search HTTP=$code bytes=$(wc -c < /tmp/search.json)"
          head -c 1800 /tmp/search.json || true
          echo
          test "$code" = "200"
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/search.json','utf8')); if(!Array.isArray(x.results)) { console.error(x); process.exit(1); } console.log(JSON.stringify({query:x.query??'NASA',results:x.results.length,count:x.count??null,source:x.source??null,error:x.error??null}))"
