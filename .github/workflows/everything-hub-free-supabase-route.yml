name: Everything Hub free Supabase route check
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/everything-hub-free-supabase-route.yml"
      - "site/index.html"
      - "data/page-derived-catalogs/**"
      - "supabase/functions/everything-hub-web-search/**"
      - "supabase/functions/everything-hub-independent-search/**"
      - "supabase/functions/everything-hub-site/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: everythinghub-free-supabase-route
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-site/
      SEARCH_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-web-search
      API_KEY: sb_publishable_XlIsACWhtVS1jVODWYGTpg_GMs8v3vJ
    steps:
      - uses: actions/checkout@v4
      - name: Verify free-hosted homepage
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --max-time 30 -o /tmp/home.html -w '%{http_code}' "$SITE_URL")"
          test "$code" = "200"
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("/tmp/home.html", "utf8");
          const required = [
            "<title>Everything Hub — Everything within reach</title>",
            "https://everythinghub-search-engine-4x25f8.v2.appdeploy.ai/resources/everythinghub-approved-octopus.png",
            'id="searchForm"',
            'id="q"',
            "View related items",
            'SEARCH_API=BASE+"/everything-hub-web-search"',
            'data-mode="web"',
            'data-mode="news"',
            'data-mode="images"',
            'data-mode="videos"',
            'data-mode="shopping"',
            'data-mode="places"',
            'data-mode="business"',
            'data-mode="research"'
          ];
          const missing = required.filter(value => !html.includes(value));
          if (html.includes("ynleeweezwkdbisaiovq") || html.includes("sb_publishable_-m5pJUkN9aKUox3NMexhQg_NvWhm520")) missing.push("Story Wall project reference");
          if (!html.includes("vdceayvfgkwpgwixrhwi")) missing.push("Everything Hub control project endpoint");
          if (missing.length) throw new Error("Homepage contract missing: " + missing.join(", "));
          console.log(JSON.stringify({
            status: "homepage_http_200",
            title: "Everything Hub — Everything within reach",
            approvedArtworkReferenced: true,
            searchInput: true,
            categories: 8,
            searchEndpoint: "Supabase Edge Function"
          }, null, 2));
          NODE
      - name: Verify representative live searches through the free Edge Function
        run: |
          set -euo pipefail
          for query in Rolex "Las Vegas" NASA; do
            safe="$(printf '%s' "$query" | tr '[:upper:] ' '[:lower:]_')"
            code="$(curl --silent --show-error --location --max-time 35 -G "$SEARCH_URL" \
              -H "apikey: $API_KEY" \
              -H "accept: application/json" \
              --data-urlencode "q=$query" \
              --data-urlencode "limit=10" \
              -o "/tmp/search-$safe.json" -w '%{http_code}')"
            test "$code" = "200"
            QUERY="$query" FILE="/tmp/search-$safe.json" node <<'NODE'
          const fs = require("node:fs");
          const query = process.env.QUERY;
          const data = JSON.parse(fs.readFileSync(process.env.FILE, "utf8"));
          const results = Array.isArray(data.results) ? data.results : [];
          const catalogs = Array.isArray(data.catalogResults) ? data.catalogResults : [];
          if (!results.length && !catalogs.length) {
            throw new Error(query + ": HTTP 200 but no visible web or catalog results: " + JSON.stringify({
              error: data.error || null, source: data.source || null, fallbackReason: data.fallbackReason || null
            }));
          }
          const haystack = JSON.stringify([...results, ...catalogs]).toLowerCase();
          const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
          if (!terms.every(term => haystack.includes(term))) throw new Error(query + ": results do not visibly match query terms");
          console.log(JSON.stringify({
            status: "search_http_200", query, visibleWebResults: results.length,
            visibleCatalogResults: catalogs.length, source: data.source || null,
            provider: data.provider || null, independentOfDatabase: data.independentOfDatabase === true,
            firstResult: results[0]?.title || catalogs[0]?.title || null
          }, null, 2));
          NODE
          done
      - name: Verify per-record related catalog lookup when indexed identities are available
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync("/tmp/search-las_vegas.json", "utf8"));
          const catalogs = Array.isArray(data.catalogResults) ? data.catalogResults : [];
          const records = catalogs.flatMap(item => Array.isArray(item.matched_records) ? item.matched_records : []);
          const record = records.find(item =>
            typeof item.record_catalog_id === "string" &&
            item.record_catalog_id.length > 0 &&
            Array.isArray(item.shared_catalog_ids) &&
            item.shared_catalog_ids.length > 0
          );
          if (!record) {
            console.log(JSON.stringify({
              status: "awaiting_next_catalog_snapshot",
              note: "The free search route is live; the current published catalog has not yet exposed per-record catalog identities."
            }, null, 2));
            process.exit(0);
          }
          fs.writeFileSync("/tmp/record-catalog-request.json", JSON.stringify({
            record_catalog_id: record.record_catalog_id,
            catalog_ids: record.shared_catalog_ids.slice(0, 12)
          }));
          NODE
          if test -f /tmp/record-catalog-request.json; then
            record_id="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("/tmp/record-catalog-request.json","utf8")).record_catalog_id)')"
            catalog_ids="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("/tmp/record-catalog-request.json","utf8")).catalog_ids.join(","))')"
            code="$(curl --silent --show-error --location --max-time 35 -G "$SEARCH_URL" \
              -H "apikey: $API_KEY" \
              -H "accept: application/json" \
              --data-urlencode "record_catalog_id=$record_id" \
              --data-urlencode "catalog_ids=$catalog_ids" \
              --data-urlencode "limit=5" \
              --data-urlencode "offset=0" \
              -o /tmp/record-catalog.json -w '%{http_code}')"
            test "$code" = "200"
            node <<'NODE'
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("/tmp/record-catalog.json", "utf8"));
            const requested = JSON.parse(fs.readFileSync("/tmp/record-catalog-request.json", "utf8"));
            if (
              data.status !== "candidate-preview" ||
              data.preview_only !== true ||
              data.record_catalog_id !== requested.record_catalog_id ||
              data.owner_record?.record_catalog_id !== requested.record_catalog_id ||
              !Array.isArray(data.related_records) ||
              data.related_records.some(record => record.commercial_eligible !== false)
            ) {
              throw new Error("Per-record related catalog response failed validation: " + JSON.stringify(data));
            }
            console.log(JSON.stringify({
              status: "record_catalog_http_200",
              recordCatalogId: data.record_catalog_id,
              relatedRecords: data.related_count,
              pageSize: data.related_records.length,
              hasMore: data.has_more,
              rightsRestricted: true
            }, null, 2));
          NODE
          fi
