name: Probe public catalog interfaces

on:
  push:
    paths:
      - "crawler/catalog_host_probe.py"
      - "crawler/catalog_source_policy.py"
      - "crawler/catalog-source-terms.json"
      - "crawler/test_catalog_source_policy.py"
      - "crawler/test_catalog_host_probe.py"
      - "data/host-catalog-candidates.json"
      - ".github/workflows/catalog-host-probe.yml"
  workflow_dispatch:
    inputs:
      offset:
        description: "Starting host offset (0-based)"
        required: false
        default: "0"
  schedule:
    - cron: "11,31,51 * * * *"

permissions:
  contents: write

concurrency:
  group: public-catalog-host-probes
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test catalog source policy and robots gate
        working-directory: crawler
        run: python -m unittest test_catalog_source_policy.py -v
      - name: Test cumulative host probe inventory
        working-directory: crawler
        run: python -m unittest test_catalog_host_probe.py -v
      - name: Probe a bounded host batch
        if: github.ref == 'refs/heads/main'
        id: batch
        env:
          INPUT_OFFSET: ${{ github.event.inputs.offset }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$INPUT_OFFSET" ]; then
            OFFSET="$INPUT_OFFSET"
          else
            OFFSET="$(( ((RUN_NUMBER - 1) % 4) * 30 ))"
          fi
          echo "offset=$OFFSET" >> "$GITHUB_OUTPUT"
          python crawler/catalog_host_probe.py --limit 30 --offset "$OFFSET" --pause 0.2
      - name: Publish probe evidence
        if: github.ref == 'refs/heads/main'
        env:
          PROBE_OFFSET: ${{ steps.batch.outputs.offset }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add -f data/host-catalog-probes.json
            if git diff --cached --quiet; then
              echo "No probe evidence changes."
              exit 0
            fi
            git commit -m "Record public catalog interface probe evidence"
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            # Rebase conflicts or a non-fast-forward push require rebuilding
            # the cumulative manifest on top of the latest committed version.
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python crawler/catalog_host_probe.py --limit 30 --offset "$PROBE_OFFSET" --pause 0.2
            echo "Retrying probe evidence publish ($attempt/3)."
            sleep "$((attempt * 2))"
          done
          echo "Unable to publish probe evidence after three safe retries."
          exit 1
