name: Deploy free static Everything Hub fallback

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out only the published site files
        uses: actions/checkout@v4
        with:
          sparse-checkout: site
          sparse-checkout-cone-mode: true
          filter: blob:none

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish the free static fallback
        id: deployment
        uses: actions/deploy-pages@v4
