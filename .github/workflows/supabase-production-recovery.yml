name: Supabase Production Recovery
on:
  workflow_dispatch:
    inputs:
      confirm_restart:
        description: "Type RESTART to authorize a production database/project restart"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-recovery
  cancel-in-progress: false

jobs:
  restart-and-check:
    if: ${{ inputs.confirm_restart == 'RESTART' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out recovery script
        uses: actions/checkout@v4
      - name: Request restart and monitor health
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: vdceayvfgkwpgwixrhwi
          CONFIRM_RESTART: YES
        run: python3 scripts/restart_supabase_project.py
