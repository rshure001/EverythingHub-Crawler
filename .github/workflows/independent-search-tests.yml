name: Independent and static search tests

on:
  pull_request:
    branches: [main]
    paths:
      - "engine/**"
      # Crawler metadata feeds both the offline engine and static catalog freshness tests.
      - "crawler/**"
      - "public-search/**"
      - "supabase/functions/everything-hub-web-search/**"
      - ".github/workflows/independent-search-tests.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "crawler/**"
      - "public-search/**"
      - "supabase/functions/everything-hub-web-search/static-search.mjs"
      - "supabase/functions/everything-hub-web-search/static-search.test.mjs"
      - "supabase/functions/everything-hub-web-search/static-search-catalog-smoke.mjs"
      - "supabase/functions/everything-hub-web-search/page-derived-catalog-preview.mjs"
      - "supabase/functions/everything-hub-web-search/page-derived-catalog-preview.test.mjs"
      - ".github/workflows/independent-search-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: independent-search-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-catalog-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run independent search and intelligence unit tests
        working-directory: engine
        run: python -m unittest -v test_search_core test_catalog_search test_intelligence_core test_media_intelligence test_extraction_pipeline

      - name: Validate public catalog timestamp compaction
        working-directory: crawler
        run: python -m unittest -v test_build_search_shards

      - name: Search the committed public catalog with the Python core
        working-directory: engine
        run: |
          python catalog_search.py "NASA" --limit 5
          python catalog_search.py "Las Vegas" --limit 5
          python catalog_search.py "Rolex" --limit 5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test browser search client
        working-directory: public-search
        run: node test-search.js

      - name: Test static fallback search ranking
        run: node --test supabase/functions/everything-hub-web-search/static-search.test.mjs
      - name: Test query-scoped catalog preview search
        run: node --test supabase/functions/everything-hub-web-search/page-derived-catalog-preview.test.mjs

      - name: Search and verify the committed public catalog with production ranking
        run: node supabase/functions/everything-hub-web-search/static-search-catalog-smoke.mjs

      - name: Search the public catalog through the bounded query index
        run: node supabase/functions/everything-hub-web-search/static-query-index-smoke.mjs
