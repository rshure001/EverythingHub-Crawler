name: Retroactive catalog inventory

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/retroactive-catalog-index.yml"
      - "crawler/catalog_retro_discovery.py"
      - "crawler/catalog_page_analysis.py"
      - "crawler/test_catalog_page_analysis.py"
      - "crawler/test_post_crawl_dispatch.py"
      - "crawler/test_publish_catalog_snapshot.py"
      - "crawler/publish_catalog_snapshot.py"
      - "crawler/automation-trigger.json"
      - "crawler/catalog_host_review_queue.py"
      - "crawler/catalog_source_policy.py"
      - "crawler/catalog-source-terms.json"
      - "crawler/product_metadata.py"
      - "data/source-policy-reviews.json"
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: catalog-data-publish-v9-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Use the current main corpus for branch previews
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git checkout origin/main -- data/index.json data/index-shards public-search
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          manifest = json.loads(Path("data/index.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "source_index_pages": manifest.get("total_pages"),
              "source_index_updated_at": datetime.fromtimestamp(
                  manifest.get("updated_at", 0), timezone.utc
              ).isoformat(),
          }, sort_keys=True))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore reusable per-host catalog analysis cache
        uses: actions/cache@v4
        with:
          path: |
            data/.page-derived-catalog-cache
            data/page-derived-catalogs/report.json
            data/page-derived-catalogs/indexes
            data/page-derived-catalogs/.catalog-index-progress.json
          key: ${{ runner.os }}-catalog-cache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-catalog-cache-${{ github.ref_name }}-
            ${{ runner.os }}-catalog-cache-main-
      - name: Test retroactive discovery
        working-directory: crawler
        run: python -m unittest test_catalog_retro_discovery.py -v
      - name: Test conservative product metadata extraction
        working-directory: crawler
        run: python -m unittest test_product_metadata.py -v
      - name: Test page-derived catalog analysis
        working-directory: crawler
        run: python -m unittest test_catalog_page_analysis.py -v
      - name: Test fail-closed catalog source review backlog
        working-directory: crawler
        run: python -m unittest test_catalog_host_review_queue.py -v
      - name: Test fail-closed catalog source policy
        working-directory: crawler
        run: python -m unittest test_catalog_source_policy.py -v

      - name: Test public search publisher limits
        working-directory: publisher
        run: python -m unittest test_stage_search_catalog.py -v
      - name: Inventory every existing indexed host
        run: python crawler/catalog_retro_discovery.py
      - name: Prepare per-host catalog cache before aggregation
        timeout-minutes: 110
        env:
          PYTHONUNBUFFERED: "1"
        run: python crawler/catalog_page_analysis.py --index public-search/manifest.json --query Rolex --query "Las Vegas" --query NASA --cache-dir data/.page-derived-catalog-cache --cache-only --workers 4
      - name: Persist host cache before catalog aggregation
        uses: actions/cache/save@v4
        with:
          path: data/.page-derived-catalog-cache
          key: ${{ runner.os }}-catalog-cache-${{ github.ref_name }}-hosts-${{ github.run_id }}
      - name: Analyze every eligible existing indexed page
        # Run 45405300540 reached 23,808/24,154 validation files before the 165-minute step limit shut down the hosted runner.
        # Keep the run bounded while allowing enough time to finish the full snapshot and its post-analysis gates.
        timeout-minutes: 225
        env:
          PYTHONUNBUFFERED: "1"
        run: python crawler/catalog_page_analysis.py --index public-search/manifest.json --query Rolex --query "Las Vegas" --query NASA --cache-dir data/.page-derived-catalog-cache --workers 4 --skip-output-validation
      - name: Save resumable per-host catalog cache checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/.page-derived-catalog-cache
            data/page-derived-catalogs/indexes
            data/page-derived-catalogs/.catalog-index-progress.json
          key: ${{ runner.os }}-catalog-cache-${{ github.ref_name }}-checkpoint-${{ github.run_id }}
      - name: Record persisted catalog and record throughput
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/page-derived-catalogs/report.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "source_index_pages": report["source_index_pages"],
              "pages_analyzed": report["metrics"]["pages_analyzed"],
              "eligible_pages": report["metrics"]["eligible_pages"],
              "unique_catalogs_discovered": report["metrics"]["unique_catalogs_discovered"],
              "unique_catalogs_by_type": report["metrics"]["unique_catalogs_by_type"],
              "source_declared_catalogs": report["metrics"]["source_declared_catalogs"],
              "content_list_catalogs": report["metrics"]["content_list_catalogs"],
              "derived_catalogs": report["metrics"]["derived_catalogs"],
              "catalog_page_associations": report["metrics"]["catalog_page_associations"],
              "catalog_candidate_occurrences": report["metrics"]["catalog_candidate_occurrences"],
              "duplicate_catalog_candidates": report["metrics"]["duplicate_catalog_candidates"],
              "subcatalogs_discovered": report["metrics"]["subcatalogs_discovered"],
              "unique_entities": report["metrics"]["unique_entities"],
              "cross_host_record_merges": report["metrics"]["cross_host_record_merges"],
              "unique_records_by_type": report["metrics"]["unique_records_by_type"],
              "structured_product_pages": report["metrics"]["structured_product_pages"],
              "structured_product_records": report["metrics"]["structured_product_records"],
              "structured_brand_records": report["metrics"]["structured_brand_records"],
              "records_staged": report["metrics"]["records_staged"],
              "records_published": report["metrics"]["records_published"],
              "media_references": report["metrics"]["media_references"],
              "unique_media_urls": report["metrics"]["unique_media_urls"],
              "coverage_percentage": report["metrics"]["coverage_percentage"],
              "unique_source_coverage_percentage": report["metrics"]["unique_source_coverage_percentage"],
              "eligible_page_coverage_percentage": report["metrics"]["eligible_page_coverage_percentage"],
              "eligible_unique_source_page_coverage_percentage": report["metrics"]["eligible_unique_source_page_coverage_percentage"],
              "previous_counts": report.get("previous_counts"),
              "count_deltas": report.get("count_deltas"),
              "elapsed_wall_clock_seconds": report.get("elapsed_wall_clock_seconds"),
              "throughput": report.get("throughput"),
          }, indent=2))
          PY
      - name: Build page-derived catalog source review backlog
        run: python crawler/catalog_host_review_queue.py
      - name: Publish candidate catalog snapshot immediately on latest main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Publish only explicitly unverified candidate data. Full semantic and
          # per-index validation runs below and controls search smoke testing.
          python crawler/publish_catalog_snapshot.py --attempts 4
      - name: Validate registry and every per-catalog index after candidate publication
        run: python crawler/catalog_page_analysis.py --validate-only
      - name: Validate page-derived catalog source review backlog
        run: python crawler/catalog_host_review_queue.py --validate-only
      - name: Run catalog search smoke test after successful validation
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh workflow run search-api-smoke.yml --ref main; then
            echo "Dispatched first-party catalog search smoke test after candidate validation."
          else
            echo "::warning::Candidate snapshot and validation succeeded, but first-party search smoke dispatch failed."
          fi
      - name: Upload catalog analysis preview from non-main branches
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: page-derived-catalog-analysis-preview
          path: data/page-derived-catalogs/
          if-no-files-found: error

