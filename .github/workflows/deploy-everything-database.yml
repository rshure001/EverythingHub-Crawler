name: Deploy Everything Database
on:
  workflow_dispatch:
  push:
    branches: [build/everything-database-provider]
    paths:
      - "everything-database/**"
      - ".github/workflows/deploy-everything-database.yml"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check existing Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || (echo "Missing repository secret CF_API_TOKEN"; exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo "Missing repository secret CF_ACCOUNT_ID"; exit 1)
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Create or reuse D1 database and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ADMIN_KEY: ${{ secrets.EVERYTHING_DB_ADMIN_KEY }}
        working-directory: everything-database
        run: |
          test -n "$ADMIN_KEY" || (echo "Missing repository secret EVERYTHING_DB_ADMIN_KEY"; exit 1)
          RESULT=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=everything-database")
          DB_ID=$(echo "$RESULT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const x=(j.result||[]).find(v=>v.name==="everything-database");if(!j.success||!x)process.exit(2);console.log(x.uuid)})')
          sed -i "s/\${D1_DATABASE_ID}/$DB_ID/" wrangler.toml
          echo "$ADMIN_KEY" | wrangler secret put ADMIN_KEY
          wrangler d1 migrations apply everything-database --remote
          wrangler deploy
