name: EverythingHub Free Publisher (Cloudflare Pages)
on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type PUBLISH to deploy the validated site to the Cloudflare Pages production branch"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: everythinghub-cloudflare-production
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: ${{ inputs.confirm_production == 'PUBLISH' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild and validate the public search catalog
        run: |
          python crawler/build_search_shards.py
          python crawler/validate_public_index.py
          python crawler/validate_media_catalog.py
      - name: Validate immutable homepage release manifest
        run: python publisher/publish.py --check
      - name: Stage validated search catalog
        run: python publisher/stage_search_catalog.py --source public-search --target site/search-index
      - name: Write crawler release health
        run: python publisher/release_health.py --manifest public-search/manifest.json --output site/search-index/health.json --media-catalog data/media-discovery.json
      - name: Create Cloudflare Pages project if needed
        id: project
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create everythinghub --production-branch main
      - name: Publish validated site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name everythinghub --branch main
      - name: Verify deployed homepage and discovery files
        run: |
          python - <<'PY'
          import urllib.request
          base = "https://everythinghub.pages.dev/"
          for path in ("", "robots.txt", "sitemap.xml"):
              req = urllib.request.Request(base + path, headers={"User-Agent": "EverythingHub-Publisher/1.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  if response.status != 200 or not body:
                      raise SystemExit(f"Verification failed for {path or 'homepage'}")
                  print(f"PASS {path or 'homepage'} HTTP {response.status} ({len(body)} bytes)")
          PY
      - name: Publish result summary
        if: always()
        run: |
          {
            echo "## EverythingHub Cloudflare Pages"
            echo "- Static deployment target: https://everythinghub.pages.dev/"
            echo "- Production custom domain: https://everythinghub.org/ (not changed by this workflow)"
            echo "- Static Pages assets use Cloudflare's free static-asset delivery; Functions or other backend services may have separate quotas."
          } >> "$GITHUB_STEP_SUMMARY"
