name: Everything Hub — owned browser lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/everythinghub-owned-browser.yml"

permissions:
  contents: read

concurrency:
  group: everythinghub-owned-browser
  cancel-in-progress: true

jobs:
  browser-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_URL: https://everythinghub-homepage-fixed-b3yidvvw9-rshure001-8053.vercel.app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install our browser engine
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run desktop and iPhone-sized visual inspection
        run: |
          cat > owned-browser-check.cjs <<'JS'
          const { chromium } = require("playwright");
          const fs = require("fs");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = {
              target: process.env.TARGET_URL,
              checkedAt: new Date().toISOString(),
              viewports: {},
              consoleErrors: [],
              pageErrors: [],
              failedRequests: []
            };
            const page = await browser.newPage({ deviceScaleFactor: 1 });
            page.on("console", m => { if (m.type() === "error") report.consoleErrors.push(m.text()); });
            page.on("pageerror", e => report.pageErrors.push(e.message));
            page.on("requestfailed", r => report.failedRequests.push({url:r.url(), error:r.failure()?.errorText}));
            try {
              const response = await page.goto(report.target, {waitUntil:"networkidle", timeout:60000});
              report.httpStatus = response?.status();
              report.title = await page.title();
              if (!response?.ok()) throw new Error("Homepage HTTP status " + report.httpStatus);
              if (!report.title.toLowerCase().includes("everything hub")) throw new Error("Unexpected page title: " + report.title);

              for (const [name, width, height] of [["desktop",1440,1000],["iphone",390,844],["iphone-small",375,667]]) {
                await page.setViewportSize({width,height});
                await page.reload({waitUntil:"networkidle", timeout:60000});
                const state = await page.evaluate(() => {
                  const art = document.querySelector(".approved-master-art, .hero img, .hero-art-wrap img");
                  const form = document.querySelector("#search, .hero-live-search, form");
                  const input = document.querySelector("#q, input[type=search], input[name=q]");
                  const rect = el => {
                    if (!el) return null;
                    const r = el.getBoundingClientRect();
                    return {x:Math.round(r.x),y:Math.round(r.y),width:Math.round(r.width),height:Math.round(r.height),right:Math.round(r.right),bottom:Math.round(r.bottom)};
                  };
                  return {
                    viewport:{width:innerWidth,height:innerHeight},
                    documentWidth:document.documentElement.scrollWidth,
                    horizontalOverflow:document.documentElement.scrollWidth > innerWidth + 2,
                    title:document.title,
                    artwork: art ? { ...rect(art),src:art.currentSrc||art.src,complete:art.complete,naturalWidth:art.naturalWidth } : null,
                    searchForm:form ? rect(form) : null,
                    searchInput:input ? rect(input) : null,
                    visibleSearchForms:[...document.querySelectorAll("form")].filter(x=>x.getClientRects().length).length,
                    visibleSearchInputs:[...document.querySelectorAll('input[type="search"],input[name="q"]')].filter(x=>x.getClientRects().length).length,
                    bodyText:document.body.innerText.slice(0,1600)
                  };
                });
                report.viewports[name] = state;
                await page.screenshot({path:"everythinghub-"+name+".png",fullPage:true});
                if (!state.artwork || state.artwork.naturalWidth < 100) throw new Error(name+": approved artwork missing or failed to load");
                if (!state.searchInput) throw new Error(name+": visible search input missing");
                if (state.horizontalOverflow) throw new Error(name+": horizontal overflow detected");
              }

              report.searchTest = {attempted:true};
              await page.setViewportSize({width:390,height:844});
              const search = page.locator("#q, input[type=search], input[name=q]").first();
              await search.fill("Rolex");
              await search.press("Enter");
              await page.waitForTimeout(8000);
              report.searchTest = await page.evaluate(() => ({
                query:document.querySelector("#q, input[type=search], input[name=q]")?.value,
                resultText:document.querySelector("#results")?.innerText?.slice(0,2000) || "",
                resultCount:document.querySelectorAll("#results .result, .result").length,
                status:document.querySelector("#status")?.innerText || ""
              }));
              await page.screenshot({path:"everythinghub-rolex-search.png",fullPage:true});
              report.passed = report.pageErrors.length===0 &&
                report.viewports.iphone.visibleSearchInputs>=1 &&
                report.viewports.iphone.horizontalOverflow===false;
            } catch(e) {
              report.passed=false;
              report.failure=e.stack||e.message;
              await page.screenshot({path:"everythinghub-failure.png",fullPage:true}).catch(()=>{});
            } finally {
              report.finishedAt=new Date().toISOString();
              fs.writeFileSync("everythinghub-browser-report.json",JSON.stringify(report,null,2));
              console.log(JSON.stringify(report,null,2));
              await browser.close();
              if (!report.passed) process.exitCode=1;
            }
          })();
          JS
          node owned-browser-check.cjs
      - name: Save our browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everythinghub-owned-browser-inspection
          path: |
            everythinghub-desktop.png
            everythinghub-iphone.png
            everythinghub-iphone-small.png
            everythinghub-rolex-search.png
            everythinghub-failure.png
            everythinghub-browser-report.json
          if-no-files-found: warn
          retention-days: 7
