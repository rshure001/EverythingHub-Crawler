name: Preserve approved EverythingHub artwork
on:
  push:
    paths:
      - ".github/workflows/preserve-everythinghub-artwork.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original artwork from recovered production HTML
        run: |
          python - <<'PY'
          import pathlib, re, urllib.request, html
          page = pathlib.Path("recovered-production/index.html").read_text()
          url = html.unescape(re.search(r'<img\s+src="([^"]+)"', page).group(1))
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=45) as response:
              data = response.read()
          if not data.startswith(b'\x89PNG\r\n\x1a\n') or len(data)<10000:
              raise SystemExit("Approved image download failed validation")
          pathlib.Path("assets").mkdir(exist_ok=True)
          pathlib.Path("assets/everythinghub-approved.png").write_bytes(data)
          print("Preserved artwork bytes:",len(data))
          PY
      - name: Commit original image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/everythinghub-approved.png
          if ! git diff --cached --quiet; then
            git commit -m "Preserve exact EverythingHub production artwork"
            git push
          fi
