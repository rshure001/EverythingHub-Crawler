name: Independent PostgreSQL 17 replacement smoke test

on:
  workflow_dispatch:
  push:
    branches: [main, feature/independent-postgres-core, fix/independent-postgres-init-and-ci]
    paths:
      - "database/**"
      - ".github/workflows/postgres-core.yml"
  pull_request:
    paths:
      - "database/**"
      - ".github/workflows/postgres-core.yml"

jobs:
  postgres-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: everythinghub_test
          POSTGRES_USER: eh_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eh_test -d everythinghub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Initialize public core and eh_quad replacement schema
        env:
          PGPASSWORD: test-only-password
        run: |
          set -euo pipefail
          psql -h localhost -U eh_test -d everythinghub_test -v ON_ERROR_STOP=1 -f database/001_everythinghub_core.sql
          psql -h localhost -U eh_test -d everythinghub_test -v ON_ERROR_STOP=1 -f database/002_eh_quad_schema.sql
      - name: Verify search schema, full-text index, and queue tables
        env:
          PGPASSWORD: test-only-password
        run: |
          set -euo pipefail
          psql -h localhost -U eh_test -d everythinghub_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO eh_quad.eh_documents
            (canonical_url, source_host, lane, title, description, body_text, robots_allowed)
          VALUES
            ('https://example.test/rolex', 'example.test', 'technology',
             'Rolex watches', 'Precision timepieces', 'Independent replacement database smoke test', true);
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM eh_quad.eh_documents
              WHERE search_vector @@ plainto_tsquery('english', 'Rolex')
            ) THEN
              RAISE EXCEPTION 'Full-text search index failed';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.tables
              WHERE table_schema='eh_quad' AND table_name='eh_crawl_queue'
            ) THEN
              RAISE EXCEPTION 'eh_quad crawl queue missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles WHERE rolname='service_role'
            ) THEN
              RAISE EXCEPTION 'service_role compatibility role missing';
            END IF;
          END $$;
          SELECT * FROM eh_quad.eh_search_pages('Rolex', null, 10);
          SQL
      - name: Build authenticated search API image
        run: docker build -f database/Dockerfile -t everythinghub-search-smoke .
