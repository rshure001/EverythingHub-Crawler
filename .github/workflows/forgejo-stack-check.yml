name: Validate free-first Forgejo stack

on:
  pull_request:
    paths:
      - "infra/forgejo/**"
      - ".github/workflows/forgejo-stack-check.yml"
  push:
    branches:
      - main
    paths:
      - "infra/forgejo/**"
      - ".github/workflows/forgejo-stack-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate Compose structure and security defaults
        run: python -m unittest infra/forgejo/test_config.py -v
      - name: Validate Compose interpolation and service model
        working-directory: infra/forgejo
        run: docker compose --env-file .env.example config --quiet
