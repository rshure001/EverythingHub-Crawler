name: Everything Hub live homepage verification
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/everything-hub-browser-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify the live approved homepage and real search
        run: |
          cat > browser-check.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            const errors = [];
            const catalogResponses = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('response', response => {
              const url = response.url();
              if (url.includes('/search-index/manifest.json') || url.includes('/search-index/shard-')) {
                catalogResponses.push({ url, status: response.status() });
              }
            });
            const failedRequests = [];
            page.on('requestfailed', r => failedRequests.push({ url: r.url(), error: r.failure()?.errorText }));
            const report = { url: 'https://everythinghub-homepage-fixed.vercel.app/', customDomainUrl: 'https://everythinghub.ink/', startedAt: new Date().toISOString() };
            try {
              const response = await page.goto(report.url, { waitUntil: 'domcontentloaded', timeout: 45000 });
              report.httpStatus = response?.status();
              report.title = await page.title();
              report.searchInput = await page.locator('#q').count() === 1;
              report.categoryCount = await page.locator('.tile').count();
              await page.locator('img.approved-master-art').waitFor({ state: 'attached', timeout: 15000 });
              await page.waitForFunction(() => {
                const img = document.querySelector('img.approved-master-art');
                return !!img && img.naturalWidth > 0;
              }, { timeout: 20000 }).catch(() => {});
              report.approvedArtwork = await page.locator('img.approved-master-art').evaluate(img => ({
                complete: img.complete, naturalWidth: img.naturalWidth, alt: img.alt, src: img.currentSrc || img.src
              }));
              report.failedRequests = failedRequests;
              if (!response?.ok() || !report.title.includes('Everything Hub') || !report.searchInput ||
                  report.categoryCount !== 8 || report.approvedArtwork.naturalWidth < 100) {
                throw new Error('Homepage structure check failed: ' + JSON.stringify(report));
              }
              await page.screenshot({ path: 'everything-hub-homepage-desktop.png', fullPage: true });
              await page.locator('#q').fill('Rolex');
              await page.locator('#q').press('Enter');
              await page.locator('#results .result a').first().waitFor({ state: 'visible', timeout: 30000 });
              report.rolexResultCount = await page.locator('#results .result').count();
              report.firstResults = await page.locator('#results .result').evaluateAll(nodes =>
                nodes.slice(0, 5).map(n => ({ title: n.querySelector('a')?.innerText, url: n.querySelector('a')?.href }))
              );
              if (!report.rolexResultCount || !report.firstResults.every(x => x.url?.startsWith('http'))) {
                throw new Error('Rolex search did not render usable web results.');
              }
              await page.screenshot({ path: 'everything-hub-rolex-search.png', fullPage: true });

              await page.locator('#q').fill('NASA');
              await page.locator('#q').press('Enter');
              await page.locator('#results .result .source').filter({ hasText: 'EverythingHub index' }).first().waitFor({ state: 'visible', timeout: 30000 });
              report.crawlerCatalogResultCount = await page.locator('#results .result .source').filter({ hasText: 'EverythingHub index' }).count();
              report.catalog = await page.evaluate(async () => {
                const response = await fetch('./search-index/manifest.json', { cache: 'no-store' });
                const manifest = await response.json();
                const checks = await Promise.all((manifest.shards || []).map(async entry => {
                  const r = await fetch('./search-index/' + encodeURIComponent(entry.file), { cache: 'no-store' });
                  const data = await r.json();
                  return { status: r.status, pages: Array.isArray(data.pages) ? data.pages.length : 0 };
                }));
                return {
                  manifestStatus: response.status,
                  totalPages: manifest.total_pages,
                  shardCount: manifest.shards?.length || 0,
                  shardResponsesOk: checks.filter(x => x.status === 200).length,
                  shardPageTotal: checks.reduce((sum, x) => sum + x.pages, 0)
                };
              });
              if (report.catalog.manifestStatus !== 200 || report.catalog.shardCount !== 14 ||
                  report.catalog.shardResponsesOk !== 14 || report.catalog.shardPageTotal !== report.catalog.totalPages ||
                  report.crawlerCatalogResultCount < 1) {
                throw new Error('Published crawler catalog verification failed: ' + JSON.stringify(report.catalog));
              }
              await page.screenshot({ path: 'everything-hub-crawler-index-search.png', fullPage: true });

              await page.locator('#q').fill('NASA');
              await page.locator('#q').press('Enter');
              await page.locator('#results .result .source').filter({ hasText: 'EverythingHub index' }).first().waitFor({ state: 'visible', timeout: 30000 });
              report.crawlerCatalogResultCount = await page.locator('#results .result .source').filter({ hasText: 'EverythingHub index' }).count();
              report.catalogManifestStatus = catalogResponses.find(x => x.url.includes('/search-index/manifest.json'))?.status ?? null;
              report.catalogShardResponseCount = catalogResponses.filter(x => x.url.includes('/search-index/shard-') && x.status === 200).length;
              report.catalogResponses = catalogResponses;
              if (report.catalogManifestStatus !== 200 || report.catalogShardResponseCount !== 14 || report.crawlerCatalogResultCount < 1) {
                throw new Error('Published crawler catalog did not load completely: ' + JSON.stringify({
                  manifestStatus: report.catalogManifestStatus,
                  shardResponses: report.catalogShardResponseCount,
                  indexResults: report.crawlerCatalogResultCount
                }));
              }
              await page.screenshot({ path: 'everything-hub-crawler-index-search.png', fullPage: true });

              await page.setViewportSize({ width: 390, height: 844 });
              await page.reload({ waitUntil: 'domcontentloaded' });
              await page.locator('#q').waitFor({ state: 'visible' });
              report.mobile = await page.evaluate(() => ({
                viewportWidth: document.documentElement.clientWidth,
                documentWidth: document.documentElement.scrollWidth,
                searchVisible: !!document.querySelector('#q')?.getClientRects().length,
                categoryCount: document.querySelectorAll('.tile').length
              }));
              if (report.mobile.documentWidth > report.mobile.viewportWidth + 2 ||
                  !report.mobile.searchVisible || report.mobile.categoryCount !== 8) {
                throw new Error('Mobile layout check failed: ' + JSON.stringify(report.mobile));
              }
              const domainPage = await browser.newPage({ viewport: { width: 1280, height: 900 } });
              try {
                const domainResponse = await domainPage.goto(report.customDomainUrl, { waitUntil: 'domcontentloaded', timeout: 15000 });
                report.customDomain = {
                  httpStatus: domainResponse?.status(),
                  title: await domainPage.title(),
                  reachable: !!domainResponse?.ok()
                };
              } catch (error) {
                report.customDomain = { reachable: false, error: String(error.message || error) };
              }
              await domainPage.close();
              report.customDomain.passed = report.customDomain.reachable && report.customDomain.title?.includes('Everything Hub');
              report.warnings = [];
              if (!report.customDomain.passed) {
                report.warnings.push('Custom domain is not yet reachable; canonical Vercel hostname checks remain independently evaluated.');
              }
              report.pageErrors = errors;
              report.canonicalPassed = errors.length === 0;
              report.passed = report.canonicalPassed;
              if (errors.length) throw new Error('Browser page errors: ' + errors.join('; '));
            } catch (e) {
              report.failure = e.stack || e.message;
              report.pageErrors = errors;
              report.passed = false;
              await page.screenshot({ path: 'everything-hub-homepage-failure.png', fullPage: true }).catch(() => {});
            } finally {
              report.finishedAt = new Date().toISOString();
              fs.writeFileSync('everything-hub-homepage-report.json', JSON.stringify(report, null, 2));
              await browser.close();
              console.log(JSON.stringify(report, null, 2));
              if (!report.passed) process.exitCode = 1;
            }
          })();
          JS
          node browser-check.cjs
      - name: Save homepage screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everything-hub-live-homepage-visual-check
          path: |
            everything-hub-homepage-desktop.png
            everything-hub-rolex-search.png
            everything-hub-crawler-index-search.png
            everything-hub-homepage-failure.png
            everything-hub-homepage-report.json
          if-no-files-found: warn
          retention-days: 3
