name: Everything Hub live browser verification
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/everything-hub-browser-check.yml"
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Open and test the live Everything Hub browser
        run: |
          cat > browser-check.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            const errors = [];
            page.on('pageerror', e => errors.push('PAGE: ' + e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push('CONSOLE: ' + m.text()); });
            page.on('requestfailed', r => errors.push('REQUEST: ' + r.url() + ' ' + (r.failure()?.errorText || 'failed')));
            const report = { url: 'https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-browser', startedAt: new Date().toISOString() };
            try {
              const response = await page.goto(report.url, { waitUntil: 'domcontentloaded', timeout: 45000 });
              report.httpStatus = response?.status();
              report.title = await page.title();
              report.header = await page.locator('header .brand').innerText();
              report.addressBar = await page.locator('#address').count() === 1;
              report.navigationControls = await page.locator('#back, #forward, #reload, #home').count();
              report.categoryTabs = await page.locator('.tab').allTextContents();
              await page.screenshot({ path: 'everything-hub-browser-home.png', fullPage: true });
              await page.locator('#address').fill('Rolex');
              await page.locator('#nav button.go').click();
              await page.locator('#results .result a').first().waitFor({ state: 'visible', timeout: 20000 });
              report.searchState = await page.locator('#state').innerText();
              report.resultCount = await page.locator('#results .result').count();
              report.firstResults = await page.locator('#results .result').evaluateAll(nodes => nodes.slice(0, 5).map(n => ({ title: n.querySelector('a')?.innerText, url: n.querySelector('a')?.href })));
              await page.screenshot({ path: 'everything-hub-browser-rolex.png', fullPage: true });
              report.errors = errors;
              report.passed = report.httpStatus === 200 && report.addressBar && report.navigationControls === 4 && report.categoryTabs.length === 8 && report.resultCount > 0 && report.firstResults.every(x => x.url.startsWith('http')) && errors.length === 0;
            } catch (e) {
              report.failure = e.stack || e.message;
              report.errors = errors;
              report.passed = false;
              await page.screenshot({ path: 'everything-hub-browser-failure.png', fullPage: true }).catch(() => {});
            } finally {
              report.finishedAt = new Date().toISOString();
              fs.writeFileSync('everything-hub-browser-report.json', JSON.stringify(report, null, 2));
              await browser.close();
              console.log(JSON.stringify(report, null, 2));
              if (!report.passed) process.exitCode = 1;
            }
          })();
          JS
          node browser-check.cjs
      - name: Save screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everything-hub-browser-visual-check
          path: |
            everything-hub-browser-home.png
            everything-hub-browser-rolex.png
            everything-hub-browser-failure.png
            everything-hub-browser-report.json
          if-no-files-found: warn
          retention-days: 3
