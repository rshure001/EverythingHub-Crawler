name: EverythingHub search API smoke test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/search-api-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed preview API
        run: |
          python - <<'PY'
          import json, urllib.request
          url = "https://everythinghub-homepage-fixed-qeg6honkg-rshure001-8053.vercel.app/api/search?q=NASA"
          req = urllib.request.Request(url, headers={"Accept": "application/json"})
          with urllib.request.urlopen(req, timeout=45) as response:
              assert response.status == 200, response.status
              data = json.load(response)
          assert data.get("indexedPages", 0) >= 1700, data
          assert data.get("total", 0) >= 5, data
          assert data.get("results"), data
          for result in data["results"]:
              assert result.get("url", "").startswith(("https://", "http://")), result
              assert result.get("title"), result
          print("Search API smoke test passed")
          print("Indexed pages:", data["indexedPages"])
          print("Matching results:", data["total"])
          for result in data["results"][:5]:
              print("-", result["title"], result["url"])
          PY
