name: EverythingHub search API smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/everything-hub-web-search/**"
      - ".github/workflows/search-api-smoke.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1
      KEY: sb_publishable_XlIsACWhtVS1jVODWYGTpg_GMs8v3vJ
    steps:
      - uses: actions/checkout@v4
      - name: Verify lightweight search API and explicit catalog deferral
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          base = os.environ["BASE"].rstrip("/")
          key = os.environ["KEY"]

          def get(function, query):
              url = base + "/" + function + "?" + urllib.parse.urlencode({"q": query, "limit": 10})
              request = urllib.request.Request(url, headers={
                  "Accept": "application/json",
                  "apikey": key,
              })
              with urllib.request.urlopen(request, timeout=25) as response:
                  if response.status != 200:
                      raise RuntimeError(function + " returned HTTP " + str(response.status))
                  return json.load(response)

          def valid_url(value):
              return isinstance(value, str) and value.startswith(("https://", "http://"))

          independent = get("everything-hub-independent-search", "Rolex")
          if independent.get("provider") != "Bing RSS" or independent.get("independentOfDatabase") is not True:
              raise SystemExit("Independent Rolex fallback did not identify its provider/database independence")
          if not isinstance(independent.get("results"), list) or not independent["results"]:
              raise SystemExit("Independent Rolex fallback returned no results")
          for item in independent["results"]:
              if not item.get("title") or not valid_url(item.get("url")):
                  raise SystemExit("Independent fallback returned an incomplete or unsafe result")
          print("Independent Rolex fallback:", len(independent["results"]), "valid results")

          for query in ("Rolex", "Las Vegas", "NASA"):
              payload = get("everything-hub-web-search", query)
              results = payload.get("results")
              if not isinstance(results, list) or not results:
                  raise SystemExit(query + ": live search returned no page results")
              for item in results:
                  if not item.get("title") or not valid_url(item.get("url")):
                      raise SystemExit(query + ": live search returned an incomplete or unsafe result")
              preview = payload.get("catalogPreview")
              catalogs = payload.get("catalogResults")
              if not isinstance(preview, dict) or preview.get("status") != "deferred":
                  raise SystemExit(query + ": Edge search did not explicitly defer heavy catalog preview")
              if preview.get("previewOnly") is not True or preview.get("recordsPublished") != 0:
                  raise SystemExit(query + ": catalog preview status or publication claims are unsafe")
              if not isinstance(catalogs, list) or catalogs:
                  raise SystemExit(query + ": Edge search unexpectedly loaded catalog previews into the hot path")
              print(json.dumps({
                  "query": query,
                  "resultCount": len(results),
                  "source": payload.get("source"),
                  "catalogPreview": preview.get("status"),
                  "recordsPublished": preview.get("recordsPublished"),
              }, sort_keys=True))
          print("PASS: live search API returns results without Edge-worker catalog fan-out.")
          PY
