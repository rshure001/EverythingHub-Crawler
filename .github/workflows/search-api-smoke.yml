name: EverythingHub search API smoke test
# Verify the live crawler index and database-independent fallback after every published catalog.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/everything-hub-web-search/**"
      - "public-search/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1
      KEY: sb_publishable_XlIsACWhtVS1jVODWYGTpg_GMs8v3vJ
    steps:
      - name: Check indexed ranking and database-independent fallback
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          base = os.environ["BASE"]
          key = os.environ["KEY"]

          def get(function, query, **extra):
              params = {"q": query, "limit": 10, **extra}
              url = base + "/" + function + "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers={
                  "Accept": "application/json",
                  "apikey": key,
              })
              with urllib.request.urlopen(request, timeout=25) as response:
                  assert response.status == 200, response.status
                  return json.load(response)

          indexed = get("everything-hub-web-search", "NASA")
          assert indexed.get("count", 0) > 0, indexed
          assert "index" in str(indexed.get("source", "")).lower(), indexed
          assert isinstance(indexed.get("results"), list), indexed
          for result in indexed["results"]:
              assert result.get("url", "").startswith(("https://", "http://")), result
              assert result.get("title"), result

          if indexed.get("source") == "Everything Hub public crawler index":
              assert indexed.get("indexIntegrity") == "sha256", indexed
              assert indexed.get("indexTransport") in ("gzip", "shards"), indexed
              urls = [result["url"] for result in indexed["results"]]
              assert len(urls) == len(set(urls)), indexed
              scores = [result.get("relevance") for result in indexed["results"]]
              assert all(isinstance(score, (int, float)) for score in scores), indexed
              assert scores == sorted(scores, reverse=True), scores
              print("Static index ranking passed:", indexed["count"], "NASA matches;",
                    "transport=", indexed["indexTransport"])

              science = get("everything-hub-web-search", "NASA", tentacle="science")
              assert science.get("count", 0) > 0, science
              assert all(item.get("tentacle") == "science" for item in science["results"]), science
              print("Science lane filter passed:", science["count"], "matches")
          else:
              print("Database-backed search passed:", indexed.get("source"), indexed["count"])

          independent = get("everything-hub-independent-search", "Rolex")
          assert independent.get("count", 0) > 0, independent
          assert independent.get("provider") == "Bing RSS", independent
          assert independent.get("independentOfDatabase") is True, independent
          for result in independent["results"]:
              assert result.get("url", "").startswith(("https://", "http://")), result
              assert result.get("title"), result
          print("Independent fallback passed:", independent["count"], "Rolex results")
          PY
