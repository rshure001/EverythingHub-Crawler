name: EverythingHub search API smoke test
# Verify the live crawler index and database-independent fallback after every published catalog.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/everything-hub-web-search/**"
      - "public-search/**"
      - "vercel-search-backend/**"
  workflow_dispatch:
  workflow_run:
    workflows: ["EverythingHub Publisher"]
    types: [completed]
permissions:
  contents: read
jobs:
  smoke-test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1
      KEY: sb_publishable_XlIsACWhtVS1jVODWYGTpg_GMs8v3vJ
      VERCEL_API: https://everythinghub-search-backend.vercel.app
    steps:
      - name: Check indexed ranking and database-independent fallback
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          base = os.environ["BASE"]
          key = os.environ["KEY"]

          def get(function, query, **extra):
              params = {"q": query, "limit": 10, **extra}
              url = base + "/" + function + "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers={
                  "Accept": "application/json",
                  "apikey": key,
              })
              with urllib.request.urlopen(request, timeout=25) as response:
                  assert response.status == 200, response.status
                  return json.load(response)

          independent = get("everything-hub-independent-search", "Rolex")
          assert independent.get("count", 0) > 0, independent
          assert independent.get("provider") == "Bing RSS", independent
          assert independent.get("independentOfDatabase") is True, independent
          for result in independent["results"]:
              assert result.get("url", "").startswith(("https://", "http://")), result
              assert result.get("title"), result
          print("Independent fallback passed:", independent["count"], "Rolex results")

          indexed = None
          indexed_error = None
          try:
              indexed = get("everything-hub-web-search", "NASA")
          except Exception as exc:
              indexed_error = f"{type(exc).__name__}: {exc}"
              print("Database-backed web search unavailable after independent fallback passed:", indexed_error)
          if indexed is not None:
              assert isinstance(indexed.get("results"), list) and indexed["results"], indexed
              indexed_source = str(indexed.get("source", ""))
              if indexed.get("independentOfDatabase") is True:
                  assert indexed.get("fallback") is True, indexed
                  assert indexed.get("fallbackReason") in ("database_unavailable", "database_empty"), indexed
                  if indexed.get("indexStatus") == "crawler-catalog-active":
                      assert indexed.get("indexedPages", 0) > 0, indexed
                      assert indexed.get("indexIntegrity") == "sha256", indexed
                      assert indexed.get("indexTransport") == "vercel", indexed
                      assert isinstance(indexed.get("indexSha256"), str) and len(indexed["indexSha256"]) == 64, indexed
                      assert "Everything Hub Crawler" in indexed.get("providers", []), indexed
                      print("Vercel-backed crawler catalog fallback passed:", indexed.get("indexedPages"), "indexed pages")
                  else:
                      assert indexed.get("results"), indexed
                      providers = indexed.get("providers", [])
                      provider = str(indexed.get("provider", ""))
                      assert provider == "Bing RSS" or any("Bing" in str(item) for item in providers), indexed
                      print("Bing-only outage fallback returned:", len(indexed["results"]), "results")
              else:
                  assert indexed.get("count", 0) > 0, indexed
                  assert "index" in indexed_source.lower(), indexed
              assert isinstance(indexed.get("results"), list), indexed
              for result in indexed["results"]:
                  assert result.get("url", "").startswith(("https://", "http://")), result
                  assert result.get("title"), result

              if indexed.get("source") == "Everything Hub public crawler index":
                  assert indexed.get("fallback") is True, indexed
                  assert indexed.get("fallbackReason") in ("database_unavailable", "database_empty"), indexed
                  assert indexed.get("indexIntegrity") == "sha256", indexed
                  assert indexed.get("indexTransport") in ("gzip", "shards"), indexed
                  urls = [result["url"] for result in indexed["results"]]
                  assert len(urls) == len(set(urls)), indexed
                  lexical_scores = [result.get("relevance") for result in indexed["results"]]
                  assert all(isinstance(score, (int, float)) for score in lexical_scores), indexed
                  rank_scores = [result.get("rankScore") for result in indexed["results"]]
                  assert all(isinstance(score, (int, float)) for score in rank_scores), indexed
                  assert rank_scores == sorted(rank_scores, reverse=True), rank_scores
                  assert all(result.get("evidenceBand") in ("high", "medium", "low")
                             for result in indexed["results"]), indexed
                  assert all(isinstance(result.get("evidenceComponents"), dict)
                             for result in indexed["results"]), indexed
                  print("Static index Hurricane ranking passed:", indexed["count"], "NASA matches;",
                        "transport=", indexed["indexTransport"])

                  science = get("everything-hub-web-search", "NASA", tentacle="science")
                  assert science.get("count", 0) > 0, science
                  assert all(item.get("tentacle") == "science" for item in science["results"]), science
                  print("Science lane filter passed:", science["count"], "matches")
              elif indexed.get("independentOfDatabase") is not True:
                  print("Database-backed search passed:", indexed.get("source"), indexed["count"])

          if indexed_error:
              raise SystemExit("Database-backed web search unavailable: " + indexed_error)

          vercel_base = os.environ["VERCEL_API"].rstrip("/")
          def get_vercel(path):
              request = urllib.request.Request(vercel_base + path, headers={"Accept": "application/json"})
              with urllib.request.urlopen(request, timeout=25) as response:
                  assert response.status == 200, response.status
                  return json.load(response)

          health = get_vercel("/api/health")
          production = get_vercel("/api/search?" + urllib.parse.urlencode({"q": "NASA", "limit": 50, "offset": 0}))
          page2 = get_vercel("/api/search?" + urllib.parse.urlencode({"q": "NASA", "limit": 50, "offset": 50}))
          assert health.get("status") == "ok", health
          assert health.get("service") == "everythinghub-independent-search", health
          assert health.get("database_required") is False, health
          assert health.get("pagination") == "non-overlapping", health
          assert production.get("indexStatus") == "crawler-catalog-active", production
          assert isinstance(production.get("indexedPages"), int) and production["indexedPages"] > 0, production
          assert isinstance(production.get("indexSha256"), str) and len(production["indexSha256"]) == 64, production
          assert production.get("page") == 1, production
          assert page2.get("page") == 2, page2
          assert page2.get("catalogOffset") == 40, page2
          assert page2.get("indexedPages") == production.get("indexedPages"), page2
          assert page2.get("indexSha256") == production.get("indexSha256"), page2
          local_results = [
              item for item in production.get("results", [])
              if item.get("source") == "Everything Hub Crawler"
              and item.get("provider") == "everythinghub-catalog"
          ]
          page2_results = [
              item for item in page2.get("results", [])
              if item.get("source") == "Everything Hub Crawler"
              and item.get("provider") == "everythinghub-catalog"
          ]
          assert len(local_results) == 40, production
          assert len(page2_results) == 50, page2
          for item in local_results + page2_results:
              assert item.get("origin") == "Everything Hub Index", item
              assert item.get("url", "").startswith(("https://", "http://")), item
          first_urls = {item["url"] for item in local_results}
          second_urls = {item["url"] for item in page2_results}
          assert not first_urls.intersection(second_urls), {"page1": local_results, "page2": page2_results}
          assert page2.get("hasMore") is True, page2
          print("Production Vercel catalog passed:", production["indexedPages"], "indexed pages;",
                len(local_results), "first-party page-one results;", len(page2_results),
                "non-overlapping page-two results")
          PY
