                (parsed.searchParams.get("q") || "").toLowerCase() === "solar panels");
              const newsResponse = apiResponse("/api/search", parsed =>
                parsed.searchParams.get("vertical") === "news");
              report.publicFeeds = {
                search: { status: searchResponse?.status || null, count: report.searches.find(item => item.query === "NASA")?.count || 0 },
                images: { status: imageResponse?.status || null, count: report.images.count, attributed: report.images.attributed },
                videos: { status: report.videos.apiStatus, count: report.videos.apiCount, withThumbnails: report.videos.apiWithThumbnails },
                news: { status: newsResponse?.status || null, count: report.topStories.headlineCount }
              };
              if (!searchResponse || !report.publicFeeds.search.count ||
                  !imageResponse || report.publicFeeds.images.loaded < 3 || report.publicFeeds.images.attributed < 3 ||
