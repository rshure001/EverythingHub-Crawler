name: Everything Hub browser verification
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/everything-hub-production-browser-check.yml"
      - "src/**"\n      - "vercel-homepage/**"
  workflow_dispatch:
  workflow_run:
    workflows: ["EverythingHub Publisher"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: eh-browser-check
  cancel-in-progress: true
jobs:
  production-browser-check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_URL: https://everythinghub-search-engine-4x25f8.v2.appdeploy.ai/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify current homepage, search, media modes, and mobile layout
        run: |
          cat > production-check.cjs <<'JS'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on("pageerror", error => errors.push(error.message));
            const report = { url: process.env.TARGET_URL, startedAt: new Date().toISOString() };
            try {
              const response = await page.goto(report.url, { waitUntil: "networkidle", timeout: 60000 });
              report.httpStatus = response?.status();
              report.title = await page.title();
              const artwork = page.locator(".everythinghub-approved-home-art img.approved-master-image").first();
              await artwork.waitFor({ state: "visible", timeout: 20000 });
              await page.waitForFunction(() => {
                const img = document.querySelector(".everythinghub-approved-home-art img.approved-master-image");
                return !!img && img.complete && img.naturalWidth >= 100;
              }, null, { timeout: 30000 });
              report.approvedArtwork = await artwork.evaluate(img => ({
                src: img.currentSrc, naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight
              }));
              const categoryButtons = page.locator(".hub-hero-divisions button:visible");
              report.categoryCount = await categoryButtons.count();
              report.categoryNames = (await categoryButtons.evaluateAll(nodes =>
                nodes.map(node => node.getAttribute("aria-label") || node.textContent.trim()).sort()
              ));
              const expected = ["Business","Images","News","Places","Research","Shopping","Videos","Web"].sort();
              const search = page.locator("input#hub-search:visible").first();
              report.searchInputCount = await page.locator("input#hub-search:visible").count();
              if (!response?.ok() || !report.title.includes("EverythingHub") ||
                  report.categoryCount !== 8 || JSON.stringify(report.categoryNames) !== JSON.stringify(expected) ||
                  report.searchInputCount < 1 || report.approvedArtwork.naturalWidth < 100) {
                throw new Error("In-house homepage structure check failed: " + JSON.stringify(report));
              }
              await page.screenshot({ path: "everything-hub-homepage.png", fullPage: true });
              for (const query of ["Rolex", "NASA"]) {
                await page.goto(report.url, { waitUntil: "networkidle", timeout: 60000 });
                const input = page.locator("input#hub-search:visible").first();
                await input.waitFor({ state: "visible", timeout: 20000 });
                await input.fill(query);
                await input.press("Enter");
                await page.locator(".eh-result-card").first().waitFor({ state: "visible", timeout: 45000 });
                const count = await page.locator(".eh-result-card").count();
                const titles = await page.locator(".eh-result-title").allTextContents();
                report[query.toLowerCase()] = { count, sampleTitles: titles.slice(0, 5) };
                if (!count) throw new Error(query + " produced no visible in-house search results");
                await page.screenshot({ path: "everything-hub-" + query.toLowerCase() + ".png", fullPage: true });
              }
              await page.setViewportSize({ width: 390, height: 844 });
              await page.goto(report.url, { waitUntil: "networkidle", timeout: 60000 });
              report.mobile = await page.evaluate(() => ({
                viewportWidth: document.documentElement.clientWidth,
                documentWidth: document.documentElement.scrollWidth,
                artworkVisible: !!document.querySelector(".everythinghub-approved-home-art img.approved-master-image")?.getClientRects().length,
                searchVisible: !!document.querySelector("input#hub-search")?.getClientRects().length,
                categoryCount: document.querySelectorAll(".hub-hero-divisions button").length
              }));
              if (report.mobile.documentWidth > report.mobile.viewportWidth + 2 ||
                  !report.mobile.artworkVisible || !report.mobile.searchVisible || report.mobile.categoryCount !== 8) {
                throw new Error("Mobile in-house homepage check failed: " + JSON.stringify(report.mobile));
              }
              report.pageErrors = errors;
              report.passed = errors.length === 0;
              if (errors.length) throw new Error("Browser page errors: " + errors.join("; "));
              fs.writeFileSync("production-report.json", JSON.stringify(report, null, 2));
              console.log(JSON.stringify(report, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          JS
          node production-check.cjs
      - name: Save production screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everything-hub-browser-check
          path: |
            everything-hub-homepage.png
            everything-hub-rolex.png
            everything-hub-nasa.png
            everything-hub-failure.png
            everything-hub-production-report.json
          if-no-files-found: warn
          retention-days: 3
