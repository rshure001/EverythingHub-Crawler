name: Everything Hub browser verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/everything-hub-production-browser-check.yml'
      - 'vercel-homepage/**'
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish and verify Everything Hub — in-house Supabase route"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: eh-browser-check
  cancel-in-progress: true
jobs:
  production-browser-check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/storage/v1/object/public/everything-hub-publishing/index.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify live AppDeploy homepage, search, categories, news, and mobile layout
        run: |
          cat > production-check.cjs <<'JS'
          const { chromium } = require("playwright");
          const fs = require("fs");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on("pageerror", error => errors.push(error.message));
            const report = { url: process.env.TARGET_URL, startedAt: new Date().toISOString() };
            try {
              const response = await page.goto(report.url, { waitUntil: "domcontentloaded", timeout: 45000 });
              await page.locator(".everythinghub-approved-home-art img.approved-master-image").waitFor({state:"visible",timeout:30000});
              const artwork = page.locator(".everythinghub-approved-home-art img.approved-master-image").first();
              await page.waitForFunction(() => {
                const img = document.querySelector(".everythinghub-approved-home-art img.approved-master-image");
                return !!img && img.complete && img.naturalWidth >= 100;
              }, null, { timeout: 30000 });
              report.httpStatus = response?.status();
              report.title = await page.title();
              report.artwork = await artwork.evaluate(img => ({src:img.currentSrc,width:img.naturalWidth,height:img.naturalHeight}));
              report.searchInputs = await page.locator('form.homepage-live-search:visible input[aria-label="Search EverythingHub"]').count();
              const categoryButtons = page.locator("nav.hub-hero-divisions button");
              report.categoryCount = await categoryButtons.count();
              report.categoryNames = await categoryButtons.allTextContents();
              if (!response?.ok() || !/(Everything\s*Hub)/i.test(report.title) || report.searchInputs < 1 || report.categoryCount !== 8 || report.artwork.width < 100) {
                throw new Error("Live AppDeploy homepage structure check failed: " + JSON.stringify(report));
              }
              await page.screenshot({path:"everything-hub-homepage.png",fullPage:true});
              report.searches = {};
              for (const query of ["Rolex","Las Vegas","NASA"]) {
                await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
                const form = page.locator("form.homepage-live-search:visible").first();
                const input = form.locator('input[aria-label="Search EverythingHub"]');
                await input.fill(query);
                await form.locator('button[type="submit"]').click();
                await page.waitForFunction(() => document.querySelectorAll(".eh-result-card").length > 0 || /no results found|temporarily unavailable|search unavailable/i.test(document.body.innerText),null,{timeout:30000});
                const cards = page.locator(".eh-result-card");
                const count = await cards.count();
                const titles = await page.locator(".eh-result-title").allTextContents();
                report.searches[query] = {count,titles:titles.slice(0,5),emptyOrError:count===0?((await page.locator("body").innerText()).match(/no results found|temporarily unavailable|search unavailable/i)?.[0]||"No visible results"):null};
                await page.screenshot({path:"everything-hub-"+query.toLowerCase().replace(/\s+/g,"-")+".png",fullPage:true});
                if (!count) report.searches[query].passed = false; else report.searches[query].passed = true;
              }
              await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
              const news = page.locator(".top-news:visible, [aria-label*='news' i]:visible").first();
              report.liveNewsVisible = await news.count() > 0;
              report.liveNewsText = report.liveNewsVisible ? (await news.innerText()).slice(0,1200) : "No visible Live News section";
              report.liveNewsPassed = report.liveNewsVisible && /temporarily unavailable|stories|headlines|top stories|live news/i.test(report.liveNewsText);
              await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
              await page.locator("#news-items .news-item").first().waitFor({state:"visible",timeout:30000});
              report.news={topStories:await page.locator("#news-items .news-item").count(),status:await page.locator("#news-status").innerText()};
              report.newsCategories={};
              for(const category of ["world","technology","business","science"]){
                await page.locator('[data-news="'+category+'"]').click();
                await page.locator("#news-items .news-item").first().waitFor({state:"visible",timeout:20000});
                report.newsCategories[category]=await page.locator("#news-items .news-item").count();
              }
              await page.locator("#news-refresh").click();
              await page.locator("#news-items .news-item").first().waitFor({state:"visible",timeout:20000});
              await page.screenshot({path:"everythinghub-fallback-news.png",fullPage:true});
              await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
              await page.locator('.hotspots [data-mode="images"]').click();
              await page.locator("#query").fill("dog");
              await page.locator("#searchForm button[type=submit]").click();
              await page.locator("#results .media-card img").first().waitFor({state:"visible",timeout:30000});
              report.imageSearch={cards:await page.locator("#results .media-card").count(),title:(await page.locator("#results .results-heading h2").innerText())};
              await page.screenshot({path:"everythinghub-fallback-images.png",fullPage:true});
              await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
              await page.locator('.hotspots [data-mode="videos"]').click();
              await page.locator("#query").fill("NASA");
              await page.locator("#searchForm button[type=submit]").click();
              await page.locator("#results .video-card img").first().waitFor({state:"visible",timeout:30000});
              report.videoSearch={cards:await page.locator("#results .video-card").count(),title:(await page.locator("#results .results-heading h2").innerText())};
              await page.screenshot({path:"everythinghub-fallback-videos.png",fullPage:true});
              if(report.news.topStories<1||Object.values(report.newsCategories).some(x=>x<1)||report.imageSearch.cards<1||report.videoSearch.cards<1)throw new Error("News, image, or video acceptance failed: "+JSON.stringify({news:report.news,newsCategories:report.newsCategories,imageSearch:report.imageSearch,videoSearch:report.videoSearch}));
              await page.setViewportSize({width:390,height:844});
              await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
              report.mobile = await page.evaluate(() => ({
                viewportWidth:document.documentElement.clientWidth,
                documentWidth:document.documentElement.scrollWidth,
                artworkVisible:!!document.querySelector(".everythinghub-approved-home-art img.approved-master-image")?.getClientRects().length,
                searchVisible:!!Array.from(document.querySelectorAll('form.homepage-live-search input[aria-label="Search EverythingHub"]')).some(el=>el.getClientRects().length),
                categories:document.querySelectorAll("nav.hub-hero-divisions button").length
              }));
              await page.screenshot({path:"everything-hub-mobile.png",fullPage:true});
              if (report.mobile.documentWidth > report.mobile.viewportWidth+2 || !report.mobile.artworkVisible || !report.mobile.searchVisible || report.mobile.categories!==8) {
                throw new Error("Mobile layout failed: "+JSON.stringify(report.mobile));
              }
              report.pageErrors=errors;
              report.passed=errors.length===0 && Object.values(report.searches).every(x=>x.passed) && report.liveNewsPassed && report.mobile.documentWidth <= report.mobile.viewportWidth+2;
              if(!report.passed) throw new Error("Live acceptance checks failed: "+JSON.stringify({searches:report.searches,liveNewsVisible:report.liveNewsVisible,liveNewsPassed:report.liveNewsPassed,mobile:report.mobile,pageErrors:errors}));
              fs.writeFileSync("production-report.json",JSON.stringify(report,null,2));
              console.log(JSON.stringify(report,null,2));
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exit(1);});
          JS
          node production-check.cjs
      - name: Save production screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everything-hub-browser-check
          path: |
            everything-hub-homepage.png
            everything-hub-rolex.png
            everything-hub-las-vegas.png
            everything-hub-nasa.png
            everything-hub-mobile.png
            everything-hub-failure.png
            production-report.json
          if-no-files-found: warn
          retention-days: 3

  free-fallback-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_URL: https://everythinghub-homepage-fixed-9grskbx3r-rshure001-8053.vercel.app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify free Vercel fallback, live search, and mobile layout
        run: |
          cat > fallback-check.cjs <<'JS'
          const { chromium } = require("playwright");
          const fs = require("fs");
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[];
            page.on("pageerror",e=>errors.push(e.message));
            const report={url:process.env.TARGET_URL,startedAt:new Date().toISOString(),searches:{}};
            try {
              const response=await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
              const image=page.locator(".art img").first();
              await image.waitFor({state:"visible",timeout:20000});
              await page.waitForFunction(()=>{const i=document.querySelector(".art img");return !!i&&i.complete&&i.naturalWidth>=100;},null,{timeout:20000});
              report.httpStatus=response?.status();
              report.title=await page.title();
              report.artwork=await image.evaluate(i=>({src:i.currentSrc,width:i.naturalWidth,height:i.naturalHeight,renderedWidth:i.getBoundingClientRect().width}));
              if(!report.artwork.src.includes("everythinghub-approved-octopus.png"))throw new Error("Approved master artwork is not being used: "+report.artwork.src);
              report.desktopLayout=await page.evaluate(()=>{const a=document.querySelector(".art").getBoundingClientRect(),r=document.querySelector("#results").getBoundingClientRect();return {mainDirection:getComputedStyle(document.querySelector("main")).flexDirection,artRight:a.right,artBottom:a.bottom,resultsTop:r.top,viewportWidth:document.documentElement.clientWidth}});
              report.searchInputCount=await page.locator("#query").count();
              report.categoryCount=await page.locator(".hotspots [data-mode]").count();
              report.categoryModes=await page.locator(".hotspots [data-mode]").evaluateAll(xs=>xs.map(x=>x.dataset.mode));
              if(!response?.ok()||!report.title.includes("Everything Hub")||report.searchInputCount!==1||report.categoryCount!==8||report.artwork.renderedWidth<700||report.desktopLayout.mainDirection!=="column"||report.desktopLayout.resultsTop<report.desktopLayout.artBottom)throw new Error("Fallback homepage structure failed: "+JSON.stringify(report));
              await page.screenshot({path:"everythinghub-fallback-home.png",fullPage:true});
              for(const mode of report.categoryModes){
                await page.locator(".hotspots [data-mode=\""+mode+"\"]").click();
                const selected=await page.locator("#status").innerText();
                if(!selected.toLowerCase().includes("selected"))throw new Error("Category did not activate: "+mode+" / "+selected);
              }
              for(const query of ["Rolex","Las Vegas","NASA"]){
                await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
                await page.locator("#query").fill(query);
                await page.locator("#searchForm button[type=submit]").click();
                await page.locator("#results .eh-result").first().waitFor({state:"visible",timeout:30000});
                const count=await page.locator("#results .eh-result").count();
                const titles=await page.locator("#results .eh-result a").allTextContents();
                report.searches[query]={visibleCards:count,titles:titles.slice(0,5),status:await page.locator("#status").innerText()};
                if(!count)throw new Error(query+" returned no visible results");
                await page.screenshot({path:"everythinghub-fallback-"+query.toLowerCase().replace(/\s+/g,"-")+".png",fullPage:true});
              }
              await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
              await page.locator("#news-items .news-item").first().waitFor({state:"visible",timeout:30000});
              report.news={topStories:await page.locator("#news-items .news-item").count(),status:await page.locator("#news-status").innerText()};
              report.newsCategories={};
              for(const category of ["world","technology","business","science"]){
                await page.locator('[data-news="'+category+'"]').click();
                await page.locator("#news-items .news-item").first().waitFor({state:"visible",timeout:20000});
                report.newsCategories[category]=await page.locator("#news-items .news-item").count();
              }
              await page.locator("#news-refresh").click();
              await page.locator("#news-items .news-item").first().waitFor({state:"visible",timeout:20000});
              await page.screenshot({path:"everythinghub-fallback-news.png",fullPage:true});
              await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
              await page.locator('.hotspots [data-mode="images"]').click();
              await page.locator("#query").fill("dog");
              await page.locator("#searchForm button[type=submit]").click();
              await page.locator("#results .media-card img").first().waitFor({state:"visible",timeout:30000});
              report.imageSearch={cards:await page.locator("#results .media-card").count(),title:(await page.locator("#results .results-heading h2").innerText())};
              await page.screenshot({path:"everythinghub-fallback-images.png",fullPage:true});
              await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
              await page.locator('.hotspots [data-mode="videos"]').click();
              await page.locator("#query").fill("NASA");
              await page.locator("#searchForm button[type=submit]").click();
              await page.locator("#results .video-card img").first().waitFor({state:"visible",timeout:30000});
              report.videoSearch={cards:await page.locator("#results .video-card").count(),title:(await page.locator("#results .results-heading h2").innerText())};
              await page.screenshot({path:"everythinghub-fallback-videos.png",fullPage:true});
              if(report.news.topStories<1||Object.values(report.newsCategories).some(x=>x<1)||report.imageSearch.cards<1||report.videoSearch.cards<1)throw new Error("News, image, or video acceptance failed: "+JSON.stringify({news:report.news,newsCategories:report.newsCategories,imageSearch:report.imageSearch,videoSearch:report.videoSearch}));
              await page.setViewportSize({width:390,height:844});
              await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
              report.mobile=await page.evaluate(()=>({viewportWidth:document.documentElement.clientWidth,documentWidth:document.documentElement.scrollWidth,artworkVisible:!!document.querySelector(".art img")?.getClientRects().length,searchVisible:!!document.querySelector("#query")?.getClientRects().length,categories:document.querySelectorAll(".hotspots [data-mode]").length,artworkWidth:document.querySelector(".art").getBoundingClientRect().width,resultsTop:document.querySelector("#results").getBoundingClientRect().top,artworkBottom:document.querySelector(".art").getBoundingClientRect().bottom}));
              await page.screenshot({path:"everythinghub-fallback-mobile.png",fullPage:true});
              if(report.mobile.documentWidth>report.mobile.viewportWidth+2||!report.mobile.artworkVisible||!report.mobile.searchVisible||report.mobile.categories!==8||report.mobile.artworkWidth<report.mobile.viewportWidth-4||report.mobile.resultsTop<report.mobile.artworkBottom)throw new Error("Fallback mobile layout failed: "+JSON.stringify(report.mobile));
              report.pageErrors=errors;
              report.passed=errors.length===0&&Object.keys(report.searches).length===3&&report.news?.topStories>0&&Object.values(report.newsCategories||{}).every(x=>x>0)&&report.imageSearch?.cards>0&&report.videoSearch?.cards>0;
              if(errors.length)throw new Error("Fallback page errors: "+errors.join("; "));
              fs.writeFileSync("fallback-report.json",JSON.stringify(report,null,2));
              console.log(JSON.stringify(report,null,2));
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
          node fallback-check.cjs
      - name: Save free fallback screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everythinghub-free-fallback-browser-check
          path: |
            everythinghub-fallback-home.png
            everythinghub-fallback-rolex.png
            everythinghub-fallback-las-vegas.png
            everythinghub-fallback-nasa.png
            everythinghub-fallback-mobile.png
            fallback-report.json
          if-no-files-found: warn
          retention-days: 3
