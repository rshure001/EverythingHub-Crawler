name: Everything Hub production browser verification
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/everything-hub-production-browser-check.yml"
      - "vercel-homepage/**"
      - "public-search/**"
      - "supabase/functions/everything-hub-web-search/**"
  workflow_run:
    workflows: ["Everything Hub crawler"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eh-production-browser-check
  cancel-in-progress: true
jobs:
  production-browser-check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_URL: https://everything-hub-ten.vercel.app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify approved homepage, crawler search, independent fallback, and mobile layout
        run: |
          cat > production-check.cjs <<'JS'
          const { chromium } = require("playwright");
          const fs = require("fs");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on("pageerror", error => errors.push(error.message));
            const report = { url: process.env.TARGET_URL, startedAt: new Date().toISOString() };
            try {
              const response = await page.goto(report.url, { waitUntil: "domcontentloaded", timeout: 45000 });
              report.httpStatus = response?.status();
              report.title = await page.title();
              report.searchInput = await page.locator("#q").count() === 1;
              const categoryTiles = page.locator('.tile[href*="mode="]');
              report.categoryCount = await categoryTiles.count();
              report.categoryModes = await categoryTiles.evaluateAll(nodes =>
                nodes.map(node => new URL(node.href).searchParams.get("mode")).sort()
              );
              const expectedModes = ["business", "images", "news", "places", "research", "shopping", "videos", "web"];
              if (JSON.stringify(report.categoryModes) !== JSON.stringify(expectedModes)) {
                throw new Error("Homepage search categories are incomplete or duplicated: " + JSON.stringify(report.categoryModes));
              }

              const artwork = page.locator(".hero img").first();
              await artwork.waitFor({ state: "visible", timeout: 15000 });
              await page.waitForFunction(() => {
                const image = document.querySelector(".hero img");
                return !!image && image.complete && image.naturalWidth >= 100;
              }, null, { timeout: 20000 });
              report.approvedArtwork = await artwork.evaluate(image => ({
                src: image.getAttribute("src"),
                complete: image.complete,
                naturalWidth: image.naturalWidth,
                alt: image.alt
              }));

              if (!response?.ok() || !report.title.includes("Everything Hub") ||
                  !report.searchInput || report.categoryCount !== 8 ||
                  report.approvedArtwork.naturalWidth < 100) {
                throw new Error("Approved homepage structure check failed: " + JSON.stringify(report));
              }
              await page.screenshot({ path: "everything-hub-production-homepage.png", fullPage: true });

              await page.locator("#q").fill("Rolex");
              await page.locator("#q").press("Enter");
              await page.locator("#results .result a").first().waitFor({ state: "visible", timeout: 35000 });
              report.rolexResultCount = await page.locator("#results .result").count();
              report.rolexStatus = await page.locator("#status").innerText();
              if (!report.rolexResultCount || !report.rolexStatus.includes("Bing RSS independent web fallback")) {
                throw new Error("Rolex did not use the independent fallback: " + JSON.stringify({
                  count: report.rolexResultCount, status: report.rolexStatus
                }));
              }
              await page.screenshot({ path: "everything-hub-production-rolex.png", fullPage: true });

              await page.locator("#q").fill("NASA");
              await page.locator("#q").press("Enter");
              await page.locator("#results .result a").first().waitFor({ state: "visible", timeout: 35000 });
              report.nasaResultCount = await page.locator("#results .result").count();
              report.nasaStatus = await page.locator("#status").innerText();
              if (!report.nasaResultCount || !report.nasaStatus.includes("Everything Hub public crawler index")) {
                throw new Error("NASA did not return crawler-index results: " + JSON.stringify({
                  count: report.nasaResultCount, status: report.nasaStatus
                }));
              }
              await page.screenshot({ path: "everything-hub-production-nasa.png", fullPage: true });

              await page.setViewportSize({ width: 390, height: 844 });
              await page.reload({ waitUntil: "domcontentloaded" });
              report.mobile = await page.evaluate(() => ({
                viewportWidth: document.documentElement.clientWidth,
                documentWidth: document.documentElement.scrollWidth,
                searchVisible: !!document.querySelector("#q")?.getClientRects().length,
                categoryCount: document.querySelectorAll('.tile[href*="mode="]').length
              }));
              if (report.mobile.documentWidth > report.mobile.viewportWidth + 2 ||
                  !report.mobile.searchVisible || report.mobile.categoryCount !== 8) {
                throw new Error("Mobile layout check failed: " + JSON.stringify(report.mobile));
              }

              report.pageErrors = errors;
              report.passed = errors.length === 0;
              if (errors.length) throw new Error("Browser page errors: " + errors.join("; "));
            } catch (error) {
              report.failure = error.stack || error.message;
              report.pageErrors = errors;
              report.passed = false;
              await page.screenshot({ path: "everything-hub-production-failure.png", fullPage: true }).catch(() => {});
            } finally {
              report.finishedAt = new Date().toISOString();
              fs.writeFileSync("everything-hub-production-report.json", JSON.stringify(report, null, 2));
              await browser.close();
              console.log(JSON.stringify(report, null, 2));
              if (!report.passed) process.exitCode = 1;
            }
          })();
          JS
          node production-check.cjs
      - name: Save production screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everything-hub-production-browser-check
          path: |
            everything-hub-production-homepage.png
            everything-hub-production-rolex.png
            everything-hub-production-nasa.png
            everything-hub-production-failure.png
            everything-hub-production-report.json
          if-no-files-found: warn
          retention-days: 3
