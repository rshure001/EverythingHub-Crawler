# Live acceptance verifies the low-latency public RSS fallback when the full catalog index is cold.
name: Everything Hub browser verification
on:
  push:
    branches: [main, 'eh/fallback-attribution-2026-11-21', 'eh/catalog-preview-cards-2026-11-21', 'eh/nasa-video-search-2026-11-21']
    paths:
      - '.github/workflows/everything-hub-production-browser-check.yml'
      - 'vercel-homepage/**'
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish and verify Everything Hub — in-house Supabase route"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: eh-browser-check
  cancel-in-progress: true
jobs:
  production-browser-check:
    if: ${{ vars.APPDEPLOY_ACCEPTANCE_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_URL: https://everythinghub-search-engine-4x25f8.v2.appdeploy.ai/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify live AppDeploy homepage, search, categories, news, and mobile layout
        run: |
          cat > production-check.cjs <<'JS'
          const { chromium } = require("playwright");
          const fs = require("fs");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            const consoleErrors = [];
            page.on("pageerror", error => pageErrors.push(error.message + "\n" + (error.stack || "")));
            page.on("console", message => { if (message.type() === "error") consoleErrors.push(message.text()); });
            const report = { url: process.env.TARGET_URL, startedAt: new Date().toISOString(), artwork: null, divisions: [], searches: {}, publicFeeds: {}, mobile: null, pageErrors, consoleErrors, passed: false };
            try {
              const homeResponse = await page.goto(report.url, { waitUntil: "domcontentloaded", timeout: 45000 });
              if (!homeResponse || !homeResponse.ok()) throw new Error("AppDeploy homepage did not return HTTP 200");
              const art = page.locator(".everythinghub-approved-home-art img.approved-master-image").first();
              await art.waitFor({ state: "visible", timeout: 30000 });
              await page.waitForFunction(() => {
                const img = document.querySelector(".everythinghub-approved-home-art img.approved-master-image");
                return !!img && img.complete && img.naturalWidth >= 800;
              }, null, { timeout: 30000 });
              report.artwork = await art.evaluate(img => ({ src: img.currentSrc || img.src, width: img.naturalWidth, height: img.naturalHeight, complete: img.complete }));
              if (!report.artwork.src.includes("everythinghub-approved-octopus.png")) throw new Error("Approved original octopus artwork is not being used");
              const inputSelector = "form.homepage-live-search:visible input#hub-search";
              await page.locator(inputSelector).first().waitFor({ state: "visible", timeout: 15000 });
              const divisionButtons = page.locator("nav.hub-hero-divisions button");
              report.divisions = await divisionButtons.evaluateAll(buttons => buttons.map(button => button.getAttribute("aria-label") || button.innerText.trim()));
              if (report.divisions.length !== 8) throw new Error("Expected 8 clickable divisions; found " + report.divisions.length);
              await divisionButtons.first().click();
              await page.locator(".division-workspace").waitFor({ state: "visible", timeout: 15000 });
              report.divisionInteraction = await page.locator(".division-workspace h2").innerText();
              await page.locator(".workspace-close").click();
              for (const query of ["Rolex", "Las Vegas", "NASA"]) {
                await page.goto(report.url, { waitUntil: "domcontentloaded", timeout: 45000 });
                const form = page.locator("form.homepage-live-search:visible").first();
                const input = form.locator("input#hub-search").first();
                await input.fill(query);
                await input.press("Enter");
                await page.waitForFunction(() => !!document.querySelector(".eh-result-card") || !!document.querySelector(".empty-state"), null, { timeout: 45000 });
                const count = await page.locator(".eh-result-card").count();
                const status = await page.locator(".status-line").first().innerText().catch(() => "");
                const titles = await page.locator(".eh-result-title").allTextContents();
                report.searches[query] = { visibleCards: count, status, titles: titles.slice(0, 5) };
                await page.screenshot({ path: "everythinghub-production-" + query.toLowerCase().replace(/\s+/g, "-") + ".png", fullPage: true });
                if (!count) throw new Error(query + " returned no visible AppDeploy search results; status=" + status);
              }
              await page.goto(report.url, { waitUntil: "domcontentloaded", timeout: 45000 });
              report.publicFeeds = await page.evaluate(async () => {
                const get = async path => {
                  try {
                    const response = await fetch(path);
                    const data = await response.json();
                    return { ok: response.ok, count: Array.isArray(data.results) ? data.results.length : 0, providers: data.providers || [], message: data.message || "" };
                  } catch (error) { return { ok: false, count: 0, message: String(error) }; }
                };
                const [news, images, videos] = await Promise.all([
                  get("/api/search?q=latest%20world%20news&limit=10&vertical=news"),
                  get("/api/images?q=dog"),
                  get("/api/videos?q=NASA")
                ]);
                return { news, images, videos };
              });
              if (report.publicFeeds.news.count < 1 || report.publicFeeds.images.count < 1 || report.publicFeeds.videos.count < 1) throw new Error("One or more AppDeploy public feeds returned no results: " + JSON.stringify(report.publicFeeds));
              await page.setViewportSize({ width: 390, height: 844 });
              await page.goto(report.url, { waitUntil: "domcontentloaded", timeout: 45000 });
              await page.locator(".everythinghub-approved-home-art img.approved-master-image").first().waitFor({ state: "visible", timeout: 30000 });
              report.mobile = await page.evaluate(() => ({ viewportWidth: document.documentElement.clientWidth, documentWidth: document.documentElement.scrollWidth, artworkVisible: !!document.querySelector(".everythinghub-approved-home-art img.approved-master-image")?.getClientRects().length, searchVisible: !!Array.from(document.querySelectorAll("form.homepage-live-search input#hub-search")).some(el => el.getClientRects().length), categories: document.querySelectorAll("nav.hub-hero-divisions button").length }));
              await page.screenshot({ path: "everythinghub-production-mobile.png", fullPage: true });
              if (report.mobile.documentWidth > report.mobile.viewportWidth + 2 || !report.mobile.artworkVisible || !report.mobile.searchVisible || report.mobile.categories !== 8) throw new Error("AppDeploy mobile layout failed: " + JSON.stringify(report.mobile));
              if (pageErrors.length) throw new Error("AppDeploy browser page errors: " + pageErrors.join("; "));
              report.passed = true;
            } catch (error) {
              report.error = error instanceof Error ? error.message : String(error);
              await page.screenshot({ path: "everythinghub-production-failure.png", fullPage: true }).catch(() => undefined);
            } finally {
              report.pageErrors = pageErrors;
              report.consoleErrors = consoleErrors;
              fs.writeFileSync("production-report.json", JSON.stringify(report, null, 2));
              await browser.close();
            }
            if (!report.passed) process.exit(1);
            console.log(JSON.stringify(report, null, 2));
          })();
          JS
          node production-check.cjs
      - name: Save production screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everything-hub-browser-check
          path: |
            everything-hub-homepage.png
            everything-hub-rolex.png
            everything-hub-las-vegas.png
            everything-hub-nasa.png
            everything-hub-mobile.png
            everything-hub-failure.png
            production-report.json
          if-no-files-found: warn
          retention-days: 30

  free-fallback-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_URL: https://everythinghub-homepage-fixed.vercel.app/
    steps:
      - uses: actions/checkout@v4
