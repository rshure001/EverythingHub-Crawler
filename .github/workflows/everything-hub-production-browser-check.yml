      - name: Save production screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everything-hub-browser-check
          path: |
            everythinghub-production-*.png
            production-report.json
          if-no-files-found: warn
          retention-days: 30

  free-fallback-browser-check:
    needs: production-browser-check
    if: ${{ always() && needs.production-browser-check.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_URL: https://everythinghub-homepage-fixed.vercel.app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify fallback source contract
        run: |
          node --test vercel-homepage/fallback-contract.test.js
          node --check vercel-homepage/fallback/inline-script.js
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify live fallback at desktop and mobile widths
        run: |
          cat > fallback-check.cjs <<'JS'
          const { chromium } = require("playwright");
          const fs = require("fs");
          const expectedArtwork = "https://everythinghub-search-engine-4x25f8.v2.appdeploy.ai/resources/everythinghub-approved-octopus.png";
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            page.setDefaultTimeout(30000);
            const pageErrors = [];
            const consoleErrors = [];
            page.on("pageerror", error => pageErrors.push(error.message));
            page.on("console", message => { if (message.type() === "error") consoleErrors.push(message.text()); });
            const report = { url: process.env.TARGET_URL, backendUrl: "https://everythinghub-search-backend.vercel.app/", deploymentMode: "free-vercel-fallback", startedAt: new Date().toISOString(), searches: {}, categorySearches: {}, newsCategories: {}, coreLinks: {} };
            report.apiProbes = {};
            async function goHome() {
              const response = await page.goto(report.url, { waitUntil: "domcontentloaded", timeout: 45000 });
              if (!response || !response.ok()) throw new Error("Homepage HTTP status: " + (response && response.status()));
              await page.locator(".art img").waitFor({ state: "visible", timeout: 20000 });
              await page.waitForFunction(() => {
                const image = document.querySelector(".art img");
                return !!image && image.complete && image.naturalWidth >= 100;
              }, null, { timeout: 20000 });
              return response;
            }
            async function readResultCards() {
              const count = await page.locator("#results .eh-result").count();
              const titles = (await page.locator("#results .eh-result a").allTextContents()).map(value => value.trim()).filter(Boolean);
              return { count, titles: titles.slice(0, 8), status: await page.locator("#status").innerText() };
            }
            async function categorySearch(mode, query, selector, expectedPattern) {
              await goHome();
              await page.locator('.hotspots [data-mode="' + mode + '"]').click();
              const selected = await page.locator("#status").innerText();
              if (!selected.toLowerCase().includes("selected")) throw new Error("Category did not activate: " + mode);
              await page.locator("#query").fill(query);
              await page.locator("#searchForm button[type=submit]").click();
              await page.locator(selector).first().waitFor({ state: "visible", timeout: 60000 });
              const count = await page.locator(selector).count();
              const titles = (await page.locator(selector + " a").allTextContents()).map(value => value.trim()).filter(Boolean);
              const status = await page.locator("#status").innerText();
              if (!count) throw new Error("Category returned no visible results: " + mode + " / " + query);
              if (expectedPattern && !titles.some(title => expectedPattern.test(title))) throw new Error("Category results were not relevant: " + mode + " / " + titles.slice(0, 5).join(" | "));
              return { count, titles: titles.slice(0, 8), status };
            }
            try {
              const response = await goHome();
              report.httpStatus = response.status();
              report.title = await page.title();
              report.artwork = await page.locator(".art img").evaluate(image => ({
                src: image.currentSrc,
                naturalWidth: image.naturalWidth,
                naturalHeight: image.naturalHeight,
                renderedWidth: image.getBoundingClientRect().width
              }));
              report.desktopLayout = await page.evaluate(() => {
                const art = document.querySelector(".art").getBoundingClientRect();
                const results = document.querySelector("#results").getBoundingClientRect();
                return {
                  viewportWidth: document.documentElement.clientWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  artRight: art.right,
                  artBottom: art.bottom,
                  resultsTop: results.top,
                  mainDirection: getComputedStyle(document.querySelector("main")).flexDirection
                };
              });
              report.searchInputCount = await page.locator("#query").count();
              report.categoryModes = await page.locator(".hotspots [data-mode]").evaluateAll(items => items.map(item => item.dataset.mode));
              if (report.artwork.src !== expectedArtwork || report.artwork.naturalWidth < 1000 || report.artwork.naturalHeight < 1000) throw new Error("Approved artwork source or dimensions changed: " + JSON.stringify(report.artwork));
              if (!report.title.includes("Everything Hub") || report.searchInputCount !== 1 || report.categoryModes.length !== 8) throw new Error("Homepage branding/search/category contract failed.");
              if (report.desktopLayout.documentWidth > report.desktopLayout.viewportWidth + 2 || report.desktopLayout.resultsTop < report.desktopLayout.artBottom - 2) throw new Error("Desktop layout overflow or overlap: " + JSON.stringify(report.desktopLayout));
              await page.screenshot({ path: "everythinghub-fallback-home.png", fullPage: true });

              for (const query of ["Rolex","Las Vegas","NASA"]) {
                const apiUrl = new URL("https://everythinghub-search-backend.vercel.app/api/search");
                apiUrl.searchParams.set("q", query);
                apiUrl.searchParams.set("limit", "20");
                apiUrl.searchParams.set("lane", "web");
                const apiResponse = await page.request.get(apiUrl.toString(), { timeout: 30000 });
                let apiBody = {};
                try { apiBody = await apiResponse.json(); } catch (error) { apiBody = { parseError: String(error) }; }
                report.apiProbes[query] = { status: apiResponse.status(), pageResults: Array.isArray(apiBody.results) ? apiBody.results.length : 0, catalogResults: Array.isArray(apiBody.catalogResults) ? apiBody.catalogResults.length : 0, externalCatalogResults: Array.isArray(apiBody.externalCatalogResults) ? apiBody.externalCatalogResults.length : 0, catalogPreview: apiBody.catalogPreview || null, providers: apiBody.providers || [], error: apiBody.error || apiBody.message || null };
                if (apiResponse.status() !== 200 || !Array.isArray(apiBody.catalogResults) || !apiBody.catalogResults.length || !Array.isArray(apiBody.externalCatalogResults) || !apiBody.externalCatalogResults.length) throw new Error(query + " first-party external catalog API probe failed: " + JSON.stringify(report.apiProbes[query]));
              }


              for (const query of ["Rolex", "Las Vegas", "NASA"]) {
                await goHome();
                await page.locator("#query").fill(query);
                await page.locator("#searchForm button[type=submit]").click();
                await page.locator("#results .eh-result").first().waitFor({ state: "visible", timeout: 60000 });
                const result = await readResultCards();
                const pattern = query === "Rolex" ? /rolex/i : query === "Las Vegas" ? /las vegas|vegas/i : /nasa/i;
                if (!result.count || !result.titles.some(title => pattern.test(title))) throw new Error(query + " did not return relevant visible web results: " + JSON.stringify(result));
                await page.locator("#results .eh-catalog-result").first().waitFor({ state: "visible", timeout: 35000 });
                const catalogCards = page.locator("#results .eh-catalog-result");
                const catalogCount = await catalogCards.count();
                const catalogTitles = await catalogCards.locator("a").allTextContents();
                const catalogMatched = await catalogCards.locator(".catalog-matched").allTextContents();
                const catalogRelevance = await catalogCards.locator(".catalog-relevance").allTextContents();
                const catalogRights = await catalogCards.locator(".catalog-rights").allTextContents();
                const catalogSources = await catalogCards.evaluateAll(nodes => nodes.map(node => node.dataset.sourceOrigin || node.dataset.sourceKind || ""));
                const catalogDisplaySources = await catalogCards.evaluateAll(nodes => nodes.map(node => node.dataset.sourceKind || ""));
                const catalogFlags = await catalogCards.evaluateAll(nodes => nodes.map(node => ({
                  id: node.dataset.catalogId,
                  previewOnly: node.dataset.previewOnly,
                  commercialEligible: node.dataset.commercialEligible
                })));
                const familyLinksVisible = query === "Rolex" && /Submariner/.test(catalogMatched.join(" ")) && /Datejust/.test(catalogMatched.join(" ")) && /Cosmograph Daytona/.test(catalogMatched.join(" "));
                const lasVegasResourcesVisible = query === "Las Vegas" && /Business License/.test(catalogMatched.join(" ")) && /Things to Do/.test(catalogMatched.join(" "));
                const nasaResourcesVisible = query === "NASA" && /NASA Earthdata Search/.test(catalogMatched.join(" ")) && /NASA Image and Video Library/.test(catalogMatched.join(" "));
                const externalDirectoryVisible = catalogSources.includes("curated_external_link_directory") || catalogDisplaySources.includes("external_link_only");
                const relevantCatalog = (query === "Rolex" && familyLinksVisible && externalDirectoryVisible) ||
                  (query === "Las Vegas" && lasVegasResourcesVisible && externalDirectoryVisible) ||
                  (query === "NASA" && nasaResourcesVisible && externalDirectoryVisible) ||
                  catalogMatched.some(text => pattern.test(text)) || catalogTitles.some(title => pattern.test(title));
                if (!catalogCount || !relevantCatalog) throw new Error(query + " returned no relevant visible catalog preview: " + JSON.stringify({catalogCount,catalogTitles,catalogMatched}));
                const isExternalDirectory = index => catalogSources[index] === "curated_external_link_directory" || catalogDisplaySources[index] === "external_link_only";
                const rightsValid = catalogRights.every((text, index) => {
                  if (isExternalDirectory(index)) {
                    return /External links only/.test(text) && /destination terms and rights apply/.test(text) && /no source-page records republished/.test(text);
                  }
                  const unreviewedCandidate = /Candidate preview only/.test(text) &&
                    /Record rights not cleared/.test(text) && /Commercial use not cleared/.test(text);
                  const reviewedRecordCandidate = /Candidate preview only/.test(text) &&
                    /Source terms reviewed per dataset/.test(text) &&
                    /Record rights:\s*eligible per record/.test(text) &&
                    /Commercial use not cleared/.test(text);
                  return unreviewedCandidate || reviewedRecordCandidate;
                });
                const pageDerivedCatalogVisible = catalogDisplaySources.some((source, index) => !isExternalDirectory(index) && source === "page-derived");
                if (query !== "Rolex" && !pageDerivedCatalogVisible) {
                  throw new Error(query + " must show at least one page-derived catalog as well as any external directory: " + JSON.stringify({catalogDisplaySources,catalogSources}));
                }
                if (!catalogFlags.every(item => item.id && item.previewOnly === "true" && item.commercialEligible === "false") ||
                    !catalogRelevance.every(text => text.trim().length > 0) || !rightsValid) {
                  throw new Error(query + " catalog preview rights or identity labels failed: " + JSON.stringify({catalogFlags,catalogRelevance,catalogRights,catalogSources,catalogDisplaySources}));
                }
                report.searches[query] = {...result,status:await page.locator("#status").textContent(),catalogPreview:{count:catalogCount,titles:catalogTitles,matched:catalogMatched,relevance:catalogRelevance,rights:catalogRights,sources:catalogSources,familyLinksVisible,lasVegasResourcesVisible,nasaResourcesVisible,externalDirectoryVisible,displaySources:catalogDisplaySources}};

                await page.screenshot({ path: "everythinghub-fallback-" + query.toLowerCase().replace(/\s+/g, "-") + ".png", fullPage: true });
              }

              const nasaLink = await page.locator("#results .eh-result a").first().evaluate(anchor => ({
                href: anchor.href, target: anchor.target, rel: anchor.rel
              }));
              if (!/^https?:\/\//i.test(nasaLink.href) || nasaLink.target !== "_blank" || !nasaLink.rel.includes("noopener")) throw new Error("Search result link contract failed: " + JSON.stringify(nasaLink));
              const popupPromise = page.waitForEvent("popup", { timeout: 10000 });
              await page.locator("#results .eh-result a").first().click();
              const popup = await popupPromise;
              await popup.waitForLoadState("domcontentloaded", { timeout: 15000 }).catch(() => undefined);
              report.coreLinks.searchResult = { ...nasaLink, openedUrl: popup.url() };
              await popup.close().catch(() => undefined);

              const categoryCases = [
                { mode: "web", query: "NASA", pattern: /nasa/i },
                { mode: "news", query: "NASA", pattern: /nasa|space|mars/i },
                { mode: "shopping", query: "Rolex", pattern: /rolex/i },
                { mode: "places", query: "Las Vegas", pattern: /las vegas|vegas/i },
                { mode: "business", query: "Las Vegas", pattern: /las vegas|vegas/i },
                { mode: "research", query: "NASA", pattern: /nasa/i }
              ];
              for (const item of categoryCases) {
                report.categorySearches[item.mode] = await categorySearch(item.mode, item.query, "#results .eh-result", item.pattern);
              }

              await goHome();
              await page.locator("#news-items .news-item").first().waitFor({ state: "visible", timeout: 30000 });
              const newsApi = await page.evaluate(async () => {
                const response = await fetch("https://everythinghub-search-backend.vercel.app/api/news?category=for-you");
                return { http: response.status, data: await response.json() };
              });
              const newsData = newsApi.data;
              const newsTitles = (await page.locator("#news-items .news-item a").allTextContents()).map(value => value.trim().toLowerCase());
              const latestPublished = (newsData.items || []).map(item => Date.parse(item.publishedAt || "")).filter(Number.isFinite).sort((a, b) => b - a)[0] || null;
              report.news = {
                topStories: await page.locator("#news-items .news-item").count(),
                uniqueTitles: new Set(newsTitles).size,
                status: await page.locator("#news-status").innerText(),
                apiHttp: newsApi.http,
                updatedAt: newsData.updatedAt,
                updateAgeMinutes: (Date.now() - Date.parse(newsData.updatedAt)) / 60000,
                latestPublishedAt: latestPublished ? new Date(latestPublished).toISOString() : null,
                latestPublishedAgeHours: latestPublished ? (Date.now() - latestPublished) / 3600000 : null
              };
              if (report.news.topStories < 5 || report.news.uniqueTitles !== report.news.topStories || newsApi.http !== 200 || newsData.status !== "ok" || report.news.updateAgeMinutes > 30 || !latestPublished || report.news.latestPublishedAgeHours > 24) throw new Error("Top Stories freshness or uniqueness failed: " + JSON.stringify(report.news));
              for (const category of ["world", "technology", "business", "science"]) {
                const responsePromise = page.waitForResponse(response => {
                  try {
                    const url = new URL(response.url());
                    return url.pathname.endsWith("/api/news") && url.searchParams.get("category") === category && response.ok();
                  } catch { return false; }
                }, { timeout: 30000 });
                await page.locator('[data-news="' + category + '"]').click();
                const categoryResponse = await responsePromise;
                const categoryData = await categoryResponse.json();
                await page.locator("#news-items .news-item").first().waitFor({ state: "visible", timeout: 20000 });
                const active = await page.locator('[data-news="' + category + '"]').evaluate(button => button.classList.contains("active"));
                const count = await page.locator("#news-items .news-item").count();
                if (!active || count < 1 || categoryData.status !== "ok") throw new Error("News tab failed: " + category);
                report.newsCategories[category] = { count, updatedAt: categoryData.updatedAt, firstTitle: categoryData.items?.[0]?.title || "" };
              }
              const refreshPromise = page.waitForResponse(response => {
                try {
                  const url = new URL(response.url());
                  return url.pathname.endsWith("/api/news") && url.searchParams.get("category") === "science" && response.ok();
                } catch { return false; }
              }, { timeout: 30000 });
              await page.locator("#news-refresh").click();
              const refreshResponse = await refreshPromise;
              const refreshData = await refreshResponse.json();
              report.newsRefresh = { http: refreshResponse.status(), count: refreshData.count, updatedAt: refreshData.updatedAt };
              if (refreshData.status !== "ok" || refreshData.count < 1) throw new Error("Top Stories Refresh failed.");
              const newsLink = await page.locator("#news-items .news-item a").first().evaluate(anchor => ({ href: anchor.href, target: anchor.target, rel: anchor.rel }));
              if (!/^https?:\/\//i.test(newsLink.href) || newsLink.target !== "_blank" || !newsLink.rel.includes("noopener")) throw new Error("News article link contract failed.");
              report.coreLinks.news = newsLink;
              await page.screenshot({ path: "everythinghub-fallback-news.png", fullPage: true });

              await goHome();
              await page.locator('.hotspots [data-mode="images"]').click();
              await page.locator("#query").fill("NASA");
              await page.locator("#searchForm button[type=submit]").click();
              await page.locator("#results .media-card").first().waitFor({ state: "visible", timeout: 45000 });
              const imageCards = page.locator("#results .media-card");
              const imageCardCount = await imageCards.count();
              for (let index = 0; index < imageCardCount; index++) {
                const image = imageCards.nth(index).locator("img");
                if (await image.count()) {
                  await image.scrollIntoViewIfNeeded();
                  await image.evaluate(node => Promise.race([
                    node.decode().then(() => true).catch(() => false),
                    new Promise(resolve => setTimeout(() => resolve(false), 8000))
                  ])).catch(() => false);
                }
              }
              report.imageSearch = await imageCards.evaluateAll(cards => {
                const ccBy = license => /^cc by(-sa)?\s+/i.test(String(license || ""));
                const details = cards.map(card => {
                  const license = card.dataset.license || "";
                  const creator = card.dataset.creator || "";
                  const small = card.querySelector("small");
                  const text = small?.textContent || "";
                  const licenseLink = Array.from(small?.querySelectorAll("a") || []).find(anchor => /^https:\/\/creativecommons\.org\//i.test(anchor.href));
                  const sourcePresent = /Source:\s*Internet Archive/i.test(text);
                  const licensePresent = !!license && !!licenseLink && licenseLink.textContent === license && text.includes(license);
                  const creatorValid = !ccBy(license) || (!!creator && !/^(internet archive|unknown|anonymous|not specified|n\/a)$/i.test(creator));
                  return { license, creator, sourcePresent, licensePresent, creatorValid, licenseHref: licenseLink?.href || null, text };
                });
                const badAttribution = details.filter(item => !item.sourcePresent || !item.licensePresent || !item.creatorValid).length;
                const ccByCards = cards.filter(card => ccBy(card.dataset.license)).length;
                const ccByCardsWithLinks = cards.filter(card => ccBy(card.dataset.license) && !!Array.from(card.querySelectorAll("small a")).find(anchor => /^https:\/\/creativecommons\.org\//i.test(anchor.href))).length;
                return {
                  cards: cards.length,
                  loadedThumbnails: cards.filter(card => {
                    const image = card.querySelector("img");
                    return !!image && image.complete && image.naturalWidth > 0;
                  }).length,
                  placeholders: cards.filter(card => !!card.querySelector(".image-placeholder")).length,
                  attributionCards: details.filter(item => item.sourcePresent && item.licensePresent && item.creatorValid).length,
                  badAttribution,
                  ccByCards,
                  ccByCardsWithLinks,
                  attributionDetails: details.slice(0, 6),
                  sampleAttributions: cards.slice(0, 4).map(card => card.querySelector("small")?.textContent || "")
                };
              });
              const imageSourceLink = await page.locator("#results .media-card > a").first().evaluate(anchor => ({ href: anchor.href, target: anchor.target, rel: anchor.rel }));
              if (report.imageSearch.cards < 8 || report.imageSearch.loadedThumbnails < 8 || report.imageSearch.placeholders !== 0 ||
                  report.imageSearch.attributionCards !== report.imageSearch.cards || report.imageSearch.badAttribution !== 0 ||
                  report.imageSearch.ccByCardsWithLinks !== report.imageSearch.ccByCards ||
                  !/^https:\/\/archive\.org\/details\//i.test(imageSourceLink.href)) throw new Error("Licensed image thumbnails or attribution failed: " + JSON.stringify(report.imageSearch));
              report.categorySearches.images = { cards: report.imageSearch.cards, loadedThumbnails: report.imageSearch.loadedThumbnails };
              report.coreLinks.images = imageSourceLink;
              await page.screenshot({ path: "everythinghub-fallback-images.png", fullPage: true });

              await goHome();
              await page.locator('.hotspots [data-mode="videos"]').click();
              await page.locator("#query").fill("animation");
              await page.locator("#searchForm button[type=submit]").click();
              await page.locator("#results .video-card").first().waitFor({ state: "visible", timeout: 45000 });
              const videoCards = page.locator("#results .video-card");
              const videoCardCount = await videoCards.count();
              for (let index = 0; index < videoCardCount; index++) {
                const image = videoCards.nth(index).locator("img");
                if (await image.count()) {
                  await image.scrollIntoViewIfNeeded();
                  await image.evaluate(node => Promise.race([
                    node.decode().then(() => true).catch(() => false),
                    new Promise(resolve => setTimeout(() => resolve(false), 8000))
                  ])).catch(() => false);
                }
              }
              report.videoSearch = await videoCards.evaluateAll(cards => ({
                cards: cards.length,
                loadedThumbnails: cards.filter(card => {
                  const image = card.querySelector("img");
                  return !!image && image.complete && image.naturalWidth > 0;
                }).length,
                fallbacks: cards.filter(card => !!card.querySelector(".video-placeholder")).length,
                sampleTitles: cards.slice(0, 5).map(card => card.querySelectorAll("a")[1]?.textContent?.trim() || ""),
                titledCards: cards.filter(card => {
                  const title = (card.querySelectorAll("a")[1]?.textContent || "").trim();
                  return title.length > 0;
                }).length,
                nonGenericTitles: cards.filter(card => {
                  const title = (card.querySelectorAll("a")[1]?.textContent || "").trim();
                  return title.length > 0 && title.toLowerCase() !== "video";
                }).length
              }));
              const videoLink = await page.locator("#results .video-card > a").first().evaluate(anchor => ({ href: anchor.href, target: anchor.target, rel: anchor.rel }));
              if (report.videoSearch.cards < 2 || report.videoSearch.loadedThumbnails < 2 || report.videoSearch.fallbacks !== 0 || report.videoSearch.nonGenericTitles < 2 ||
                  !/^https:\/\/archive\.org\/details\//i.test(videoLink.href)) throw new Error("Video cards or thumbnails failed: " + JSON.stringify(report.videoSearch));
              report.categorySearches.videos = { cards: report.videoSearch.cards, loadedThumbnails: report.videoSearch.loadedThumbnails };
              report.coreLinks.videos = videoLink;
              await page.screenshot({ path: "everythinghub-fallback-videos.png", fullPage: true });

              await page.setViewportSize({ width: 390, height: 844 });
              await goHome();
              report.mobile = await page.evaluate(() => {
                const art = document.querySelector(".art").getBoundingClientRect();
                const search = document.querySelector("#searchForm").getBoundingClientRect();
                const input = document.querySelector("#query").getBoundingClientRect();
                const categories = document.querySelector(".hotspots").getBoundingClientRect();
                const stories = document.querySelector("#top-stories").getBoundingClientRect();
                const results = document.querySelector("#results").getBoundingClientRect();
                return {
                  viewportWidth: document.documentElement.clientWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  artworkVisible: !!document.querySelector(".art img")?.getClientRects().length,
                  searchVisible: !!document.querySelector("#query")?.getClientRects().length,
                  categories: document.querySelectorAll(".hotspots [data-mode]").length,
                  artworkWidth: art.width,
                  artworkBottom: art.bottom,
                  searchBottom: Math.max(search.bottom, input.bottom),
                  categoriesTop: categories.top,
                  categoriesBottom: categories.bottom,
                  storiesLeft: stories.left,
                  storiesRight: stories.right,
                  resultsTop: results.top,
                  brokenImages: [...document.images].filter(image => image.complete && image.naturalWidth === 0).length
                };
              });
              await page.screenshot({ path: "everythinghub-fallback-mobile.png", fullPage: true });
              if (report.mobile.documentWidth > report.mobile.viewportWidth + 2 ||
                  !report.mobile.artworkVisible || !report.mobile.searchVisible || report.mobile.categories !== 8 ||
                  report.mobile.artworkWidth < report.mobile.viewportWidth - 4 ||
                  report.mobile.searchBottom > report.mobile.categoriesTop + 2 ||
                  report.mobile.categoriesBottom > report.mobile.artworkBottom + 2 ||
                  report.mobile.storiesLeft < -2 || report.mobile.storiesRight > report.mobile.viewportWidth + 2 ||
                  report.mobile.resultsTop < report.mobile.artworkBottom - 2 || report.mobile.brokenImages !== 0) {
                throw new Error("Mobile layout, overlap, or image check failed: " + JSON.stringify(report.mobile));
              }

              report.browserErrors = { pageErrors, consoleErrors };
              report.categorySearchCount = Object.keys(report.categorySearches).length;
              report.finishedAt = new Date().toISOString();
              report.passed = report.httpStatus === 200 && report.searchInputCount === 1 &&
                report.categorySearchCount === 8 && report.news.topStories >= 5 &&
                Object.values(report.newsCategories).every(value => value.count > 0) &&
                report.newsRefresh.http === 200 && report.imageSearch.loadedThumbnails >= 8 &&
                report.imageSearch.badAttribution === 0 && report.videoSearch.loadedThumbnails >= 2 && report.videoSearch.nonGenericTitles >= 2 &&
                report.mobile.documentWidth <= report.mobile.viewportWidth + 2 &&
                pageErrors.length === 0 && consoleErrors.length === 0;
              if (!report.passed) throw new Error("One or more live fallback acceptance gates failed.");
            } catch (error) {
              report.error = error instanceof Error ? error.message : String(error);
              report.finishedAt = new Date().toISOString();
              await page.screenshot({ path: "everythinghub-fallback-failure.png", fullPage: true }).catch(() => undefined);
              try {
                await page.setViewportSize({ width: 390, height: 844 });
                report.mobileDiagnostic = await page.evaluate(() => ({
                  viewportWidth: document.documentElement.clientWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  title: document.title,
                  bodyText: (document.body?.innerText || "").slice(0, 500),
                  brokenImages: [...document.images].filter(image => image.complete && image.naturalWidth === 0).length
                }));
                await page.screenshot({ path: "everythinghub-fallback-mobile-failure.png", fullPage: true }).catch(() => undefined);
              } catch (mobileError) {
                report.mobileDiagnosticError = mobileError instanceof Error ? mobileError.message : String(mobileError);
              }
            } finally {
              report.browserErrors = { pageErrors, consoleErrors };
              fs.writeFileSync("fallback-report.json", JSON.stringify(report, null, 2));
              await browser.close();
            }
            if (!report.passed) process.exit(1);
            console.log(JSON.stringify(report, null, 2));
          })().catch(error => { console.error(error); process.exit(1); });
