              }

              const apiResponse = (path, predicate) => report.apiResponses.filter(item => {
                const parsed = new URL(item.url);
                return parsed.pathname.endsWith(path) && item.status === 200 && predicate(parsed);
              }).slice(-1)[0] || null;
              const searchResponse = apiResponse("/api/search", parsed =>
                (parsed.searchParams.get("q") || "").toLowerCase() === "nasa" &&
                (parsed.searchParams.get("vertical") || "web") === "web");
