# Live acceptance verifies the low-latency public RSS fallback when the full catalog index is cold.
name: Everything Hub browser verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/everything-hub-production-browser-check.yml'
      - 'vercel-homepage/**'
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish and verify Everything Hub — in-house Supabase route"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: eh-browser-check
  cancel-in-progress: true
jobs:
  production-browser-check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_URL: https://everythinghub-search-engine-4x25f8.v2.appdeploy.ai/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify live AppDeploy homepage, search, categories, news, and mobile layout
        run: |
          cat > production-check.cjs <<'JS'
          const { chromium } = require("playwright");
          const fs = require("fs");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            const consoleErrors = [];
            page.on("pageerror", error => pageErrors.push(error.message));
            page.on("console", message => { if (message.type() === "error") consoleErrors.push(message.text()); });
            const report = { url: process.env.TARGET_URL, startedAt: new Date().toISOString(), artwork: null, divisions: [], searches: {}, publicFeeds: {}, mobile: null, pageErrors, consoleErrors, passed: false };
            try {
              const homeResponse = await page.goto(report.url, { waitUntil: "domcontentloaded", timeout: 45000 });
              if (!homeResponse || !homeResponse.ok()) throw new Error("AppDeploy homepage did not return HTTP 200");
              const art = page.locator(".everythinghub-approved-home-art img.approved-master-image").first();
              await art.waitFor({ state: "visible", timeout: 30000 });
              await page.waitForFunction(() => {
                const img = document.querySelector(".everythinghub-approved-home-art img.approved-master-image");
                return !!img && img.complete && img.naturalWidth >= 800;
              }, null, { timeout: 30000 });
              report.artwork = await art.evaluate(img => ({ src: img.currentSrc || img.src, width: img.naturalWidth, height: img.naturalHeight, complete: img.complete }));
              if (!report.artwork.src.includes("everythinghub-approved-octopus.png")) throw new Error("Approved original octopus artwork is not being used");
              const inputSelector = "form.homepage-live-search:visible input#hub-search";
              await page.locator(inputSelector).first().waitFor({ state: "visible", timeout: 15000 });
              const divisionButtons = page.locator("nav.hub-hero-divisions button");
              report.divisions = await divisionButtons.evaluateAll(buttons => buttons.map(button => button.getAttribute("aria-label") || button.innerText.trim()));
              if (report.divisions.length !== 8) throw new Error("Expected 8 clickable divisions; found " + report.divisions.length);
              await divisionButtons.first().click();
              await page.locator(".division-workspace").waitFor({ state: "visible", timeout: 15000 });
              report.divisionInteraction = await page.locator(".division-workspace h2").innerText();
              await page.locator(".workspace-close").click();
              for (const query of ["Rolex", "Las Vegas", "NASA"]) {
                await page.goto(report.url, { waitUntil: "domcontentloaded", timeout: 45000 });
                const form = page.locator("form.homepage-live-search:visible").first();
                const input = form.locator("input#hub-search").first();
                await input.fill(query);
                await input.press("Enter");
                await page.waitForFunction(() => !!document.querySelector(".eh-result-card") || !!document.querySelector(".empty-state"), null, { timeout: 45000 });
                const count = await page.locator(".eh-result-card").count();
                const status = await page.locator(".status-line").first().innerText().catch(() => "");
                const titles = await page.locator(".eh-result-title").allTextContents();
                report.searches[query] = { visibleCards: count, status, titles: titles.slice(0, 5) };
                await page.screenshot({ path: "everythinghub-production-" + query.toLowerCase().replace(/\s+/g, "-") + ".png", fullPage: true });
                if (!count) throw new Error(query + " returned no visible AppDeploy search results; status=" + status);
              }
              await page.goto(report.url, { waitUntil: "domcontentloaded", timeout: 45000 });
              report.publicFeeds = await page.evaluate(async () => {
                const get = async path => {
                  try {
                    const response = await fetch(path);
                    const data = await response.json();
                    return { ok: response.ok, count: Array.isArray(data.results) ? data.results.length : 0, providers: data.providers || [], message: data.message || "" };
                  } catch (error) { return { ok: false, count: 0, message: String(error) }; }
                };
                const [news, images, videos] = await Promise.all([
                  get("/api/search?q=latest%20world%20news&limit=10&vertical=news"),
                  get("/api/images?q=dog"),
                  get("/api/videos?q=NASA")
                ]);
                return { news, images, videos };
              });
              if (report.publicFeeds.news.count < 1 || report.publicFeeds.images.count < 1 || report.publicFeeds.videos.count < 1) throw new Error("One or more AppDeploy public feeds returned no results: " + JSON.stringify(report.publicFeeds));
              await page.setViewportSize({ width: 390, height: 844 });
              await page.goto(report.url, { waitUntil: "domcontentloaded", timeout: 45000 });
              await page.locator(".everythinghub-approved-home-art img.approved-master-image").first().waitFor({ state: "visible", timeout: 30000 });
              report.mobile = await page.evaluate(() => ({ viewportWidth: document.documentElement.clientWidth, documentWidth: document.documentElement.scrollWidth, artworkVisible: !!document.querySelector(".everythinghub-approved-home-art img.approved-master-image")?.getClientRects().length, searchVisible: !!Array.from(document.querySelectorAll("form.homepage-live-search input#hub-search")).some(el => el.getClientRects().length), categories: document.querySelectorAll("nav.hub-hero-divisions button").length }));
              await page.screenshot({ path: "everythinghub-production-mobile.png", fullPage: true });
              if (report.mobile.documentWidth > report.mobile.viewportWidth + 2 || !report.mobile.artworkVisible || !report.mobile.searchVisible || report.mobile.categories !== 8) throw new Error("AppDeploy mobile layout failed: " + JSON.stringify(report.mobile));
              if (pageErrors.length) throw new Error("AppDeploy browser page errors: " + pageErrors.join("; "));
              report.passed = true;
            } catch (error) {
              report.error = error instanceof Error ? error.message : String(error);
              await page.screenshot({ path: "everythinghub-production-failure.png", fullPage: true }).catch(() => undefined);
            } finally {
              report.pageErrors = pageErrors;
              report.consoleErrors = consoleErrors;
              fs.writeFileSync("production-report.json", JSON.stringify(report, null, 2));
              await browser.close();
            }
            if (!report.passed) process.exit(1);
            console.log(JSON.stringify(report, null, 2));
          })();
          JS
          node production-check.cjs
      - name: Save production screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everything-hub-browser-check
          path: |
            everything-hub-homepage.png
            everything-hub-rolex.png
            everything-hub-las-vegas.png
            everything-hub-nasa.png
            everything-hub-mobile.png
            everything-hub-failure.png
            production-report.json
          if-no-files-found: warn
          retention-days: 3

  free-fallback-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_URL: https://everythinghub-homepage-fixed-rshure001-8053.vercel.app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify free Vercel fallback, live search, and mobile layout
        run: |
          cat > fallback-check.cjs <<'JS'
          const { chromium } = require("playwright");
          const fs = require("fs");
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[];
            page.on("pageerror",e=>errors.push(e.message));
              page.on("console",m=>{if(m.type()==="error")errors.push("console: "+m.text());});
            const report={url:process.env.TARGET_URL,startedAt:new Date().toISOString(),searches:{}};
            try {
              const response=await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
              const image=page.locator(".art img").first();
              await image.waitFor({state:"visible",timeout:20000});
              await page.waitForFunction(()=>{const i=document.querySelector(".art img");return !!i&&i.complete&&i.naturalWidth>=100;},null,{timeout:20000});
              report.httpStatus=response?.status();
              report.title=await page.title();
              report.artwork=await image.evaluate(i=>({src:i.currentSrc,width:i.naturalWidth,height:i.naturalHeight,renderedWidth:i.getBoundingClientRect().width}));
              if(!report.artwork.src.includes("everythinghub-approved-octopus.png"))throw new Error("Approved master artwork is not being used: "+report.artwork.src);
              report.desktopLayout=await page.evaluate(()=>{const a=document.querySelector(".art").getBoundingClientRect(),r=document.querySelector("#results").getBoundingClientRect();return {mainDirection:getComputedStyle(document.querySelector("main")).flexDirection,artRight:a.right,artBottom:a.bottom,resultsTop:r.top,viewportWidth:document.documentElement.clientWidth}});
              report.searchInputCount=await page.locator("#query").count();
              report.categoryCount=await page.locator(".hotspots [data-mode]").count();
              report.categoryModes=await page.locator(".hotspots [data-mode]").evaluateAll(xs=>xs.map(x=>x.dataset.mode));
              if(!response?.ok()||!report.title.includes("Everything Hub")||report.searchInputCount!==1||report.categoryCount!==8||report.artwork.renderedWidth<700||report.desktopLayout.mainDirection!=="column"||report.desktopLayout.resultsTop<report.desktopLayout.artBottom)throw new Error("Fallback homepage structure failed: "+JSON.stringify(report));
              await page.screenshot({path:"everythinghub-fallback-home.png",fullPage:true});
              for(const mode of report.categoryModes){
                await page.locator(".hotspots [data-mode=\""+mode+"\"]").click();
                const selected=await page.locator("#status").innerText();
                if(!selected.toLowerCase().includes("selected"))throw new Error("Category did not activate: "+mode+" / "+selected);
              }
              for(const query of ["Rolex","Las Vegas","NASA"]){
                await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
                await page.locator("#query").fill(query);
                await page.locator("#searchForm button[type=submit]").click();
                await page.waitForFunction(()=>!!document.querySelector("#results .eh-result")||!!document.querySelector("#results .results-empty"),null,{timeout:60000});
                const count=await page.locator("#results .eh-result").count();
                const titles=await page.locator("#results .eh-result a").allTextContents();
                const statusText=await page.locator("#status").innerText();
                const emptyText=await page.locator("#results .results-empty").first().textContent().catch(()=> "");
                report.searches[query]={visibleCards:count,titles:titles.slice(0,5),status:statusText,emptyMessage:emptyText};
                if(!count){await page.screenshot({path:"everythinghub-fallback-"+query.toLowerCase().replace(/\s+/g,"-")+"-failure.png",fullPage:true});throw new Error(query+" returned no visible results; status="+statusText+"; detail="+emptyText+"; pageErrors="+errors.join("; "));}
                await page.screenshot({path:"everythinghub-fallback-"+query.toLowerCase().replace(/\s+/g,"-")+".png",fullPage:true});
              }
              await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
              await page.locator("#news-items .news-item").first().waitFor({state:"visible",timeout:30000});
              report.news={topStories:await page.locator("#news-items .news-item").count(),status:await page.locator("#news-status").innerText()};
              const newsTitles=await page.locator("#news-items .news-item a").allTextContents();
              report.news.uniqueTitles=new Set(newsTitles.map(x=>x.trim().toLowerCase())).size;
              report.newsCategories={};
              for(const category of ["world","technology","business","science"]){
                await page.locator('[data-news="'+category+'"]').click();
                await page.locator("#news-items .news-item").first().waitFor({state:"visible",timeout:20000});
                report.newsCategories[category]=await page.locator("#news-items .news-item").count();
              }
              await page.locator("#news-refresh").click();
              await page.locator("#news-items .news-item").first().waitFor({state:"visible",timeout:20000});
              await page.screenshot({path:"everythinghub-fallback-news.png",fullPage:true});
              await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
              await page.locator('.hotspots [data-mode="images"]').click();
              await page.locator("#query").fill("dog");
              await page.locator("#searchForm button[type=submit]").click();
              await page.locator("#results .media-card img").first().waitFor({state:"visible",timeout:30000});
              await page.locator("#results .media-card img").first().scrollIntoViewIfNeeded();
              await page.locator("#results .media-card img").first().evaluate(img=>img.decode());
              report.imageSearch={cards:await page.locator("#results .media-card").count(),loadedThumbnails:await page.locator("#results .media-card img").evaluateAll(imgs=>imgs.filter(i=>i.complete&&i.naturalWidth>0).length),title:(await page.locator("#results .results-heading h2").innerText())};
              await page.screenshot({path:"everythinghub-fallback-images.png",fullPage:true});
              await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
              await page.locator('.hotspots [data-mode="videos"]').click();
              await page.locator("#query").fill("NASA");
              await page.locator("#searchForm button[type=submit]").click();
              await page.locator("#results .video-card img").first().waitFor({state:"visible",timeout:30000});
              await page.locator("#results .video-card img").first().scrollIntoViewIfNeeded();
              await page.locator("#results .video-card img").first().evaluate(img=>img.decode());
              report.videoSearch={cards:await page.locator("#results .video-card").count(),loadedThumbnails:await page.locator("#results .video-card img").evaluateAll(imgs=>imgs.filter(i=>i.complete&&i.naturalWidth>0).length),fallbacks:await page.locator("#results .video-placeholder").count(),title:(await page.locator("#results .results-heading h2").innerText())};
              await page.screenshot({path:"everythinghub-fallback-videos.png",fullPage:true});
              if(report.news.topStories<1||report.news.uniqueTitles!==report.news.topStories||Object.values(report.newsCategories).some(x=>x<1)||report.imageSearch.cards<1||report.imageSearch.loadedThumbnails<1||report.videoSearch.cards<1||report.videoSearch.cards<15||report.videoSearch.loadedThumbnails<15)throw new Error("News, image, or video acceptance failed: "+JSON.stringify({news:report.news,newsCategories:report.newsCategories,imageSearch:report.imageSearch,videoSearch:report.videoSearch}));
              await page.setViewportSize({width:390,height:844});
              await page.goto(report.url,{waitUntil:"domcontentloaded",timeout:45000});
              report.mobile=await page.evaluate(()=>({viewportWidth:document.documentElement.clientWidth,documentWidth:document.documentElement.scrollWidth,artworkVisible:!!document.querySelector(".art img")?.getClientRects().length,searchVisible:!!document.querySelector("#query")?.getClientRects().length,categories:document.querySelectorAll(".hotspots [data-mode]").length,artworkWidth:document.querySelector(".art").getBoundingClientRect().width,resultsTop:document.querySelector("#results").getBoundingClientRect().top,artworkBottom:document.querySelector(".art").getBoundingClientRect().bottom}));
              await page.screenshot({path:"everythinghub-fallback-mobile.png",fullPage:true});
              if(report.mobile.documentWidth>report.mobile.viewportWidth+2||!report.mobile.artworkVisible||!report.mobile.searchVisible||report.mobile.categories!==8||report.mobile.artworkWidth<report.mobile.viewportWidth-4||report.mobile.resultsTop<report.mobile.artworkBottom)throw new Error("Fallback mobile layout failed: "+JSON.stringify(report.mobile));
              report.pageErrors=errors;
              report.passed=errors.length===0 && Object.keys(report.searches).length===3 && report.news?.topStories>0 && Object.values(report.newsCategories||{}).every(x=>x>0) && report.imageSearch?.cards>0 && report.videoSearch?.cards>0 && report.mobile.documentWidth<=report.mobile.viewportWidth+2;
              if(errors.length)throw new Error("Fallback page errors: "+errors.join("; "));
              fs.writeFileSync("fallback-report.json",JSON.stringify(report,null,2));
              console.log(JSON.stringify(report,null,2));
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
          node fallback-check.cjs
      - name: Save free fallback screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everythinghub-free-fallback-browser-check
          path: |
            everythinghub-fallback-home.png
            everythinghub-fallback-rolex.png
            everythinghub-fallback-las-vegas.png
            everythinghub-fallback-nasa.png
            everythinghub-fallback-mobile.png
            everythinghub-fallback-news.png
            everythinghub-fallback-images.png
            everythinghub-fallback-videos.png
            fallback-report.json
          if-no-files-found: warn
          retention-days: 3
