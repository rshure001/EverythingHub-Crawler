                    documentWidth: document.documentElement.scrollWidth,
                    artworkVisible: !!art && art.complete && art.naturalWidth >= 800 && !!art.getClientRects().length,
                    artwork: rect(art),
                    searchVisible: !!search && !!search.getClientRects().length,
                    search: rect(search),
                    categoryCount: buttons.length,
                    visibleCategoryCount: buttons.filter(button => button.getClientRects().length && button.getBoundingClientRect().width > 0).length,
                    categoryRects,
                    brokenImages: [...document.images].filter(image => image.complete && image.naturalWidth === 0).length
                  };
                });
                await page.screenshot({ path: "everythinghub-production-mobile-diagnostic.png", fullPage: true });
              } catch (mobileError) {
