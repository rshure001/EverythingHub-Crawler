# Live acceptance verifies the low-latency public RSS fallback when the full catalog index is cold.
name: Legacy AppDeploy browser acceptance — manual only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eh-browser-check
  cancel-in-progress: true
jobs:
  production-browser-check:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_URL: https://everythinghub-search-engine-4x25f8.v2.appdeploy.ai/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify live AppDeploy homepage, categories, searches, media, Top Stories and mobile layout
        run: |
          cat > production-check.cjs <<'JS'
          (async () => {
            const { chromium } = require("playwright");
            const fs = require("fs");
            const url = process.env.TARGET_URL;
            const expectedDivisions = ['Web', 'News', 'Images', 'Videos', 'Shopping', 'Places', 'Business', 'Research'];
            const report = {
              url, startedAt: new Date().toISOString(), status: null, branding: null, artwork: null,
              searchInputVisible: false, divisions: [], divisionChecks: [], categorySearches: [], searches: [],
              images: null, videos: null, publicFeeds: null, topStories: null, mobile: null, research: null,
              navigation: null, pageErrors: [], consoleErrors: [], apiRequests: [], apiResponses: [], failedRequests: [],
              visibleSearchInputs: null, passed: false
            };
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            page.setDefaultTimeout(15000);
            page.on("pageerror", error => report.pageErrors.push(String(error)));
            page.on("console", message => { if (message.type() === "error") report.consoleErrors.push(message.text()); });
            page.on("request", request => {
              try {
                const requestUrl = new URL(request.url());
                if (requestUrl.pathname.includes("/api/")) {
                  report.apiRequests.push({ method: request.method(), url: request.url(), postData: request.postData() || null });
                }
              } catch {}
            });
            page.on("response", response => {
              try {
                const responseUrl = new URL(response.url());
                if (responseUrl.pathname.includes("/api/")) {
                  report.apiResponses.push({ status: response.status(), url: response.url() });
                }
              } catch {}
            });
            page.on("requestfailed", request => report.failedRequests.push({
              url: request.url(), error: request.failure()?.errorText || "unknown"
            }));
            const shot = async name => page.screenshot({ path: "everythinghub-production-" + name + ".png", fullPage: true });
            const fail = message => { throw new Error(message); };
            const searchInput = () => page.locator("form.homepage-live-search input#hub-search:visible").first();
            const goHome = async () => {
              const response = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60000 });
              if (!response || response.status() !== 200) fail("Homepage HTTP " + (response ? response.status() : "unavailable"));
              await page.locator(".everythinghub-approved-home-art img.approved-master-image").first().waitFor({ state: "visible", timeout: 20000 });
              report.visibleSearchInputs = await page.locator("input#hub-search:visible").count();
              await searchInput().waitFor({ state: "visible", timeout: 12000 });
              await page.waitForFunction(() => {
                const image = document.querySelector(".everythinghub-approved-home-art img.approved-master-image");
                return image && image.complete && image.naturalWidth >= 800;
              }, null, { timeout: 20000 });
              return response;
            };
            const openDivision = async name => {
              const button = page.locator('nav.hub-hero-divisions button[aria-label="' + name + '"]').first();
              if (!(await button.count())) fail("Division button " + name + " was not found.");
              await button.click();
              await page.waitForFunction(expected => {
                const title = document.querySelector("#division-workspace-title");
                return title && title.textContent?.trim() === "Explore " + expected;
              }, name, { timeout: 12000 });
              const input = searchInput();
              await input.waitFor({ state: "visible", timeout: 12000 });
              const workspace = page.locator(".division-workspace:not(.division-destination-page)");
              const workspaceVisible = await workspace.isVisible().catch(() => false);
              const titleLocator = page.locator("#division-workspace-title");
              const title = await titleLocator.innerText().catch(() => "");
              const titleVisible = await titleLocator.isVisible().catch(() => false);
              const buttonState = await button.evaluate(node => ({
                ariaPressed: node.getAttribute("aria-pressed"),
                ariaCurrent: node.getAttribute("aria-current"),
                className: node.className,
                dataMode: node.getAttribute("data-mode")
              })).catch(() => ({}));
              const placeholder = await input.getAttribute("placeholder").catch(() => "");
              const modeLabel = await page.locator("#modeLabel").innerText().catch(() => "");
              const categoryStateChanged = buttonState.ariaPressed === "true" ||
                buttonState.ariaCurrent === "true" ||
                /\b(active|selected)\b/i.test(String(buttonState.className || "")) ||
                String(placeholder || "").toLowerCase().includes(name.toLowerCase()) ||
                String(modeLabel || "").toLowerCase().includes(name.toLowerCase()) ||
                (workspaceVisible && titleVisible && title === "Explore " + name);
              const ok = await button.isVisible().catch(() => false) &&
                await input.isVisible().catch(() => false) && categoryStateChanged;
              report.divisionChecks.push({
                name, title, titleVisible, workspaceVisible, buttonState, inputPlaceholder: placeholder,
                modeLabel, categoryStateChanged, searchInputVisible: true, ok
              });
              if (!ok) fail("Category " + name + " did not activate a visible workspace or selected search mode.");
              return workspace;
            };
            const closeWorkspace = async () => {
              const close = page.locator(".division-workspace:not(.division-destination-page) .workspace-close:visible").first();
              if (await close.count()) await close.click();
            };
            const searchWeb = async (query, pattern, screenshotName) => {
              await goHome();
              await openDivision("Web");
              await closeWorkspace();
              const input = searchInput();
              await input.fill(query);
              await input.press("Enter");
              await page.waitForFunction(arg => {
                const expression = new RegExp(arg.source, "i");
                return Array.from(document.querySelectorAll(".eh-result-card")).some(card => expression.test(card.innerText || ""));
              }, { source: pattern }, { timeout: 45000 });
              const cards = await page.locator(".eh-result-card").evaluateAll(nodes => nodes.slice(0, 8).map(node => ({
                text: node.innerText,
                title: node.querySelector(".eh-result-title")?.textContent?.trim() || ""
              })));
              const count = await page.locator(".eh-result-card").count();
              const relevant = cards.some(card => new RegExp(pattern, "i").test(card.text));
              const result = { query, count, visibleTitles: cards.map(card => card.title), relevant, ok: count > 0 && relevant };
              report.searches.push(result);
              await shot(screenshotName);
              if (!result.ok) fail("Search " + query + " returned no relevant visible results.");
            };
            const searchCategoryMode = async (name, query, path, vertical, selector, pattern) => {
              await goHome();
              await openDivision(name);
              const input = searchInput();
              const requestStart = report.apiRequests.length;
              await input.fill(query);
              await input.press("Enter");
              await page.locator(selector).first().waitFor({ state: "visible", timeout: 45000 });
              const requests = report.apiRequests.slice(requestStart);
              const matchingRequests = requests.filter(item => {
                const requestUrl = new URL(item.url);
                const queryMatches = (requestUrl.searchParams.get("q") || "").toLowerCase().includes(query.toLowerCase());
                return requestUrl.pathname.endsWith(path) && queryMatches &&
                  (!vertical || requestUrl.searchParams.get("vertical") === vertical);
              });
              const cards = await page.locator(selector).evaluateAll(nodes => nodes.slice(0, 8).map(node => {
                const titleNode = node.querySelector(".eh-result-title, .place-result-heading h3, h3, h2");
                return {
                  text: node.innerText,
                  title: titleNode?.textContent?.trim() || ""
                };
              }));
              const relevant = cards.some(card => new RegExp(pattern, "i").test(card.text));
              const result = {
                name, query, expectedEndpoint: path, expectedVertical: vertical,
                requestUrls: requests.map(item => item.url),
                matchingRequests: matchingRequests.map(item => item.url),
                modeMatched: matchingRequests.length > 0,
                count: cards.length, visibleTitles: cards.map(card => card.title),
                relevant, ok: matchingRequests.length > 0 && cards.length > 0 && relevant
              };
              report.categorySearches.push(result);
              if (!result.ok) fail("Category " + name + " did not route to the expected source and return relevant visible results.");
              return result;
            };
            const verifyResearchRouteWithoutCallingAI = async () => {
              await goHome();
              await openDivision("Research");
              const input = searchInput();
              let intercepted = false;
              await page.route("**/api/ai/answer", async route => {
                intercepted = true;
                await route.fulfill({
                  status: 200,
                  contentType: "application/json",
                  body: JSON.stringify({
                    answer: "Research route verified; paid AI execution skipped.",
                    sources: [],
                    providers: [],
                    unavailableProviders: ["Paid AI generation intentionally skipped in free-only browser acceptance."],
                    sourceCount: 0
                  })
                });
              });
              const requestPromise = page.waitForRequest(request => new URL(request.url()).pathname.endsWith("/api/ai/answer"), { timeout: 20000 });
              await input.fill("NASA");
              await input.press("Enter");
              const request = await requestPromise;
              await page.unroute("**/api/ai/answer");
              report.research = {
                endpoint: new URL(request.url()).pathname, method: request.method(),
                routeVerified: intercepted, resultVerified: false,
                paidAiExecutionSkipped: true,
                note: "The Research route was verified without invoking paid AI generation."
              };
              if (!intercepted) fail("Research category did not route to its answer endpoint.");
            };
            try {
              const response = await goHome();
              report.status = response.status();
              report.artwork = await page.locator(".everythinghub-approved-home-art img.approved-master-image").first().evaluate(image => ({
                src: image.currentSrc || image.src, complete: image.complete,
                naturalWidth: image.naturalWidth, naturalHeight: image.naturalHeight
              }));
              report.branding = {
                brand: (await page.locator(".brand-word").innerText()).trim(),
                tagline: (await page.locator(".approved-hero-tagline").innerText()).trim()
              };
              const visibleSearchInputs = page.locator("input#hub-search:visible");
              report.searchInputVisible = (await visibleSearchInputs.count()) === 1;
              report.divisions = await page.locator("nav.hub-hero-divisions button").evaluateAll(nodes =>
                nodes.map(node => (node.getAttribute("aria-label") || node.innerText || "").trim())
              );
              if (report.artwork.src !== "https://everythinghub-search-engine-4x25f8.v2.appdeploy.ai/resources/everythinghub-approved-octopus.png") fail("Approved octopus artwork URL changed.");
              if (!report.searchInputVisible) fail("The main search input is not visible.");
              if (report.divisions.length !== 8 || expectedDivisions.some(name => !report.divisions.includes(name))) {
                fail("Expected all eight categories; found " + report.divisions.join(", "));
              }
              await shot("home");

              for (const name of expectedDivisions) {
                await goHome();
                await openDivision(name);
                await closeWorkspace();
              }

              await searchWeb("Rolex", "rolex", "rolex");
              await searchWeb("Las Vegas", "las vegas|vegas|nevada", "las-vegas");
              await searchWeb("NASA", "nasa|space|aerospace", "nasa");
              await searchCategoryMode("News", "NASA", "/api/search", "news", ".eh-result-card", "nasa|space|aerospace");
              await searchCategoryMode("Shopping", "Rolex", "/api/search", "shopping", ".eh-result-card", "rolex");
              await searchCategoryMode("Places", "Las Vegas", "/api/places", null, ".place-results .place-result", "las vegas|vegas|nevada");
              await searchCategoryMode("Business", "Apple", "/api/businesses", null, ".place-results .place-result", "apple");
              await verifyResearchRouteWithoutCallingAI();

              await goHome();
              await openDivision("Images");
              await closeWorkspace();
              const imageInput = searchInput();
              await imageInput.fill("solar panels");
              await imageInput.press("Enter");
              await page.waitForFunction(() => document.querySelectorAll(".image-results-grid .image-result").length > 0, null, { timeout: 45000 });
              const imageCardLocator = page.locator(".image-results-grid .image-result");
              const imageCardCount = await imageCardLocator.count();
              for (let index = 0; index < Math.min(10, imageCardCount); index += 1) {
                const card = imageCardLocator.nth(index);
                await card.scrollIntoViewIfNeeded();
                const image = card.locator("img").first();
                await image.evaluate(element => {
                  element.loading = "eager";
                  if (element.complete) return element.naturalWidth > 0;
                  return new Promise(resolve => {
                    element.addEventListener("load", () => resolve(element.naturalWidth > 0), { once: true });
                    element.addEventListener("error", () => resolve(false), { once: true });
                    setTimeout(() => resolve(false), 6000);
                  });
                }).catch(() => false);
              }
              await imageCardLocator.first().scrollIntoViewIfNeeded();
              const imageCards = await imageCardLocator.evaluateAll(nodes =>
                nodes.slice(0, 10).map(node => ({
                  href: node.href,
                  loaded: (node.querySelector("img")?.naturalWidth || 0) > 0,
                  alt: node.querySelector("img")?.alt || "",
                  attribution: node.querySelector(".image-result-attribution")?.textContent?.trim() || "",
                  source: node.querySelector(".image-result-source")?.textContent?.trim() || ""
                }))
              );
              report.images = {
                count: imageCards.length,
                loaded: imageCards.filter(item => item.loaded).length,
                attributed: imageCards.filter(item => item.attribution && !/creator or license not supplied/i.test(item.attribution)).length,
                sources: Array.from(new Set(imageCards.map(item => item.source)))
              };
              await shot("images");
              if (report.images.loaded < 3 || report.images.attributed < 3 ||
                  !imageCards.some(item => item.href.startsWith("https://"))) {
                fail("Images did not return at least three loaded, attributed public thumbnails and a source link.");
              }

              // Video result cards and thumbnails are checked after the other desktop/mobile gates below.

              await goHome();
              const newsSection = page.locator("section.top-news");
              await newsSection.waitFor({ state: "visible", timeout: 12000 });
              await newsSection.scrollIntoViewIfNeeded();
              await page.waitForFunction(() => document.querySelectorAll("section.top-news .discover-story-body").length >= 2, null, { timeout: 60000 });
              const headlineCount = await page.locator("section.top-news .discover-story-body").count();
              const tabs = page.locator("section.top-news .discover-filters button");
              const tabLabels = await tabs.allTextContents();
              const checkedTabs = [];
              for (const label of ["For you", "World", "Technology", "Business", "Science", "Videos"]) {
                const tab = tabs.filter({ hasText: label }).first();
                if (!(await tab.count())) fail("Top Stories tab " + label + " is missing.");
                await tab.click();
                await page.waitForFunction(() =>
                  document.querySelectorAll("section.top-news .discover-story-body").length > 0,
                  null, { timeout: 30000 }
                );
                const pressed = await tab.getAttribute("aria-pressed");
                const visibleStories = await page.locator("section.top-news .discover-story-body").count();
                const ok = pressed === "true" && visibleStories > 0;
                checkedTabs.push({ label, pressed, visibleStories, ok });
                if (!ok) fail("Top Stories tab " + label + " did not activate with visible stories.");
              }
              const statusLocator = page.locator("section.top-news .top-news-heading p").first();
              const beforeRefresh = await statusLocator.innerText().catch(() => "");
              const refreshResponsePromise = page.waitForResponse(response => {
                const responseUrl = new URL(response.url());
                return responseUrl.pathname.endsWith("/api/search") &&
                  responseUrl.searchParams.get("vertical") === "news" && response.status() === 200;
              }, { timeout: 45000 }).catch(() => null);
              const refreshButton = page.locator('section.top-news button[aria-label="Refresh top news"]');
              await refreshButton.click();
              const refreshResponse = await refreshResponsePromise;
              await page.waitForFunction(() => {
                const button = document.querySelector('section.top-news button[aria-label="Refresh top news"]');
                return button && !button.disabled;
              }, null, { timeout: 60000 });
              await page.waitForFunction(() =>
                document.querySelectorAll("section.top-news .discover-story-body").length > 0,
                null, { timeout: 30000 }
              );
              const afterRefresh = await statusLocator.innerText().catch(() => "");
              const refreshedCount = await page.locator("section.top-news .discover-story-body").count();
              const refreshCompleted = !!refreshResponse && refreshResponse.ok() &&
                !(await refreshButton.isDisabled()) && refreshedCount > 0 && !/error/i.test(afterRefresh);
              report.topStories = {
                headlineCount,
                firstHeadline: (await page.locator("section.top-news .discover-story-body").first().innerText().catch(() => "")).slice(0, 240),
                tabLabels, checkedTabs, beforeRefresh, afterRefresh,
                refreshRequestObserved: !!refreshResponse,
                refreshResponseStatus: refreshResponse?.status() || null,
                refreshCompleted, refreshedCount
              };
              await shot("top-stories");
              if (headlineCount < 2 || checkedTabs.length !== 6 ||
                  checkedTabs.some(item => !item.ok) || !report.topStories.refreshRequestObserved ||
                  !report.topStories.refreshCompleted) {
                fail("Top Stories headlines, category tabs or Refresh did not pass.");
              }

              await goHome();
              // The approved launch-only hero intentionally hides the top bar until search or Library is active.
              await searchWeb("NASA", "nasa|space|aerospace", "nasa");
              const libraryNavButton = page.locator("button.nav-library").first();
              await libraryNavButton.waitFor({ state: "visible", timeout: 12000 });
              await libraryNavButton.click();
              await page.locator(".library-page").waitFor({ state: "visible", timeout: 12000 });
              const librarySearchVisible = await page.locator('.library-page input[aria-label="Search the Library"]').isVisible().catch(() => false);
              const headerLibraryVisible = await libraryNavButton.isVisible().catch(() => false);
              const exploreLink = page.locator('a[href="#divisions"]').first();
              const aboutLink = page.locator('a[href="#how-it-works"]').first();
              const exploreLinkVisible = await exploreLink.isVisible().catch(() => false);
              const aboutLinkVisible = await aboutLink.isVisible().catch(() => false);
              const exploreTargetExists = (await page.locator("#divisions").count()) > 0;
              const aboutTargetExists = (await page.locator("#how-it-works").count()) > 0;
              await page.locator("footer").scrollIntoViewIfNeeded();
              const dogTagLink = page.locator('footer a[href="https://dogtagday.org/"]').first();
              const dogTagDayLinkVisible = await dogTagLink.isVisible().catch(() => false);
              report.navigation = {
                ...(report.navigation || {}),
                libraryOpened: true,
                librarySearchVisible,
                headerLibraryVisible,
                exploreLinkVisible,
                aboutLinkVisible,
                exploreTargetExists,
                aboutTargetExists,
                dogTagDayLinkCount: await dogTagLink.count(),
                dogTagDayLinkVisible,
                dogTagDayLinkHref: await dogTagLink.getAttribute("href").catch(() => null)
              };
              if (!librarySearchVisible || !headerLibraryVisible || !exploreLinkVisible || !aboutLinkVisible ||
                  !exploreTargetExists || !aboutTargetExists || !dogTagDayLinkVisible ||
                  report.navigation.dogTagDayLinkHref !== "https://dogtagday.org/") {
                fail("Core Library, Explore, About or Dog Tag Day navigation is missing or not visible.");
              }
              await shot("navigation");

              await page.setViewportSize({ width: 390, height: 844 });
              await goHome();
              await page.evaluate(() => window.scrollTo(0, 0));
              const mobileLayout = await page.evaluate(() => {
                const viewportWidth = window.innerWidth;
                const documentWidth = document.documentElement.scrollWidth;
                const rect = element => {
                  const value = element.getBoundingClientRect();
                  return { left: value.left, right: value.right, top: value.top, bottom: value.bottom, width: value.width, height: value.height };
                };
                const visible = element => {
                  if (!element) return false;
                  const style = getComputedStyle(element);
                  const bounds = element.getBoundingClientRect();
                  return style.display !== "none" && style.visibility !== "hidden" &&
                    Number(style.opacity || 1) > 0 && bounds.width > 0 && bounds.height > 0;
                };
                const searchCandidates = Array.from(document.querySelectorAll("input#hub-search"));
                const visibleSearches = searchCandidates.filter(visible);
                const search = visibleSearches[0] || null;
                const artwork = document.querySelector(".everythinghub-approved-home-art img.approved-master-image");
                const artContainer = document.querySelector(".everythinghub-approved-home-art");
                const discovery = document.querySelector(".visual-discovery-home");
                const buttons = Array.from(document.querySelectorAll("nav.hub-hero-divisions button"));
                const visibleButtons = buttons.filter(visible);
                const searchBounds = search ? rect(search) : null;
                const artBounds = artContainer ? rect(artContainer) : null;
                const discoveryBounds = discovery ? rect(discovery) : null;
                const categoryBounds = buttons.map(rect);
                const searchCategoryOverlapPairs = searchBounds ? categoryBounds
                  .map((bounds, index) => ({ index, bounds }))
                  .filter(item => item.bounds.width > 0 && item.bounds.height > 0 &&
                    item.bounds.left < searchBounds.right && item.bounds.right > searchBounds.left &&
                    item.bounds.top < searchBounds.bottom && item.bounds.bottom > searchBounds.top)
                  .map(item => item.index) : ["missing-visible-search"];
                const categoryDiscoveryOverlapIndexes = discoveryBounds ? categoryBounds
                  .map((bounds, index) => ({ index, bounds }))
                  .filter(item => item.bounds.width > 0 && item.bounds.height > 0 &&
                    item.bounds.left < discoveryBounds.right && item.bounds.right > discoveryBounds.left &&
                    item.bounds.top < discoveryBounds.bottom && item.bounds.bottom > discoveryBounds.top)
                  .map(item => item.index) : [];
                const categoryOutsideArtworkIndexes = artBounds ? categoryBounds
                  .map((bounds, index) => ({ index, bounds }))
                  .filter(item => item.bounds.width > 0 && item.bounds.height > 0 &&
                    (item.bounds.top < artBounds.top - 2 || item.bounds.bottom > artBounds.bottom + 2))
                  .map(item => item.index) : buttons.map((_, index) => index);
                const controlsOverlap = searchCategoryOverlapPairs.length > 0 ||
                  categoryDiscoveryOverlapIndexes.length > 0 || categoryOutsideArtworkIndexes.length > 0;
                return {
                  viewportWidth, documentWidth, horizontalOverflow: documentWidth > viewportWidth + 2,
                  searchCandidateCount: searchCandidates.length, visibleSearchCount: visibleSearches.length,
                  searchVisible: !!search, searchBounds, artBounds, discoveryBounds,
                  artworkLoaded: !!artwork && artwork.complete && artwork.naturalWidth > 0,
                  categoryCount: buttons.length, visibleCategoryCount: visibleButtons.length,
                  categoryBounds, searchCategoryOverlapPairs, categoryDiscoveryOverlapIndexes,
                  categoryOutsideArtworkIndexes, controlsOverlap
                };
              });
              await page.locator("section.top-news").scrollIntoViewIfNeeded();
              await page.waitForFunction(() => document.querySelectorAll("section.top-news .discover-story-body").length >= 1, null, { timeout: 45000 });
              const brokenVisibleImages = await page.evaluate(() => Array.from(document.images).filter(image => {
                const bounds = image.getBoundingClientRect();
                return bounds.width > 0 && bounds.height > 0 && bounds.top < window.innerHeight && bounds.bottom > 0 &&
                  image.complete && image.naturalWidth === 0;
              }).map(image => image.currentSrc || image.src));
              const mobileFailures = [];
              if (mobileLayout.horizontalOverflow) mobileFailures.push("horizontal overflow");
              if (!mobileLayout.searchVisible || mobileLayout.visibleSearchCount !== 1) mobileFailures.push("search input visibility/count");
              if (!mobileLayout.artworkLoaded) mobileFailures.push("approved artwork not loaded");
              if (mobileLayout.categoryCount !== 8 || mobileLayout.visibleCategoryCount !== 8) mobileFailures.push("all eight categories are not visible");
              if (mobileLayout.controlsOverlap) mobileFailures.push("search/category/discovery controls overlap or extend outside the artwork");
              if (brokenVisibleImages.length) mobileFailures.push("broken visible images");
              if (mobileLayout.categoryBounds.some(bounds => bounds.width <= 0 || bounds.height <= 0 ||
                  bounds.left < 0 || bounds.right > mobileLayout.viewportWidth + 2)) mobileFailures.push("category clipping");
              report.mobile = { ...mobileLayout, brokenVisibleImages, ok: mobileFailures.length === 0, failures: mobileFailures };
              await shot("mobile");

              await page.setViewportSize({ width: 1440, height: 1000 });
              await goHome();
              await openDivision("Videos");
              const videoInput = searchInput();
              const videoResponsePromise = page.waitForResponse(response => {
                const responseUrl = new URL(response.url());
                return responseUrl.pathname.endsWith("/api/videos") &&
                  (responseUrl.searchParams.get("q") || "").toLowerCase() === "nasa";
              }, { timeout: 45000 });
              await videoInput.fill("NASA");
              await videoInput.press("Enter");
              const videoResponse = await videoResponsePromise;
              const videoSearchJson = await videoResponse.json().catch(() => ({}));
              await page.waitForFunction(() =>
                document.querySelectorAll(".eh-result-card").length > 0 || document.querySelector(".empty-state"),
                null, { timeout: 45000 }
              );
              const visibleVideoCards = await page.locator(".eh-result-card").evaluateAll(nodes => nodes.slice(0, 8).map(node => ({
                title: node.querySelector(".eh-result-title")?.textContent?.trim() || node.innerText.split("\n")[0],
                href: node.querySelector(".eh-result-title")?.href || node.querySelector("a")?.href || "",
                loadedThumbnail: (node.querySelector("img")?.naturalWidth || 0) > 0
              })));
              const visibleVideoThumbnails = await page.locator(".eh-media-shelf img, .eh-result-card img").evaluateAll(nodes =>
