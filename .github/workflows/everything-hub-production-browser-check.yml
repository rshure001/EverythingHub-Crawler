        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everythinghub-free-fallback-browser-check
          path: |
            everythinghub-fallback-home.png
            everythinghub-fallback-rolex.png
            everythinghub-fallback-las-vegas.png
            everythinghub-fallback-nasa.png
            everythinghub-fallback-mobile.png
            everythinghub-fallback-news.png
            everythinghub-fallback-images.png
            everythinghub-fallback-videos.png
            everythinghub-fallback-failure.png
            everythinghub-fallback-mobile-failure.png
            fallback-report.json
          if-no-files-found: warn
          retention-days: 30

