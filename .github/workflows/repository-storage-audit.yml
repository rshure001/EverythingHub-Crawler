name: Repository storage audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

concurrency:
  group: repository-storage-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Measure Git object storage and largest historical blobs
        shell: bash
        run: |
          set -euo pipefail
          echo "## Git object storage" >> "$GITHUB_STEP_SUMMARY"
          git count-objects -vH | tee /tmp/git-count-objects.txt
          cat /tmp/git-count-objects.txt >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "## Largest blobs reachable from repository refs" >> "$GITHUB_STEP_SUMMARY"
          git rev-list --objects --all |
            git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' |
            awk '$1 == "blob" {print $2 "\t" substr($0, index($0,$3))}' |
            sort -nr |
            head -n 30 |
            tee /tmp/largest-blobs.txt
          cat /tmp/largest-blobs.txt >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Audit only: no files, refs, history, releases, or production data were changed." >> "$GITHUB_STEP_SUMMARY"
