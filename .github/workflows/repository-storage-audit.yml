name: Repository storage audit

on:
  push:
    paths:
      - ".github/workflows/repository-storage-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

concurrency:
  group: repository-storage-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current snapshot only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Measure repository metadata and current tracked files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "## GitHub repository size metadata" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" |
            python -c 'import json,sys; d=json.load(sys.stdin); print("GitHub reported repository size: {} KB".format(d.get("size")))' |
            tee /tmp/repository-size.txt
          cat /tmp/repository-size.txt >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "## Largest files in current main snapshot (bytes)" >> "$GITHUB_STEP_SUMMARY"
          git ls-tree -r -l HEAD |
            awk '$4 != "-" {print $4 "\t" $5}' |
            sort -nr |
            sed -n '1,50p' |
            tee /tmp/current-largest-files.txt
          cat /tmp/current-largest-files.txt >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "## Shallow checkout object footprint" >> "$GITHUB_STEP_SUMMARY"
          git count-objects -vH | tee /tmp/git-count-objects.txt
          cat /tmp/git-count-objects.txt >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "This is a bounded current-snapshot audit. It deliberately does not fetch 76+ GB of history or scan historical blobs. No files, refs, history, releases, or production data were changed." >> "$GITHUB_STEP_SUMMARY"
