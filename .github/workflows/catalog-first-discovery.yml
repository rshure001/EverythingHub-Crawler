name: Catalog-first discovery

on:
  push:
    paths:
      - "crawler/catalog_discovery.py"
      - "crawler/test_catalog_discovery.py"
      - "crawler/catalog_retro_discovery.py"
      - "crawler/test_catalog_retro_discovery.py"
      - "crawler/catalog_model.py"
      - "crawler/catalog_ingest.py"
      - "crawler/catalog_openlibrary.py"
      - "crawler/test_catalog_openlibrary.py"
      - "crawler/test_catalog_ingest.py"
      - "crawler/test_catalog_model.py"
      - "project/**"
      - "learning/**"
      - ".github/workflows/catalog-first-discovery.yml"
  workflow_dispatch:
    inputs:
      rows:
        description: Records per catalog API page
        required: false
        default: "250"
      max_pages:
        description: Maximum API pages per catalog
        required: false
        default: "20"
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: catalog-data-publish
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog discovery
        working-directory: crawler
        run: python -m unittest test_catalog_discovery.py -v
      - name: Validate universal catalog model
        working-directory: crawler
        run: python -m unittest test_catalog_model.py -v
      - name: Validate retroactive catalog discovery
        working-directory: crawler
        run: python -m unittest test_catalog_retro_discovery.py -v
      - name: Validate Open Library catalog discovery
        working-directory: crawler
        run: python -m unittest test_catalog_openlibrary.py -v
      - name: Validate universal catalog ingestion
        working-directory: crawler
        run: python -m unittest test_catalog_ingest.py -v
      - name: Validate project ledger
        run: python -m unittest discover -s project -p 'test_*.py' -v
      - name: Validate feedback learner
        run: python -m unittest discover -s learning -p 'test_*.py' -v
      - name: Discover whole catalogs and their bulk resources
        env:
          ROWS: ${{ inputs.rows || '250' }}
          MAX_PAGES: ${{ inputs.max_pages || '20' }}
        run: python crawler/catalog_discovery.py --rows "$ROWS" --max-pages "$MAX_PAGES"
      - name: Discover Open Library subject catalogs
        run: python crawler/catalog_openlibrary.py --pause 1
      - name: Normalize datasets into universal catalog records
        run: python crawler/catalog_ingest.py
      - name: Verify compressed catalog staging artifacts
        run: |
          python - <<'PY'
          import gzip, json
          catalogs = json.load(gzip.open("data/catalogs.json.gz", "rt", encoding="utf-8"))
          records = json.load(gzip.open("data/universal-catalog-records.json.gz", "rt", encoding="utf-8"))
          openlibrary = json.load(gzip.open("data/openlibrary-catalogs.json.gz", "rt", encoding="utf-8"))
          assert records["production_indexed"] is False
          assert len(records["catalogs"]) == records["metrics"]["catalogs_discovered"]
          assert len(records["records"]) == records["metrics"]["catalog_records"]
          assert len(records["records"]) == catalogs["datasets_discovered"] + openlibrary["datasets_discovered"]
          print({
              "catalogs": len(records["catalogs"]),
              "catalog_records": len(records["records"]),
              "resource_links": catalogs["resources_discovered"],
              "openlibrary_records": openlibrary["datasets_discovered"],
              "indexed_records": records["metrics"]["indexed_records"],
          })
          PY
      - name: Record discovery in the project ledger
        run: python project/ledger.py --record-catalog-discovery
      - name: Publish catalog manifest and project ledger
        run: |
          git add -f data/catalogs.json.gz data/openlibrary-catalogs.json.gz data/project-ledger.json data/universal-catalog-records.json.gz
          git rm -f --ignore-unmatch data/catalogs.json data/universal-catalog-records.json
          if git diff --cached --quiet; then
            echo "No catalog manifest or ledger changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record catalog discovery and project history"
          # Retry a non-conflicting concurrent main-branch update safely.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push race on attempt $attempt; refreshing main before retry."
            sleep "$((attempt * 2))"
          done
          echo "Unable to publish after three safe rebase attempts."
          exit 1
