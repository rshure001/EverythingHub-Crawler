name: Catalog-first discovery

on:
  push:
    paths:
      - "crawler/catalog_discovery.py"
      - "crawler/catalog_source_policy.py"
      - "crawler/catalog-source-terms.json"
      - "crawler/test_catalog_source_policy.py"
      - "crawler/test_catalog_discovery.py"
      - "crawler/catalog_host_probe.py"
      - "crawler/test_catalog_host_probe.py"
      - "crawler/catalog_retro_discovery.py"
      - "crawler/test_catalog_retro_discovery.py"
      - "crawler/catalog_model.py"
      - "crawler/catalog_ingest.py"
      - "crawler/catalog_openlibrary.py"
      - "crawler/test_catalog_openlibrary.py"
      - "crawler/test_catalog_ingest.py"
      - "database/import_universal_catalogs.py"
      - "database/test_import_universal_catalogs.py"
      - "crawler/test_catalog_model.py"
      - "project/**"
      - "learning/**"
      - ".github/workflows/catalog-first-discovery.yml"
  workflow_dispatch:
    inputs:
      rows:
        description: Records per catalog API page
        required: false
        default: "250"
      max_pages:
        description: Maximum API pages per catalog
        required: false
        default: "40"
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: catalog-first-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog source policy
        working-directory: crawler
        run: python -m unittest test_catalog_source_policy.py -v
      - name: Validate catalog discovery
        working-directory: crawler
        run: python -m unittest test_catalog_discovery.py -v
      - name: Validate catalog host probe policy
        working-directory: crawler
        run: python -m unittest test_catalog_host_probe.py -v
      - name: Validate universal catalog model
        working-directory: crawler
        run: python -m unittest test_catalog_model.py -v
      - name: Validate retroactive catalog discovery
        working-directory: crawler
        run: python -m unittest test_catalog_retro_discovery.py -v
      - name: Validate Open Library catalog discovery
        working-directory: crawler
        run: python -m unittest test_catalog_openlibrary.py -v
      - name: Validate universal catalog ingestion
        working-directory: crawler
        run: python -m unittest test_catalog_ingest.py -v
      - name: Validate eh_quad rights-aware importer
        run: python -m unittest discover -s database -p "test_import_universal_catalogs.py" -v
      - name: Validate project ledger
        run: python -m unittest discover -s project -p 'test_*.py' -v
      - name: Validate feedback learner
        run: python -m unittest discover -s learning -p 'test_*.py' -v
      - name: Discover whole catalogs and their bulk resources
        env:
          ROWS: ${{ inputs.rows || '250' }}
          MAX_PAGES: ${{ inputs.max_pages || '40' }}
        run: python crawler/catalog_discovery.py --rows "$ROWS" --max-pages "$MAX_PAGES"
      - name: Discover Open Library subject catalogs
        run: python crawler/catalog_openlibrary.py --pause 1
      - name: Normalize datasets into universal catalog records
        run: python crawler/catalog_ingest.py
      - name: Verify compressed catalog staging artifacts and rights-filtered per-catalog indexes
        run: |
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          catalogs = json.load(gzip.open("data/catalogs.json.gz", "rt", encoding="utf-8"))
          records = json.load(gzip.open("data/universal-catalog-records.json.gz", "rt", encoding="utf-8"))
          openlibrary = json.load(gzip.open("data/openlibrary-catalogs.json.gz", "rt", encoding="utf-8"))
          index_root = Path("data/universal-catalog-indexes")
          index_manifest = json.loads((index_root / "manifest.json").read_text(encoding="utf-8"))
          assert records["production_indexed"] is False
          if openlibrary.get("source_policy_status") == "restricted":
              assert openlibrary["catalog_count"] == 0
              assert openlibrary["datasets_discovered"] == 0
              assert records["metrics"]["restricted_source_records_excluded"] >= int(openlibrary.get("previous_snapshot_records_excluded") or 0)
              assert records["metrics"]["restricted_source_catalogs_excluded"] >= int(openlibrary.get("previous_snapshot_catalogs_excluded") or 0)
          assert records["metrics"]["production_eligible_records"] + records["metrics"]["restricted_records"] == len(records["records"])
          assert all(not row.get("policy_allowed") or row.get("source_terms_status") in ("reviewed", "reviewed_per_dataset") for row in records["source_pages"])
          assert len(records["catalogs"]) == records["metrics"]["catalogs_discovered"]
          assert len(records["records"]) == records["metrics"]["catalog_records"]
          assert records["metrics"]["source_page_associations"] == len(records["source_pages"])
          assert records["metrics"]["source_page_associations"] >= records["metrics"]["catalog_records"]
          assert records["metrics"]["duplicate_record_occurrences"] == records["metrics"]["source_page_associations"] - records["metrics"]["catalog_records"]
          assert len(records["records"]) <= catalogs["datasets_discovered"] + openlibrary["datasets_discovered"]
          assert records["metrics"]["indexed_records"] == 0
          assert records["metrics"]["records_published"] == 0
          assert index_manifest["production_indexed"] is False
          assert index_manifest["records_published"] == 0
          catalog_by_id = {row["catalog_id"]: row for row in records["catalogs"]}
          record_by_id = {row["record_id"]: row for row in records["records"]}
          assert len(catalog_by_id) == len(records["catalogs"])
          assert len(record_by_id) == len(records["records"])
          manifest_rows = {row["catalog_id"]: row for row in index_manifest["catalog_indexes"]}
          assert len(manifest_rows) == len(index_manifest["catalog_indexes"]) == len(catalog_by_id)
          index_rows = {}
          indexed_record_ids = set()
          public_memberships = 0
          root_record_search_documents = {}
          root_record_search_document_occurrences = 0
          for shard in index_manifest["shards"]:
              shard_path = index_root / shard["file"]
              compressed = shard_path.read_bytes()
              assert len(compressed) == shard["bytes"]
              assert hashlib.sha256(compressed).hexdigest() == shard["sha256"]
              payload = json.loads(gzip.decompress(compressed))
              assert payload["schema_version"] == 1
              assert payload["shard_id"] == shard["shard_id"]
              assert len(payload["catalog_indexes"]) == shard["catalog_count"]
              shard_memberships = 0
              shard_search_document_occurrences = 0
              for row in payload["catalog_indexes"]:
                  catalog_id = row["catalog_id"]
                  assert catalog_id in catalog_by_id and catalog_id not in index_rows
                  catalog = catalog_by_id[catalog_id]
                  entry = manifest_rows[catalog_id]
                  record_ids = row["record_ids"]
                  assert record_ids == sorted(set(record_ids))
                  assert len(record_ids) == row["record_count"] == entry["record_count"]
                  canonical_ids = json.dumps(record_ids, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8") + b"\n"
                  assert hashlib.sha256(canonical_ids).hexdigest() == row["index_sha256"] == entry["index_sha256"]
                  assert entry["file"] == catalog["public_index_shard"]
                  assert entry["index_sha256"] == catalog["public_index_sha256"]
                  assert entry["record_count"] == catalog["public_record_count"]
                  assert row["public_search_allowed"] == (catalog.get("public_search_allowed") is True)
                  documents = row.get("record_search_documents")
                  assert isinstance(documents, list)
                  assert row.get("record_search_document_count") == len(documents)
                  is_public_root = catalog.get("catalog_level") == "root" and catalog.get("public_search_allowed") is True
                  if is_public_root:
                      assert len(documents) == len(record_ids)
                  else:
                      assert documents == []
                  for document in documents:
                      assert isinstance(document, dict)
                      record_id = document.get("record_id")
                      assert record_id in record_ids and record_id in record_by_id
                      assert document.get("public_search_allowed") is True
                      assert isinstance(document.get("title"), str) and document["title"].strip()
                      assert isinstance(document.get("record_type"), str) and document["record_type"].strip()
                      assert isinstance(document.get("source_url"), str) and document["source_url"].startswith("https://")
                      assert isinstance(document.get("source_urls"), list) and document["source_urls"]
                      assert all(isinstance(url, str) and url.startswith("https://") for url in document["source_urls"])
                      document_catalog_ids = document.get("catalog_ids")
                      assert isinstance(document_catalog_ids, list) and catalog_id in document_catalog_ids
                      assert all(value in catalog_by_id and catalog_by_id[value].get("public_search_allowed") is True for value in document_catalog_ids)
                      assert document.get("search_text")
                      prior_document = root_record_search_documents.get(record_id)
                      if prior_document is not None:
                          assert prior_document == document
                      else:
                          root_record_search_documents[record_id] = document
                      root_record_search_document_occurrences += 1
                      shard_search_document_occurrences += 1
                  for record_id in record_ids:
                      record = record_by_id[record_id]
                      assert (record.get("attributes") or {}).get("public_search_allowed") is True
                      assert catalog.get("public_search_allowed") is True
                      assert catalog_id in record.get("catalog_ids", [record.get("catalog_id")])
                  index_rows[catalog_id] = row
                  indexed_record_ids.update(record_ids)
                  shard_memberships += len(record_ids)
              assert shard_memberships == shard["public_record_memberships"]
              assert shard_search_document_occurrences == shard.get("record_search_document_occurrences")
              public_memberships += shard_memberships
          assert set(index_rows) == set(catalog_by_id)
          public_record_ids = {
              record_id for record_id, record in record_by_id.items()
              if (record.get("attributes") or {}).get("public_search_allowed") is True
          }
          assert indexed_record_ids == public_record_ids
          assert set(root_record_search_documents) == public_record_ids
          assert index_manifest["record_search_schema_version"] == 1
          assert index_manifest["unique_root_record_search_documents"] == len(root_record_search_documents)
          assert index_manifest["root_record_search_document_occurrences"] == root_record_search_document_occurrences
          for catalog_id, entry in manifest_rows.items():
              catalog = catalog_by_id[catalog_id]
              assert entry["title"] == catalog.get("title")
              assert entry["source_url"] == catalog.get("source_url")
              assert entry["public_search_allowed"] == (catalog.get("public_search_allowed") is True)
              assert entry["record_search_document_count"] == index_rows[catalog_id]["record_search_document_count"]
          assert index_manifest["catalog_count"] == len(catalog_by_id)
          assert index_manifest["index_shard_count"] == len(index_manifest["shards"])
          assert index_manifest["unique_public_records"] == len(indexed_record_ids)
          assert index_manifest["public_record_memberships"] == public_memberships
          assert index_manifest["catalogs_with_public_records"] + index_manifest["catalogs_without_public_records"] == len(catalog_by_id)
          assert index_manifest["restricted_records_not_indexed"] == len(record_by_id) - len(public_record_ids)
          assert index_manifest["eligible_records_without_public_index"] == 0
          assert records["metrics"]["catalog_indexes_built"] == len(catalog_by_id)
          assert records["metrics"]["unique_public_records_indexed"] == len(indexed_record_ids)
          assert records["metrics"]["public_record_catalog_memberships"] == public_memberships
          assert records["metrics"]["eligible_records_without_public_index"] == 0
          print({
              "catalogs": len(records["catalogs"]),
              "catalog_records": len(records["records"]),
              "duplicate_record_occurrences": records["metrics"]["duplicate_record_occurrences"],
              "subcatalogs": records["metrics"]["subcatalogs_discovered"],
              "catalog_index_shards": len(index_manifest["shards"]),
              "unique_public_records_indexed": len(indexed_record_ids),
              "unique_root_record_search_documents": len(root_record_search_documents),
              "root_record_search_document_occurrences": root_record_search_document_occurrences,
              "public_record_memberships": public_memberships,
              "restricted_records_excluded_from_public_indexes": index_manifest["restricted_records_not_indexed"],
              "restricted_source_catalogs_excluded": records["metrics"]["restricted_source_catalogs_excluded"],
              "restricted_source_records_excluded": records["metrics"]["restricted_source_records_excluded"],
              "openlibrary_snapshot_records_excluded": openlibrary.get("previous_snapshot_records_excluded"),
              "indexed_records": records["metrics"]["indexed_records"],
              "records_published": records["metrics"]["records_published"],
          })
          PY
      - name: Upload catalog staging preview from non-main branches
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: catalog-staging-preview-${{ github.run_number }}
          path: |
            data/catalogs.json.gz
            data/openlibrary-catalogs.json.gz
            data/universal-catalog-records.json.gz
            data/universal-catalog-indexes/
      - name: Record discovery in the project ledger
        if: github.ref == 'refs/heads/main'
        run: python project/ledger.py --record-catalog-discovery
      - name: Publish catalog manifest and project ledger
        if: github.ref == 'refs/heads/main'
        run: |
          git add -f data/catalogs.json.gz data/openlibrary-catalogs.json.gz data/project-ledger.json data/universal-catalog-records.json.gz data/universal-catalog-indexes/
          git rm -f --ignore-unmatch data/catalogs.json data/universal-catalog-records.json
          if git diff --cached --quiet; then
            echo "No catalog manifest or ledger changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record catalog discovery and project history"
          # First try a path-safe rebase. Crawler checkpoints often advance only
          # data/index* and public-search files, which do not overlap these catalog
          # manifests. Git will reject a rebase if another catalog writer changed
          # the same binary snapshot or ledger; only then rebuild the bounded batch.
          for attempt in 1 2 3 4; do
            base_commit="$(git rev-parse HEAD^)"
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            remote_head="$(git rev-parse origin/main)"
            if [ "$remote_head" = "$base_commit" ]; then
              echo "Push failed without a main-branch race; check repository write permission."
              exit 1
            fi

            echo "Main advanced during catalog publication; trying a path-safe rebase (attempt $attempt/4)."
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Validated catalog snapshot safely rebased over non-overlapping main changes."
                exit 0
              fi
              git fetch origin main
              remote_head="$(git rev-parse origin/main)"
              if git merge-base --is-ancestor origin/main HEAD; then
                echo "Push failed after rebase without another remote advance; check repository write permission."
                exit 1
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "main kept advancing during four safe rebase attempts; leaving the remote untouched."
                exit 1
              fi
              echo "main advanced again; retrying the same validated catalog snapshot."
              continue
            fi

            git rebase --abort || true
            if [ "$attempt" -eq 4 ]; then
              echo "Overlapping catalog paths changed on the final bounded attempt; leaving the remote untouched."
              exit 1
            fi
            echo "Overlapping catalog paths changed; rebuilding the bounded discovery batch from $remote_head."
            git reset --hard origin/main
            python crawler/catalog_discovery.py --rows "${{ inputs.rows || '250' }}" --max-pages "${{ inputs.max_pages || '40' }}"
            python crawler/catalog_openlibrary.py --pause 1
            python crawler/catalog_ingest.py
            python project/ledger.py --record-catalog-discovery
            git add -f data/catalogs.json.gz data/openlibrary-catalogs.json.gz data/project-ledger.json data/universal-catalog-records.json.gz data/universal-catalog-indexes/
            git rm -f --ignore-unmatch data/catalogs.json data/universal-catalog-records.json
            if git diff --cached --quiet; then
              echo "Latest main already contains this catalog snapshot."
              exit 0
            fi
            git commit -m "Record catalog discovery and project history"
          done
          echo "Unable to publish a coherent catalog snapshot after four bounded push attempts."
          exit 1
