name: Catalog-first discovery

on:
  push:
    paths:
      - "crawler/catalog_discovery.py"
      - "crawler/test_catalog_discovery.py"
      - "crawler/catalog_retro_discovery.py"
      - "crawler/test_catalog_retro_discovery.py"
      - "crawler/catalog_model.py"
      - "crawler/catalog_ingest.py"
      - "crawler/test_catalog_ingest.py"
      - "crawler/test_catalog_model.py"
      - "project/**"
      - "learning/**"
      - ".github/workflows/catalog-first-discovery.yml"
  workflow_dispatch:
    inputs:
      rows:
        description: Records per catalog API page
        required: false
        default: "250"
      max_pages:
        description: Maximum API pages per catalog
        required: false
        default: "20"
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: catalog-first-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog discovery
        working-directory: crawler
        run: python -m unittest test_catalog_discovery.py -v
      - name: Validate universal catalog model
        working-directory: crawler
        run: python -m unittest test_catalog_model.py -v
      - name: Validate retroactive catalog discovery
        working-directory: crawler
        run: python -m unittest test_catalog_retro_discovery.py -v
      - name: Validate universal catalog ingestion
        working-directory: crawler
        run: python -m unittest test_catalog_ingest.py -v
      - name: Build catalog backlog from all existing indexed pages
        run: python crawler/catalog_retro_discovery.py
      - name: Validate project ledger
        run: python -m unittest discover -s project -p 'test_*.py' -v
      - name: Validate feedback learner
        run: python -m unittest discover -s learning -p 'test_*.py' -v
      - name: Discover whole catalogs and their bulk resources
        env:
          ROWS: ${{ inputs.rows || '250' }}
          MAX_PAGES: ${{ inputs.max_pages || '20' }}
        run: python crawler/catalog_discovery.py --rows "$ROWS" --max-pages "$MAX_PAGES"
      - name: Normalize datasets into universal catalog records
        run: python crawler/catalog_ingest.py
      - name: Record discovery in the project ledger
        run: python project/ledger.py --record-catalog-discovery
      - name: Publish catalog manifest and project ledger
        run: |
          git add -f data/catalogs.json data/host-catalog-candidates.json data/project-ledger.json data/universal-catalog-records.json
          if git diff --cached --quiet; then
            echo "No catalog manifest or ledger changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record catalog discovery and project history"
          # Other independent workflows may update main while discovery runs.
          git pull --rebase origin main
          git push
