name: Ten-at-a-time catalog seed expansion

on:
  push:
    paths:
      - "crawler/catalog_seed_expansion.py"
      - "crawler/test_catalog_seed_expansion.py"
      - "database/stage_page_catalog_memberships.py"
      - "database/import_page_catalog_memberships.py"
      - "database/test_import_page_catalog_memberships.py"
      - "database/003_eh_quad_page_catalog_memberships.sql"
      - "data/page-derived-catalogs/report.json"
      - "data/page-derived-catalogs/source-host-review-queue.json"
      - "data/catalog-landing-page-robots.json"
      - ".github/workflows/catalog-seed-expansion.yml"
  pull_request:
    paths:
      - "crawler/catalog_seed_expansion.py"
      - "crawler/test_catalog_seed_expansion.py"
      - "database/003_eh_quad_page_catalog_memberships.sql"
      - "database/import_page_catalog_memberships.py"
      - "database/test_import_page_catalog_memberships.py"
      - ".github/workflows/catalog-seed-expansion.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Retroactive catalog inventory"
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: "7,27,47 * * * *"

permissions:
  contents: write

concurrency:
  group: everythinghub-main-writers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  expand:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eh_test
          POSTGRES_PASSWORD: eh_test_password
          POSTGRES_DB: everythinghub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eh_test -d everythinghub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate evidence-backed catalog expansion engine
        working-directory: crawler
        run: python -m unittest test_catalog_seed_expansion.py test_catalog_source_policy.py -v
      - name: Measure eligible catalog landing pages from current main review queue without fetching
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git checkout origin/main -- data/page-derived-catalogs/source-host-review-queue.json public-search/manifest.json
          PYTHONPATH=crawler python - <<'PY'
          import json
          from pathlib import Path
          from catalog_seed_expansion import _eligible_seed, _queue_snapshot_compatible_with_current_index

          queue = json.loads(
              Path("data/page-derived-catalogs/source-host-review-queue.json").read_text(encoding="utf-8")
          )
          compatible = _queue_snapshot_compatible_with_current_index(queue, Path("public-search/manifest.json"))
          candidates = queue.get("candidate_urls", []) if isinstance(queue, dict) else []
          eligible = [row for row in candidates if _eligible_seed(row)] if compatible else []
          print(json.dumps({
              "source_index_pages": queue.get("source_index_pages"),
              "review_queue_snapshot_compatible_with_current_index": compatible,
              "catalog_definition_source_urls": len(candidates),
              "eligible_catalog_landing_pages": len(eligible),
              "network_requests_made": 0,
              "records_published": 0
          }, indent=2))
          PY
      - name: Expand one bounded batch of ten evidence-backed catalog landing pages
        if: github.event_name != 'pull_request'
        run: python crawler/catalog_seed_expansion.py --limit 10
      - name: Build non-public catalog membership bridge from the canonical ledger
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python database/stage_page_catalog_memberships.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("data/page-catalog-membership-staging.json").read_text(encoding="utf-8"))
          assert p["production_import_allowed"] is False
          assert p["public_search_allowed"] is False
          assert p["rejected_rows"] == 0
          assert p["candidate_count"] > 0, "empty catalog bridge: no metadata-only candidates were staged"
          assert p["membership_count"] > 0, "empty catalog bridge: no catalog relationships were staged"
          assert all(r["verified"] is False and r["content_fetched"] is False for r in p["candidates"])
          print(json.dumps({k:p[k] for k in ("candidate_count","membership_count","rejected_rows","production_import_allowed","public_search_allowed")}, indent=2))
          PY
      - name: Validate eh_quad-only membership importer without production writes
        run: |
          set -euo pipefail
          python -m unittest database.test_import_page_catalog_memberships -v
          python database/import_page_catalog_memberships.py
      - name: Exercise both migrations and metadata-only importer in isolated PostgreSQL
        env:
          PGPASSWORD: eh_test_password
          DATABASE_URL: postgresql://eh_test:eh_test_password@localhost:5432/everythinghub_test
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install "psycopg[binary]>=3.2,<4"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create role service_role"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/002_eh_quad_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/003_eh_quad_page_catalog_memberships.sql
          python database/import_page_catalog_memberships.py --apply
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select 'staged_candidates=' || count(*) from eh_quad.eh_page_catalog_candidates"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select 'staged_memberships=' || count(*) from eh_quad.eh_page_catalog_candidate_memberships"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select 'public_documents=' || count(*) from eh_quad.eh_documents"
      - name: Publish metadata-only expansion ledger and membership bridge
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/page-catalog-expansion.json.gz data/page-catalog-membership-staging.json
          if git diff --cached --quiet; then
            echo "No expansion ledger changes."
            exit 0
          fi
          git commit -m "Expand ten evidence-backed catalog landing pages"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced during checkpoint publication; refreshing the canonical ledger and rebuilding the same bounded batch (attempt $attempt/3)."
            git fetch origin main
            git reset --hard origin/main

            # The expansion ledger and membership bridge are compressed/derived
            # artifacts. Never text-rebase them. Re-run the idempotent bounded
            # worker against the newest committed ledger so completed seed URLs
            # are skipped and stable candidate IDs deduplicate any overlap.
            python crawler/catalog_seed_expansion.py --limit 10
            python database/stage_page_catalog_memberships.py
            python -m unittest database.test_import_page_catalog_memberships -v
            python database/import_page_catalog_memberships.py
            git add -f data/page-catalog-expansion.json.gz data/page-catalog-membership-staging.json
            if git diff --cached --quiet; then
              echo "Latest main already contains this bounded expansion checkpoint."
              exit 0
            fi
            git commit -m "Expand ten evidence-backed catalog landing pages"
          done
          echo "Unable to publish expansion ledger after three bounded rebuild attempts."
          exit 1
