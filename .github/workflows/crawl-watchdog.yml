name: Everything Hub crawler schedule watchdog
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/crawl-watchdog.yml"
      - "crawler/schedule_watchdog.py"
      - "crawler/test_schedule_watchdog.py"
      - "crawler/pipeline_health.py"
      - "crawler/test_pipeline_health.py"
  schedule:
    # Stagger lightweight 15-minute checks away from Actions peaks. The watchdog rechecks active runs immediately before committing a marker; crawl.yml retains its own single-run concurrency guard.
    - cron: "7,22,37,52 * * * *"
  workflow_run:
    workflows:
      - "Everything Hub crawler"
    types:
      - completed
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: eh-crawler-schedule-watchdog
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test watchdog decision logic
        run: |
          python -m unittest crawler.test_schedule_watchdog -v
          python -m unittest crawler.test_pipeline_health -v
      - name: Check recent crawler runs and recover missed schedules
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/runs?per_page=20" > /tmp/crawl-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/runs?event=schedule&per_page=5" > /tmp/crawl-scheduled-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/contents/public-search/manifest.json" > /tmp/public-manifest-envelope.json
          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/crawl-runs.json").read_text(encoding="utf-8"))
          scheduled_payload = json.loads(Path("/tmp/crawl-scheduled-runs.json").read_text(encoding="utf-8"))
          runs = payload.get("workflow_runs")
          scheduled = scheduled_payload.get("workflow_runs")
          if not isinstance(runs, list) or not isinstance(scheduled, list):
              raise SystemExit("GitHub did not return crawler workflow-run arrays")
          known_ids = {row.get("id") for row in runs if isinstance(row, dict)}
          runs.extend(row for row in scheduled if isinstance(row, dict) and row.get("id") not in known_ids)
          latest_scheduled = max(
              (row for row in scheduled if isinstance(row, dict) and row.get("id")),
              key=lambda row: row.get("created_at") or "",
              default=None,
          )
          Path("/tmp/latest-scheduled-run-id").write_text(
              str(latest_scheduled.get("id", "")) if latest_scheduled else "",
              encoding="utf-8",
          )
          Path("/tmp/crawl-runs-combined.json").write_text(
              json.dumps({"workflow_runs": runs}), encoding="utf-8"
          )

          envelope = json.loads(Path("/tmp/public-manifest-envelope.json").read_text(encoding="utf-8"))
          encoded = envelope.get("content")
          if not isinstance(encoded, str):
              raise SystemExit("GitHub did not return the public search manifest content")
          manifest = json.loads(base64.b64decode(encoded).decode("utf-8"))
          if (
              not isinstance(manifest, dict)
              or manifest.get("version") != 1
              or not isinstance(manifest.get("updated_at"), int)
              or manifest["updated_at"] <= 0
              or not isinstance(manifest.get("total_pages"), int)
              or manifest["total_pages"] < 1
          ):
              raise SystemExit("Public search manifest failed the watchdog freshness preflight")
          Path("/tmp/public-manifest.json").write_text(json.dumps(manifest), encoding="utf-8")
          print("Public manifest timestamp:", manifest["updated_at"])
          print("Public manifest indexed pages:", manifest["total_pages"])
          print("Recent crawler runs:", len(runs))
          print("Recent scheduled crawler runs:", len(scheduled))
          PY
          latest_scheduled_run_id="$(cat /tmp/latest-scheduled-run-id)"
          if [ -n "$latest_scheduled_run_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${latest_scheduled_run_id}/jobs?per_page=100" > /tmp/latest-scheduled-jobs.json
          else
            echo '{"jobs":[]}' > /tmp/latest-scheduled-jobs.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          combined = json.loads(Path("/tmp/crawl-runs-combined.json").read_text(encoding="utf-8"))
          jobs_payload = json.loads(Path("/tmp/latest-scheduled-jobs.json").read_text(encoding="utf-8"))
          run_id_text = Path("/tmp/latest-scheduled-run-id").read_text(encoding="utf-8").strip()
          execution_conclusion = "unobserved"
          if run_id_text:
              try:
                  run_id = int(run_id_text)
              except ValueError:
                  run_id = None
              for job in jobs_payload.get("jobs", []):
                  if not isinstance(job, dict) or job.get("name") != "crawl":
                      continue
                  for step in job.get("steps", []):
                      if isinstance(step, dict) and step.get("name") == "Crawl configured sites":
                          execution_conclusion = step.get("conclusion") or step.get("status") or "unobserved"
                          break
                  if run_id is not None:
                      for run in combined.get("workflow_runs", []):
                          if isinstance(run, dict) and run.get("id") == run_id:
                              run["crawl_execution_conclusion"] = execution_conclusion
                              break
          Path("/tmp/crawl-runs-combined.json").write_text(json.dumps(combined), encoding="utf-8")
          print("Latest scheduled crawl-step conclusion:", execution_conclusion)
          PY
          python crawler/schedule_watchdog.py /tmp/crawl-runs-combined.json /tmp/public-manifest.json > /tmp/decision.json
          cat /tmp/decision.json

          action="$(python -c 'import json; print(json.load(open("/tmp/decision.json"))["action"])')"
          reason="$(python -c 'import json; print(json.load(open("/tmp/decision.json"))["reason"])')"
          age="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("age_seconds"))')"
          manifest_age="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("manifest_age_seconds"))')"
          schedule_status="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("schedule_status"))')"
          schedule_age="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("schedule_age_seconds"))')"
          last_schedule="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("last_scheduled_run"))')"
          schedule_conclusion="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("last_scheduled_conclusion"))')"

          {
            echo "### Everything Hub crawler schedule watchdog"
            echo "- Decision: $action"
            echo "- Reason: $reason"
            echo "- Last crawler attempt age (seconds): $age"
            echo "- Public manifest age (seconds): $manifest_age"
            echo "- Schedule trigger status: $schedule_status"
            echo "- Latest scheduled crawler run: ${last_schedule:-none observed}"
            echo "- Scheduled run age (seconds): ${schedule_age:-unknown}"
            echo "- Scheduled crawl-step conclusion: ${schedule_conclusion:-unknown}"
            echo "- Scheduled workflow conclusion: $(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("last_scheduled_workflow_conclusion"))')"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$schedule_status" != "recent" ] || [ "$schedule_conclusion" != "success" ]; then
            schedule_warning="status=${schedule_status}; latest conclusion=${schedule_conclusion:-unknown}; age=${schedule_age:-unknown}s; latest run=${last_schedule:-none observed}"
            echo "> **Scheduled crawler delivery warning:** ${schedule_warning}. No recovery marker is written solely for schedule lag." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Scheduled crawler delivery::${schedule_warning}. Crawl freshness is evaluated independently."
          fi

          case "$action" in
            mark)
              git fetch origin main
              git checkout -B main origin/main
              expected_head="$(git rev-parse origin/main)"
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/runs?per_page=100" > /tmp/crawl-runs-final.json
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/runs?event=schedule&per_page=5" > /tmp/crawl-scheduled-final.json
              gh api "repos/${GITHUB_REPOSITORY}/contents/public-search/manifest.json" > /tmp/public-manifest-final-envelope.json
              python - <<'PY'
              import base64
              import json
              from datetime import datetime, timezone
              from pathlib import Path

              active_statuses = {"queued", "in_progress", "pending", "waiting", "requested"}
              runs_payload = json.loads(Path("/tmp/crawl-runs-final.json").read_text(encoding="utf-8"))
              runs = runs_payload.get("workflow_runs")
              if not isinstance(runs, list):
                  raise SystemExit("Final GitHub crawler run check returned no workflow_runs array")
              active = [run for run in runs if isinstance(run, dict) and run.get("status") in active_statuses]
              if active:
                  print("Final check found an active crawler; no recovery marker will be written.")
                  raise SystemExit(0)

              scheduled_payload = json.loads(Path("/tmp/crawl-scheduled-final.json").read_text(encoding="utf-8"))
              scheduled = scheduled_payload.get("workflow_runs")
              if not isinstance(scheduled, list) or not scheduled:
                  print("No scheduled crawl event is observable; no recovery marker will be written.")
                  raise SystemExit(0)
              latest = max(scheduled, key=lambda row: row.get("created_at") or "")
              created_at = latest.get("created_at")
              if not isinstance(created_at, str):
                  raise SystemExit("Latest scheduled crawl event has no valid created_at timestamp")
              schedule_time = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
              if schedule_time.tzinfo is None:
                  schedule_time = schedule_time.replace(tzinfo=timezone.utc)
              now = datetime.now(timezone.utc)
              schedule_age = max(0, int((now - schedule_time.astimezone(timezone.utc)).total_seconds()))
              if schedule_age <= 25 * 60:
                  print(f"Scheduled delivery is only {schedule_age}s old; no recovery marker will be written.")
                  raise SystemExit(0)

              envelope = json.loads(Path("/tmp/public-manifest-final-envelope.json").read_text(encoding="utf-8"))
              encoded = envelope.get("content")
              if not isinstance(encoded, str):
                  raise SystemExit("Final public manifest response has no content")
              manifest = json.loads(base64.b64decode(encoded).decode("utf-8"))
              updated_at = manifest.get("updated_at")
              total_pages = manifest.get("total_pages")
              if type(updated_at) is not int or updated_at <= 0 or type(total_pages) is not int or total_pages < 1:
                  raise SystemExit("Final public manifest has invalid updated_at or total_pages")
              manifest_time = datetime.fromtimestamp(updated_at, timezone.utc)
              manifest_age = (now - manifest_time).total_seconds()
              if manifest_age < -60:
                  raise SystemExit("Final public manifest timestamp is too far in the future")
              manifest_age = max(0, int(manifest_age))
              if manifest_age <= 10 * 60:
                  print(f"Public manifest is only {manifest_age}s old; no recovery marker will be written.")
                  raise SystemExit(0)

              marker = {
                  "version": 1,
                  "updated_at": now.isoformat(timespec="milliseconds").replace("+00:00", "Z"),
                  "reason": (
                      f"Push-triggered fallback after scheduled crawl delivery was {schedule_age}s old "
                      f"(>25 minutes); no queued or running crawler; public manifest was {manifest_age}s old "
                      f"(>10 minutes). One bounded recovery crawl; normal schedule unchanged."
                  ),
                  "manifest_before_pages": total_pages,
                  "manifest_before_updated_at": manifest_time.isoformat(timespec="seconds").replace("+00:00", "Z"),
              }
              Path("/tmp/marker-ready.json").write_text(json.dumps(marker, indent=2) + "\n", encoding="utf-8")
              print("Recovery marker recheck passed:", json.dumps({
                  "scheduled_run": created_at,
                  "schedule_age_seconds": schedule_age,
                  "manifest_age_seconds": manifest_age,
                  "manifest_before_pages": total_pages,
                  "manifest_before_updated_at": marker["manifest_before_updated_at"],
              }, sort_keys=True))
              PY
              if [ ! -f /tmp/marker-ready.json ]; then
                echo "Final recovery conditions changed; no marker commit was made."
                exit 0
              fi
              cp /tmp/marker-ready.json crawler/automation-trigger.json
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add crawler/automation-trigger.json
              if git diff --cached --quiet; then
                echo "Recovery marker is unchanged; no commit was made."
                exit 0
              fi
              git commit -m "Trigger one bounded crawler recovery after stale schedule"
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/runs?per_page=100" > /tmp/crawl-runs-prepush.json
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/runs?event=schedule&per_page=5" > /tmp/crawl-scheduled-prepush.json
              gh api "repos/${GITHUB_REPOSITORY}/contents/public-search/manifest.json" > /tmp/public-manifest-prepush-envelope.json
              python - <<'PY'
              import base64
              import json
              from datetime import datetime, timezone
              from pathlib import Path

              active_statuses = {"queued", "in_progress", "pending", "waiting", "requested"}
              runs_payload = json.loads(Path("/tmp/crawl-runs-prepush.json").read_text(encoding="utf-8"))
              runs = runs_payload.get("workflow_runs", [])
              if any(isinstance(run, dict) and run.get("status") in active_statuses for run in runs):
                  print("A crawler became queued or active before push; aborting marker commit.")
                  raise SystemExit(0)
              scheduled_payload = json.loads(Path("/tmp/crawl-scheduled-prepush.json").read_text(encoding="utf-8"))
              scheduled = scheduled_payload.get("workflow_runs", [])
              if not scheduled:
                  print("Scheduled crawl history is unavailable at final push check; aborting marker commit.")
                  raise SystemExit(0)
              latest = max(scheduled, key=lambda row: row.get("created_at") or "")
              created_at = latest.get("created_at")
              if not isinstance(created_at, str):
                  raise SystemExit("Latest scheduled crawl event has no created_at timestamp")
              scheduled_at = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
              if scheduled_at.tzinfo is None:
                  scheduled_at = scheduled_at.replace(tzinfo=timezone.utc)
              now = datetime.now(timezone.utc)
              schedule_age = max(0, int((now - scheduled_at.astimezone(timezone.utc)).total_seconds()))
              if schedule_age <= 25 * 60:
                  print("Scheduled crawl delivery is no longer more than 25 minutes stale; aborting marker commit.")
                  raise SystemExit(0)
              envelope = json.loads(Path("/tmp/public-manifest-prepush-envelope.json").read_text(encoding="utf-8"))
              encoded = envelope.get("content")
              if not isinstance(encoded, str):
                  raise SystemExit("Latest public manifest content is unavailable at final push check")
              manifest = json.loads(base64.b64decode(encoded).decode("utf-8"))
              updated_at = manifest.get("updated_at")
              if type(updated_at) is not int or updated_at <= 0:
                  raise SystemExit("Latest public manifest updated_at is invalid at final push check")
              manifest_age = (now - datetime.fromtimestamp(updated_at, timezone.utc)).total_seconds()
              if manifest_age < -60:
                  raise SystemExit("Latest public manifest timestamp is too far in the future")
              if manifest_age <= 10 * 60:
                  print("Public manifest became fresh before push; aborting marker commit.")
                  raise SystemExit(0)
              Path("/tmp/prepush-eligible").write_text("yes", encoding="utf-8")
              print("Final no-overlap and freshness recheck passed.")
              PY
              if [ ! -f /tmp/prepush-eligible ]; then
                git reset --hard "${expected_head}"
                echo "Final recovery conditions changed; local marker commit discarded."
                exit 0
              fi
              git push --force-with-lease="refs/heads/main:${expected_head}" origin HEAD:refs/heads/main
              echo "Committed one bounded recovery marker with expected-head protection; crawl.yml push path will start the bounded crawl."
              ;;
            wait)
              echo "An existing crawler is queued or running, or one of the freshness gates is not satisfied; no marker update."
              ;;
            healthy)
              echo "The public manifest is fresh; no recovery marker is needed."
              ;;
            *)
              echo "Unexpected watchdog decision: $action" >&2
              exit 1
              ;;
          esac
      - name: Report publisher and live-search smoke health
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-site.yml/runs?per_page=5" > /tmp/publisher-runs.json
          publisher_run_id="$(python -c 'import json; runs=json.load(open("/tmp/publisher-runs.json")).get("workflow_runs") or []; print(runs[0].get("id", "") if runs else "")')"
          if [ -n "$publisher_run_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${publisher_run_id}/jobs?per_page=100" > /tmp/publisher-jobs.json
          else
            echo '{"jobs":[]}' > /tmp/publisher-jobs.json
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/search-api-smoke.yml/runs?per_page=5" > /tmp/search-smoke-runs.json
          python crawler/pipeline_health.py /tmp/publisher-runs.json /tmp/publisher-jobs.json /tmp/search-smoke-runs.json > /tmp/pipeline-health.json
          cat /tmp/pipeline-health.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("/tmp/pipeline-health.json").read_text(encoding="utf-8"))
          lines = [
              "### Everything Hub downstream pipeline health",
              f"- Overall status: {report['overall_status']}",
          ]
          for key, label in (("publisher", "Publisher workflow"), ("deploy_job", "Pages deployment job"), ("search_smoke", "Live search smoke")):
              item = report[key]
              lines.append(
                  f"- {label}: {item['status']} "
                  f"(run #{item.get('run_number') or 'n/a'}, "
                  f"conclusion={item.get('conclusion') or 'pending'})"
              )
          lines.append("- A successful deploy job is not treated as live-domain verification.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
