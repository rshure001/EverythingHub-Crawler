name: Everything Hub crawler schedule watchdog
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/crawl-watchdog.yml"
      - "crawler/schedule_watchdog.py"
      - "crawler/test_schedule_watchdog.py"
  schedule:
    # Stagger lightweight 15-minute checks away from quarter-hour and top-of-hour Actions peaks.
    - cron: "7,22,37,52 * * * *"
  workflow_run:
    workflows:
      - "Everything Hub crawler"
      - "Everything Hub live diagnostics"
      - "EverythingHub isolated importer smoke test"
    types:
      - completed
    branches: [main]
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: eh-crawler-schedule-watchdog
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test watchdog decision logic
        run: python -m unittest crawler.test_schedule_watchdog -v
      - name: Check recent crawler runs and recover missed schedules
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/runs?per_page=20" > /tmp/crawl-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/runs?event=schedule&per_page=5" > /tmp/crawl-scheduled-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/contents/public-search/manifest.json" > /tmp/public-manifest-envelope.json
          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/crawl-runs.json").read_text(encoding="utf-8"))
          scheduled_payload = json.loads(Path("/tmp/crawl-scheduled-runs.json").read_text(encoding="utf-8"))
          runs = payload.get("workflow_runs")
          scheduled = scheduled_payload.get("workflow_runs")
          if not isinstance(runs, list) or not isinstance(scheduled, list):
              raise SystemExit("GitHub did not return crawler workflow-run arrays")
          known_ids = {row.get("id") for row in runs if isinstance(row, dict)}
          runs.extend(row for row in scheduled if isinstance(row, dict) and row.get("id") not in known_ids)
          Path("/tmp/crawl-runs-combined.json").write_text(
              json.dumps({"workflow_runs": runs}), encoding="utf-8"
          )

          envelope = json.loads(Path("/tmp/public-manifest-envelope.json").read_text(encoding="utf-8"))
          encoded = envelope.get("content")
          if not isinstance(encoded, str):
              raise SystemExit("GitHub did not return the public search manifest content")
          manifest = json.loads(base64.b64decode(encoded).decode("utf-8"))
          if (
              not isinstance(manifest, dict)
              or manifest.get("version") != 1
              or not isinstance(manifest.get("updated_at"), int)
              or manifest["updated_at"] <= 0
              or not isinstance(manifest.get("total_pages"), int)
              or manifest["total_pages"] < 1
          ):
              raise SystemExit("Public search manifest failed the watchdog freshness preflight")
          Path("/tmp/public-manifest.json").write_text(json.dumps(manifest), encoding="utf-8")
          print("Public manifest timestamp:", manifest["updated_at"])
          print("Public manifest indexed pages:", manifest["total_pages"])
          print("Recent crawler runs:", len(runs))
          print("Recent scheduled crawler runs:", len(scheduled))
          PY
          python crawler/schedule_watchdog.py /tmp/crawl-runs-combined.json /tmp/public-manifest.json > /tmp/decision.json
          cat /tmp/decision.json

          action="$(python -c 'import json; print(json.load(open("/tmp/decision.json"))["action"])')"
          reason="$(python -c 'import json; print(json.load(open("/tmp/decision.json"))["reason"])')"
          age="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("age_seconds"))')"
          manifest_age="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("manifest_age_seconds"))')"
          schedule_status="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("schedule_status"))')"
          schedule_age="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("schedule_age_seconds"))')"
          last_schedule="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("last_scheduled_run"))')"
          schedule_conclusion="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("last_scheduled_conclusion"))')"

          {
            echo "### Everything Hub crawler schedule watchdog"
            echo "- Decision: $action"
            echo "- Reason: $reason"
            echo "- Last crawler attempt age (seconds): $age"
            echo "- Public manifest age (seconds): $manifest_age"
            echo "- Schedule trigger status: $schedule_status"
            echo "- Latest scheduled crawler run: ${last_schedule:-none observed}"
            echo "- Scheduled run age (seconds): ${schedule_age:-unknown}"
            echo "- Scheduled run conclusion: ${schedule_conclusion:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$action" in
            dispatch)
              gh workflow run crawl.yml --ref main
              echo "Dispatched one recovery crawl through workflow_dispatch."
              ;;
            wait)
              echo "An existing crawler run is queued or active; no duplicate dispatch."
              ;;
            healthy)
              echo "The most recent crawler run and public manifest are within the 10-minute freshness window."
              ;;
            *)
              echo "Unexpected watchdog decision: $action" >&2
              exit 1
              ;;
          esac
