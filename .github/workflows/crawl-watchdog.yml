name: Everything Hub crawler schedule watchdog
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/crawl-watchdog.yml"
      - "crawler/schedule_watchdog.py"
      - "crawler/test_schedule_watchdog.py"
      - "crawler/pipeline_health.py"
      - "crawler/test_pipeline_health.py"
  schedule:
    # Run lightweight checks every five minutes, two minutes after each staggered crawl slot, away from the top-of-hour Actions load peak.
    # Keep the watchdog as the bounded recovery path when scheduled crawl delivery goes stale.
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  workflow_run:
    # Recheck freshness after catalog publishers too. Scheduled crawl events can
    # be delayed; a completed inventory/discovery run is another safe recovery
    # point, while the watchdog's no-overlap and manifest-age guards stay intact.
    workflows:
      - "Everything Hub crawler"
      - "Retroactive catalog inventory"
      - "Catalog-first discovery"
      - "Ten-at-a-time catalog seed expansion"
    types:
      - completed
    branches: [main]
  workflow_dispatch:
permissions:
  actions: write
  contents: write
concurrency:
  group: eh-crawler-schedule-watchdog
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test watchdog decision logic
        run: |
          python -m unittest crawler.test_schedule_watchdog -v
          python -m unittest crawler.test_pipeline_health -v
      - name: Check recent crawler runs and recover missed schedules
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/runs?per_page=20" > /tmp/crawl-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/runs?event=schedule&per_page=5" > /tmp/crawl-scheduled-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/retroactive-catalog-index.yml/runs?per_page=100" > /tmp/catalog-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-first-discovery.yml/runs?per_page=100" > /tmp/catalog-discovery-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-seed-expansion.yml/runs?per_page=100" > /tmp/catalog-seed-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/contents/public-search/manifest.json" > /tmp/public-manifest-envelope.json
          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/crawl-runs.json").read_text(encoding="utf-8"))
          scheduled_payload = json.loads(Path("/tmp/crawl-scheduled-runs.json").read_text(encoding="utf-8"))
          catalog_payload = json.loads(Path("/tmp/catalog-runs.json").read_text(encoding="utf-8"))
          discovery_payload = json.loads(Path("/tmp/catalog-discovery-runs.json").read_text(encoding="utf-8"))
          seed_payload = json.loads(Path("/tmp/catalog-seed-runs.json").read_text(encoding="utf-8"))
          runs = payload.get("workflow_runs")
          scheduled = scheduled_payload.get("workflow_runs")
          catalog_runs = catalog_payload.get("workflow_runs")
          discovery_runs = discovery_payload.get("workflow_runs")
          seed_runs = seed_payload.get("workflow_runs")
          if not all(isinstance(items, list) for items in (runs, scheduled, catalog_runs, discovery_runs, seed_runs)):
              raise SystemExit("GitHub did not return crawler and catalog workflow-run arrays")
          known_ids = {row.get("id") for row in runs if isinstance(row, dict)}
          for extra_runs in (scheduled, catalog_runs, discovery_runs, seed_runs):
              for row in extra_runs:
                  if isinstance(row, dict) and row.get("id") not in known_ids:
                      runs.append(row)
                      known_ids.add(row.get("id"))
          latest_scheduled = max(
              (row for row in scheduled if isinstance(row, dict) and row.get("id")),
              key=lambda row: row.get("created_at") or "",
              default=None,
          )
          Path("/tmp/latest-scheduled-run-id").write_text(
              str(latest_scheduled.get("id", "")) if latest_scheduled else "",
              encoding="utf-8",
          )
          Path("/tmp/crawl-runs-combined.json").write_text(
              json.dumps({"workflow_runs": runs}), encoding="utf-8"
          )

          envelope = json.loads(Path("/tmp/public-manifest-envelope.json").read_text(encoding="utf-8"))
          encoded = envelope.get("content")
          if not isinstance(encoded, str):
              raise SystemExit("GitHub did not return the public search manifest content")
          manifest = json.loads(base64.b64decode(encoded).decode("utf-8"))
          if (
              not isinstance(manifest, dict)
              or manifest.get("version") != 1
              or not isinstance(manifest.get("updated_at"), int)
              or manifest["updated_at"] <= 0
              or not isinstance(manifest.get("total_pages"), int)
              or manifest["total_pages"] < 1
          ):
              raise SystemExit("Public search manifest failed the watchdog freshness preflight")
          Path("/tmp/public-manifest.json").write_text(json.dumps(manifest), encoding="utf-8")
          print("Public manifest timestamp:", manifest["updated_at"])
          print("Public manifest indexed pages:", manifest["total_pages"])
          print("Recent crawler runs:", len(runs))
          print("Recent scheduled crawler runs:", len(scheduled))
          PY
          latest_scheduled_run_id="$(cat /tmp/latest-scheduled-run-id)"
          if [ -n "$latest_scheduled_run_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${latest_scheduled_run_id}/jobs?per_page=100" > /tmp/latest-scheduled-jobs.json
          else
            echo '{"jobs":[]}' > /tmp/latest-scheduled-jobs.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          combined = json.loads(Path("/tmp/crawl-runs-combined.json").read_text(encoding="utf-8"))
          jobs_payload = json.loads(Path("/tmp/latest-scheduled-jobs.json").read_text(encoding="utf-8"))
          run_id_text = Path("/tmp/latest-scheduled-run-id").read_text(encoding="utf-8").strip()
          execution_conclusion = "unobserved"
          if run_id_text:
              try:
                  run_id = int(run_id_text)
              except ValueError:
                  run_id = None
              for job in jobs_payload.get("jobs", []):
                  if not isinstance(job, dict) or job.get("name") != "crawl":
                      continue
                  for step in job.get("steps", []):
                      if isinstance(step, dict) and step.get("name") == "Crawl configured sites":
                          execution_conclusion = step.get("conclusion") or step.get("status") or "unobserved"
                          break
                  if run_id is not None:
                      for run in combined.get("workflow_runs", []):
                          if isinstance(run, dict) and run.get("id") == run_id:
                              run["crawl_execution_conclusion"] = execution_conclusion
                              break
          Path("/tmp/crawl-runs-combined.json").write_text(json.dumps(combined), encoding="utf-8")
          print("Latest scheduled crawl-step conclusion:", execution_conclusion)
          PY
          python crawler/schedule_watchdog.py /tmp/crawl-runs-combined.json /tmp/public-manifest.json data/frontier.json > /tmp/decision.json
          cat /tmp/decision.json

          action="$(python -c 'import json; print(json.load(open("/tmp/decision.json"))["action"])')"
          reason="$(python -c 'import json; print(json.load(open("/tmp/decision.json"))["reason"])')"
          age="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("age_seconds"))')"
          manifest_age="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("manifest_age_seconds"))')"
          schedule_status="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("schedule_status"))')"
          schedule_age="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("schedule_age_seconds"))')"
          last_schedule="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("last_scheduled_run"))')"
          schedule_conclusion="$(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("last_scheduled_conclusion"))')"

          {
            echo "### Everything Hub crawler schedule watchdog"
            echo "- Decision: $action"
            echo "- Reason: $reason"
            echo "- Last crawler attempt age (seconds): $age"
            echo "- Public manifest age (seconds): $manifest_age"
            echo "- Schedule trigger status: $schedule_status"
            echo "- Latest scheduled crawler run: ${last_schedule:-none observed}"
            echo "- Scheduled run age (seconds): ${schedule_age:-unknown}"
            echo "- Scheduled crawl-step conclusion: ${schedule_conclusion:-unknown}"
            echo "- Scheduled workflow conclusion: $(python -c 'import json; print(json.load(open("/tmp/decision.json")).get("last_scheduled_workflow_conclusion"))')"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$schedule_status" != "recent" ] || [ "$schedule_conclusion" != "success" ]; then
            schedule_warning="status=${schedule_status}; latest conclusion=${schedule_conclusion:-unknown}; age=${schedule_age:-unknown}s; latest run=${last_schedule:-none observed}"
            echo "> **Scheduled crawler delivery warning:** ${schedule_warning}. No recovery marker is written solely for schedule lag." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Scheduled crawler delivery::${schedule_warning}. Crawl freshness is evaluated independently."
          fi

          case "$action" in
            mark)
              git fetch origin main
              git checkout -B main origin/main
              expected_head="$(git rev-parse origin/main)"
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/runs?per_page=100" > /tmp/crawl-runs-final.json
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/retroactive-catalog-index.yml/runs?per_page=100" > /tmp/catalog-runs-final.json
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-first-discovery.yml/runs?per_page=100" > /tmp/catalog-discovery-runs-final.json
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-seed-expansion.yml/runs?per_page=100" > /tmp/catalog-seed-runs-final.json
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/runs?event=schedule&per_page=5" > /tmp/crawl-scheduled-final.json
              gh api "repos/${GITHUB_REPOSITORY}/contents/public-search/manifest.json" > /tmp/public-manifest-final-envelope.json
              python - <<'PY'
          import base64
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          active_statuses = {"queued", "in_progress", "pending", "waiting", "requested"}
          runs_payload = json.loads(Path("/tmp/crawl-runs-final.json").read_text(encoding="utf-8"))
          catalog_payload = json.loads(Path("/tmp/catalog-runs-final.json").read_text(encoding="utf-8"))
          discovery_payload = json.loads(Path("/tmp/catalog-discovery-runs-final.json").read_text(encoding="utf-8"))
          seed_payload = json.loads(Path("/tmp/catalog-seed-runs-final.json").read_text(encoding="utf-8"))
          runs = runs_payload.get("workflow_runs")
          catalog_runs = catalog_payload.get("workflow_runs")
          discovery_runs = discovery_payload.get("workflow_runs")
          seed_runs = seed_payload.get("workflow_runs")
          if not all(isinstance(items, list) for items in (runs, catalog_runs, discovery_runs, seed_runs)):
              raise SystemExit("Final GitHub crawler/catalog run check returned an invalid workflow_runs array")
          runs.extend(catalog_runs)
          runs.extend(discovery_runs)
          runs.extend(seed_runs)
          # Page-derived analysis rebases its validated snapshot and may overlap a crawl.
          # Page-derived analysis rebases its validated snapshot and may overlap a crawl.
          blocking_names = {"Everything Hub crawler", "Catalog-first discovery", "Ten-at-a-time catalog seed expansion"}
          active = [
              run for run in runs
              if isinstance(run, dict)
              and run.get("name") in blocking_names
              and run.get("status") in active_statuses
          ]
          if active:
              print("Final check found an active crawler or conflicting catalog workflow; no recovery marker will be written.")
              raise SystemExit(0)

          scheduled_payload = json.loads(Path("/tmp/crawl-scheduled-final.json").read_text(encoding="utf-8"))
          scheduled = scheduled_payload.get("workflow_runs")
          schedule_age = None
          created_at = None
          now = datetime.now(timezone.utc)
          if isinstance(scheduled, list) and scheduled:
              latest = max(scheduled, key=lambda row: row.get("created_at") or "")
              created_at = latest.get("created_at")
              if not isinstance(created_at, str):
                  raise SystemExit("Latest scheduled crawl event has no valid created_at timestamp")
              schedule_time = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
              if schedule_time.tzinfo is None:
                  schedule_time = schedule_time.replace(tzinfo=timezone.utc)
              schedule_age = max(0, int((now - schedule_time.astimezone(timezone.utc)).total_seconds()))
          else:
              print("No scheduled crawl event is observable; using manifest age as a conservative fallback.")

          envelope = json.loads(Path("/tmp/public-manifest-final-envelope.json").read_text(encoding="utf-8"))
          encoded = envelope.get("content")
          if not isinstance(encoded, str):
              raise SystemExit("Final public manifest response has no content")
          manifest = json.loads(base64.b64decode(encoded).decode("utf-8"))
          updated_at = manifest.get("updated_at")
          total_pages = manifest.get("total_pages")
          if type(updated_at) is not int or updated_at <= 0 or type(total_pages) is not int or total_pages < 1:
              raise SystemExit("Final public manifest has invalid updated_at or total_pages")
          manifest_time = datetime.fromtimestamp(updated_at, timezone.utc)
          manifest_age = (now - manifest_time).total_seconds()
          if manifest_age < -60:
              raise SystemExit("Final public manifest timestamp is too far in the future")
          manifest_age = max(0, int(manifest_age))

          frontier = json.loads(Path("data/frontier.json").read_text(encoding="utf-8"))
          queue = frontier.get("queue") if isinstance(frontier, dict) else None
          if not isinstance(queue, list):
              raise SystemExit("Final frontier snapshot does not contain a queue array")
          frontier_pending_count = len(queue)

          attempts = [
              run for run in runs
              if isinstance(run, dict)
              and run.get("name") == "Everything Hub crawler"
              and isinstance(run.get("created_at"), str)
          ]
          latest_attempt = max(attempts, key=lambda row: row.get("created_at") or "", default=None)
          attempt_age = None
          if latest_attempt is not None:
              attempt_time = datetime.fromisoformat(latest_attempt["created_at"].replace("Z", "+00:00"))
              if attempt_time.tzinfo is None:
                  attempt_time = attempt_time.replace(tzinfo=timezone.utc)
              attempt_age = max(0, int((now - attempt_time.astimezone(timezone.utc)).total_seconds()))

          if frontier_pending_count > 0:
              if attempt_age is not None and attempt_age < 5 * 60:
                  print(
                      f"{frontier_pending_count} frontier URLs remain queued, but the last crawler attempt "
                      f"started only {attempt_age}s ago; the five-minute minimum interval has not elapsed."
                  )
                  raise SystemExit(0)
              recovery_reason = (
                  f"{frontier_pending_count} frontier URLs remain queued; "
                  f"the last crawler attempt started {attempt_age if attempt_age is not None else 'an unknown number of'} seconds ago "
                  f"(five-minute minimum interval satisfied); manifest age is {manifest_age}s"
              )
          else:
              if schedule_age is not None and schedule_age <= 10 * 60:
                  print(f"Scheduled delivery is only {schedule_age}s old and the frontier is empty; no recovery marker will be written.")
                  raise SystemExit(0)
              if manifest_age <= 10 * 60:
                  print(f"Public manifest is only {manifest_age}s old and the frontier is empty; no recovery marker will be written.")
                  raise SystemExit(0)
              schedule_reason = (
                  f"scheduled crawl delivery was {schedule_age}s old (>10 minutes)"
                  if schedule_age is not None
                  else f"no scheduled crawl event was observable and the manifest was {manifest_age}s old (>10 minutes)"
              )
              recovery_reason = f"{schedule_reason}; frontier is empty and manifest age is {manifest_age}s"

          marker = {
              "version": 1,
              "updated_at": now.isoformat(timespec="milliseconds").replace("+00:00", "Z"),
              "reason": (
                  f"Explicit workflow_dispatch fallback because {recovery_reason}; no queued or running crawler; "
                  "one bounded recovery crawl; normal schedule unchanged."
              ),
              "manifest_before_pages": total_pages,
              "manifest_before_updated_at": manifest_time.isoformat(timespec="seconds").replace("+00:00", "Z"),
              "frontier_pending_count": frontier_pending_count,
          }
          Path("/tmp/marker-ready.json").write_text(json.dumps(marker, indent=2) + "\n", encoding="utf-8")
          print("Recovery marker recheck passed:", json.dumps({
              "scheduled_run": created_at,
              "schedule_age_seconds": schedule_age,
              "manifest_age_seconds": manifest_age,
              "manifest_before_pages": total_pages,
              "manifest_before_updated_at": marker["manifest_before_updated_at"],
          }, sort_keys=True))
          PY
              if [ ! -f /tmp/marker-ready.json ]; then
                echo "Final recovery conditions changed; no marker commit was made."
                exit 0
              fi
              cp /tmp/marker-ready.json crawler/automation-trigger.json
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add crawler/automation-trigger.json
              if git diff --cached --quiet; then
                echo "Recovery marker is unchanged; no commit was made."
                exit 0
              fi
              git commit -m "Trigger one bounded crawler recovery after stale schedule"
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/runs?per_page=100" > /tmp/crawl-runs-prepush.json
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/retroactive-catalog-index.yml/runs?per_page=100" > /tmp/catalog-runs-prepush.json
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-first-discovery.yml/runs?per_page=100" > /tmp/catalog-discovery-runs-prepush.json
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-seed-expansion.yml/runs?per_page=100" > /tmp/catalog-seed-runs-prepush.json
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/runs?event=schedule&per_page=5" > /tmp/crawl-scheduled-prepush.json
              gh api "repos/${GITHUB_REPOSITORY}/contents/public-search/manifest.json" > /tmp/public-manifest-prepush-envelope.json
              python - <<'PY'
          import base64
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          active_statuses = {"queued", "in_progress", "pending", "waiting", "requested"}
          runs_payload = json.loads(Path("/tmp/crawl-runs-prepush.json").read_text(encoding="utf-8"))
          catalog_payload = json.loads(Path("/tmp/catalog-runs-prepush.json").read_text(encoding="utf-8"))
          discovery_payload = json.loads(Path("/tmp/catalog-discovery-runs-prepush.json").read_text(encoding="utf-8"))
          seed_payload = json.loads(Path("/tmp/catalog-seed-runs-prepush.json").read_text(encoding="utf-8"))
          runs = runs_payload.get("workflow_runs", [])
          catalog_runs = catalog_payload.get("workflow_runs", [])
          discovery_runs = discovery_payload.get("workflow_runs", [])
          seed_runs = seed_payload.get("workflow_runs", [])
          blocking_names = {"Everything Hub crawler", "Catalog-first discovery", "Ten-at-a-time catalog seed expansion"}
          all_runs = runs + catalog_runs + discovery_runs + seed_runs
          if any(
              isinstance(run, dict)
              and run.get("name") in blocking_names
              and run.get("status") in active_statuses
              for run in all_runs
          ):
              print("A crawler or catalog-analysis run became queued or active before push; aborting marker commit.")
              raise SystemExit(0)
          scheduled_payload = json.loads(Path("/tmp/crawl-scheduled-prepush.json").read_text(encoding="utf-8"))
          scheduled = scheduled_payload.get("workflow_runs", [])
          schedule_age = None
          now = datetime.now(timezone.utc)
          if scheduled:
              latest = max(scheduled, key=lambda row: row.get("created_at") or "")
              created_at = latest.get("created_at")
              if not isinstance(created_at, str):
                  raise SystemExit("Latest scheduled crawl event has no created_at timestamp")
              scheduled_at = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
              if scheduled_at.tzinfo is None:
                  scheduled_at = scheduled_at.replace(tzinfo=timezone.utc)
              schedule_age = max(0, int((now - scheduled_at.astimezone(timezone.utc)).total_seconds()))
          else:
              print("No scheduled crawl event is observable at final push check; using manifest age when the frontier is empty.")

          envelope = json.loads(Path("/tmp/public-manifest-prepush-envelope.json").read_text(encoding="utf-8"))
          encoded = envelope.get("content")
          if not isinstance(encoded, str):
              raise SystemExit("Latest public manifest content is unavailable at final push check")
          manifest = json.loads(base64.b64decode(encoded).decode("utf-8"))
          updated_at = manifest.get("updated_at")
          if type(updated_at) is not int or updated_at <= 0:
              raise SystemExit("Latest public manifest updated_at is invalid at final push check")
          manifest_time = datetime.fromtimestamp(updated_at, timezone.utc)
          manifest_age = (now - manifest_time).total_seconds()
          if manifest_age < -60:
              raise SystemExit("Latest public manifest timestamp is too far in the future")
          manifest_age = max(0, int(manifest_age))

          frontier = json.loads(Path("data/frontier.json").read_text(encoding="utf-8"))
          queue = frontier.get("queue") if isinstance(frontier, dict) else None
          if not isinstance(queue, list):
              raise SystemExit("Latest frontier snapshot does not contain a queue array at final push check")
          frontier_pending_count = len(queue)

          attempts = [
              run for run in runs
              if isinstance(run, dict)
              and run.get("name") == "Everything Hub crawler"
              and isinstance(run.get("created_at"), str)
          ]
          latest_attempt = max(attempts, key=lambda row: row.get("created_at") or "", default=None)
          attempt_age = None
          if latest_attempt is not None:
              attempt_time = datetime.fromisoformat(latest_attempt["created_at"].replace("Z", "+00:00"))
              if attempt_time.tzinfo is None:
                  attempt_time = attempt_time.replace(tzinfo=timezone.utc)
              attempt_age = max(0, int((now - attempt_time.astimezone(timezone.utc)).total_seconds()))

          frontier_continue = frontier_pending_count > 0
          if frontier_continue and attempt_age is not None and attempt_age < 5 * 60:
              print(
                  f"{frontier_pending_count} frontier URLs remain queued, but the last crawler attempt "
                  f"started only {attempt_age}s ago; the five-minute minimum interval has not elapsed."
              )
              raise SystemExit(0)

          if frontier_continue:
              print(
                  f"Frontier continuation recheck passed: {frontier_pending_count} URLs remain queued; "
                  f"the minimum interval is satisfied; manifest age is {manifest_age}s."
              )
          else:
              if schedule_age is not None and schedule_age <= 10 * 60:
                  print("Scheduled crawl delivery is within 10 minutes and the frontier is empty; aborting marker commit.")
                  raise SystemExit(0)
              if manifest_age <= 10 * 60:
                  print("Public manifest is fresh and the frontier is empty; aborting marker commit.")
                  raise SystemExit(0)
          Path("/tmp/prepush-eligible").write_text("yes", encoding="utf-8")
          print("Final no-overlap and freshness recheck passed.")
          PY
              if [ ! -f /tmp/prepush-eligible ]; then
                git reset --hard "${expected_head}"
                echo "Final recovery conditions changed; local marker commit discarded."
                exit 0
              fi
              pushed=0
              for attempt in 1 2 3; do
                git fetch origin main
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  echo "::warning title=Recovery marker deferred::The main branch changed the recovery marker concurrently; the next watchdog cycle will re-evaluate."
                  exit 0
                fi
                if git push origin HEAD:refs/heads/main; then
                  pushed=1
                  break
                fi
                echo "Main advanced during recovery marker push; retrying rebase (attempt ${attempt}/3)."
              done
              if [ "$pushed" -ne 1 ]; then
                echo "::warning title=Recovery marker deferred::Main advanced repeatedly; the next watchdog cycle will re-evaluate."
                exit 0
              fi
              echo "Committed one bounded recovery marker after rebasing onto latest main."

              # GITHUB_TOKEN pushes do not start another push-triggered workflow.
              # Explicitly dispatch the crawl only after a fresh no-overlap check.
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/runs?per_page=100" > /tmp/crawl-runs-postpush.json
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/retroactive-catalog-index.yml/runs?per_page=100" > /tmp/catalog-runs-postpush.json
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-first-discovery.yml/runs?per_page=100" > /tmp/catalog-discovery-runs-postpush.json
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-seed-expansion.yml/runs?per_page=100" > /tmp/catalog-seed-runs-postpush.json
              recovery_sha="$(git rev-parse HEAD)"
              RECOVERY_SHA="$recovery_sha" python - <<'PY'
          import json
          import os
          from pathlib import Path
          from crawler.schedule_watchdog import recovery_dispatch_decision

          payload = json.loads(Path("/tmp/crawl-runs-postpush.json").read_text(encoding="utf-8"))
          catalog_payload = json.loads(Path("/tmp/catalog-runs-postpush.json").read_text(encoding="utf-8"))
          discovery_payload = json.loads(Path("/tmp/catalog-discovery-runs-postpush.json").read_text(encoding="utf-8"))
          seed_payload = json.loads(Path("/tmp/catalog-seed-runs-postpush.json").read_text(encoding="utf-8"))
          runs = payload.get("workflow_runs")
          catalog_runs = catalog_payload.get("workflow_runs")
          discovery_runs = discovery_payload.get("workflow_runs")
          seed_runs = seed_payload.get("workflow_runs")
          if not all(isinstance(items, list) for items in (runs, catalog_runs, discovery_runs, seed_runs)):
              raise SystemExit("Post-push crawler/catalog run check returned an invalid workflow_runs array")
          runs.extend(catalog_runs)
          runs.extend(discovery_runs)
          runs.extend(seed_runs)
          decision = recovery_dispatch_decision(runs, os.environ["RECOVERY_SHA"])
          print("Post-push recovery dispatch decision:", json.dumps(decision, sort_keys=True))
          if decision["action"] == "dispatch":
              Path("/tmp/crawl-dispatch-eligible").write_text("yes", encoding="utf-8")
          PY
              if [ ! -f /tmp/crawl-dispatch-eligible ]; then
                echo "Post-push check found an existing crawler run or could not authorize a second dispatch; no workflow_dispatch was sent."
                exit 0
              fi
              gh workflow run crawl.yml --ref main
              echo "Dispatched one bounded crawler workflow_dispatch after the post-push no-overlap check."
              ;;
            wait)
              echo "An existing crawler or catalog-analysis run is queued or running, or one of the freshness gates is not satisfied; no marker update."
              ;;
            healthy)
              echo "The public manifest is fresh; no recovery marker is needed."
              ;;
            *)
              echo "Unexpected watchdog decision: $action" >&2
              exit 1
              ;;
          esac
      - name: Report live-search smoke health (Pages publisher not used)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo '{"workflow_runs":[]}' > /tmp/publisher-runs.json
          echo '{"jobs":[]}' > /tmp/publisher-jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/search-api-smoke.yml/runs?per_page=5" > /tmp/search-smoke-runs.json
          python crawler/pipeline_health.py /tmp/publisher-runs.json /tmp/publisher-jobs.json /tmp/search-smoke-runs.json > /tmp/pipeline-health.json
          cat /tmp/pipeline-health.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("/tmp/pipeline-health.json").read_text(encoding="utf-8"))
          search = report["search_smoke"]
          lines = [
              "### Everything Hub live-search health",
              f"- Overall status: {report['overall_status']}",
              f"- Live search smoke: {search['status']} "
              f"(run #{search.get('run_number') or 'n/a'}, "
              f"conclusion={search.get('conclusion') or 'pending'})",
              "- GitHub Pages publishing: not used by the crawler; validated catalog artifacts remain in the repository.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
