name: Everything Hub free static publisher
# Final free-hosting activation: publish approved manifest-verified release through GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "site/search.js"
      - "site/catalog-navigation.js"
      - "site/release-manifest.json"
      - ".github/workflows/everything-hub-free-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: everything-hub-free-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out only the approved site files
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            site/index.html
            site/search.js
            site/catalog-navigation.js
            site/release-manifest.json
            site/hosting-deployment-trigger.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Verify release manifest sizes and SHA-256 digests
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('site')
          manifest = json.loads((root / 'release-manifest.json').read_text())
          entries = {item['path']: item for item in manifest['files']}
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file() and p.name != 'release-manifest.json'}
          if actual != set(entries):
              raise SystemExit(f'manifest file-set mismatch: unlisted={sorted(actual-set(entries))}, missing={sorted(set(entries)-actual)}')
          for rel, item in entries.items():
              raw = (root / rel).read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              if item.get('size') != len(raw) or item.get('sha256') != digest:
                  raise SystemExit(f'manifest mismatch: {rel}')
              print(f'PASS {rel}: {len(raw)} bytes SHA-256 {digest}')
          print(f'PASS: {len(entries)} release files match the manifest exactly.')
          PY
      - name: Configure free GitHub Pages hosting
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble only the approved homepage and search client
        run: |
          set -euo pipefail
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/search.js _site/search.js
          cp site/catalog-navigation.js _site/catalog-navigation.js
          test -s _site/index.html
          test -s _site/search.js
          test -s _site/catalog-navigation.js
          echo "Homepage bytes: $(wc -c < _site/index.html)"
          echo "Search client bytes: $(wc -c < _site/search.js)"
          echo "Catalog navigation bytes: $(wc -c < _site/catalog-navigation.js)"
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published homepage and search client
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "$PAGE_URL" -o /tmp/live-index.html
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "${PAGE_URL%/}/search.js" -o /tmp/live-search.js
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "${PAGE_URL%/}/catalog-navigation.js" -o /tmp/live-catalog-navigation.js
          cmp -s site/index.html /tmp/live-index.html
          cmp -s site/search.js /tmp/live-search.js
          cmp -s site/catalog-navigation.js /tmp/live-catalog-navigation.js
          echo "PASS: live homepage, search client, and catalog navigation exactly match the approved repository files."
          echo "Published URL: $PAGE_URL"
