name: Hurricane Memory prototype tests

on:
  pull_request:
    paths:
      - 'hurricane_memory/**'
      - 'tests/test_hurricane_memory.py'
      - '.github/workflows/hurricane-memory-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile prototype
        run: python -m py_compile hurricane_memory/store.py hurricane_memory/__init__.py
      - name: Run isolated memory tests
        run: python -m unittest discover -s tests -p 'test_hurricane_memory.py' -v
