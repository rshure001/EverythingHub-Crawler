name: Validate Everything Hub crawler and schema
on:
  push:
    branches: [main]
    paths:
      - "crawler/**"
      - "database/**"
      - "publisher/**"
      - "supabase/functions/**"
      - "README.md"
      - "SCALABLE-ARCHITECTURE.md"
      - ".github/workflows/crawl.yml"
      - ".github/workflows/crawl-watchdog.yml"
      - ".github/workflows/validate-crawler.yml"
  pull_request:
    paths:
      - "crawler/**"
      - "publisher/**"
      - "database/**"
      - "supabase/functions/**"
      - "README.md"
      - "SCALABLE-ARCHITECTURE.md"
      - ".github/workflows/crawl-watchdog.yml"
      - ".github/workflows/validate-crawler.yml"
      - ".github/workflows/crawl.yml"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eh-crawler-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate crawler and publisher workflow YAML
        run: ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path, aliases: true); puts "YAML valid: #{path}" }' .github/workflows/crawl.yml .github/workflows/publish-site.yml
      - name: Compile crawler and database tools
        run: |
          python -m py_compile crawler/crawl.py crawler/report.py crawler/build_search_shards.py crawler/validate_public_index.py crawler/validate_media_catalog.py database/import_repository_index.py database/crawl_worker.py database/crawl_worker_smoke.py publisher/release_health.py
      - name: Run crawler, schema-isolation, and edge-search tests
        run: |
          python -m unittest discover -s crawler -p 'test_*.py' -v
          python -m unittest discover -s database -p 'test_*.py' -v
          python -m unittest discover -s publisher -p 'test_*.py' -v
          node --test supabase/functions/everything-hub-web-search/params.test.mjs supabase/functions/everything-hub-web-search/db-fetch.test.mjs supabase/functions/everything-hub-web-search/static-search.test.mjs supabase/functions/everything-hub-web-search/static-manifest.test.mjs supabase/functions/everything-hub-web-search/manifest-time.test.mjs supabase/functions/everything-hub-media-search/merge-results.test.mjs
          python crawler/build_search_shards.py
          python crawler/validate_public_index.py
          python crawler/validate_media_catalog.py
          node supabase/functions/everything-hub-web-search/static-search-catalog-smoke.mjs
      - name: Set up Deno for Edge Function type checking
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Everything Hub media discovery Edge Function
        run: deno check supabase/functions/everything-hub-media-search/index.ts
      - name: Type-check Everything Hub web search Edge Function
        run: deno check supabase/functions/everything-hub-web-search/index.ts
      - name: Validate static release manifest
        run: python publisher/publish.py --check
