name: Validate Everything Hub crawler
on:
  pull_request:
    paths:
      - "crawler/**"
      - "publisher/**"
      - "README.md"
      - "SCALABLE-ARCHITECTURE.md"
      - ".github/workflows/validate-crawler.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eh-crawler-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile crawler and run unit tests
        run: |
          python -m py_compile crawler/crawl.py crawler/report.py crawler/build_search_shards.py
          python -m unittest discover -s crawler -p 'test_*.py' -v
      - name: Validate static release manifest
        run: python publisher/publish.py --check
