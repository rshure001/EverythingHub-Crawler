name: Validate Everything Hub Vercel search backend
on:
  push:
    branches: [main]
    paths:
      - 'vercel-search-backend/**'
      - '.github/workflows/validate-vercel-search.yml'
  pull_request:
    paths:
      - 'vercel-search-backend/**'
      - '.github/workflows/validate-vercel-search.yml'
  schedule:
    # Stagger lightweight production checks away from GitHub's quarter-hour peaks; completion also wakes the crawler watchdog.
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Run search integrity and pagination tests
        run: node --test vercel-search-backend/test/*.test.js
      - name: Validate current main universal catalog manifest and root record shards
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: node vercel-search-backend/scripts/validate-universal-catalog-live.js
  staging-smoke:
    if: github.event_name == 'pull_request' && contains(fromJSON('["fix/bounded-catalog-search-20261121","eh/search-load-budget-20261121","eh/catalog-search-relevance-20261121","fix/live-search-watchdog-recovery-20261122","fix/query-index-consumer-main-20261122","fix/bounded-query-shard-ranking-20261122"]'), github.head_ref)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://everythinghub-search-backend-mtk64xqeo-rshure001-8053.vercel.app
    steps:
      - name: Verify staging backend health and representative catalog searches
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 15 "$BASE/api/health" -o /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(h.status!=='ok'||h.database_required!==false) throw new Error('staging health failed: '+JSON.stringify(h)); console.log(JSON.stringify({health:h.status,service:h.service,storage:h.storage,databaseRequired:h.database_required}));"
          for q in "Rolex" "Las Vegas" "NASA"; do
            out="/tmp/search-$(printf '%s' "$q" | tr '[:upper:] ' '[:lower:]-').json"
            curl --silent --show-error --fail --max-time 45 -G "$BASE/api/search" --data-urlencode "q=$q" --data-urlencode "limit=10" -o "$out"
            node - "$out" "$q" <<'NODE'
          const fs=require('node:fs');
          const data=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const query=process.argv[3];
          if(!Array.isArray(data.results)||!Array.isArray(data.catalogResults)||!data.catalogPreview) {
            throw new Error(query+' response schema incomplete: '+JSON.stringify({keys:Object.keys(data)}));
          }
          const derived=data.catalogResults.filter(x=>x.catalog_id&&!String(x.catalog_id).startsWith('external:'));
          const relevant=derived.filter(x=>{
            const matched=x.matched_records||[];
            const types=new Set(matched.map(r=>String(r.record_type||'').toLowerCase()));
            const titles=matched.map(r=>String(r.title||''));
            const catalogTitle=String(x.catalog_title||x.title||'');
            if(query==='Rolex') return /rolex/i.test(catalogTitle)||['brand','product','model'].some(t=>types.has(t));
            if(query==='Las Vegas') return ['place','business','organization','service'].some(t=>types.has(t))&&titles.some(t=>/las vegas/i.test(t));
            if(query==='NASA') return types.has('organization')&&titles.some(t=>/\bNASA\b/i.test(t));
            return false;
          });
          const externalTitles=data.catalogResults.filter(x=>String(x.catalog_id||'').startsWith('external:')).map(x=>String(x.catalog_title||x.title||x.name||''));
          const webRelevant=data.results.some(r=>(String(r.title||'')+' '+String(r.snippet||'')).toLowerCase().includes(query.toLowerCase()));
          const scan=data.indexScan||{};
          const debug={
            query,
            indexScan:data.indexScan||null,
            catalogError:data.catalogError||null,
            catalogPreview:data.catalogPreview,
            error:data.error||null,
            webResults:(data.results||[]).slice(0,3).map(r=>({title:r.title,snippet:r.snippet,provider:r.provider,previewOnly:r.preview_only})),
            catalogResults:(data.catalogResults||[]).slice(0,3).map(x=>({id:x.catalog_id,title:x.catalog_title||x.title,source:x.source_kind||x.sourceKind,relevanceClass:x.relevance_class,matchedRecords:(x.matched_records||[]).map(r=>({type:r.record_type,title:r.title,sourceUrl:r.source_url}))}))
          };
          console.log(JSON.stringify(debug,null,2));
          const queryScoped=scan.mode==='query-scoped'&&Number.isSafeInteger(scan.indexedPages)&&Number.isSafeInteger(scan.scannedPages)&&scan.scannedPages>0&&scan.scannedPages<scan.indexedPages;
          const previewFallback=scan.mode==='catalog-preview-fallback'&&Number.isSafeInteger(scan.previewRecords)&&scan.previewRecords>0&&(data.results||[]).some(r=>r.provider==='everythinghub-catalog-preview'&&(String(r.title||'')+' '+String(r.snippet||'')).toLowerCase().includes(query.toLowerCase()));
          if(!queryScoped&&!previewFallback) {
            throw new Error(query+' did not use bounded query shards or an explicitly marked catalog-preview fallback: '+JSON.stringify({scan,catalogError:data.catalogError,preview:data.catalogPreview}));
          }
          const summary={
            query,
            indexScan:scan,
            visibleWebResults:data.results.length,
            webRelevant,
            catalogCards:data.catalogResults.length,
            pageDerivedCatalogs:derived.map(x=>({id:x.catalog_id,title:x.catalog_title||x.title,origin:x.catalog_origin,matchedRecords:(x.matched_records||[]).map(r=>({type:r.record_type,title:r.title}))})),
            relevantPageDerivedCatalogs:relevant.map(x=>({id:x.catalog_id,title:x.catalog_title||x.title})),
            externalCatalogs:externalTitles,
            previewStatus:data.catalogPreview.status,
            previewError:data.catalogPreview.error||null,
            previewCount:data.catalogPreview.resultCount,
            analysisVersion:data.catalogPreview.analysisVersion,
            sourceIndexPages:data.catalogPreview.sourceIndexPages
          };
          console.log(JSON.stringify(summary,null,2));
          if(data.results.length===0||!webRelevant) throw new Error(query+' returned no relevant visible web results');
          if(query==='Las Vegas'&&relevant.length===0) throw new Error('Las Vegas returned no relevant typed place/local directory catalog');
          if(query==='NASA'&&relevant.length===0&&!externalTitles.some(t=>/NASA/i.test(t))) throw new Error('NASA returned neither a relevant organization catalog nor an official directory');
          if(query==='Rolex'&&relevant.length===0&&!externalTitles.some(t=>/Rolex/i.test(t))) throw new Error('Rolex returned neither a relevant typed catalog nor an official directory');
          NODE
          done
      - name: Verify robots-compliant current news feeds
        run: |
          set -euo pipefail
          for category in for-you world technology business science; do
            curl --silent --show-error --fail --max-time 30 -G "$BASE/api/news" \
              --data-urlencode "category=$category" -o "/tmp/news-$category.json"
            node - "/tmp/news-$category.json" "$category" <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const category = process.argv[3];
          if (
            body.status !== "ok" ||
            body.category !== category ||
            !Array.isArray(body.items) ||
            body.items.length < 1 ||
            body.count !== body.items.length ||
            body.items.some(item => !item.title || !/^https?:\/\//i.test(item.url) || !item.source)
          ) {
            throw new Error("Robots-compliant news feed failed for " + category + ": " + JSON.stringify(body));
          }
          console.log(JSON.stringify({ category, count: body.count, firstHeadline: body.items[0].title, firstSource: body.items[0].source }));
          NODE
            sleep 1
          done

  live-smoke:
    # Production freshness is monitored on main and by the schedule; do not fail code PRs because the independent live catalog is stale.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production search backend health
        env:
          BASE: https://everythinghub-search-backend.vercel.app
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 20 "$BASE/api/health" -o /tmp/health.json
          node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          if (
            health.status !== 'ok' ||
            health.database_required !== false ||
            health.catalog_integrity !== 'sha256' ||
            health.pagination !== 'non-overlapping'
          ) {
            throw new Error('Production search health contract failed: ' + JSON.stringify(health));
          }
          console.log(JSON.stringify({
            status: health.status,
            service: health.service,
            storage: health.storage,
            databaseRequired: health.database_required,
            catalogIntegrity: health.catalog_integrity,
            pagination: health.pagination
          }, null, 2));
          NODE
      - name: Verify recent crawler execution or request bounded recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          fetch_evidence() {
            curl --silent --show-error --fail --max-time 20 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/actions/workflows/crawl.yml/runs?branch=main&per_page=20" \
              -o /tmp/crawler-runs.json
            curl --silent --show-error --fail --max-time 20 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/actions/workflows/crawl-watchdog.yml/runs?branch=main&per_page=10" \
              -o /tmp/watchdog-runs.json
            curl --silent --show-error --fail --max-time 20 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/contents/public-search/manifest.json?ref=main" \
              -o /tmp/public-manifest-envelope.json
          }
          fetch_evidence
          python - <<'PY' > /tmp/freshness-before.json
          import base64
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          active_statuses = {"queued", "in_progress", "pending", "waiting", "requested"}
          now = datetime.now(timezone.utc).timestamp()
          runs = json.loads(Path("/tmp/crawler-runs.json").read_text(encoding="utf-8")).get("workflow_runs")
          watchdogs = json.loads(Path("/tmp/watchdog-runs.json").read_text(encoding="utf-8")).get("workflow_runs")
          envelope = json.loads(Path("/tmp/public-manifest-envelope.json").read_text(encoding="utf-8"))
          if not isinstance(runs, list) or not isinstance(watchdogs, list):
              raise SystemExit("GitHub did not return crawler/watchdog workflow-run arrays")
          encoded = envelope.get("content")
          if not isinstance(encoded, str):
              raise SystemExit("GitHub did not return the public manifest content")
          manifest = json.loads(base64.b64decode(encoded).decode("utf-8"))
          updated_at = manifest.get("updated_at")
          total_pages = manifest.get("total_pages")
          if type(updated_at) is not int or updated_at <= 0 or type(total_pages) is not int or total_pages < 1:
              raise SystemExit("Public search manifest failed freshness preflight")
          manifest_age = int(now - updated_at)
          if manifest_age < -300:
              raise SystemExit("Public manifest timestamp is too far in the future")
          manifest_age = max(0, manifest_age)

          active_crawlers = [run for run in runs if run.get("status") in active_statuses]
          active_watchdogs = [run for run in watchdogs if run.get("status") in active_statuses]
          successes = [
              run for run in runs
              if run.get("status") == "completed" and run.get("conclusion") == "success" and run.get("updated_at")
          ]
          latest = max(successes, key=lambda run: run.get("updated_at") or "", default=None)
          success_age = None
          if latest:
              completed = datetime.fromisoformat(latest["updated_at"].replace("Z", "+00:00")).timestamp()
              success_age = int(now - completed)
              if success_age < -300:
                  raise SystemExit("Latest successful crawler timestamp is too far in the future")
              success_age = max(0, success_age)
          needs_recovery = (
              not active_crawlers
              and not active_watchdogs
              and manifest_age > 900
              and (success_age is None or success_age > 900)
          )
          print(json.dumps({
              "indexedPages": total_pages,
              "manifestAgeSeconds": manifest_age,
              "latestSuccessfulRunId": latest.get("id") if latest else None,
              "latestSuccessfulRunAt": latest.get("updated_at") if latest else None,
              "latestSuccessfulRunAgeSeconds": success_age,
              "activeCrawlerRuns": len(active_crawlers),
              "activeWatchdogRuns": len(active_watchdogs),
              "needsRecovery": needs_recovery
          }))
          PY

          recovery_dispatched=false
          needs_recovery="$(python -c 'import json; print("true" if json.load(open("/tmp/freshness-before.json"))["needsRecovery"] else "false")')"
          if [ "$needs_recovery" = "true" ]; then
            echo "No active crawler/watchdog and both the manifest and last successful crawl are older than 15 minutes."
            echo "Dispatching the existing bounded watchdog; it retains the no-overlap, schedule-age, and manifest-age guards."
            gh workflow run crawl-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main
            recovery_dispatched=true
          fi

          python - "$recovery_dispatched" <<'PY' > /tmp/crawler-freshness.json
          import json
          import sys
          from pathlib import Path

          before = json.loads(Path("/tmp/freshness-before.json").read_text(encoding="utf-8"))
          dispatched = sys.argv[1].lower() == "true"
          if before["activeCrawlerRuns"]:
              status = "refresh-in-progress"
          elif before["activeWatchdogRuns"] or dispatched:
              status = "recovery-requested"
          elif before["latestSuccessfulRunAgeSeconds"] is not None and before["latestSuccessfulRunAgeSeconds"] <= 900:
              status = "recent-success"
          elif before["manifestAgeSeconds"] <= 900:
              status = "recent-manifest"
          else:
              raise SystemExit("Crawler and public manifest remain stale; bounded watchdog recovery could not be started: " + json.dumps(before))
          report = {
              "latestSuccessfulRunId": before["latestSuccessfulRunId"],
              "latestSuccessfulRunAt": before["latestSuccessfulRunAt"],
              "latestSuccessfulRunAgeSeconds": before["latestSuccessfulRunAgeSeconds"],
              "manifestAgeSeconds": before["manifestAgeSeconds"],
              "indexedPages": before["indexedPages"],
              "activeCrawlerRuns": before["activeCrawlerRuns"],
              "activeWatchdogRuns": before["activeWatchdogRuns"],
              "recoveryDispatchTriggered": dispatched,
              "freshnessStatus": status
          }
          print(json.dumps(report, indent=2))
          PY
          cat /tmp/crawler-freshness.json

      - name: Verify live catalog search, freshness, and non-overlapping pagination
        env:
          BASE: https://everythinghub-search-backend.vercel.app
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 30 -G "$BASE/api/search" \
            --data-urlencode "q=NASA" --data-urlencode "limit=20" --data-urlencode "offset=0" \
            -o /tmp/page-1.json
          curl --silent --show-error --fail --max-time 30 -G "$BASE/api/search" \
            --data-urlencode "q=NASA" --data-urlencode "limit=20" --data-urlencode "offset=20" \
            -o /tmp/page-2.json
          node <<'NODE'
          const fs = require('node:fs');
          const first = JSON.parse(fs.readFileSync('/tmp/page-1.json', 'utf8'));
          const second = JSON.parse(fs.readFileSync('/tmp/page-2.json', 'utf8'));
          const shaPattern = /^[a-f0-9]{64}$/i;
          if (
            first.indexStatus !== 'crawler-catalog-active' ||
            !Number.isSafeInteger(first.indexedPages) || first.indexedPages < 1 ||
            !Number.isSafeInteger(first.indexUpdatedAt) || first.indexUpdatedAt < 1 ||
            !shaPattern.test(first.indexSha256 || '') ||
            !Array.isArray(first.results) || first.results.length < 11 ||
            !first.providers?.includes('Everything Hub Crawler') ||
            !first.results.some(item => item.provider === 'everythinghub-catalog')
          ) {
            throw new Error('Live crawler catalog is missing or invalid: ' + JSON.stringify({
              indexStatus: first.indexStatus,
              indexedPages: first.indexedPages,
              resultCount: first.results?.length,
              providers: first.providers
            }));
          }
          const snapshotAgeSeconds = Math.floor(Date.now() / 1000 - first.indexUpdatedAt);
          if (snapshotAgeSeconds < -300) {
            throw new Error('Crawler catalog snapshot timestamp is too far in the future: ' + snapshotAgeSeconds);
          }
          const crawlerFreshness = JSON.parse(fs.readFileSync('/tmp/crawler-freshness.json', 'utf8'));
          if (
            second.offset !== 20 ||
            second.count !== first.count ||
            second.indexSha256 !== first.indexSha256 ||
            second.indexUpdatedAt !== first.indexUpdatedAt ||
            !Array.isArray(second.results) || second.results.length === 0 ||
            second.results.some(item => item.provider !== 'everythinghub-catalog')
          ) {
            throw new Error('Second search page does not match the same crawler catalog snapshot');
          }
          const firstUrls = new Set(first.results.map(item => item.url));
          const overlap = second.results.filter(item => firstUrls.has(item.url));
          if (overlap.length) {
            throw new Error('Search pagination returned ' + overlap.length + ' duplicate URLs');
          }
          console.log(JSON.stringify({
            query: first.query,
            indexedPages: first.indexedPages,
            crawlerMatches: first.count,
            catalogUpdatedAt: new Date(first.indexUpdatedAt * 1000).toISOString(),
            catalogSnapshotAgeSeconds: snapshotAgeSeconds,
            latestSuccessfulCrawlerRunAt: crawlerFreshness.latestSuccessfulRunAt,
            latestSuccessfulCrawlerRunAgeSeconds: crawlerFreshness.latestSuccessfulRunAgeSeconds,
            activeCrawlerRuns: crawlerFreshness.activeCrawlerRuns,
            activeWatchdogRuns: crawlerFreshness.activeWatchdogRuns,
            recoveryDispatchTriggered: crawlerFreshness.recoveryDispatchTriggered,
            publicManifestAgeSeconds: crawlerFreshness.manifestAgeSeconds,
            crawlerFreshnessStatus: crawlerFreshness.freshnessStatus,
            page1Results: first.results.length,
            page1CrawlerResults: first.results.filter(item => item.provider === 'everythinghub-catalog').length,
            page1BingResults: first.results.filter(item => item.provider === 'bing-rss').length,
            page2Results: second.results.length,
            duplicateUrlsAcrossPages: overlap.length,
            catalogSha256: first.indexSha256
          }, null, 2));
          NODE

      - name: Verify separate Rolex, Las Vegas and NASA link-only catalogs
        env:
          BASE: https://everythinghub-search-backend.vercel.app
        run: |
          set -euo pipefail
          for query in Rolex "Las Vegas" NASA; do
            key=$(printf '%s' "$query" | tr '[:upper:] ' '[:lower:]_')
            curl --silent --show-error --fail --max-time 20 -G "$BASE/api/search" \
              --data-urlencode "q=$query" --data-urlencode "limit=10" -o "/tmp/external-$key.json"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const expected = [
            { key: 'rolex', id: 'external:rolex:official-collections', terms: ['Submariner', 'Datejust'] },
            { key: 'las_vegas', id: 'external:las-vegas:official-resources', terms: ['Business License', 'Things to Do'] },
            { key: 'nasa', id: 'external:nasa:official-resources', terms: ['NASA Earthdata Search', 'NASA Image and Video Library'] }
          ];
          for (const item of expected) {
            const body = JSON.parse(fs.readFileSync('/tmp/external-' + item.key + '.json', 'utf8'));
            const catalog = body.externalCatalogResults?.find(candidate => candidate.catalog_id === item.id);
            const mergedCatalog = body.catalogResults?.find(candidate => candidate.catalog_id === item.id);
            const matched = (catalog?.matched_records || []).map(record => record.title).join(' ');
            if (
              body.indexStatus !== 'crawler-catalog-active' ||
              !Array.isArray(body.results) || body.results.length < 1 ||
              !Array.isArray(body.catalogResults) || !mergedCatalog ||
              !Array.isArray(body.externalCatalogResults) || body.externalCatalogResults.length !== 1 ||
              !catalog ||
              catalog.source_kind !== 'curated_external_link_directory' ||
              catalog.preview_only !== true ||
              catalog.commercial_eligible !== false ||
              catalog.source_page_count !== 0 ||
              catalog.source_terms_status !== 'link_only_no_content_fetched' ||
              catalog.rights_status !== 'link_only_not_cleared_for_redistribution' ||
              catalog.record_count !== 6 ||
              catalog.matched_record_count !== 6 ||
              !item.terms.every(term => matched.includes(term)) ||
              body.catalogPreview?.externalCatalogCount !== 3 ||
              body.catalogPreview?.externalCatalogRecordCount !== 18 ||
              !body.providers?.some(provider => ['Curated External Catalog Directory', 'Everything Hub External Catalogs', 'Everything Hub Catalog Preview'].includes(provider))
            ) {
              throw new Error('External link-only catalog contract failed for ' + item.key + ': ' + JSON.stringify(body));
            }
            console.log(JSON.stringify({ query: item.key, catalogId: catalog.catalog_id, merged: !!mergedCatalog, matchedRecords: catalog.matched_record_count, totalExternalCatalogs: body.catalogPreview.externalCatalogCount, totalExternalLinks: body.catalogPreview.externalCatalogRecordCount, rightsStatus: catalog.rights_status }));
          }
          NODE

  video-source-live-smoke:
    # One bounded, robots-checked request validates the public NASA video source before code can be merged.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Verify Internet Archive image and video robots policy, licenses and thumbnails
        run: |
          node vercel-search-backend/test/images-live-smoke.cjs
          node vercel-search-backend/test/videos-live-smoke.cjs
