name: Validate Everything Hub Vercel search backend
on:
  push:
    branches: [main]
    paths:
      - 'vercel-search-backend/**'
      - '.github/workflows/validate-vercel-search.yml'
  pull_request:
    paths:
      - 'vercel-search-backend/**'
      - '.github/workflows/validate-vercel-search.yml'
  schedule:
    # Stagger lightweight production checks away from GitHub's quarter-hour peaks; completion also wakes the crawler watchdog.
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Run search integrity and pagination tests
        run: node --test vercel-search-backend/test/*.test.js
  staging-smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/bounded-catalog-search-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE: https://everythinghub-search-backend-4vdrcia8y-rshure001-8053.vercel.app
    steps:
      - name: Verify staging backend health and representative catalog searches
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 15 "$BASE/api/health" -o /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(h.status!=='ok'||h.database_required!==false) throw new Error('staging health failed: '+JSON.stringify(h)); console.log(JSON.stringify({health:h.status,service:h.service,storage:h.storage,databaseRequired:h.database_required}));"
          for q in "Rolex" "Las Vegas" "NASA"; do
            out="/tmp/search-$(printf '%s' "$q" | tr '[:upper:] ' '[:lower:]-').json"
            curl --silent --show-error --fail --max-time 20 -G "$BASE/api/search" --data-urlencode "q=$q" --data-urlencode "limit=10" -o "$out"
            node - "$out" "$q" <<'NODE'
          const fs=require('node:fs');
          const data=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const query=process.argv[3];
          if(!Array.isArray(data.results)||!Array.isArray(data.catalogResults)||!data.catalogPreview) {
            throw new Error(query+' response schema incomplete: '+JSON.stringify({keys:Object.keys(data)}));
          }
          const derived=data.catalogResults.filter(x=>x.catalog_id&&!String(x.catalog_id).startsWith('external:'));
          const relevant=derived.filter(x=>{
            const matched=x.matched_records||[];
            const types=new Set(matched.map(r=>String(r.record_type||'').toLowerCase()));
            const titles=matched.map(r=>String(r.title||''));
            const catalogTitle=String(x.catalog_title||x.title||'');
            if(query==='Rolex') return /rolex/i.test(catalogTitle)||['brand','product','model'].some(t=>types.has(t));
            if(query==='Las Vegas') return ['place','business','organization','service'].some(t=>types.has(t))&&titles.some(t=>/las vegas/i.test(t));
            if(query==='NASA') return types.has('organization')&&titles.some(t=>/\\bNASA\\b/i.test(t));
            return false;
          });
          const summary={
            query,
            visibleWebResults:data.results.length,
            catalogCards:data.catalogResults.length,
            pageDerivedCatalogs:derived.map(x=>({id:x.catalog_id,title:x.catalog_title||x.title,origin:x.catalog_origin,matchedRecords:(x.matched_records||[]).map(r=>({type:r.record_type,title:r.title}))})),
            relevantPageDerivedCatalogs:relevant.map(x=>({id:x.catalog_id,title:x.catalog_title||x.title})),
            externalCatalogs:data.catalogResults.filter(x=>String(x.catalog_id||'').startsWith('external:')).map(x=>x.catalog_title||x.title||x.name),
            previewStatus:data.catalogPreview.status,
            previewError:data.catalogPreview.error||null,
            previewCount:data.catalogPreview.resultCount,
            analysisVersion:data.catalogPreview.analysisVersion,
            sourceIndexPages:data.catalogPreview.sourceIndexPages
          };
          console.log(JSON.stringify(summary,null,2));
          if(data.results.length===0) throw new Error(query+' returned no visible search results');
          if(query==='Las Vegas'&&relevant.length===0) throw new Error('Las Vegas returned no relevant typed place/local directory catalog');
          if(query==='NASA'&&relevant.length===0) throw new Error('NASA returned no relevant organization catalog');
          if(query==='Rolex'&&derived.length>0&&relevant.length===0) throw new Error('Rolex returned only incidental page-mention catalogs');
          NODE
          done
  live-smoke:
    # Production freshness is monitored on main and by the schedule; do not fail code PRs because the independent live catalog is stale.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify production search backend health
        env:
          BASE: https://everythinghub-search-backend.vercel.app
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 20 "$BASE/api/health" -o /tmp/health.json
          node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          if (
            health.status !== 'ok' ||
            health.database_required !== false ||
            health.catalog_integrity !== 'sha256' ||
            health.pagination !== 'non-overlapping'
          ) {
            throw new Error('Production search health contract failed: ' + JSON.stringify(health));
          }
          console.log(JSON.stringify({
            status: health.status,
            service: health.service,
            storage: health.storage,
            databaseRequired: health.database_required,
            catalogIntegrity: health.catalog_integrity,
            pagination: health.pagination
          }, null, 2));
          NODE
      - name: Verify live catalog search, freshness, and non-overlapping pagination
        env:
          BASE: https://everythinghub-search-backend.vercel.app
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 30 -G "$BASE/api/search" \
            --data-urlencode "q=NASA rover" --data-urlencode "limit=50" --data-urlencode "offset=0" \
            -o /tmp/page-1.json
          curl --silent --show-error --fail --max-time 30 -G "$BASE/api/search" \
            --data-urlencode "q=NASA rover" --data-urlencode "limit=50" --data-urlencode "offset=50" \
            -o /tmp/page-2.json
          node <<'NODE'
          const fs = require('node:fs');
          const first = JSON.parse(fs.readFileSync('/tmp/page-1.json', 'utf8'));
          const second = JSON.parse(fs.readFileSync('/tmp/page-2.json', 'utf8'));
          const shaPattern = /^[a-f0-9]{64}$/i;
          if (
            first.indexStatus !== 'crawler-catalog-active' ||
            !Number.isSafeInteger(first.indexedPages) || first.indexedPages < 1 ||
            !Number.isSafeInteger(first.indexUpdatedAt) || first.indexUpdatedAt < 1 ||
            !shaPattern.test(first.indexSha256 || '') ||
            !Array.isArray(first.results) || first.results.length < 11 ||
            !first.providers?.includes('Everything Hub Crawler') ||
            !first.results.some(item => item.provider === 'everythinghub-catalog')
          ) {
            throw new Error('Live crawler catalog is missing or invalid: ' + JSON.stringify({
              indexStatus: first.indexStatus,
              indexedPages: first.indexedPages,
              resultCount: first.results?.length,
              providers: first.providers
            }));
          }
          const ageSeconds = Math.floor(Date.now() / 1000 - first.indexUpdatedAt);
          if (ageSeconds < -300 || ageSeconds > 900) {
            throw new Error('Crawler catalog timestamp is outside the 15-minute live-monitor window: ' + ageSeconds);
          }
          if (
            second.offset !== 50 ||
            second.count !== first.count ||
            second.indexSha256 !== first.indexSha256 ||
            second.indexUpdatedAt !== first.indexUpdatedAt ||
            !Array.isArray(second.results) || second.results.length === 0 ||
            second.results.some(item => item.provider !== 'everythinghub-catalog')
          ) {
            throw new Error('Second search page does not match the same crawler catalog snapshot');
          }
          const firstUrls = new Set(first.results.map(item => item.url));
          const overlap = second.results.filter(item => firstUrls.has(item.url));
          if (overlap.length) {
            throw new Error('Search pagination returned ' + overlap.length + ' duplicate URLs');
          }
          console.log(JSON.stringify({
            query: first.query,
            indexedPages: first.indexedPages,
            crawlerMatches: first.count,
            catalogUpdatedAt: new Date(first.indexUpdatedAt * 1000).toISOString(),
            catalogAgeSeconds: ageSeconds,
            page1Results: first.results.length,
            page1CrawlerResults: first.results.filter(item => item.provider === 'everythinghub-catalog').length,
            page1BingResults: first.results.filter(item => item.provider === 'bing-rss').length,
            page2Results: second.results.length,
            duplicateUrlsAcrossPages: overlap.length,
            catalogSha256: first.indexSha256
          }, null, 2));
          NODE

      - name: Verify separate Rolex, Las Vegas and NASA link-only catalogs
        env:
          BASE: https://everythinghub-search-backend.vercel.app
        run: |
          set -euo pipefail
          for query in Rolex "Las Vegas" NASA; do
            key=$(printf '%s' "$query" | tr '[:upper:] ' '[:lower:]_')
            curl --silent --show-error --fail --max-time 20 -G "$BASE/api/search" \
              --data-urlencode "q=$query" --data-urlencode "limit=10" -o "/tmp/external-$key.json"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const expected = [
            { key: 'rolex', id: 'external:rolex:official-collections', terms: ['Submariner', 'Datejust'] },
            { key: 'las_vegas', id: 'external:las-vegas:official-resources', terms: ['Business License', 'Things to Do'] },
            { key: 'nasa', id: 'external:nasa:official-resources', terms: ['NASA Earthdata Search', 'NASA Image and Video Library'] }
          ];
          for (const item of expected) {
            const body = JSON.parse(fs.readFileSync('/tmp/external-' + item.key + '.json', 'utf8'));
            const catalog = body.catalogResults?.[0];
            const matched = (catalog?.matched_records || []).map(record => record.title).join(' ');
            if (
              body.status !== 'ok' ||
              body.indexStatus !== 'external-link-only' ||
              !Array.isArray(body.results) || body.results.length !== 0 ||
              !Array.isArray(body.catalogResults) || body.catalogResults.length !== 1 ||
              !Array.isArray(body.externalCatalogResults) || body.externalCatalogResults.length !== 1 ||
              catalog.catalog_id !== item.id ||
              catalog.source_kind !== 'curated_external_link_directory' ||
              catalog.preview_only !== true ||
              catalog.commercial_eligible !== false ||
              catalog.source_page_count !== 0 ||
              catalog.source_terms_status !== 'link_only_no_content_fetched' ||
              catalog.rights_status !== 'link_only_not_cleared_for_redistribution' ||
              catalog.record_count !== 6 ||
              catalog.matched_record_count !== 6 ||
              !item.terms.every(term => matched.includes(term)) ||
              body.catalogPreview?.externalCatalogCount !== 3 ||
              body.catalogPreview?.externalCatalogRecordCount !== 18 ||
              !body.providers?.includes('Everything Hub External Catalogs')
            ) {
              throw new Error('External link-only catalog contract failed for ' + item.key + ': ' + JSON.stringify(body));
            }
            console.log(JSON.stringify({ query: item.key, catalogId: catalog.catalog_id, matchedRecords: catalog.matched_record_count, totalExternalCatalogs: body.catalogPreview.externalCatalogCount, totalExternalLinks: body.catalogPreview.externalCatalogRecordCount, rightsStatus: catalog.rights_status }));
          }
          NODE

  video-source-live-smoke:
    # One bounded, robots-checked request validates the public NASA video source before code can be merged.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Verify Internet Archive image and video robots policy, licenses and thumbnails
        run: |
          node vercel-search-backend/test/images-live-smoke.cjs
          node vercel-search-backend/test/videos-live-smoke.cjs
