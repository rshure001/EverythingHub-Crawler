name: Everything Hub crawler
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: everythinghub-crawler
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate crawler configuration
        run: |
          python -m py_compile crawler/crawl.py
          test "$(grep -c '^https://' crawler/seeds.txt)" -eq 49
      - name: Crawl configured sites
        run: python crawler/crawl.py
      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json
          if ! git diff --cached --quiet; then
            git commit -m "Update crawler index"
            git push
          fi
