name: Everything Hub crawler
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/crawl.yml"
      - "crawler/crawl.py"
      - "crawler/catalog_frontier.py"
      - "crawler/test_catalog_frontier.py"
      - "data/universal-catalog-records.json.gz"
      - "crawler/index_store.py"
      - "crawler/test_index_store.py"
      - "crawler/test_crawl.py"
      - "crawler/test_discovery_sitemap.py"
      - "vercel-homepage/sitemap.xml"
      - "crawler/seeds.txt"
      - "crawler/build_search_shards.py"
      - "crawler/validate_public_index.py"
      - "crawler/validate_media_catalog.py"
      - "crawler/hurricane_strength.py"
      - "crawler/media_discovery.py"
      - "crawler/test_hurricane_media_discovery.py"
      - "crawler/test_validate_media_catalog.py"
      - "crawler/media_extraction_preflight.py"
      - "crawler/test_media_extraction_preflight.py"
      - "crawler/crawl_revision_guard.py"
      - "crawler/test_crawl_revision_guard.py"
      - "crawler/media-source-terms.json"
      - "crawler/report.py"
      - "crawler/automation-trigger.json"
      - "crawler/hourly_production.py"
      - "crawler/test_hourly_production.py"
      - "crawler/test_live_diagnostics_schedule.py"
  schedule:
    # Queue one bounded crawl every five minutes, staggered away from the top-of-hour Actions load peak.
    # A reviewed push to this workflow is also the safe recovery trigger when scheduled delivery stalls.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: write
concurrency:
  group: everythinghub-main-writers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard stale crawler revisions before external fetches
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --name-only "$GITHUB_SHA" FETCH_HEAD > /tmp/main-changed-paths.txt
          python crawler/crawl_revision_guard.py /tmp/main-changed-paths.txt "$GITHUB_REF_NAME" > /tmp/freshness.json
          cat /tmp/freshness.json

          action="$(python -c 'import json; print(json.load(open("/tmp/freshness.json"))["action"])')"
          reason="$(python -c 'import json; print(json.load(open("/tmp/freshness.json"))["reason"])')"
          echo "- Crawler revision guard: $action — $reason" >> "$GITHUB_STEP_SUMMARY"

          if [ "$action" = "dispatch" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::warning::This run is stale or not on main; it will not fetch or commit against an outdated crawler catalog."
            gh workflow run crawl.yml --ref main
            echo "Dispatched one fresh crawler run from current main."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Crawler inputs match current main; proceeding with bounded crawl."
          fi
      - name: Capture canonical manifest baseline
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path

          path = Path("public-search/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          pages = manifest.get("total_pages")
          updated_at = manifest.get("updated_at")
          if type(pages) is not int or pages < 0:
              raise SystemExit("Canonical manifest baseline has an invalid total_pages value.")
          if type(updated_at) is not int or updated_at <= 0:
              raise SystemExit("Canonical manifest baseline has an invalid updated_at value.")
          print(f"EH_MANIFEST_BEFORE_PAGES={pages}")
          print(f"EH_MANIFEST_BEFORE_UPDATED_AT={updated_at}")
          PY
      - name: Validate crawler configuration and tests
        run: |
          python -m py_compile crawler/index_store.py crawler/crawl.py crawler/report.py crawler/hourly_production.py crawler/build_search_shards.py crawler/validate_public_index.py crawler/validate_media_catalog.py crawler/hurricane_strength.py crawler/media_discovery.py crawler/media_extraction_preflight.py crawler/crawl_revision_guard.py
          test "$(grep -c '^https://' crawler/seeds.txt)" -ge 71
          python -m unittest discover -s crawler -p 'test_*.py' -v
      # Validate bounded sitemap discovery, Retry-After backoff, and the 12,000-attempt ceiling inside the 420-second run budget; each host remains single-flight and robots-paced.
      - name: Crawl configured sites
        if: steps.freshness.outputs.current == 'true'
        run: python crawler/crawl.py
      - name: Checkpoint canonical crawl state before index validation
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/index-shards/ data/frontier.json data/media-discovery.json
          if git diff --cached --quiet; then
            echo "No raw crawler state changed; no checkpoint commit is needed."
            exit 0
          fi
          git commit -m "Checkpoint raw crawler state before search validation"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then
              echo "Raw crawler state checkpoint committed. Public search shards and manifest remain unchanged until validation passes."
              {
                echo "### Raw crawler checkpoint"
                echo "- Persisted canonical page index, raw page shards, frontier, and media discovery state."
                echo "- Public search manifest and catalog registries were not published by this checkpoint."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            git fetch origin main
            if git merge-base --is-ancestor HEAD origin/main; then
              echo "Checkpoint commit is already present on main."
              exit 0
            fi
            if git merge-base --is-ancestor origin/main HEAD; then
              echo "Push failed without a remote branch advance; check repository write permission or branch protection."
              exit 1
            fi

            if [ "$attempt" -eq 8 ]; then
              echo "main kept advancing during eight bounded checkpoint rebase attempts; leaving the remote untouched."
              exit 1
            fi

            echo "main advanced during crawl; rebasing the raw checkpoint (attempt $((attempt + 1))/8)."
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Raw checkpoint conflicts with newer main data; no remote changes were made."
              exit 1
            fi
            sleep 1
          done
      - name: Build small public search shards
        if: steps.freshness.outputs.current == 'true'
        run: python crawler/build_search_shards.py
      - name: Validate public search index
        if: steps.freshness.outputs.current == 'true'
        run: python crawler/validate_public_index.py
      - name: Validate metadata-only media catalog
        if: steps.freshness.outputs.current == 'true'
        run: python crawler/validate_media_catalog.py
      - name: Preflight source-approved media extraction
        if: steps.freshness.outputs.current == 'true'
        run: python crawler/media_extraction_preflight.py
      - name: Publish crawler health summary
        if: steps.freshness.outputs.current == 'true'
        run: python crawler/report.py
      - name: Measure unique additions from canonical manifest delta
        if: steps.freshness.outputs.current == 'true'
        run: python crawler/hourly_production.py
      - name: Measure Hurricane Core strength
        if: steps.freshness.outputs.current == 'true'
        run: python crawler/hurricane_strength.py
      - name: Commit updated index and frontier
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/index.json data/index-shards/ data/frontier.json data/media-discovery.json data/hourly-production.json public-search/
          if git diff --cached --quiet; then
            echo "Crawler output already matches the current repository."
            exit 0
          fi
          git commit -m "Update crawler index, search shards, and frontier"

          # Other Everything Hub workflows may advance main while a crawl runs.
          # Rebase this one isolated crawler commit instead of discarding its
          # fetched work and crawling the same hosts again. Never force-push.
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then
              echo "Crawler index and frontier committed successfully."
              exit 0
            fi

            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              echo "Push failed without a remote branch advance; check repository write permission or branch protection."
              exit 1
            fi

            if [ "$attempt" -eq 8 ]; then
              echo "main kept advancing during eight bounded rebase attempts; leaving the remote untouched."
              exit 1
            fi

            echo "main advanced during crawl; rebasing the crawler commit (attempt $((attempt + 1))/8)."
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Crawler commit conflicts with newer main data; no remote changes were made."
              exit 1
            fi
            # Give concurrent catalog/ledger writers a brief chance to finish.
            sleep 1
          done
