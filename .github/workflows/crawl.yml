name: Everything Hub crawler
on:
  push:
    branches: [main, scale/one-million-readiness]
    paths-ignore:
      - data/index.json
      - data/frontier.json
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: everythinghub-crawler
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate crawler configuration
        run: |
          python -m py_compile crawler/crawl.py
          test "$(grep -c '^https://' crawler/seeds.txt)" -eq 49
      - name: Run crawler unit tests
        run: python -m unittest discover -s tests -v
      - name: Set up Deno for Edge Function type-check
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check isolated Supabase crawler repair
        run: deno check --no-lock supabase/functions/everything-hub-crawler/index.ts
      - name: Crawl configured sites
        run: python crawler/crawl.py
      - name: Commit updated index and frontier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/frontier.json
          if ! git diff --cached --quiet; then
            git commit -m "Update crawler index and persistent frontier"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
