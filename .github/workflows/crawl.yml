name: Everything Hub crawler
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/crawl.yml"
      - "crawler/crawl.py"
      - "crawler/seeds.txt"
      - "crawler/build_search_shards.py"
      - "crawler/validate_public_index.py"
  schedule:
    # Run every 5 minutes; the durable frontier resumes work and concurrency prevents overlapping crawls.
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: everythinghub-crawler
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate crawler configuration and tests
        run: |
          python -m py_compile crawler/crawl.py crawler/report.py crawler/build_search_shards.py crawler/validate_public_index.py
          test "$(grep -c '^https://' crawler/seeds.txt)" -eq 49
          python -m unittest discover -s crawler -p 'test_*.py' -v
      # Validate bounded sitemap discovery, Retry-After backoff, and the strict 1,600-page fetch cap.
      - name: Crawl configured sites
        run: python crawler/crawl.py
      - name: Build small public search shards
        run: python crawler/build_search_shards.py
      - name: Validate public search index
        run: python crawler/validate_public_index.py
      - name: Publish crawler health summary
        run: python crawler/report.py
      - name: Commit updated index and frontier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A competing homepage/artwork commit can advance main during a crawl.
          # If that happens, discard only this runner's generated index/frontier
          # snapshot, restart from the new main, and repeat the bounded crawl.
          for attempt in 1 2 3; do
            git add data/index.json data/frontier.json public-search/
            if git diff --cached --quiet; then
              echo "Crawler output already matches the current repository."
              exit 0
            fi

            git commit -m "Update crawler index, search shards, and frontier"
            if git push origin HEAD:main; then
              echo "Crawler index and frontier committed successfully."
              exit 0
            fi

            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              echo "Push failed without a remote branch advance; check repository write permission or branch protection."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "main kept advancing during three bounded publish attempts; leaving the remote untouched."
              exit 1
            fi

            echo "main advanced during crawl; replaying from latest main (attempt $((attempt + 1))/3)."
            git reset --hard origin/main
            python crawler/crawl.py
            python crawler/build_search_shards.py
            python crawler/validate_public_index.py
            python crawler/report.py
          done
