name: Everything Hub crawler
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: everythinghub-crawler
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate crawler configuration and tests
        run: |
          python -m py_compile crawler/crawl.py crawler/report.py
          test "$(grep -c '^https://' crawler/seeds.txt)" -eq 49
          python -m unittest discover -s crawler -p 'test_*.py' -v
      - name: Crawl configured sites
        run: python crawler/crawl.py
      - name: Publish crawler health summary
        run: python crawler/report.py
      - name: Commit updated index and frontier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/frontier.json
          if ! git diff --cached --quiet; then
            git commit -m "Update crawler index and persistent frontier"
            git push
          fi
