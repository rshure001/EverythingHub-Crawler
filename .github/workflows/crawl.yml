name: Everything Hub crawler
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/crawl.yml"
      - "crawler/crawl.py"
      - "crawler/seeds.txt"
      - "crawler/build_search_shards.py"
      - "crawler/validate_public_index.py"
      - "crawler/hurricane_strength.py"
      - "crawler/media_discovery.py"
      - "crawler/test_hurricane_media_discovery.py"
      - "crawler/report.py"
      - "data/media-discovery.json"
  schedule:
    # Run every 5 minutes; the durable frontier resumes work and concurrency prevents overlapping crawls.
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: write
concurrency:
  group: everythinghub-crawler
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate crawler configuration and tests
        run: |
          python -m py_compile crawler/crawl.py crawler/report.py crawler/build_search_shards.py crawler/validate_public_index.py crawler/hurricane_strength.py crawler/media_discovery.py
          test "$(grep -c '^https://' crawler/seeds.txt)" -eq 49
          python -m unittest discover -s crawler -p 'test_*.py' -v
      # Validate bounded sitemap discovery, Retry-After backoff, and the strict 1,600-page fetch cap.
      - name: Crawl configured sites
        run: python crawler/crawl.py
      - name: Build small public search shards
        run: python crawler/build_search_shards.py
      - name: Validate public search index
        run: python crawler/validate_public_index.py
      - name: Publish crawler health summary
        run: python crawler/report.py
      - name: Measure Hurricane Core strength
        run: python crawler/hurricane_strength.py
      - name: Commit updated index and frontier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/index.json data/frontier.json data/media-discovery.json public-search/
          if git diff --cached --quiet; then
            echo "Crawler output already matches the current repository."
            exit 0
          fi
          git commit -m "Update crawler index, search shards, and frontier"

          # Other Everything Hub workflows may advance main while a crawl runs.
          # Rebase this one isolated crawler commit instead of discarding its
          # fetched work and crawling the same hosts again. Never force-push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Crawler index and frontier committed successfully."
              exit 0
            fi

            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              echo "Push failed without a remote branch advance; check repository write permission or branch protection."
              exit 1
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "main kept advancing during three bounded rebase attempts; leaving the remote untouched."
              exit 1
            fi

            echo "main advanced during crawl; rebasing the crawler commit (attempt $((attempt + 1))/3)."
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Crawler commit conflicts with newer main data; no remote changes were made."
              exit 1
            fi
          done
      - name: Dispatch catalog publishing and search verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-site.yml --ref main
          echo "Dispatched the validated catalog publisher."
          gh workflow run search-api-smoke.yml --ref main
          echo "Dispatched the live search API smoke test."
