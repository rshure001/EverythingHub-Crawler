name: Validate EverythingHub Code

on:
  push:
    branches:
      - repair/bounded-lane-queue-claims
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q crawler imports
      - name: Bulk importer tests (offline)
        run: python -m unittest discover -s imports -p 'test_*.py' -v
      - name: Crawler unit tests (offline)
        run: python -m unittest discover -s crawler -p 'test_*.py' -v
      - name: Synthetic 10,000,000-record importer benchmark
        run: python imports/benchmark_bulk_ingest.py --records 10000000 --chunk-size 50000
