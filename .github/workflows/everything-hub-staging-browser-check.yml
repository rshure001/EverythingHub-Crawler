name: Everything Hub desktop and mobile browser acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/everything-hub-staging-browser-check.yml"
      - "scripts/everything-hub-browser-check.cjs"
      - "site/index.html"
      - "vercel-homepage/index.html"
      - "vercel-homepage/media-preview-policy.js"
      - "supabase/functions/everything-hub-site/index.ts"
      - "supabase/functions/everything-hub-web-search/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: everything-hub-browser-acceptance
  cancel-in-progress: true

jobs:
  local-staging-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve the checked-in public homepage
        run: |
          nohup python3 -m http.server 8765 --directory site >/tmp/everything-hub-site.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/everything-hub-site.log
          exit 1
      - name: Test desktop, searches, media attribution, news tabs and mobile layout
        env:
          TARGET_URL: http://127.0.0.1:8765/
          EH_PUBLIC_KEY: sb_publishable_XlIsACWhtVS1jVODWYGTpg_GMs8v3vJ
        run: node scripts/everything-hub-browser-check.cjs
      - name: Upload local staging screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everything-hub-local-staging-browser-evidence
          path: |
            everything-hub-browser-report.json
            everything-hub-*.png
          if-no-files-found: warn
          retention-days: 14

  live-edge-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Wait for the newly deployed public Edge homepage
        env:
          TARGET_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-site
          EXPECTED_RELEASE: edge-homepage-v3-supabase
        run: |
          for attempt in $(seq 1 45); do
            curl -fsS -D /tmp/eh-headers "$TARGET_URL" -o /tmp/eh-homepage.html || true
            release=$(awk 'BEGIN{IGNORECASE=1} /^x-eh-release:/ {gsub("\r","",$2); print $2}' /tmp/eh-headers 2>/dev/null | tail -n 1)
            if [ "$release" = "$EXPECTED_RELEASE" ]; then
              echo "Live Edge release confirmed: $release"
              exit 0
            fi
            echo "Waiting for Edge release; observed: ${release:-not deployed}"
            sleep 20
          done
          echo "Expected Edge release was not deployed."
          cat /tmp/eh-headers || true
          exit 1
      - name: Test the actual public website at desktop and mobile widths
        env:
          TARGET_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-site
          LIVE_EDGE: "1"
          EH_PUBLIC_KEY: sb_publishable_XlIsACWhtVS1jVODWYGTpg_GMs8v3vJ
        run: node scripts/everything-hub-browser-check.cjs
      - name: Upload live desktop and mobile screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everything-hub-live-edge-browser-evidence
          path: |
            everything-hub-browser-report.json
            everything-hub-*.png
          if-no-files-found: warn
          retention-days: 30
