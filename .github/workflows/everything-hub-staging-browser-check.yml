name: Everything Hub desktop and mobile browser acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/everything-hub-staging-browser-check.yml"
      - "scripts/everything-hub-browser-check.cjs"
      - "site/index.html"
      - "site/search.js"
      - "supabase/functions/everything-hub-static-publisher/index.ts"
      - "supabase/functions/everything-hub-site/index.ts"
      - "supabase/functions/everything-hub-homepage-release/index.ts"
      - "supabase/functions/everything-hub-web-search/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: everything-hub-browser-acceptance
  cancel-in-progress: true

jobs:
  local-staging-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve the checked-in public homepage
        run: |
          python3 -m http.server 8765 --directory site >/tmp/everything-hub-site.log 2>&1 &
          echo $! >/tmp/everything-hub-site.pid
          sleep 3
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 2 --max-time 10 -fsS http://127.0.0.1:8765/ >/dev/null; then
              echo "Local homepage server ready (PID $(cat /tmp/everything-hub-site.pid))"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/everything-hub-site.log
          ps -ef | grep '[h]ttp.server' || true
          exit 1
      - name: Test desktop, searches, media attribution, news tabs and mobile layout
        env:
          TARGET_URL: http://127.0.0.1:8765/
          EH_PUBLIC_KEY: sb_publishable_XlIsACWhtVS1jVODWYGTpg_GMs8v3vJ
        run: node scripts/everything-hub-browser-check.cjs
      - name: Upload local staging screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everything-hub-local-staging-browser-evidence
          path: |
            everything-hub-browser-report.json
            everything-hub-*.png
          if-no-files-found: warn
          retention-days: 14

  live-cdn-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Wait for the existing homepage URL to redirect to the free GitHub-backed CDN
        env:
          TARGET_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-site/?eh_cache_bust=${{ github.run_id }}
        run: |
          for attempt in $(seq 1 8); do
            curl --silent --show-error --location --max-time 12 -D /tmp/eh-headers "$TARGET_URL" -o /tmp/eh-homepage.html || true
            content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r",""); ct=$0} END{print ct}' /tmp/eh-headers 2>/dev/null)
            if [[ "$content_type" == text/html* ]] && grep -qi 'approved-master-art' /tmp/eh-homepage.html && grep -q 'data:image/png;base64,' /tmp/eh-homepage.html && grep -q 'src="search.js"' /tmp/eh-homepage.html && grep -q 'Bing RSS independent fallback' /tmp/eh-homepage.html; then
              echo "Existing homepage URL redirects to GitHub rawcdn HTML with approved artwork and search client ($content_type)"
              exit 0
            fi
            echo "Waiting for redirect and HTML CDN page; observed content type: ${content_type:-unknown}"
            sleep 3
          done
          echo "Expected redirected HTML homepage and approved artwork were not confirmed."
          cat /tmp/eh-headers || true
          exit 1
      - name: Test the actual public website at desktop and mobile widths
        env:
          TARGET_URL: https://vdceayvfgkwpgwixrhwi.supabase.co/functions/v1/everything-hub-site/?eh_cache_bust=${{ github.run_id }}
          LIVE_EDGE: "0"
          EH_PUBLIC_KEY: sb_publishable_XlIsACWhtVS1jVODWYGTpg_GMs8v3vJ
        run: node scripts/everything-hub-browser-check.cjs
      - name: Upload live desktop and mobile screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everything-hub-live-edge-browser-evidence
          path: |
            everything-hub-browser-report.json
            everything-hub-*.png
          if-no-files-found: warn
          retention-days: 30
