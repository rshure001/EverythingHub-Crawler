name: Catalog integrity tests

on:
  push:
    paths:
      - "crawler/record_related_catalogs.py"
      - "crawler/catalog_page_analysis.py"
      - "crawler/catalog_ingest.py"
      - "crawler/test_catalog_ingest.py"
      - "tests/test_record_related_catalogs.py"
      - ".github/workflows/record-related-catalogs.yml"
  pull_request:
    paths:
      - "crawler/record_related_catalogs.py"
      - "crawler/catalog_page_analysis.py"
      - "crawler/catalog_ingest.py"
      - "crawler/test_catalog_ingest.py"
      - "tests/test_record_related_catalogs.py"
      - ".github/workflows/record-related-catalogs.yml"

jobs:
  catalog-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run record-owned catalog tests
        run: python -m unittest discover -s tests -p "test_record_related_catalogs.py" -v
      - name: Run universal catalog ingestion tests
        working-directory: crawler
        run: python -m unittest test_catalog_ingest -v
